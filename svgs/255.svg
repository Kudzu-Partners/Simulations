<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg255" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="bell255" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="reject255L" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="reject255R" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg255)"/>

  <!-- Baseline -->
  <line x1="52" y1="280" x2="348" y2="280" stroke="#a0aec0" stroke-width="1.5" opacity="0.4"/>

  <!-- Bell curve path -->
  <path d="M 52,278 C 52,278 80,275 100,270 C 120,264 140,240 160,205
           C 175,178 188,145 200,130
           C 212,145 225,178 240,205
           C 260,240 280,264 300,270
           C 320,275 348,278 348,278"
        fill="url(#bell255)" stroke="#00bfff" stroke-width="2.5" opacity="0.9"/>

  <!-- Left rejection region (shaded red) -->
  <path d="M 52,278 C 52,278 68,277 80,274 C 88,272 96,268 100,270 L 100,280 L 52,280 Z"
        fill="url(#reject255L)" opacity="0.85"/>
  <path d="M 52,278 C 68,277 80,274 96,268 100,270" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.8"/>

  <!-- Right rejection region (shaded red) -->
  <path d="M 300,270 C 308,268 318,272 328,274 C 338,277 348,278 348,278 L 348,280 L 300,280 Z"
        fill="url(#reject255R)" opacity="0.85"/>
  <path d="M 300,270 C 312,268 322,272 332,274 348,278" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.8"/>

  <!-- Critical value lines -->
  <line x1="100" y1="145" x2="100" y2="280" stroke="#ff4444" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.7"/>
  <line x1="300" y1="145" x2="300" y2="280" stroke="#ff4444" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.7"/>
  <text x="100" y="138" font-family="monospace" font-size="9" fill="#ff4444" text-anchor="middle" opacity="0.85">-z*</text>
  <text x="300" y="138" font-family="monospace" font-size="9" fill="#ff4444" text-anchor="middle" opacity="0.85">+z*</text>

  <!-- Alpha labels in tails -->
  <text x="76"  y="268" font-family="monospace" font-size="9" fill="#ff4444" text-anchor="middle" opacity="0.8">α/2</text>
  <text x="324" y="268" font-family="monospace" font-size="9" fill="#ff4444" text-anchor="middle" opacity="0.8">α/2</text>

  <!-- Confidence interval bracket -->
  <line x1="100" y1="300" x2="300" y2="300" stroke="#00ff88" stroke-width="2.5" opacity="0.85"/>
  <line x1="100" y1="294" x2="100" y2="306" stroke="#00ff88" stroke-width="2.5" opacity="0.85"/>
  <line x1="300" y1="294" x2="300" y2="306" stroke="#00ff88" stroke-width="2.5" opacity="0.85"/>
  <text x="200" y="320" font-family="monospace" font-size="9.5" fill="#00ff88" text-anchor="middle" opacity="0.85">95% Confidence Interval</text>

  <!-- μ marker -->
  <line x1="200" y1="130" x2="200" y2="280" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.4"/>
  <text x="200" y="124" font-family="monospace" font-size="11" fill="#a0aec0" text-anchor="middle" opacity="0.6">μ</text>

  <!-- p-value annotation -->
  <rect x="55" y="70" width="88" height="46" rx="6" fill="#0d1b2a"/>
  <rect x="55" y="70" width="88" height="46" rx="6" fill="none" stroke="#ff4444" stroke-width="1.5" opacity="0.6"/>
  <text x="99" y="89"  font-family="monospace" font-size="8.5" fill="#a0aec0" text-anchor="middle" opacity="0.7">p-value</text>
  <text x="99" y="107" font-family="monospace" font-size="13"  fill="#ff4444" text-anchor="middle" font-weight="bold">0.023</text>

  <!-- H0 reject badge -->
  <rect x="257" y="70" width="88" height="46" rx="6" fill="#0d1b2a"/>
  <rect x="257" y="70" width="88" height="46" rx="6" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.7"/>
  <text x="301" y="89"  font-family="monospace" font-size="8.5" fill="#a0aec0" text-anchor="middle" opacity="0.7">Decision</text>
  <text x="301" y="107" font-family="monospace" font-size="9"   fill="#00ff88" text-anchor="middle">Reject H₀ ✓</text>

  <!-- Label -->
  <text x="200" y="358" font-family="monospace" font-size="9" fill="#a0aec0" text-anchor="middle" opacity="0.42">Hypothesis Testing · Bayesian · 8 Business Scenarios</text>
</svg>
