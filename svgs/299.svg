<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg299" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#1b3a20"/>
    </linearGradient>
    <radialGradient id="glow299" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#52b788" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg299)"/>
  <rect width="400" height="400" rx="32" fill="url(#glow299)"/>

  <!-- Triple bottom line: 3 overlapping circles (Venn) -->
  <!-- Planet (green, top) -->
  <circle cx="200" cy="142" r="90" fill="#52b788" opacity="0.18" stroke="#52b788" stroke-width="2.5"/>
  <!-- People (blue, bottom-left) -->
  <circle cx="148" cy="248" r="90" fill="#74b9ff" opacity="0.16" stroke="#74b9ff" stroke-width="2.5"/>
  <!-- Profit (gold, bottom-right) -->
  <circle cx="252" cy="248" r="90" fill="#f5c842" opacity="0.16" stroke="#f5c842" stroke-width="2.5"/>

  <!-- Center intersection (ESG sweet spot) -->
  <circle cx="200" cy="214" r="32" fill="#0a1f0a" stroke="#52b788" stroke-width="3" opacity="0.9"/>
  <!-- Globe icon in center -->
  <circle cx="200" cy="214" r="20" fill="none" stroke="#52b788" stroke-width="2.5" opacity="0.9"/>
  <ellipse cx="200" cy="214" rx="10" ry="20" fill="none" stroke="#52b788" stroke-width="1.5" opacity="0.7"/>
  <line x1="180" y1="214" x2="220" y2="214" stroke="#52b788" stroke-width="1.5" opacity="0.7"/>
  <line x1="183" y1="200" x2="217" y2="200" stroke="#52b788" stroke-width="1.2" opacity="0.5"/>
  <line x1="183" y1="228" x2="217" y2="228" stroke="#52b788" stroke-width="1.2" opacity="0.5"/>

  <!-- Circle icons -->
  <!-- Planet icon (top) -->
  <text x="200" y="82" text-anchor="middle" font-family="sans-serif" font-size="38">🌍</text>
  <!-- People icon (bottom-left) -->
  <text x="110" y="302" text-anchor="middle" font-family="sans-serif" font-size="36">👥</text>
  <!-- Profit icon (bottom-right) -->
  <text x="290" y="302" text-anchor="middle" font-family="sans-serif" font-size="36">💹</text>

  <!-- E / S / G badges -->
  <g transform="translate(28, 356)">
    <rect x="0" y="0" width="94" height="28" rx="7" fill="#0a1f10" stroke="#52b788" stroke-width="2"/>
    <text x="47" y="19" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#52b788">E</text>

    <rect x="103" y="0" width="94" height="28" rx="7" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <text x="150" y="19" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#74b9ff">S</text>

    <rect x="206" y="0" width="94" height="28" rx="7" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <text x="253" y="19" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#f5c842">G</text>

    <!-- Combined badge -->
    <rect x="308" y="0" width="64" height="28" rx="7" fill="#0a1f0a" stroke="#52b788" stroke-width="2.5"/>
    <text x="340" y="19" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#52b788">ESG ✦</text>
  </g>
</svg>
