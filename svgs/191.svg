<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg191" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg191)"/>

  <!-- Gantt chart grid -->
  <!-- Month columns (6 columns = 24 months) -->
  <line x1="72" y1="90" x2="72" y2="290" stroke="#c0cfff" stroke-width="0.5" opacity="0.2"/>
  <line x1="122" y1="90" x2="122" y2="290" stroke="#c0cfff" stroke-width="0.5" opacity="0.2"/>
  <line x1="172" y1="90" x2="172" y2="290" stroke="#c0cfff" stroke-width="0.5" opacity="0.2"/>
  <line x1="222" y1="90" x2="222" y2="290" stroke="#c0cfff" stroke-width="0.5" opacity="0.2"/>
  <line x1="272" y1="90" x2="272" y2="290" stroke="#c0cfff" stroke-width="0.5" opacity="0.2"/>
  <line x1="322" y1="90" x2="322" y2="290" stroke="#c0cfff" stroke-width="0.5" opacity="0.2"/>
  <line x1="355" y1="90" x2="355" y2="290" stroke="#c0cfff" stroke-width="0.5" opacity="0.2"/>

  <!-- Axis -->
  <line x1="72" y1="290" x2="355" y2="290" stroke="#c0cfff" stroke-width="1.5" opacity="0.4"/>
  <line x1="72" y1="90" x2="72" y2="290" stroke="#c0cfff" stroke-width="1.5" opacity="0.4"/>

  <!-- Month labels -->
  <text x="97" y="85" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.4">Q1</text>
  <text x="147" y="85" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.4">Q2</text>
  <text x="197" y="85" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.4">Q3</text>
  <text x="247" y="85" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.4">Q4</text>
  <text x="297" y="85" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.4">Q5</text>
  <text x="338" y="85" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.4">Q6</text>

  <!-- Gantt bars -->
  <!-- Row 1: Planning -->
  <text x="68" y="112" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="end" opacity="0.6">Plan</text>
  <rect x="72" y="100" width="100" height="14" rx="3" fill="#e67e22" opacity="0.7"/>

  <!-- Row 2: Design -->
  <text x="68" y="132" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="end" opacity="0.6">Design</text>
  <rect x="122" y="120" width="100" height="14" rx="3" fill="#e67e22" opacity="0.6"/>

  <!-- Row 3: Build -->
  <text x="68" y="152" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="end" opacity="0.6">Build</text>
  <rect x="172" y="140" width="130" height="14" rx="3" fill="#f5c842" opacity="0.65"/>

  <!-- Row 4: Testing -->
  <text x="68" y="172" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="end" opacity="0.6">Test</text>
  <rect x="272" y="160" width="60" height="14" rx="3" fill="#f5c842" opacity="0.55"/>

  <!-- Row 5: Change Mgmt -->
  <text x="68" y="192" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="end" opacity="0.6">Change</text>
  <rect x="72" y="180" width="283" height="14" rx="3" fill="#00bfff" opacity="0.3"/>
  <rect x="72" y="180" width="283" height="14" rx="3" fill="none" stroke="#00bfff" stroke-width="1" opacity="0.5"/>

  <!-- Row 6: Training -->
  <text x="68" y="212" font-family="monospace" font-size="7" fill="#c0cfff" text-anchor="end" opacity="0.6">Train</text>
  <rect x="272" y="200" width="83" height="14" rx="3" fill="#52b788" opacity="0.55"/>

  <!-- EVM earned value line -->
  <polyline points="72,280 122,275 172,265 222,250 272,248 322,230" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  <!-- Planned value line -->
  <line x1="72" y1="280" x2="322" y2="215" stroke="#c0cfff" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.35"/>
  <text x="330" y="228" font-family="monospace" font-size="6" fill="#c0cfff" opacity="0.4">PV</text>
  <text x="330" y="232" font-family="monospace" font-size="6" fill="#00ff88" opacity="0.6">EV</text>

  <!-- Go-Live decision diamond -->
  <polygon points="322,220 338,238 322,256 306,238" fill="#f5c842" opacity="0.2"/>
  <polygon points="322,220 338,238 322,256 306,238" fill="none" stroke="#f5c842" stroke-width="2.5" opacity="0.85"/>
  <text x="322" y="242" font-family="Arial,sans-serif" font-size="7" fill="#f5c842" text-anchor="middle" opacity="0.9">GO</text>
  <text x="322" y="252" font-family="Arial,sans-serif" font-size="6" fill="#f5c842" text-anchor="middle" opacity="0.7">LIVE?</text>

  <!-- Methodology badge -->
  <rect x="80" y="308" width="60" height="20" rx="5" fill="#00bfff" opacity="0.12"/>
  <rect x="80" y="308" width="60" height="20" rx="5" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.5"/>
  <text x="110" y="322" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.7">Waterfall</text>

  <rect x="148" y="308" width="50" height="20" rx="5" fill="#52b788" opacity="0.12"/>
  <rect x="148" y="308" width="50" height="20" rx="5" fill="none" stroke="#52b788" stroke-width="1.5" opacity="0.5"/>
  <text x="173" y="322" font-family="Arial,sans-serif" font-size="8" fill="#52b788" text-anchor="middle" opacity="0.7">Agile</text>

  <rect x="206" y="308" width="50" height="20" rx="5" fill="#f5c842" opacity="0.15"/>
  <rect x="206" y="308" width="50" height="20" rx="5" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.6"/>
  <text x="231" y="322" font-family="Arial,sans-serif" font-size="8" fill="#f5c842" text-anchor="middle" opacity="0.8">Hybrid</text>

  <!-- $12M badge -->
  <rect x="268" y="308" width="70" height="20" rx="5" fill="#e67e22" opacity="0.15"/>
  <rect x="268" y="308" width="70" height="20" rx="5" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.55"/>
  <text x="303" y="322" font-family="Arial,sans-serif" font-size="8" fill="#e67e22" text-anchor="middle" opacity="0.8">Oracle $12M</text>

  <!-- Label -->
  <text x="200" y="358" font-family="Arial,sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.35">ProjectArena · Manufactura Atlas</text>
  <text x="200" y="374" font-family="Arial,sans-serif" font-size="9" fill="#e67e22" text-anchor="middle" opacity="0.4" letter-spacing="1">ERP IMPLEMENTATION · PMBOK</text>
</svg>
