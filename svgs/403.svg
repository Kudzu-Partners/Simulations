<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg403" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <radialGradient id="stadium403" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1a4d3a"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg403)"/>

  <text x="200" y="58" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">FOOTBALL · LALIGA · FFP</text>

  <!-- floodlights -->
  <g>
    <line x1="60" y1="200" x2="60" y2="125" stroke="#c0cfff" stroke-width="2.5"/>
    <rect x="50" y="105" width="20" height="14" fill="#c0cfff" stroke="#1a2744" stroke-width="1"/>
    <g fill="#ffe27a" opacity="0.55">
      <polygon points="60,118 30,180 90,180"/>
    </g>
    <line x1="340" y1="200" x2="340" y2="125" stroke="#c0cfff" stroke-width="2.5"/>
    <rect x="330" y="105" width="20" height="14" fill="#c0cfff" stroke="#1a2744" stroke-width="1"/>
    <g fill="#ffe27a" opacity="0.55">
      <polygon points="340,118 310,180 370,180"/>
    </g>
  </g>

  <!-- STADIUM oval (hero) -->
  <g transform="translate(200,250)">
    <!-- outer rim -->
    <ellipse cx="0" cy="0" rx="135" ry="60" fill="#1a2744" stroke="#c0cfff" stroke-width="2.5"/>
    <!-- stands -->
    <ellipse cx="0" cy="0" rx="125" ry="52" fill="#5a6f9c" stroke="#1a2744" stroke-width="1.3"/>
    <!-- field -->
    <ellipse cx="0" cy="0" rx="100" ry="38" fill="url(#stadium403)" stroke="#fff" stroke-width="1.5"/>
    <!-- center line -->
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#fff" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="none" stroke="#fff" stroke-width="1.3"/>
    <!-- goal areas -->
    <ellipse cx="-90" cy="0" rx="14" ry="12" fill="none" stroke="#fff" stroke-width="1.2"/>
    <ellipse cx="90" cy="0" rx="14" ry="12" fill="none" stroke="#fff" stroke-width="1.2"/>
    <!-- crowd dots in stands -->
    <g fill="#c0cfff" opacity="0.55">
      <circle cx="-110" cy="-25" r="1"/>
      <circle cx="-100" cy="-30" r="1"/>
      <circle cx="-90" cy="-32" r="1"/>
      <circle cx="-80" cy="-33" r="1"/>
      <circle cx="-70" cy="-34" r="1"/>
      <circle cx="-60" cy="-34" r="1"/>
      <circle cx="-50" cy="-34" r="1"/>
      <circle cx="-40" cy="-34" r="1"/>
      <circle cx="-30" cy="-34" r="1"/>
      <circle cx="-20" cy="-34" r="1"/>
      <circle cx="-10" cy="-34" r="1"/>
      <circle cx="0" cy="-34" r="1"/>
      <circle cx="10" cy="-34" r="1"/>
      <circle cx="20" cy="-34" r="1"/>
      <circle cx="30" cy="-34" r="1"/>
      <circle cx="40" cy="-34" r="1"/>
      <circle cx="50" cy="-34" r="1"/>
      <circle cx="60" cy="-34" r="1"/>
      <circle cx="70" cy="-34" r="1"/>
      <circle cx="80" cy="-33" r="1"/>
      <circle cx="90" cy="-32" r="1"/>
      <circle cx="100" cy="-30" r="1"/>
      <circle cx="110" cy="-25" r="1"/>
    </g>
  </g>

  <!-- SOCCER BALL (centered on field) -->
  <g transform="translate(200,250)">
    <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#1a2744" stroke-width="1.5"/>
    <polygon points="0,-9 5,-3 3,4 -3,4 -5,-3" fill="#1a2744"/>
    <line x1="0" y1="-9" x2="0" y2="-13" stroke="#1a2744" stroke-width="1"/>
    <line x1="5" y1="-3" x2="11" y2="-5" stroke="#1a2744" stroke-width="1"/>
    <line x1="-5" y1="-3" x2="-11" y2="-5" stroke="#1a2744" stroke-width="1"/>
    <line x1="3" y1="4" x2="7" y2="11" stroke="#1a2744" stroke-width="1"/>
    <line x1="-3" y1="4" x2="-7" y2="11" stroke="#1a2744" stroke-width="1"/>
  </g>

  <!-- FFP shield (top-left) -->
  <g transform="translate(60,90)">
    <path d="M 0 0 L 22 -4 L 22 14 Q 22 24 0 30 Q -22 24 -22 14 L -22 -4 Z"
          fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.4"/>
    <text x="0" y="13" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" font-weight="bold">FFP</text>
  </g>

  <!-- Transfer window $ (top-right) -->
  <g transform="translate(330,90)">
    <rect x="-22" y="-13" width="44" height="26" rx="4" fill="#00ff88" fill-opacity="0.18" stroke="#00ff88" stroke-width="1.3"/>
    <text x="0" y="3" text-anchor="middle" fill="#00ff88" font-size="11" font-family="Georgia, serif" font-weight="bold">$ →</text>
  </g>

  <!-- ESPAÑA pin (bottom-right) -->
  <g transform="translate(345,335)">
    <rect x="-12" y="-9" width="24" height="6" fill="#c0392b" opacity="0.9"/>
    <rect x="-12" y="-3" width="24" height="12" fill="#f5c842" opacity="0.9"/>
    <rect x="-12" y="5" width="24" height="4" fill="#c0392b" opacity="0.9"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">LaLiga · FFP · Naming · España</text>
</svg>
