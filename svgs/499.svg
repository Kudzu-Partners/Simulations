<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg499" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="land499" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#1a4d3a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg499)"/>

  <text x="200" y="58" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">VALUATION · 3 METHODS · H&amp;BU</text>

  <!-- 3 PRICE TAGS (background, valuation methods) -->
  <g font-family="monospace" font-size="6" font-weight="bold">
    <g transform="translate(70,150)">
      <path d="M 0 6 L 10 0 L 56 0 L 56 24 L 10 24 L 0 18 Z" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.3"/>
      <circle cx="10" cy="12" r="2.5" fill="#52b788"/>
      <text x="36" y="16" text-anchor="middle" fill="#52b788" font-size="8">$ COMP</text>
    </g>
    <g transform="translate(70,200)">
      <path d="M 0 6 L 10 0 L 56 0 L 56 24 L 10 24 L 0 18 Z" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.3"/>
      <circle cx="10" cy="12" r="2.5" fill="#f5c842"/>
      <text x="36" y="16" text-anchor="middle" fill="#f5c842" font-size="8">$ COST</text>
    </g>
    <g transform="translate(70,250)">
      <path d="M 0 6 L 10 0 L 56 0 L 56 24 L 10 24 L 0 18 Z" fill="#ff6b9d" fill-opacity="0.18" stroke="#ff6b9d" stroke-width="1.3"/>
      <circle cx="10" cy="12" r="2.5" fill="#ff6b9d"/>
      <text x="36" y="16" text-anchor="middle" fill="#ff6b9d" font-size="8">$ INC</text>
    </g>
  </g>

  <!-- LAND PARCEL (hero, central-right) -->
  <g transform="translate(255,250)">
    <!-- ground -->
    <path d="M -75 0 L 75 0 L 65 50 L -65 50 Z" fill="url(#land499)" stroke="#0d2418" stroke-width="2.5"/>
    <!-- fence -->
    <g stroke="#5a3210" stroke-width="1.5">
      <line x1="-72" y1="-5" x2="-72" y2="-22"/>
      <line x1="-50" y1="-5" x2="-50" y2="-25"/>
      <line x1="-28" y1="-5" x2="-28" y2="-28"/>
      <line x1="-6" y1="-5" x2="-6" y2="-30"/>
      <line x1="16" y1="-5" x2="16" y2="-28"/>
      <line x1="38" y1="-5" x2="38" y2="-25"/>
      <line x1="60" y1="-5" x2="60" y2="-22"/>
      <line x1="-72" y1="-18" x2="60" y2="-18"/>
      <line x1="-72" y1="-12" x2="60" y2="-12"/>
    </g>
    <!-- center marker (parcel) -->
    <rect x="-20" y="10" width="40" height="30" fill="#c98a2b" fill-opacity="0.7" stroke="#5a3210" stroke-width="1.2"/>
    <text x="0" y="28" text-anchor="middle" fill="#5a3210" font-size="6" font-family="monospace" font-weight="bold">LOT</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,90)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Valuation · Land · Tegucigalpa</text>
</svg>
