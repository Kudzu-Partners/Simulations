<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg043" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1a0a"/>
      <stop offset="100%" stop-color="#4a2a10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg043)"/>

  <!-- Menu card outline (left zone) -->
  <rect x="55" y="62" width="148" height="200" rx="8"
        fill="#fde8c8" fill-opacity="0.07" stroke="#fde8c8" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Menu title area -->
  <rect x="55" y="62" width="148" height="30" rx="8"
        fill="#e67e22" fill-opacity="0.30"/>
  <text x="129" y="82" font-family="Arial Black, sans-serif" font-size="11" font-weight="900"
        fill="#fde8c8" text-anchor="middle" opacity="0.85">MENU</text>
  <!-- Menu item lines -->
  <g stroke="#fde8c8" stroke-width="1" stroke-opacity="0.30">
    <line x1="72" y1="112" x2="186" y2="112"/>
    <line x1="72" y1="128" x2="186" y2="128"/>
    <line x1="72" y1="144" x2="186" y2="144"/>
    <line x1="72" y1="160" x2="186" y2="160"/>
    <line x1="72" y1="176" x2="186" y2="176"/>
    <line x1="72" y1="192" x2="186" y2="192"/>
    <line x1="72" y1="208" x2="186" y2="208"/>
    <line x1="72" y1="224" x2="186" y2="224"/>
  </g>
  <!-- Price dots (right side of menu lines) -->
  <g fill="#fde8c8" fill-opacity="0.40">
    <circle cx="180" cy="112" r="3"/><circle cx="180" cy="128" r="3"/>
    <circle cx="180" cy="144" r="3"/><circle cx="180" cy="160" r="3"/>
    <circle cx="180" cy="176" r="3"/><circle cx="180" cy="192" r="3"/>
  </g>

  <!-- P&L margin bars (right zone — clearly separated) -->
  <!-- Revenue bar (full width, top) -->
  <rect x="228" y="80" width="120" height="36" rx="4"
        fill="#e67e22" fill-opacity="0.75" stroke="#e67e22" stroke-width="1.5"/>
  <text x="238" y="102" font-family="Arial, sans-serif" font-size="10" fill="#fde8c8" opacity="0.85">Revenue</text>
  <text x="340" y="102" font-family="Arial, sans-serif" font-size="10" fill="#fde8c8" text-anchor="end" opacity="0.85">100%</text>

  <!-- Food cost bar -->
  <rect x="228" y="126" width="84" height="28" rx="4"
        fill="#e74c3c" fill-opacity="0.65" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="238" y="144" font-family="Arial, sans-serif" font-size="9" fill="#fde8c8" opacity="0.80">Food Cost</text>
  <text x="304" y="144" font-family="Arial, sans-serif" font-size="9" fill="#fde8c8" text-anchor="end" opacity="0.80">30%</text>

  <!-- Labor cost bar -->
  <rect x="228" y="164" width="76" height="28" rx="4"
        fill="#e74c3c" fill-opacity="0.50" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="238" y="182" font-family="Arial, sans-serif" font-size="9" fill="#fde8c8" opacity="0.75">Labor</text>
  <text x="296" y="182" font-family="Arial, sans-serif" font-size="9" fill="#fde8c8" text-anchor="end" opacity="0.75">28%</text>

  <!-- Prime cost line (dashed separator) -->
  <line x1="228" y1="200" x2="348" y2="200"
        stroke="#f5c842" stroke-width="2" stroke-dasharray="5,4" stroke-opacity="0.70"/>
  <text x="238" y="212" font-family="Arial, sans-serif" font-size="8" fill="#f5c842" opacity="0.70">Prime Cost 58%</text>

  <!-- Overhead bar -->
  <rect x="228" y="218" width="40" height="22" rx="4"
        fill="#95a5a6" fill-opacity="0.45" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="238" y="233" font-family="Arial, sans-serif" font-size="8" fill="#fde8c8" opacity="0.65">OH</text>

  <!-- Profit/Margin bar (thin, gold, at bottom) -->
  <rect x="228" y="250" width="42" height="22" rx="4"
        fill="#f5c842" fill-opacity="0.80" stroke="#f5c842" stroke-width="2"/>
  <text x="238" y="265" font-family="Arial, sans-serif" font-size="9" fill="#2d1a0a" font-weight="bold">Margin</text>

  <!-- Axis baseline -->
  <line x1="228" y1="276" x2="348" y2="276"
        stroke="#fde8c8" stroke-width="1" stroke-opacity="0.30"/>
</svg>
