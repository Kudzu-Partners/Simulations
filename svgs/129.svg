<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg129" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="cert129" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8f3dc"/>
      <stop offset="100%" stop-color="#95d5b2"/>
    </linearGradient>
    <radialGradient id="leaf129" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#74dd80"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg129)"/>
  <!-- Bond certificate with leaf seal -->
  <g transform="translate(200 200)">
    <!-- Certificate paper -->
    <rect x="-115" y="-130" width="230" height="260" rx="6" fill="url(#cert129)" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Decorative border -->
    <rect x="-105" y="-120" width="210" height="240" rx="4" fill="none" stroke="#1b5e20" stroke-width="1.5" opacity="0.55"/>
    <rect x="-100" y="-115" width="200" height="230" rx="3" fill="none" stroke="#52b788" stroke-width="1" opacity="0.45"/>
    <!-- Header -->
    <rect x="-80" y="-105" width="160" height="14" rx="2" fill="#1b5e20" opacity="0.75"/>
    <rect x="-60" y="-86" width="120" height="6" rx="2" fill="#1b5e20" opacity="0.45"/>
    <!-- Big € denomination -->
    <text y="-30" font-family="Georgia, serif" font-size="62" font-weight="700" fill="#1b5e20" text-anchor="middle">€</text>
    <!-- Lines -->
    <g fill="#1b5e20" opacity="0.5">
      <rect x="-80" y="6" width="160" height="3"/>
      <rect x="-80" y="16" width="120" height="3"/>
      <rect x="-80" y="26" width="160" height="3"/>
      <rect x="-80" y="36" width="100" height="3"/>
    </g>
    <!-- SPT growth chart small -->
    <g transform="translate(-72 60)" stroke="#1b5e20" stroke-width="2" fill="none">
      <polyline points="0,32 14,22 28,28 42,12 56,18 70,4"/>
      <line x1="0" y1="34" x2="74" y2="34"/>
    </g>
    <!-- Coupon stub line -->
    <line x1="-115" y1="65" x2="115" y2="65" stroke="#1b5e20" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="50" y="100" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1b5e20" text-anchor="middle" opacity="0.85">SLB</text>
  </g>
  <!-- Leaf seal (top-right corner of certificate) -->
  <g transform="translate(290 110)">
    <circle r="36" fill="url(#leaf129)" stroke="#ffffff" stroke-width="3"/>
    <!-- Leaf shape -->
    <path d="M-14 16 Q-22 0 -10 -14 Q4 -22 18 -10 Q22 4 14 18 Q0 22 -14 16 Z" fill="#d8f3dc" opacity="0.95"/>
    <path d="M-12 14 Q4 -2 16 -14" fill="none" stroke="#1b5e20" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-6 8 L0 4" stroke="#1b5e20" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M2 12 L8 6" stroke="#1b5e20" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M6 -2 L12 -8" stroke="#1b5e20" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
