<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg310" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <radialGradient id="hub310" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg310)"/>
  <rect width="400" height="400" rx="32" fill="url(#hub310)"/>

  <!-- Organizational network (nodes + edges) -->
  <g>
    <!-- Edges first (background) -->
    <line x1="200" y1="180" x2="110" y2="100" stroke="#f5c842" stroke-width="2" opacity="0.5"/>
    <line x1="200" y1="180" x2="290" y2="100" stroke="#f5c842" stroke-width="2" opacity="0.5"/>
    <line x1="200" y1="180" x2="72" y2="210" stroke="#f5c842" stroke-width="1.5" opacity="0.4"/>
    <line x1="200" y1="180" x2="328" y2="210" stroke="#f5c842" stroke-width="1.5" opacity="0.4"/>
    <line x1="200" y1="180" x2="140" y2="298" stroke="#f5c842" stroke-width="1.5" opacity="0.4"/>
    <line x1="200" y1="180" x2="260" y2="298" stroke="#f5c842" stroke-width="1.5" opacity="0.4"/>
    <!-- Secondary edges -->
    <line x1="110" y1="100" x2="290" y2="100" stroke="#74b9ff" stroke-width="1.5" opacity="0.3"/>
    <line x1="72" y1="210" x2="140" y2="298" stroke="#74b9ff" stroke-width="1.2" opacity="0.3"/>
    <line x1="328" y1="210" x2="260" y2="298" stroke="#74b9ff" stroke-width="1.2" opacity="0.3"/>
    <line x1="110" y1="100" x2="72" y2="210" stroke="#74b9ff" stroke-width="1.2" opacity="0.25"/>
    <line x1="290" y1="100" x2="328" y2="210" stroke="#74b9ff" stroke-width="1.2" opacity="0.25"/>
    <line x1="140" y1="298" x2="260" y2="298" stroke="#74b9ff" stroke-width="1.2" opacity="0.25"/>

    <!-- Central power node (GM) -->
    <circle cx="200" cy="180" r="30" fill="#1a3a5c" stroke="#f5c842" stroke-width="3.5"/>
    <text x="200" y="186" text-anchor="middle" font-family="sans-serif" font-size="22">👤</text>

    <!-- Level 1 nodes -->
    <circle cx="110" cy="100" r="20" fill="#1a2744" stroke="#f5c842" stroke-width="2"/>
    <text x="110" y="106" text-anchor="middle" font-family="sans-serif" font-size="16">👤</text>

    <circle cx="290" cy="100" r="20" fill="#1a2744" stroke="#f5c842" stroke-width="2"/>
    <text x="290" y="106" text-anchor="middle" font-family="sans-serif" font-size="16">👤</text>

    <!-- Level 2 nodes (smaller, colored by influence) -->
    <circle cx="72" cy="210" r="16" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <text x="72" y="216" text-anchor="middle" font-family="sans-serif" font-size="13">👤</text>

    <circle cx="328" cy="210" r="16" fill="#1a2744" stroke="#00ff88" stroke-width="2"/>
    <text x="328" y="216" text-anchor="middle" font-family="sans-serif" font-size="13">👤</text>

    <circle cx="140" cy="298" r="14" fill="#1a2744" stroke="#a29bfe" stroke-width="2"/>
    <text x="140" y="304" text-anchor="middle" font-family="sans-serif" font-size="12">👤</text>

    <circle cx="260" cy="298" r="14" fill="#1a2744" stroke="#e74c3c" stroke-width="2"/>
    <text x="260" y="304" text-anchor="middle" font-family="sans-serif" font-size="12">👤</text>

    <!-- Outlier (informal power) -->
    <circle cx="200" cy="60" r="12" fill="#2a1a1a" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="200" y="66" text-anchor="middle" font-family="sans-serif" font-size="11">👤</text>
    <line x1="200" y1="72" x2="200" y2="150" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
  </g>

  <!-- Matrix org hint (bottom) -->
  <g transform="translate(36, 344)">
    <rect x="0" y="0" width="48" height="32" rx="5" fill="#1a2744" stroke="#74b9ff" stroke-width="1.5"/>
    <rect x="56" y="0" width="48" height="32" rx="5" fill="#1a2744" stroke="#f5c842" stroke-width="1.5"/>
    <rect x="112" y="0" width="48" height="32" rx="5" fill="#1a2744" stroke="#00ff88" stroke-width="1.5"/>
    <rect x="168" y="0" width="48" height="32" rx="5" fill="#1a2744" stroke="#a29bfe" stroke-width="1.5"/>
    <!-- Horizontal cross line = matrix -->
    <line x1="0" y1="16" x2="216" y2="16" stroke="#f5c842" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
    <!-- Power arrow -->
    <g transform="translate(236, 0)">
      <rect x="0" y="0" width="96" height="32" rx="5" fill="#1a3a5c" stroke="#f5c842" stroke-width="2"/>
      <line x1="12" y1="24" x2="12" y2="8" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
      <polygon points="7,14 12,5 17,14" fill="#f5c842"/>
      <line x1="32" y1="24" x2="80" y2="8" stroke="#f5c842" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
