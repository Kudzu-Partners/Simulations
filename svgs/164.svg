  <path d="M 60 90 Q 90 75 120 85 Q 145 95 150 125 Q 160 155 145 180 Q 155 200 148 230 Q 140 255 120 260 Q 100 265 90 245 Q 75 250 62 235 Q 50 215 60 185 Q 48 165 55 135 Q 60 110 60 90 Z" fill="#e67e22" opacity="0.25"/>
  <path d="M 60 90 Q 90 75 120 85 Q 145 95 150 125 Q 160 155 145 180 Q 155 200 148 230 Q 140 255 120 260 Q 100 265 90 245 Q 75 250 62 235 Q 50 215 60 185 Q 48 165 55 135 Q 60 110 60 90 Z" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.6"/>
  <text x="105" y="170" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#e67e22" text-anchor="middle" opacity="0.7">MX</text>

