      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg164)"/>

  <!-- Ocean background (subtle) -->
