  <path d="M 260 165 Q 200 100 148 160" fill="none" stroke="#95a5a6" stroke-width="3" stroke-dasharray="10 6" opacity="0.35" stroke-linecap="round"/>
  <!-- Strikethrough on old route -->
  <line x1="185" y1="118" x2="218" y2="138" stroke="#e74c3c" stroke-width="2.5" opacity="0.55"/>
  <line x1="218" y1="118" x2="185" y2="138" stroke="#e74c3c" stroke-width="2.5" opacity="0.55"/>

  <!-- TARIFF WALL barrier (vertical dashed) -->
  <line x1="200" y1="68" x2="200" y2="290" stroke="#e74c3c" stroke-width="3" stroke-dasharray="12 6" stroke-linecap="round" opacity="0.65"/>
  <!-- Wall segments (brick-like) -->
  <rect x="194" y="80" width="12" height="18" rx="2" fill="#e74c3c" opacity="0.2"/>
  <rect x="194" y="106" width="12" height="18" rx="2" fill="#e74c3c" opacity="0.2"/>
  <rect x="194" y="132" width="12" height="18" rx="2" fill="#e74c3c" opacity="0.2"/>
  <rect x="194" y="158" width="12" height="18" rx="2" fill="#e74c3c" opacity="0.2"/>
  <rect x="194" y="184" width="12" height="18" rx="2" fill="#e74c3c" opacity="0.2"/>
  <rect x="194" y="210" width="12" height="18" rx="2" fill="#e74c3c" opacity="0.2"/>
  <rect x="194" y="236" width="12" height="18" rx="2" fill="#e74c3c" opacity="0.2"/>
  <text x="200" y="62" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#e74c3c" text-anchor="middle" opacity="0.75">TARIFFS</text>

  <!-- NEW nearshore route: short arc within Americas (bright) -->
  <path d="M 148 175 Q 158 280 130 290 Q 100 300 90 280 Q 80 260 105 255" fill="none" stroke="#e67e22" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <polygon points="105,255 95,244 113,244" fill="#e67e22" opacity="0.85"/>

  <!-- Factory icon (Americas side, destination) -->
  <rect x="62" y="285" width="55" height="35" rx="3" fill="#e67e22" opacity="0.15"/>
  <rect x="62" y="285" width="55" height="35" rx="3" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.65"/>
  <rect x="70" y="275" width="8" height="12" rx="2" fill="#e67e22" opacity="0.5"/>
  <rect x="84" y="278" width="8" height="9" rx="2" fill="#e67e22" opacity="0.5"/>
  <rect x="98" y="276" width="8" height="11" rx="2" fill="#e67e22" opacity="0.5"/>

  <!-- Ship icon (old route, faded) -->
  <path d="M 230 195 Q 248 190 262 195 L 258 205 L 234 205 Z" fill="#95a5a6" opacity="0.3"/>
  <line x1="246" y1="190" x2="246" y2="180" stroke="#95a5a6" stroke-width="1.5" opacity="0.3"/>
  <path d="M 246 180 L 240 186 L 252 186 Z" fill="#95a5a6" opacity="0.3"/>

  <!-- Dual sourcing arrow (short) -->
  <text x="200" y="330" font-family="Arial,sans-serif" font-size="9" fill="#e67e22" text-anchor="middle" opacity="0.5">Nearshore · Dual-Source Strategy</text>
  <text x="200" y="348" font-family="Arial,sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.35">Mexico vs Asia · 5 Quarters</text>
</svg>
