  <path d="M 270 80 Q 310 70 340 90 Q 370 120 355 160 Q 345 190 320 200 Q 340 220 330 250 Q 320 270 300 265 Q 290 260 285 240 Q 270 250 255 240 Q 245 220 260 200 Q 240 180 245 150 Q 250 120 270 80 Z" fill="#95a5a6" opacity="0.3"/>
  <path d="M 270 80 Q 310 70 340 90 Q 370 120 355 160 Q 345 190 320 200 Q 340 220 330 250 Q 320 270 300 265 Q 290 260 285 240 Q 270 250 255 240 Q 245 220 260 200 Q 240 180 245 150 Q 250 120 270 80 Z" fill="none" stroke="#95a5a6" stroke-width="1.5" opacity="0.5"/>
  <text x="302" y="170" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#95a5a6" text-anchor="middle" opacity="0.6">ASIA</text>

