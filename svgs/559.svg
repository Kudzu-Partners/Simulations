<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg559" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#1b3a20"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg559)"/>

  <text x="200" y="56" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">PASO SEGURO · REINTEGRATION</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Bridge over divide (protagonist) -->
    <g transform="translate(200,224)">
      <!-- Ground left -->
      <rect x="-176" y="0" width="80" height="32" fill="#0a1f0a" stroke="#52b788" stroke-width="2.5"/>
      <!-- Ground right -->
      <rect x="96" y="0" width="80" height="32" fill="#0a1f0a" stroke="#52b788" stroke-width="2.5"/>

      <!-- Bridge arch -->
      <path d="M -96 0 Q 0 -80 96 0" fill="none" stroke="#f5c842" stroke-width="5"/>
      <!-- Bridge deck -->
      <line x1="-96" y1="0" x2="96" y2="0" stroke="#f5c842" stroke-width="4"/>
      <!-- Bridge support cables (vertical) -->
      <line x1="-72" y1="0" x2="-72" y2="-32" stroke="#f5c842" stroke-width="2"/>
      <line x1="-40" y1="0" x2="-40" y2="-56" stroke="#f5c842" stroke-width="2"/>
      <line x1="-8"  y1="0" x2="-8"  y2="-72" stroke="#f5c842" stroke-width="2"/>
      <line x1="24"  y1="0" x2="24"  y2="-64" stroke="#f5c842" stroke-width="2"/>
      <line x1="56"  y1="0" x2="56"  y2="-40" stroke="#f5c842" stroke-width="2"/>

      <!-- Person walking across -->
      <g transform="translate(0,-12)">
        <circle cx="0" cy="-12" r="8" fill="#1b3a20" stroke="#dfe6e9" stroke-width="2.5"/>
        <path d="M -10 12 Q 0 -4 10 12" fill="#1b3a20" stroke="#dfe6e9" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Financial pulse top-left -->
    <g transform="translate(48,108)">
      <path d="M 0 12 L 12 12 L 18 0 L 26 24 L 32 12 L 56 12" stroke="#52b788" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Funding badge top-right -->
    <g transform="translate(288,84)">
      <rect width="64" height="26" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#f5c842" font-size="11" font-family="monospace" font-weight="bold">$ ·</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#d8f3dc" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Social Enterprise · CO</text>
</svg>
