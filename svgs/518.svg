<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg518" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg518)"/>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Standard baseline (the standard cost reference) -->
    <line x1="64" y1="200" x2="336" y2="200" stroke="#f5c842" stroke-width="3.5" stroke-dasharray="10 6"/>

    <!-- Variance bars: some above (unfavorable), some below (favorable) -->
    <!-- Bar 1: favorable (below baseline = green) -->
    <rect x="80"  y="200" width="32" height="40" rx="4" fill="#52b788" opacity="0.75" stroke="none"/>
    <!-- Bar 2: unfavorable (above = red) -->
    <rect x="128" y="152" width="32" height="48" rx="4" fill="#e74c3c" opacity="0.75" stroke="none"/>
    <!-- Bar 3: favorable -->
    <rect x="176" y="200" width="32" height="24" rx="4" fill="#52b788" opacity="0.75" stroke="none"/>
    <!-- Bar 4: unfavorable (largest variance) -->
    <rect x="224" y="112" width="32" height="88" rx="4" fill="#e74c3c" stroke="none"/>
    <!-- Bar 5: favorable -->
    <rect x="272" y="200" width="32" height="56" rx="4" fill="#52b788" opacity="0.75" stroke="none"/>

    <!-- Highlight on largest unfavorable variance -->
    <circle cx="240" cy="112" r="14" stroke="#f5c842" stroke-width="3.5" fill="none"/>
    <line x1="240" y1="80" x2="240" y2="98" stroke="#f5c842" stroke-width="3.5"/>

    <!-- Axis labels (visual only, no text) -->
    <line x1="64" y1="280" x2="336" y2="280" stroke="#74b9ff" stroke-width="1.5" opacity="0.25"/>
    <line x1="64" y1="120" x2="336" y2="120" stroke="#74b9ff" stroke-width="1.5" opacity="0.25"/>

    <!-- Left axis -->
    <line x1="64" y1="80" x2="64" y2="320" stroke="#74b9ff" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
