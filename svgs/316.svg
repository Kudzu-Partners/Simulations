<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg316" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="lever316" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="50%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg316)"/>

  <!-- LBO Structure (stacked capital) -->
  <g transform="translate(110, 60)">
    <!-- Equity layer (top, green) -->
    <rect x="0" y="0" width="180" height="52" rx="8" fill="#0a1f10" stroke="#00ff88" stroke-width="2.5"/>
    <text x="90" y="22" text-anchor="middle" font-family="sans-serif" font-size="18">💰</text>
    <text x="90" y="42" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#00ff88">EQUITY  30%</text>

    <!-- Mezzanine layer (middle, gold) -->
    <rect x="0" y="60" width="180" height="52" rx="8" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <text x="90" y="78" text-anchor="middle" font-family="sans-serif" font-size="18">📄</text>
    <text x="90" y="98" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#f5c842">MEZZ  20%</text>

    <!-- Senior debt (bottom, blue-red) -->
    <rect x="0" y="120" width="180" height="88" rx="8" fill="#1a0a10" stroke="#e74c3c" stroke-width="2.5"/>
    <text x="90" y="150" text-anchor="middle" font-family="sans-serif" font-size="26">🏦</text>
    <text x="90" y="176" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#e74c3c">SENIOR DEBT  50%</text>

    <!-- Leverage arrow (right side) -->
    <line x1="196" y1="208" x2="196" y2="0" stroke="url(#lever316)" stroke-width="5" stroke-linecap="round"/>
    <polygon points="188,8 196,-4 204,8" fill="#00ff88"/>
    <text x="220" y="108" font-family="'Courier New',monospace" font-size="9" fill="#f5c842" transform="rotate(90,220,108)">LEVERAGE</text>
  </g>

  <!-- Value creation levers (bottom) -->
  <g transform="translate(36, 308)">
    <rect x="0" y="0" width="76" height="52" rx="8" fill="#1a2744" stroke="#00ff88" stroke-width="2"/>
    <text x="38" y="24" text-anchor="middle" font-family="sans-serif" font-size="20">📈</text>
    <text x="38" y="42" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#00ff88">EBITDA ↑</text>

    <rect x="84" y="0" width="76" height="52" rx="8" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <text x="122" y="24" text-anchor="middle" font-family="sans-serif" font-size="20">🔁</text>
    <text x="122" y="42" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#74b9ff">DEBT PAY</text>

    <rect x="168" y="0" width="76" height="52" rx="8" fill="#1a2744" stroke="#f5c842" stroke-width="2"/>
    <text x="206" y="24" text-anchor="middle" font-family="sans-serif" font-size="20">🏷</text>
    <text x="206" y="42" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#f5c842">MUL EXP</text>

    <!-- Exit -->
    <rect x="252" y="0" width="112" height="52" rx="8" fill="#0a1f10" stroke="#00ff88" stroke-width="2.5"/>
    <text x="308" y="22" text-anchor="middle" font-family="sans-serif" font-size="20">🚀</text>
    <text x="308" y="42" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#00ff88">EXIT · IRR</text>
  </g>
</svg>
