<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg673" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg673)"/>

  <text x="200" y="56" text-anchor="middle" fill="#e74c3c" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">BURNOUT · HOSPITAL WELLNESS</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Stress thermometer + meditation figure (protagonist) -->
    <!-- Thermometer (left) -->
    <g transform="translate(120,212)">
      <rect x="-10" y="-72" width="20" height="120" rx="10" fill="#1a3a5c" stroke="#dfe6e9" stroke-width="3"/>
      <!-- High stress fill -->
      <rect x="-6" y="-44" width="12" height="88" rx="6" fill="#e74c3c"/>
      <!-- Bulb -->
      <circle cx="0" cy="64" r="22" fill="#e74c3c" stroke="#dfe6e9" stroke-width="3"/>
      <!-- Ticks -->
      <line x1="10" y1="-56" x2="20" y2="-56" stroke="#dfe6e9" stroke-width="2"/>
      <line x1="10" y1="-32" x2="20" y2="-32" stroke="#dfe6e9" stroke-width="2"/>
      <line x1="10" y1="-8" x2="20" y2="-8" stroke="#dfe6e9" stroke-width="2"/>
      <line x1="10" y1="16" x2="20" y2="16" stroke="#dfe6e9" stroke-width="2"/>
    </g>

    <!-- Arrow down (lowering) -->
    <g transform="translate(200,212)">
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#52b788" stroke-width="3.5"/>
      <path d="M 8 -10 L 20 0 L 8 10" stroke="#52b788" stroke-width="3.5" fill="none"/>
    </g>

    <!-- Meditation lotus figure (right) -->
    <g transform="translate(288,216)">
      <!-- Head -->
      <circle cx="0" cy="-32" r="14" fill="#1a3a5c" stroke="#52b788" stroke-width="3"/>
      <!-- Body crossed legs -->
      <path d="M -28 8 Q 0 -16 28 8 Q 28 32 0 32 Q -28 32 -28 8 Z" fill="#1a3a5c" stroke="#52b788" stroke-width="3"/>
      <!-- Arms folded -->
      <line x1="-24" y1="0" x2="-12" y2="12" stroke="#52b788" stroke-width="3"/>
      <line x1="24"  y1="0" x2="12"  y2="12" stroke="#52b788" stroke-width="3"/>
      <!-- Aura -->
      <circle r="56" fill="none" stroke="#52b788" stroke-width="1.5" opacity="0.45" stroke-dasharray="3 4"/>
    </g>

    <!-- 600 emp badge top-left -->
    <g transform="translate(48,84)">
      <rect width="64" height="26" rx="4" fill="#74b9ff" fill-opacity="0.18" stroke="#74b9ff" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#74b9ff" font-size="11" font-family="monospace" font-weight="bold">600</text>
    </g>

    <!-- Wellness badge top-right -->
    <g transform="translate(284,84)">
      <rect width="68" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <text x="34" y="18" text-anchor="middle" fill="#52b788" font-size="11" font-family="monospace" font-weight="bold">CARE</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#dfe6e9" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Hospital · Stress Mgmt · CO</text>
</svg>
