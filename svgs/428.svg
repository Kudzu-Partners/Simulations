<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg428" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="plane428" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c0cfff"/>
      <stop offset="100%" stop-color="#5a6f9c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg428)"/>

  <text x="200" y="58" text-anchor="middle" fill="#74b9ff" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">REVENUE MGMT · ELASTICITY</text>

  <!-- Elasticity curve (background) -->
  <g opacity="0.7">
    <line x1="50" y1="330" x2="350" y2="330" stroke="#c0cfff" stroke-width="0.8" opacity="0.55"/>
    <line x1="50" y1="220" x2="50" y2="330" stroke="#c0cfff" stroke-width="0.8" opacity="0.55"/>
    <path d="M 50 230 Q 100 240 150 270 Q 200 300 270 320 Q 320 327 350 330" fill="none" stroke="#f5c842" stroke-width="2"/>
    <text x="55" y="226" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.85">P</text>
    <text x="345" y="345" text-anchor="end" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.85">Q</text>
  </g>

  <!-- AIRPLANE (hero, central, tilted ascending) -->
  <g transform="translate(200,180) rotate(-15)">
    <!-- fuselage -->
    <ellipse cx="0" cy="0" rx="105" ry="14" fill="url(#plane428)" stroke="#1a2744" stroke-width="2"/>
    <!-- nose -->
    <path d="M 90 -10 Q 115 -2 115 0 Q 115 2 90 10 Z" fill="#1a2744"/>
    <!-- cockpit windows -->
    <path d="M 75 -8 Q 95 -8 100 -3 L 95 -2 L 75 -2 Z" fill="#0a1a2e" stroke="#00bfff" stroke-width="0.8"/>
    <!-- main wings -->
    <path d="M -10 -8 L 50 -45 L 35 -8 Z" fill="url(#plane428)" stroke="#1a2744" stroke-width="1.5"/>
    <path d="M -10 8 L 50 45 L 35 8 Z" fill="url(#plane428)" stroke="#1a2744" stroke-width="1.5"/>
    <!-- tail wings -->
    <path d="M -85 -8 L -100 -28 L -75 -10 Z" fill="url(#plane428)" stroke="#1a2744" stroke-width="1.3"/>
    <path d="M -85 8 L -100 28 L -75 10 Z" fill="url(#plane428)" stroke="#1a2744" stroke-width="1.3"/>
    <!-- windows row -->
    <g fill="#0a1a2e">
      <circle cx="-50" cy="0" r="2.5"/>
      <circle cx="-35" cy="0" r="2.5"/>
      <circle cx="-20" cy="0" r="2.5"/>
      <circle cx="-5" cy="0" r="2.5"/>
      <circle cx="10" cy="0" r="2.5"/>
      <circle cx="25" cy="0" r="2.5"/>
      <circle cx="40" cy="0" r="2.5"/>
      <circle cx="55" cy="0" r="2.5"/>
    </g>
    <!-- AH logo on tail -->
    <text x="-92" y="-15" text-anchor="middle" fill="#c0392b" font-size="7" font-family="monospace" font-weight="bold">AH</text>
  </g>

  <!-- Trail / contrail -->
  <path d="M 60 230 Q 110 215 165 195" stroke="#c0cfff" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- LOW-COST competitor badge (top-right) -->
  <g transform="translate(290,80)">
    <rect x="0" y="0" width="64" height="28" rx="4" fill="#ff6b6b" fill-opacity="0.18" stroke="#ff6b6b" stroke-width="1.3"/>
    <text x="32" y="13" text-anchor="middle" fill="#ff6b6b" font-size="9" font-family="monospace" font-weight="bold">FlyBudget</text>
    <text x="32" y="22" text-anchor="middle" fill="#ff6b6b" font-size="5" font-family="monospace" opacity="0.85">low-cost</text>
  </g>

  <!-- Price tag (top-left) -->
  <g transform="translate(50,90)">
    <path d="M 0 6 L 10 0 L 50 0 L 50 24 L 10 24 L 0 18 Z" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.3"/>
    <circle cx="10" cy="12" r="2.5" fill="#f5c842"/>
    <text x="32" y="16" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" font-weight="bold">$ Δ</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,340)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Pricing · AeroHonduras</text>
</svg>
