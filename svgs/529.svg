<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg529" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg529)"/>

  <text x="200" y="56" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.75" letter-spacing="2">SOVEREIGN RISK · ARGENTINA</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Globe (protagonist) -->
    <g transform="translate(160,200)">
      <circle r="88" fill="#1a2744" stroke="#74b9ff" stroke-width="3.5"/>
      <!-- Latitude lines -->
      <ellipse cx="0" cy="0" rx="88" ry="32" fill="none" stroke="#74b9ff" stroke-width="1.5" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="88" ry="64" fill="none" stroke="#74b9ff" stroke-width="1.5" opacity="0.5"/>
      <!-- Longitude lines -->
      <ellipse cx="0" cy="0" rx="32" ry="88" fill="none" stroke="#74b9ff" stroke-width="1.5" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="64" ry="88" fill="none" stroke="#74b9ff" stroke-width="1.5" opacity="0.5"/>
      <!-- Equator -->
      <line x1="-88" y1="0" x2="88" y2="0" stroke="#74b9ff" stroke-width="1.5" opacity="0.5"/>

      <!-- Argentina region highlighted -->
      <path d="M -16 24 Q -8 40 -4 64 Q 0 72 8 64 Q 12 48 8 32 Q 0 16 -16 24 Z"
            fill="#e74c3c" opacity="0.85" stroke="#0a0f1e" stroke-width="1.5"/>

      <!-- Pulse rings on Argentina -->
      <circle cx="-2" cy="44" r="20" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.5"/>
      <circle cx="-2" cy="44" r="32" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.25"/>
    </g>

    <!-- Risk gauge (right side) -->
    <g transform="translate(304,200)">
      <!-- Gauge arc -->
      <path d="M -40 0 A 40 40 0 0 1 40 0" fill="none" stroke="#0a0f1e" stroke-width="12"/>
      <!-- Risk fill (red zone) -->
      <path d="M -40 0 A 40 40 0 0 1 24 -32" fill="none" stroke="#e74c3c" stroke-width="12"/>
      <!-- Needle pointing high -->
      <line x1="0" y1="8" x2="32" y2="-24" stroke="#f5c842" stroke-width="3.5"/>
      <circle cx="0" cy="8" r="4" fill="#f5c842" stroke="none"/>

      <!-- Gauge ticks -->
      <line x1="-40" y1="0" x2="-48" y2="0" stroke="#74b9ff" stroke-width="2"/>
      <line x1="0" y1="-40" x2="0" y2="-48" stroke="#74b9ff" stroke-width="2"/>
      <line x1="40" y1="0" x2="48" y2="0" stroke="#74b9ff" stroke-width="2"/>
    </g>

    <!-- CDS badge top-left -->
    <g transform="translate(48,84)">
      <rect width="60" height="26" rx="4" fill="#e74c3c" fill-opacity="0.18" stroke="#e74c3c" stroke-width="1.5"/>
      <text x="30" y="18" text-anchor="middle" fill="#e74c3c" font-size="11" font-family="monospace" font-weight="bold">CDS</text>
    </g>

    <!-- FX badge top-right -->
    <g transform="translate(296,84)">
      <rect width="60" height="26" rx="4" fill="#f5c842" fill-opacity="0.15" stroke="#f5c842" stroke-width="1.5"/>
      <text x="30" y="18" text-anchor="middle" fill="#f5c842" font-size="11" font-family="monospace" font-weight="bold">FX</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#c0cfff" font-size="9" font-family="monospace" opacity="0.4" letter-spacing="1.2">Export Contract · AR</text>
</svg>
