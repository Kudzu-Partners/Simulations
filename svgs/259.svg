<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg259" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <radialGradient id="vrGlow259" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#7b2fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg259)"/>
  <rect width="400" height="400" rx="32" fill="url(#vrGlow259)"/>

  <!-- VR headset silhouette (center, large) -->
  <!-- Headset body -->
  <rect x="108" y="128" width="184" height="108" rx="18" fill="#0d1220" stroke="#c0aaff" stroke-width="3" opacity="0.95"/>
  <!-- Left lens -->
  <circle cx="158" cy="182" r="34" fill="#7b2fff" opacity="0.25"/>
  <circle cx="158" cy="182" r="34" fill="none" stroke="#c0aaff" stroke-width="2" opacity="0.8"/>
  <circle cx="158" cy="182" r="20" fill="#7b2fff" opacity="0.3"/>
  <!-- Right lens -->
  <circle cx="242" cy="182" r="34" fill="#7b2fff" opacity="0.25"/>
  <circle cx="242" cy="182" r="34" fill="none" stroke="#c0aaff" stroke-width="2" opacity="0.8"/>
  <circle cx="242" cy="182" r="20" fill="#7b2fff" opacity="0.3"/>
  <!-- Nose bridge -->
  <rect x="182" y="165" width="36" height="34" rx="6" fill="#0d1220" stroke="#c0aaff" stroke-width="1.5" opacity="0.6"/>
  <!-- Headband strap hints -->
  <line x1="108" y1="150" x2="72"  y2="142" stroke="#c0aaff" stroke-width="2.5" opacity="0.55"/>
  <line x1="108" y1="212" x2="72"  y2="220" stroke="#c0aaff" stroke-width="2.5" opacity="0.55"/>
  <line x1="292" y1="150" x2="328" y2="142" stroke="#c0aaff" stroke-width="2.5" opacity="0.55"/>
  <line x1="292" y1="212" x2="328" y2="220" stroke="#c0aaff" stroke-width="2.5" opacity="0.55"/>
  <!-- Spatial grid inside lenses -->
  <line x1="138" y1="166" x2="178" y2="198" stroke="#c0aaff" stroke-width="0.8" opacity="0.35"/>
  <line x1="158" y1="158" x2="158" y2="206" stroke="#c0aaff" stroke-width="0.8" opacity="0.35"/>
  <line x1="138" y1="182" x2="178" y2="182" stroke="#c0aaff" stroke-width="0.8" opacity="0.35"/>
  <line x1="222" y1="166" x2="262" y2="198" stroke="#c0aaff" stroke-width="0.8" opacity="0.35"/>
  <line x1="242" y1="158" x2="242" y2="206" stroke="#c0aaff" stroke-width="0.8" opacity="0.35"/>
  <line x1="222" y1="182" x2="262" y2="182" stroke="#c0aaff" stroke-width="0.8" opacity="0.35"/>

  <!-- Hype cycle curve (below headset) -->
  <path d="M 52,310 Q 90,308 110,285 Q 130,260 148,242 Q 160,228 168,268 Q 178,305 200,300 Q 240,292 290,296 Q 320,298 348,295"
        fill="none" stroke="#f5c842" stroke-width="2.5" opacity="0.85"/>

  <!-- Peak of inflated expectations label -->
  <line x1="148" y1="242" x2="148" y2="272" stroke="#f5c842" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.55"/>
  <text x="115" y="238" font-family="monospace" font-size="7.5" fill="#f5c842" opacity="0.75">Peak Hype</text>

  <!-- Trough label -->
  <text x="168" y="316" font-family="monospace" font-size="7.5" fill="#a0aec0" opacity="0.55">Trough</text>

  <!-- Plateau label -->
  <text x="295" y="290" font-family="monospace" font-size="7.5" fill="#00ff88" opacity="0.65">Plateau</text>

  <!-- Technology maturity stars (8 use cases) -->
  <circle cx="80"  cy="82" r="6" fill="#f5c842" opacity="0.7"/>
  <circle cx="105" cy="70" r="5" fill="#c0aaff" opacity="0.65"/>
  <circle cx="130" cy="82" r="7" fill="#00bfff" opacity="0.7"/>
  <circle cx="270" cy="70" r="5" fill="#c0aaff" opacity="0.65"/>
  <circle cx="295" cy="82" r="6" fill="#f5c842" opacity="0.6"/>
  <circle cx="320" cy="72" r="5" fill="#52b788" opacity="0.65"/>

  <!-- VR / AR / XR labels -->
  <text x="82"  y="60" font-family="monospace" font-size="8" fill="#f5c842"  opacity="0.75">VR</text>
  <text x="130" y="60" font-family="monospace" font-size="8" fill="#00bfff"  opacity="0.75">AR</text>
  <text x="318" y="60" font-family="monospace" font-size="8" fill="#52b788"  opacity="0.75">XR</text>

  <text x="200" y="370" font-family="monospace" font-size="9" fill="#a0aec0" text-anchor="middle" opacity="0.42">Hype vs Value · Maturity · 8 Use Cases</text>
</svg>
