<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg68" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="platform68" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#7b2fff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg68)"/>
  <!-- Central platform bar -->
  <rect x="150" y="185" width="100" height="30" rx="8" fill="url(#platform68)" opacity="0.85"/>
  <text x="200" y="206" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">CONECTA</text>
  <!-- Left side: suppliers/sellers -->
  <circle cx="80" cy="140" r="18" fill="#00bfff" opacity="0.6" stroke="#00bfff" stroke-width="1.5"/>
  <circle cx="80" cy="200" r="18" fill="#00bfff" opacity="0.5" stroke="#00bfff" stroke-width="1.5"/>
  <circle cx="80" cy="260" r="18" fill="#00bfff" opacity="0.4" stroke="#00bfff" stroke-width="1.5"/>
  <!-- Right side: buyers -->
  <circle cx="320" cy="140" r="18" fill="#7b2fff" opacity="0.6" stroke="#7b2fff" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="18" fill="#7b2fff" opacity="0.5" stroke="#7b2fff" stroke-width="1.5"/>
  <circle cx="320" cy="260" r="18" fill="#7b2fff" opacity="0.4" stroke="#7b2fff" stroke-width="1.5"/>
  <!-- Connection lines left to platform -->
  <line x1="98" y1="140" x2="150" y2="195" stroke="#00bfff" stroke-width="1.5" opacity="0.5"/>
  <line x1="98" y1="200" x2="150" y2="200" stroke="#00bfff" stroke-width="1.5" opacity="0.6"/>
  <line x1="98" y1="260" x2="150" y2="210" stroke="#00bfff" stroke-width="1.5" opacity="0.5"/>
  <!-- Connection lines right to platform -->
  <line x1="302" y1="140" x2="250" y2="195" stroke="#7b2fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="302" y1="200" x2="250" y2="200" stroke="#7b2fff" stroke-width="1.5" opacity="0.6"/>
  <line x1="302" y1="260" x2="250" y2="210" stroke="#7b2fff" stroke-width="1.5" opacity="0.5"/>
  <!-- Network effect arrows (circular) -->
  <path d="M200,145 Q240,120 260,155" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,3"/>
  <path d="M200,255 Q160,280 140,245" fill="none" stroke="#7b2fff" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,3"/>
  <!-- SME label left -->
  <text x="80" y="304" font-family="sans-serif" font-size="11" fill="#00bfff" text-anchor="middle" opacity="0.7">Sellers</text>
  <text x="320" y="304" font-family="sans-serif" font-size="11" fill="#7b2fff" text-anchor="middle" opacity="0.7">Buyers</text>
</svg>
