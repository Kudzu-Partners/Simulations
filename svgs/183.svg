<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg183" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg183)"/>

  <!-- REINFORCING LOOP (R) — large clockwise loop left side -->
  <!-- Loop arc -->
  <path d="M 145 160 A 72 72 0 1 1 148 232" fill="none" stroke="#00bfff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Arrowhead -->
  <polygon points="148,232 136,218 152,216" fill="#00bfff" opacity="0.8"/>
  <!-- R label inside loop -->
  <circle cx="130" cy="196" r="22" fill="#00bfff" opacity="0.08"/>
  <text x="130" y="192" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#00bfff" text-anchor="middle" opacity="0.85">R</text>
  <text x="130" y="208" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.6">Reinforce</text>

  <!-- Nodes on R loop -->
  <circle cx="145" cy="148" r="28" fill="#0d1b2a" opacity="0.95"/>
  <circle cx="145" cy="148" r="28" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.8"/>
  <text x="145" y="143" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.9">Traffic</text>
  <text x="145" y="155" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.65">Congestion</text>

  <circle cx="72" cy="248" r="28" fill="#0d1b2a" opacity="0.95"/>
  <circle cx="72" cy="248" r="28" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.75"/>
  <text x="72" y="243" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.85">Car</text>
  <text x="72" y="255" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.6">Dependency</text>

  <circle cx="190" cy="290" r="28" fill="#0d1b2a" opacity="0.95"/>
  <circle cx="190" cy="290" r="28" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.75"/>
  <text x="190" y="285" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.85">Road</text>
  <text x="190" y="297" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.6">Expansion</text>

  <!-- R loop connecting arcs between nodes -->
  <path d="M 100 238 Q 72 200 100 162" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.4"/>
  <path d="M 160 275 Q 200 310 220 290" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.4"/>

  <!-- BALANCING LOOP (B) — smaller counter-clockwise loop right side -->
  <path d="M 268 155 A 68 68 0 1 0 264 228" fill="none" stroke="#52b788" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <polygon points="264,228 276,215 260,212" fill="#52b788" opacity="0.8"/>
  <!-- B label -->
  <circle cx="295" cy="192" r="22" fill="#52b788" opacity="0.06"/>
  <text x="295" y="188" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#52b788" text-anchor="middle" opacity="0.85">B</text>
  <text x="295" y="204" font-family="Arial,sans-serif" font-size="8" fill="#52b788" text-anchor="middle" opacity="0.6">Balance</text>

  <!-- Nodes on B loop -->
  <circle cx="265" cy="143" r="28" fill="#0d1b2a" opacity="0.95"/>
  <circle cx="265" cy="143" r="28" fill="none" stroke="#52b788" stroke-width="2" opacity="0.8"/>
  <text x="265" y="138" font-family="Arial,sans-serif" font-size="8" fill="#52b788" text-anchor="middle" opacity="0.9">Public</text>
  <text x="265" y="150" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.65">Transport</text>

  <circle cx="340" cy="248" r="28" fill="#0d1b2a" opacity="0.95"/>
  <circle cx="340" cy="248" r="28" fill="none" stroke="#52b788" stroke-width="2" opacity="0.75"/>
  <text x="340" y="243" font-family="Arial,sans-serif" font-size="8" fill="#52b788" text-anchor="middle" opacity="0.85">Ridership</text>
  <text x="340" y="255" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.6">Funding</text>

  <!-- Connecting arc between R and B loops (leverage point) -->
  <path d="M 173 148 Q 207 140 237 143" fill="none" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.65"/>
  <polygon points="237,138 249,143 237,148" fill="#f5c842" opacity="0.65"/>

  <!-- Leverage point label -->
  <circle cx="207" cy="140" r="10" fill="#f5c842" opacity="0.15"/>
  <circle cx="207" cy="140" r="10" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.7"/>
  <text x="207" y="136" font-family="Arial,sans-serif" font-size="7" fill="#f5c842" text-anchor="middle" opacity="0.85">⚡</text>

  <!-- Signs on arrows (+ / -) -->
  <text x="90" y="188" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#00bfff" text-anchor="middle" opacity="0.6">+</text>
  <text x="316" y="192" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#52b788" text-anchor="middle" opacity="0.6">−</text>

  <!-- City name -->
  <text x="200" y="358" font-family="Arial,sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.35">Ciudad Valparaíso · Urban Mobility Crisis</text>
  <text x="200" y="374" font-family="Arial,sans-serif" font-size="9" fill="#c0cfff" text-anchor="middle" opacity="0.4" letter-spacing="1">CAUSAL LOOP DYNAMICS</text>
</svg>
