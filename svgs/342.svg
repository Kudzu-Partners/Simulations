<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="splitDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#95a5a6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <!-- Dividing line (split: analog left / digital right) -->
  <line x1="200" y1="55" x2="200" y2="345" stroke="url(#splitDiv)" stroke-width="3"/>

  <!-- === LEFT HALF: FACTORY (Traditional / Analog) === -->
  <!-- Factory building -->
  <rect x="62" y="200" width="55" height="100" rx="4"
        fill="#95a5a6" fill-opacity="0.2" stroke="#95a5a6" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="90" y="220" width="40" height="80" rx="3"
        fill="#95a5a6" fill-opacity="0.15" stroke="#95a5a6" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Chimneys -->
  <rect x="70" y="168" width="14" height="36" rx="3" fill="#95a5a6" opacity="0.55"/>
  <rect x="90" y="178" width="12" height="26" rx="3" fill="#95a5a6" opacity="0.5"/>
  <rect x="109" y="173" width="13" height="30" rx="3" fill="#95a5a6" opacity="0.5"/>
  <!-- Smoke -->
  <circle cx="77" cy="160" r="8" fill="#95a5a6" opacity="0.2"/>
  <circle cx="85" cy="152" r="6" fill="#95a5a6" opacity="0.15"/>
  <circle cx="115" cy="162" r="7" fill="#95a5a6" opacity="0.18"/>
  <!-- Windows -->
  <rect x="70" y="215" width="14" height="12" rx="2" fill="#95a5a6" opacity="0.3"/>
  <rect x="90" y="215" width="12" height="12" rx="2" fill="#95a5a6" opacity="0.3"/>
  <!-- Big gear (analog) -->
  <g transform="translate(125, 155)">
    <circle cx="0" cy="0" r="30" fill="#95a5a6" fill-opacity="0.12" stroke="#95a5a6" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="12" fill="#1b2d4f" stroke="#95a5a6" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="-5" y="-38" width="10" height="11" rx="2" fill="#95a5a6" opacity="0.6"/>
    <rect x="-5" y="27" width="10" height="11" rx="2" fill="#95a5a6" opacity="0.6"/>
    <rect x="27" y="-5" width="11" height="10" rx="2" fill="#95a5a6" opacity="0.6"/>
    <rect x="-38" y="-5" width="11" height="10" rx="2" fill="#95a5a6" opacity="0.6"/>
  </g>
  <!-- "ANALÓGICO" label -->
  <text x="118" y="292" text-anchor="middle" fill="#95a5a6" font-size="11" font-family="monospace" opacity="0.55" letter-spacing="1">ANALÓGICO</text>
  <text x="118" y="310" text-anchor="middle" fill="#95a5a6" font-size="10" font-family="monospace" opacity="0.4">Argentina</text>

  <!-- === RIGHT HALF: DIGITAL CIRCUIT BOARD === -->
  <!-- Circuit traces (horizontal) -->
  <g stroke="#00bfff" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <line x1="215" y1="120" x2="280" y2="120"/>
    <line x1="280" y1="120" x2="280" y2="155"/>
    <line x1="280" y1="155" x2="340" y2="155"/>
    <line x1="215" y1="155" x2="250" y2="155"/>
    <line x1="250" y1="155" x2="250" y2="190"/>
    <line x1="250" y1="190" x2="340" y2="190"/>
    <line x1="215" y1="190" x2="230" y2="190"/>
    <line x1="230" y1="190" x2="230" y2="225"/>
    <line x1="230" y1="225" x2="340" y2="225"/>
    <line x1="215" y1="225" x2="265" y2="225"/>
    <line x1="265" y1="225" x2="265" y2="260"/>
    <line x1="265" y1="260" x2="340" y2="260"/>
    <line x1="215" y1="260" x2="215" y2="295"/>
    <line x1="215" y1="295" x2="340" y2="295"/>
    <line x1="310" y1="120" x2="310" y2="295"/>
  </g>
  <!-- Circuit nodes / pads -->
  <g fill="#00bfff" opacity="0.8">
    <circle cx="280" cy="120" r="4"/>
    <circle cx="280" cy="155" r="4"/>
    <circle cx="250" cy="155" r="4"/>
    <circle cx="250" cy="190" r="4"/>
    <circle cx="230" cy="190" r="4"/>
    <circle cx="230" cy="225" r="4"/>
    <circle cx="265" cy="225" r="4"/>
    <circle cx="265" cy="260" r="4"/>
    <circle cx="310" cy="155" r="4"/>
    <circle cx="310" cy="225" r="4"/>
    <circle cx="310" cy="295" r="4"/>
  </g>
  <!-- IC chip in center -->
  <rect x="240" y="165" width="40" height="35" rx="4"
        fill="#0d1b2a" stroke="#00bfff" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Chip pins -->
  <line x1="240" y1="172" x2="232" y2="172" stroke="#00bfff" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="180" x2="232" y2="180" stroke="#00bfff" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="188" x2="232" y2="188" stroke="#00bfff" stroke-width="1.5" opacity="0.7"/>
  <line x1="280" y1="172" x2="288" y2="172" stroke="#00bfff" stroke-width="1.5" opacity="0.7"/>
  <line x1="280" y1="180" x2="288" y2="180" stroke="#00bfff" stroke-width="1.5" opacity="0.7"/>
  <line x1="280" y1="188" x2="288" y2="188" stroke="#00bfff" stroke-width="1.5" opacity="0.7"/>
  <text x="260" y="187" text-anchor="middle" fill="#00bfff" font-size="9" font-family="monospace" opacity="0.85">AI</text>
  <!-- DIGITAL label -->
  <text x="282" y="318" text-anchor="middle" fill="#00bfff" font-size="11" font-family="monospace" opacity="0.6" letter-spacing="1">DIGITAL</text>

  <!-- THE LEAP ARROW crossing the divide -->
  <path d="M152,200 C165,190 178,185 190,183" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
  <path d="M210,183 C222,185 232,190 242,195" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
  <polygon points="240,190 250,197 242,203" fill="#ffd166" opacity="0.9"/>
  <!-- Leap arc over dividing line -->
  <path d="M150,200 C170,155 230,155 250,197"
        fill="none" stroke="#ffd166" stroke-width="2.5" stroke-opacity="0.7" stroke-dasharray="6,4"/>
  <!-- Spark at crossing point -->
  <circle cx="200" cy="183" r="8" fill="#ffd166" fill-opacity="0.4" stroke="#ffd166" stroke-width="2" stroke-opacity="0.8"/>
  <text x="200" y="187" text-anchor="middle" fill="#ffd166" font-size="9" font-family="monospace" font-weight="bold" opacity="0.95">!</text>

  <!-- Build / Buy / Partner badges (bottom) -->
  <rect x="62" y="345" width="44" height="20" rx="4" fill="#95a5a6" fill-opacity="0.2" stroke="#95a5a6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="84" y="359" text-anchor="middle" fill="#95a5a6" font-size="9" font-family="monospace" opacity="0.7">BUILD</text>
  <rect x="112" y="345" width="38" height="20" rx="4" fill="#ffd166" fill-opacity="0.15" stroke="#ffd166" stroke-width="1" stroke-opacity="0.5"/>
  <text x="131" y="359" text-anchor="middle" fill="#ffd166" font-size="9" font-family="monospace" opacity="0.7">BUY</text>
  <rect x="156" y="345" width="56" height="20" rx="4" fill="#00bfff" fill-opacity="0.12" stroke="#00bfff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="184" y="359" text-anchor="middle" fill="#00bfff" font-size="9" font-family="monospace" opacity="0.7">PARTNER</text>
</svg>
