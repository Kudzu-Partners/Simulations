  <!-- Crack lines -->
  <polyline points="248,110 252,130 244,138 256,155 260,172" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="252" y1="130" x2="268" y2="126" stroke="#e74c3c" stroke-width="1.5" opacity="0.6"/>
  <line x1="244" y1="138" x2="230" y2="140" stroke="#e74c3c" stroke-width="1.5" opacity="0.6"/>
  <!-- Breach badge -->
  <circle cx="275" cy="108" r="20" fill="#e74c3c" opacity="0.2"/>
  <circle cx="275" cy="108" r="20" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.85"/>
  <text x="275" y="103" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#e74c3c" text-anchor="middle" opacity="0.9">2M</text>
  <text x="275" y="115" font-family="Arial,sans-serif" font-size="7" fill="#e74c3c" text-anchor="middle" opacity="0.8">records</text>

  <!-- Data flow lines coming in (left side) -->
  <line x1="52" y1="140" x2="128" y2="155" stroke="#00bfff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.45"/>
  <line x1="52" y1="165" x2="128" y2="170" stroke="#00bfff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="52" y1="190" x2="128" y2="185" stroke="#00bfff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.35"/>
  <!-- Data node labels -->
  <rect x="30" y="132" width="22" height="16" rx="3" fill="#00bfff" opacity="0.12"/>
  <text x="41" y="144" font-family="Arial,sans-serif" font-size="7" fill="#00bfff" text-anchor="middle" opacity="0.65">KYC</text>
  <rect x="30" y="157" width="22" height="16" rx="3" fill="#00bfff" opacity="0.12"/>
  <text x="41" y="169" font-family="Arial,sans-serif" font-size="7" fill="#00bfff" text-anchor="middle" opacity="0.65">PII</text>
  <rect x="30" y="182" width="22" height="16" rx="3" fill="#00bfff" opacity="0.12"/>
  <text x="41" y="194" font-family="Arial,sans-serif" font-size="7" fill="#00bfff" text-anchor="middle" opacity="0.6">Txn</text>

  <!-- Privacy checkpoints (right side outputs) -->
  <line x1="272" y1="200" x2="340" y2="200" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5"/>
  <circle cx="348" cy="200" r="10" fill="#00ff88" opacity="0.15"/>
  <circle cx="348" cy="200" r="10" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.7"/>
  <text x="348" y="204" font-family="Arial,sans-serif" font-size="8" fill="#00ff88" text-anchor="middle" opacity="0.8">✓</text>

  <!-- Compliance layers at bottom -->
  <rect x="100" y="290" width="65" height="22" rx="6" fill="#7b2fff" opacity="0.12"/>
  <rect x="100" y="290" width="65" height="22" rx="6" fill="none" stroke="#7b2fff" stroke-width="1.5" opacity="0.6"/>
  <text x="132" y="305" font-family="Arial,sans-serif" font-size="8" fill="#7b2fff" text-anchor="middle" opacity="0.8">GDPR</text>

  <rect x="172" y="290" width="56" height="22" rx="6" fill="#7b2fff" opacity="0.12"/>
  <rect x="172" y="290" width="56" height="22" rx="6" fill="none" stroke="#7b2fff" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="305" font-family="Arial,sans-serif" font-size="8" fill="#7b2fff" text-anchor="middle" opacity="0.8">LGPD</text>

  <rect x="235" y="290" width="65" height="22" rx="6" fill="#7b2fff" opacity="0.12"/>
  <rect x="235" y="290" width="65" height="22" rx="6" fill="none" stroke="#7b2fff" stroke-width="1.5" opacity="0.55"/>
  <text x="267" y="305" font-family="Arial,sans-serif" font-size="8" fill="#7b2fff" text-anchor="middle" opacity="0.7">LATAM</text>

  <!-- FinNova label -->
  <text x="200" y="346" font-family="Arial,sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.35">FinNova Digital · Data Protection</text>
  <text x="200" y="362" font-family="Arial,sans-serif" font-size="9" fill="#00bfff" text-anchor="middle" opacity="0.4" letter-spacing="1">PRIVACY ENGINEERING · BREACH</text>
</svg>
