<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg185" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <radialGradient id="breachGlow185" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg185)"/>

  <!-- Central shield -->
  <path d="M 200 72 L 272 100 L 272 185 Q 272 242 200 272 Q 128 242 128 185 L 128 100 Z" fill="#00bfff" opacity="0.08"/>
  <path d="M 200 72 L 272 100 L 272 185 Q 272 242 200 272 Q 128 242 128 185 L 128 100 Z" fill="none" stroke="#00bfff" stroke-width="3" opacity="0.8"/>

  <!-- Lock icon inside shield -->
  <rect x="178" y="170" width="44" height="34" rx="5" fill="#00bfff" opacity="0.2"/>
  <rect x="178" y="170" width="44" height="34" rx="5" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.8"/>
  <path d="M 186 170 Q 186 152 200 152 Q 214 152 214 170" fill="none" stroke="#00bfff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="200" cy="185" r="5" fill="#00bfff" opacity="0.8"/>
  <line x1="200" y1="190" x2="200" y2="196" stroke="#00bfff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- BREACH: crack in shield + red glow -->
