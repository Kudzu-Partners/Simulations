<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg292" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg292)"/>

  <!-- Production timeline (horizontal flow) -->
  <!-- Station 1: Cut -->
  <rect x="30" y="148" width="66" height="104" rx="8" fill="#1a2744" stroke="#74b9ff" stroke-width="2.5"/>
  <text x="63" y="188" text-anchor="middle" font-family="sans-serif" font-size="32">✂️</text>
  <!-- Fill bar: 80% -->
  <rect x="38" y="218" width="50" height="10" rx="3" fill="#1a3a5c"/>
  <rect x="38" y="218" width="40" height="10" rx="3" fill="#74b9ff" opacity="0.8"/>

  <!-- Arrow 1→2 -->
  <line x1="96" y1="200" x2="118" y2="200" stroke="#74b9ff" stroke-width="3" stroke-linecap="round"/>
  <polygon points="114,194 124,200 114,206" fill="#74b9ff"/>

  <!-- Station 2: SEW — BOTTLENECK (red, pulsing) -->
  <rect x="124" y="116" width="66" height="168" rx="8" fill="#2a0a0a" stroke="#e74c3c" stroke-width="3.5"/>
  <!-- Warning ring -->
  <rect x="116" y="108" width="82" height="184" rx="12" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,4"/>
  <text x="157" y="185" text-anchor="middle" font-family="sans-serif" font-size="32">🧵</text>
  <!-- Full bar (overloaded) -->
  <rect x="132" y="240" width="50" height="12" rx="3" fill="#7d0000"/>
  <rect x="132" y="240" width="50" height="12" rx="3" fill="#e74c3c" opacity="0.9"/>
  <!-- Bottleneck label (icon) -->
  <path d="M 157 106 L 148 96 L 166 96 Z" fill="#e74c3c" opacity="0.9"/>

  <!-- Arrow 2→3 -->
  <line x1="190" y1="200" x2="212" y2="200" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,3" opacity="0.7"/>
  <polygon points="208,194 218,200 208,206" fill="#e74c3c" opacity="0.7"/>

  <!-- Station 3: Quality Check -->
  <rect x="218" y="148" width="66" height="104" rx="8" fill="#1a2744" stroke="#a29bfe" stroke-width="2"/>
  <text x="251" y="188" text-anchor="middle" font-family="sans-serif" font-size="32">🔍</text>
  <rect x="226" y="218" width="50" height="10" rx="3" fill="#1a3a5c"/>
  <rect x="226" y="218" width="28" height="10" rx="3" fill="#a29bfe" opacity="0.7"/>

  <!-- Arrow 3→4 -->
  <line x1="284" y1="200" x2="306" y2="200" stroke="#a29bfe" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <polygon points="302,194 312,200 302,206" fill="#a29bfe" opacity="0.5"/>

  <!-- Station 4: Ship (waiting) -->
  <rect x="312" y="148" width="58" height="104" rx="8" fill="#1a2032" stroke="#556" stroke-width="1.5"/>
  <text x="341" y="188" text-anchor="middle" font-family="sans-serif" font-size="28" opacity="0.4">📦</text>
  <rect x="320" y="218" width="42" height="10" rx="3" fill="#1a2032" stroke="#556" stroke-width="1"/>

  <!-- Queue triangle (overflow at bottleneck) -->
  <g transform="translate(124, 295)">
    <path d="M 33 0 L 0 44 L 66 44 Z" fill="#e74c3c" opacity="0.25"/>
    <path d="M 33 6 L 6 44 L 60 44 Z" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Waiting items -->
    <circle cx="22" cy="38" r="5" fill="#e74c3c" opacity="0.6"/>
    <circle cx="33" cy="38" r="5" fill="#e74c3c" opacity="0.6"/>
    <circle cx="44" cy="38" r="5" fill="#e74c3c" opacity="0.6"/>
    <circle cx="27" cy="28" r="5" fill="#e74c3c" opacity="0.4"/>
    <circle cx="38" cy="28" r="5" fill="#e74c3c" opacity="0.4"/>
  </g>
</svg>
