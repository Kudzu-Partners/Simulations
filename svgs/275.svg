<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg275" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1a0e"/>
      <stop offset="100%" stop-color="#4a2f1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg275)"/>

  <!-- Coffee shop table (center) -->
  <ellipse cx="200" cy="230" rx="72" ry="28" fill="#6b3f1e" opacity="0.45" stroke="#c9a96e" stroke-width="1.5"/>
  <rect x="170" y="228" width="60" height="48" rx="4" fill="#6b3f1e" opacity="0.3"/>

  <!-- Coffee cup on table -->
  <rect x="185" y="198" width="32" height="28" rx="4" fill="#0d0d0d" stroke="#c9a96e" stroke-width="1.5"/>
  <ellipse cx="201" cy="198" rx="16" ry="5" fill="#3d1f0a" stroke="#c9a96e" stroke-width="1.2"/>
  <!-- Steam -->
  <path d="M 196,192 Q 194,184 196,178" fill="none" stroke="#c9a96e" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
  <path d="M 202,191 Q 200,182 202,175" fill="none" stroke="#c9a96e" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
  <path d="M 208,192 Q 206,184 208,178" fill="none" stroke="#c9a96e" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>

  <!-- Observer figure (left) -->
  <circle cx="102" cy="192" r="12" fill="none" stroke="#f5c842" stroke-width="2.2"/>
  <circle cx="102" cy="192" r="5" fill="#f5c842" opacity="0.6"/>
  <!-- Body -->
  <line x1="102" y1="204" x2="102" y2="235" stroke="#f5c842" stroke-width="2" opacity="0.7"/>
  <!-- Arm holding notebook -->
  <line x1="102" y1="214" x2="118" y2="222" stroke="#f5c842" stroke-width="2" opacity="0.7"/>

  <!-- Fieldnotes notebook -->
  <rect x="118" y="218" width="36" height="28" rx="3" fill="#1a3a5c" stroke="#74b9ff" stroke-width="1.5"/>
  <line x1="124" y1="226" x2="148" y2="226" stroke="#74b9ff" stroke-width="1" opacity="0.6"/>
  <line x1="124" y1="232" x2="148" y2="232" stroke="#74b9ff" stroke-width="1" opacity="0.6"/>
  <line x1="124" y1="238" x2="140" y2="238" stroke="#74b9ff" stroke-width="1" opacity="0.6"/>
  <text x="136" y="222" font-family="monospace" font-size="6" fill="#74b9ff" opacity="0.8" text-anchor="middle">notes</text>

  <!-- Time allocation pie (right) -->
  <circle cx="298" cy="190" r="46" fill="#0d0d0d" stroke="#c9a96e" stroke-width="1.2" opacity="0.5"/>
  <!-- Observation slice ~40% -->
  <path d="M 298,190 L 344,190 A 46,46 0 0,0 312,147 Z" fill="#f5c842" opacity="0.7"/>
  <!-- Notes slice ~35% -->
  <path d="M 298,190 L 312,147 A 46,46 0 0,0 258,170 Z" fill="#74b9ff" opacity="0.7"/>
  <!-- Artifacts slice ~25% -->
  <path d="M 298,190 L 258,170 A 46,46 0 0,0 298,236 Z" fill="#52b788" opacity="0.7"/>
  <!-- Remaining -->
  <path d="M 298,190 L 298,236 A 46,46 0 0,0 344,190 Z" fill="#e67e22" opacity="0.5"/>
  <text x="322" y="178" font-family="monospace" font-size="7" fill="#0d0d0d" font-weight="bold">OBS</text>
  <text x="278" y="158" font-family="monospace" font-size="6.5" fill="#0d0d0d" font-weight="bold">NOTES</text>
  <text x="264" y="208" font-family="monospace" font-size="6" fill="#0d0d0d" font-weight="bold">ART.</text>

  <!-- Legend -->
  <rect x="238" y="248" width="10" height="8" fill="#f5c842" opacity="0.7"/>
  <text x="252" y="256" font-family="monospace" font-size="7" fill="#a0aec0" opacity="0.75">Observation</text>
  <rect x="238" y="260" width="10" height="8" fill="#74b9ff" opacity="0.7"/>
  <text x="252" y="268" font-family="monospace" font-size="7" fill="#a0aec0" opacity="0.75">Field Notes</text>
  <rect x="238" y="272" width="10" height="8" fill="#52b788" opacity="0.7"/>
  <text x="252" y="280" font-family="monospace" font-size="7" fill="#a0aec0" opacity="0.75">Artifacts</text>

  <!-- Observation arrows from figure to table -->
  <path d="M 114,195 Q 145,205 162,218" fill="none" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <polygon points="162,218 155,213 158,221" fill="#f5c842" opacity="0.6"/>

  <!-- Title -->
  <text x="200" y="48" font-family="monospace" font-size="10" fill="#c9a96e" text-anchor="middle" font-weight="bold">EthnoLab</text>
  <text x="200" y="62" font-family="monospace" font-size="7.5" fill="#a0aec0" text-anchor="middle" opacity="0.6">Fieldwork · Observation · Notes · Artifacts</text>

  <!-- Bottom label -->
  <text x="200" y="370" font-family="monospace" font-size="9" fill="#a0aec0" text-anchor="middle" opacity="0.42">Ethnography · Time Allocation · Coffee Shop Fieldwork</text>
</svg>
