<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg311" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="inflBar311" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="60%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg311)"/>

  <!-- Inflation thermometer (protagonist) -->
  <g transform="translate(72, 52)">
    <!-- Thermometer tube -->
    <rect x="22" y="0" width="20" height="240" rx="10" fill="#1a2744" stroke="#f5c842" stroke-width="2"/>
    <!-- Mercury fill (high inflation) -->
    <rect x="26" y="30" width="12" height="206" rx="6" fill="url(#inflBar311)" opacity="0.9"/>
    <!-- Bulb -->
    <circle cx="32" cy="248" r="24" fill="#e74c3c" opacity="0.9" stroke="#f5c842" stroke-width="2"/>
    <!-- Tick marks -->
    <line x1="42" y1="60" x2="54" y2="60" stroke="#f5c842" stroke-width="2" opacity="0.6"/>
    <line x1="42" y1="100" x2="54" y2="100" stroke="#f5c842" stroke-width="2" opacity="0.6"/>
    <line x1="42" y1="140" x2="54" y2="140" stroke="#f5c842" stroke-width="2" opacity="0.6"/>
    <line x1="42" y1="180" x2="54" y2="180" stroke="#f5c842" stroke-width="2" opacity="0.6"/>
    <line x1="42" y1="220" x2="66" y2="220" stroke="#e74c3c" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Policy levers (right side) -->
  <g transform="translate(152, 60)">
    <!-- Fiscal -->
    <rect x="0" y="0" width="200" height="56" rx="10" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <text x="28" y="28" font-family="sans-serif" font-size="26">🏛</text>
    <!-- Slider -->
    <rect x="58" y="20" width="128" height="10" rx="5" fill="#1a3a5c"/>
    <rect x="58" y="20" width="72" height="10" rx="5" fill="#74b9ff" opacity="0.8"/>
    <circle cx="130" cy="25" r="9" fill="#74b9ff"/>

    <!-- Monetary -->
    <rect x="0" y="68" width="200" height="56" rx="10" fill="#1a2744" stroke="#00ff88" stroke-width="2"/>
    <text x="28" y="96" font-family="sans-serif" font-size="26">🏦</text>
    <rect x="58" y="88" width="128" height="10" rx="5" fill="#1a3a5c"/>
    <rect x="58" y="88" width="100" height="10" rx="5" fill="#00ff88" opacity="0.8"/>
    <circle cx="158" cy="93" r="9" fill="#00ff88"/>

    <!-- Exchange rate -->
    <rect x="0" y="136" width="200" height="56" rx="10" fill="#1a2744" stroke="#f5c842" stroke-width="2"/>
    <text x="28" y="164" font-family="sans-serif" font-size="26">💱</text>
    <rect x="58" y="156" width="128" height="10" rx="5" fill="#1a3a5c"/>
    <rect x="58" y="156" width="44" height="10" rx="5" fill="#e74c3c" opacity="0.8"/>
    <circle cx="102" cy="161" r="9" fill="#e74c3c"/>
  </g>

  <!-- GDP chart (bottom) -->
  <g transform="translate(36, 330)">
    <rect x="0" y="0" width="328" height="40" rx="8" fill="#1a2744" stroke="#8899aa" stroke-width="1" opacity="0.6"/>
    <!-- GDP line (stalling) -->
    <path d="M 10 32 L 60 22 L 110 18 L 160 20 L 210 24 L 260 28 L 310 30"
          stroke="#f5c842" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Inflation bar chart (overlay) -->
    <rect x="10" y="20" width="12" height="12" rx="2" fill="#e74c3c" opacity="0.5"/>
    <rect x="32" y="14" width="12" height="18" rx="2" fill="#e74c3c" opacity="0.6"/>
    <rect x="54" y="8" width="12" height="24" rx="2" fill="#e74c3c" opacity="0.7"/>
    <rect x="76" y="4" width="12" height="28" rx="2" fill="#e74c3c" opacity="0.8"/>
  </g>
</svg>
