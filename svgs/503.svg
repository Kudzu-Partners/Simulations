<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg503" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#0d1421"/>
    </linearGradient>
    <linearGradient id="lock503" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#7a1418"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg503)"/>

  <text x="200" y="58" text-anchor="middle" fill="#ff6b6b" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">RANSOMWARE · CYBER CRISIS</text>

  <!-- Background binary code -->
  <g opacity="0.25" font-family="monospace" font-size="7" fill="#52b788">
    <text x="50" y="100">10101 11001 00110 1001</text>
    <text x="50" y="120">01100 10101 11010 0100</text>
    <text x="50" y="330">11010 00111 01010 1101</text>
    <text x="50" y="350">10110 11001 01010 0110</text>
  </g>

  <!-- LOCK (hero, central) -->
  <g transform="translate(200,225)">
    <!-- shackle -->
    <path d="M -30 -10 Q -30 -60 0 -60 Q 30 -60 30 -10" fill="none" stroke="url(#lock503)" stroke-width="9" stroke-linecap="round"/>
    <!-- body -->
    <rect x="-50" y="-15" width="100" height="80" rx="8" fill="url(#lock503)" stroke="#3d0000" stroke-width="2.5"/>
    <!-- keyhole -->
    <circle cx="0" cy="15" r="9" fill="#1a1a1a"/>
    <rect x="-3" y="15" width="6" height="22" fill="#1a1a1a"/>
    <!-- skull warning -->
    <g transform="translate(0,-32)" fill="#fff" opacity="0.95">
      <circle cx="0" cy="0" r="6"/>
      <rect x="-4" y="4" width="8" height="3" rx="1"/>
      <circle cx="-2" cy="-1" r="1.3" fill="#1a1a1a"/>
      <circle cx="2" cy="-1" r="1.3" fill="#1a1a1a"/>
    </g>
  </g>

  <!-- $500K prevention badge (bottom-left) -->
  <g transform="translate(60,335)">
    <rect x="0" y="0" width="74" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.3"/>
    <text x="37" y="13" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" font-weight="bold">$500K</text>
    <text x="37" y="22" text-anchor="middle" fill="#52b788" font-size="5" font-family="monospace" opacity="0.85">PREVENT 10×</text>
  </g>

  <!-- AML badge (top-left) -->
  <g transform="translate(55,90)">
    <rect x="0" y="0" width="58" height="28" rx="4" fill="#c0cfff" fill-opacity="0.15" stroke="#c0cfff" stroke-width="1.3"/>
    <text x="29" y="14" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" font-weight="bold">AML</text>
    <text x="29" y="22" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" opacity="0.85">compliance</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,335)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Cyber · Ransomware · Microfin</text>
</svg>
