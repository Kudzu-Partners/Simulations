<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg140" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg140)"/>

  <!-- Matrix border -->
  <rect x="72" y="72" width="256" height="256" rx="4" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.25"/>

  <!-- Divider lines -->
  <line x1="200" y1="72" x2="200" y2="328" stroke="#f5c842" stroke-width="1.5" opacity="0.35"/>
  <line x1="72" y1="200" x2="328" y2="200" stroke="#f5c842" stroke-width="1.5" opacity="0.35"/>

  <!-- Axis arrows -->
  <line x1="68" y1="328" x2="68" y2="68" stroke="#c0cfff" stroke-width="1.5" opacity="0.4"/>
  <polygon points="68,64 64,74 72,74" fill="#c0cfff" opacity="0.4"/>
  <line x1="68" y1="332" x2="332" y2="332" stroke="#c0cfff" stroke-width="1.5" opacity="0.4"/>
  <polygon points="336,332 326,328 326,336" fill="#c0cfff" opacity="0.4"/>

  <!-- Axis labels -->
  <text x="200" y="354" font-family="Arial,sans-serif" font-size="10" fill="#c0cfff" opacity="0.5" text-anchor="middle">Profit Impact</text>
  <text x="48" y="200" font-family="Arial,sans-serif" font-size="10" fill="#c0cfff" opacity="0.5" text-anchor="middle" transform="rotate(-90,48,200)">Supply Risk</text>

  <!-- Quadrant labels -->
  <text x="136" y="93" font-family="Arial,sans-serif" font-size="10" fill="#c0cfff" opacity="0.6" text-anchor="middle">Non-Critical</text>
  <text x="264" y="93" font-family="Arial,sans-serif" font-size="10" fill="#f5c842" opacity="0.8" text-anchor="middle">Leverage</text>
  <text x="136" y="320" font-family="Arial,sans-serif" font-size="10" fill="#c0cfff" opacity="0.6" text-anchor="middle">Bottleneck</text>
  <text x="264" y="320" font-family="Arial,sans-serif" font-size="10" fill="#f5c842" opacity="0.9" text-anchor="middle">Strategic</text>

  <!-- Non-Critical suppliers (small, top-left) -->
  <circle cx="115" cy="145" r="11" fill="#c0cfff" opacity="0.25"/>
  <circle cx="148" cy="162" r="8" fill="#c0cfff" opacity="0.2"/>
  <circle cx="128" cy="178" r="6" fill="#c0cfff" opacity="0.18"/>

  <!-- Leverage suppliers (medium-large, top-right) -->
  <circle cx="248" cy="128" r="22" fill="#f5c842" opacity="0.45"/>
  <circle cx="292" cy="152" r="16" fill="#f5c842" opacity="0.3"/>
  <circle cx="264" cy="170" r="10" fill="#f5c842" opacity="0.22"/>

  <!-- Bottleneck (medium, bottom-left) -->
  <circle cx="118" cy="248" r="17" fill="#e07a00" opacity="0.55"/>
  <circle cx="158" cy="275" r="10" fill="#e07a00" opacity="0.35"/>

  <!-- Strategic (large, prominent, bottom-right) -->
  <circle cx="268" cy="252" r="32" fill="#f5c842" opacity="0.15"/>
  <circle cx="268" cy="252" r="32" fill="none" stroke="#f5c842" stroke-width="2.5" opacity="0.85"/>
  <circle cx="268" cy="252" r="18" fill="#f5c842" opacity="0.55"/>
  <circle cx="305" cy="280" r="15" fill="#f5c842" opacity="0.35"/>
  <circle cx="248" cy="285" r="9" fill="#f5c842" opacity="0.28"/>
</svg>
