<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg113" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="layer113a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2fff"/>
      <stop offset="100%" stop-color="#3a1080"/>
    </linearGradient>
    <linearGradient id="layer113b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#0a6090"/>
    </linearGradient>
    <linearGradient id="layer113c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#0a8050"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg113)"/>
  <!-- Stack of 3 HR tech layers (cards) with people on top, AI brain at base -->
  <!-- Layer 3 (Talent acquisition - top, smallest) -->
  <g transform="translate(200 130)">
    <path d="M-90 0 L0 -32 L90 0 L0 32 Z" fill="url(#layer113a)" stroke="#ffffff" stroke-width="2"/>
    <path d="M-90 0 L0 -32 L90 0 L0 32 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- People silhouettes on top -->
    <g fill="#ffffff" opacity="0.95">
      <circle cx="-30" cy="-8" r="5"/>
      <path d="M-38 4 Q-30 -2 -22 4 L-22 12 L-38 12 Z"/>
      <circle cx="0" cy="-12" r="6"/>
      <path d="M-9 2 Q0 -5 9 2 L9 12 L-9 12 Z"/>
      <circle cx="30" cy="-8" r="5"/>
      <path d="M22 4 Q30 -2 38 4 L38 12 L22 12 Z"/>
    </g>
  </g>
  <!-- Layer 2 (Performance) -->
  <g transform="translate(200 195)">
    <path d="M-110 0 L0 -36 L110 0 L0 36 Z" fill="url(#layer113b)" stroke="#ffffff" stroke-width="2"/>
    <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="round">
      <polyline points="-50,8 -25,-6 0,4 25,-12 50,-2"/>
      <circle cx="-50" cy="8" r="3" fill="#ffffff"/>
      <circle cx="-25" cy="-6" r="3" fill="#ffffff"/>
      <circle cx="0" cy="4" r="3" fill="#ffffff"/>
      <circle cx="25" cy="-12" r="3" fill="#ffffff"/>
      <circle cx="50" cy="-2" r="3" fill="#ffffff"/>
    </g>
  </g>
  <!-- Layer 1 (AI Workforce Analytics - bottom, largest) -->
  <g transform="translate(200 270)">
    <path d="M-130 0 L0 -42 L130 0 L0 42 Z" fill="url(#layer113c)" stroke="#ffffff" stroke-width="2"/>
    <!-- Neural net mini -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="-50" cy="0" r="4"/>
      <circle cx="-25" cy="-10" r="4"/>
      <circle cx="-25" cy="10" r="4"/>
      <circle cx="0" cy="-15" r="4"/>
      <circle cx="0" cy="0" r="4"/>
      <circle cx="0" cy="15" r="4"/>
      <circle cx="25" cy="-10" r="4"/>
      <circle cx="25" cy="10" r="4"/>
      <circle cx="50" cy="0" r="4"/>
    </g>
    <g stroke="#ffffff" stroke-width="1" opacity="0.55" fill="none">
      <line x1="-50" y1="0" x2="-25" y2="-10"/>
      <line x1="-50" y1="0" x2="-25" y2="10"/>
      <line x1="-25" y1="-10" x2="0" y2="-15"/>
      <line x1="-25" y1="-10" x2="0" y2="0"/>
      <line x1="-25" y1="10" x2="0" y2="0"/>
      <line x1="-25" y1="10" x2="0" y2="15"/>
      <line x1="0" y1="-15" x2="25" y2="-10"/>
      <line x1="0" y1="0" x2="25" y2="-10"/>
      <line x1="0" y1="0" x2="25" y2="10"/>
      <line x1="0" y1="15" x2="25" y2="10"/>
      <line x1="25" y1="-10" x2="50" y2="0"/>
      <line x1="25" y1="10" x2="50" y2="0"/>
    </g>
  </g>
  <!-- AI label -->
  <text x="200" y="80" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#00ff88" text-anchor="middle" opacity="0.9">AI</text>
  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M170 90 Q150 110 145 130"/>
    <path d="M230 90 Q250 110 255 130"/>
  </g>
</svg>
