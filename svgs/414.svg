<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg414" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0a2418"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg414)"/>

  <text x="200" y="58" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">MULTI-PARTY · COALITION</text>

  <!-- ground plane -->
  <line x1="40" y1="320" x2="360" y2="320" stroke="#c0cfff" stroke-width="1" opacity="0.4"/>

  <!-- WIND TURBINE (hero, central) -->
  <g transform="translate(200,220)">
    <!-- pole -->
    <rect x="-3" y="-30" width="6" height="120" fill="#c0cfff"/>
    <!-- hub -->
    <circle cx="0" cy="-30" r="7" fill="#c0cfff" stroke="#1a2744" stroke-width="1"/>
    <!-- blades -->
    <g fill="#c0cfff" stroke="#1a2744" stroke-width="1">
      <path d="M 0 -30 L -8 -110 L 0 -114 L 8 -110 Z"/>
      <path d="M 0 -30 L 65 -55 L 72 -50 L 70 -42 L 8 -22 Z"/>
      <path d="M 0 -30 L -65 -55 L -72 -50 L -70 -42 L -8 -22 Z"/>
    </g>
    <!-- base -->
    <polygon points="-12,90 12,90 6,72 -6,72" fill="#5a6f9c"/>
  </g>

  <!-- 4 STAKEHOLDERS around (with blocking power) -->
  <g font-family="monospace" font-size="7" font-weight="bold">
    <!-- Top-left: Government -->
    <g transform="translate(80,120)">
      <circle cx="0" cy="0" r="18" fill="#f5c842" fill-opacity="0.25" stroke="#f5c842" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#f5c842">§ GOV</text>
      <line x1="14" y1="6" x2="100" y2="170" stroke="#f5c842" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,3"/>
    </g>
    <!-- Top-right: Investor -->
    <g transform="translate(320,120)">
      <circle cx="0" cy="0" r="18" fill="#00ff88" fill-opacity="0.25" stroke="#00ff88" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#00ff88">$ INV</text>
      <line x1="-14" y1="6" x2="-100" y2="170" stroke="#00ff88" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,3"/>
    </g>
    <!-- Bottom-left: Community -->
    <g transform="translate(80,310)">
      <circle cx="0" cy="0" r="18" fill="#c0cfff" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#c0cfff">COM</text>
      <line x1="14" y1="-6" x2="100" y2="-70" stroke="#c0cfff" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,3"/>
    </g>
    <!-- Bottom-right: Landowner -->
    <g transform="translate(320,310)">
      <circle cx="0" cy="0" r="18" fill="#ff6b9d" fill-opacity="0.25" stroke="#ff6b9d" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" fill="#ff6b9d">OWN</text>
      <line x1="-14" y1="-6" x2="-100" y2="-70" stroke="#ff6b9d" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,3"/>
    </g>
  </g>

  <!-- Center revenue share badge -->
  <g transform="translate(200,250)">
    <rect x="-32" y="-8" width="64" height="16" rx="3" fill="#1a2744" stroke="#f5c842" stroke-width="1.3"/>
    <text x="0" y="3" text-anchor="middle" fill="#f5c842" font-size="7" font-family="monospace" font-weight="bold">REVENUE SHARE</text>
  </g>

  <!-- ESPAÑA / EXTREMADURA pin -->
  <g transform="translate(345,90)">
    <rect x="-12" y="-9" width="24" height="6" fill="#c0392b" opacity="0.9"/>
    <rect x="-12" y="-3" width="24" height="12" fill="#f5c842" opacity="0.9"/>
    <rect x="-12" y="5" width="24" height="4" fill="#c0392b" opacity="0.9"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Coalición · Eólica · Extremadura</text>
</svg>
