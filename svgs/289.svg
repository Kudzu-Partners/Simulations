<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg289" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg289)"/>

  <!-- Chain links horizontal -->
  <!-- Link 1 (OK) -->
  <g transform="translate(34, 160)">
    <rect x="0" y="0" width="54" height="80" rx="27" fill="none" stroke="#74b9ff" stroke-width="8"/>
    <rect x="12" y="10" width="30" height="60" rx="15" fill="#0d1b2a"/>
  </g>
  <!-- Connector 1-2 -->
  <rect x="74" y="192" width="22" height="16" rx="4" fill="#74b9ff" opacity="0.8"/>

  <!-- Link 2 (OK) -->
  <g transform="translate(82, 160)">
    <rect x="0" y="0" width="54" height="80" rx="27" fill="none" stroke="#74b9ff" stroke-width="8"/>
    <rect x="12" y="10" width="30" height="60" rx="15" fill="#0d1b2a"/>
  </g>
  <!-- Connector 2-3 (cracked) -->
  <rect x="122" y="192" width="22" height="16" rx="4" fill="#e74c3c" opacity="0.3"/>

  <!-- BREAK / EXPLOSION in center -->
  <g transform="translate(200, 200)">
    <!-- Red burst -->
    <circle r="42" fill="#7d0000" opacity="0.5"/>
    <circle r="42" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="6,4"/>
    <!-- Lightning bolt -->
    <path d="M 8 -28 L -6 -2 L 4 -2 L -8 28 L 16 -6 L 4 -6 L 18 -28 Z" fill="#e74c3c"/>
  </g>

  <!-- Link 3 (broken, faded) -->
  <g transform="translate(244, 160)" opacity="0.35">
    <rect x="0" y="0" width="54" height="80" rx="27" fill="none" stroke="#e74c3c" stroke-width="8" stroke-dasharray="8,5"/>
    <rect x="12" y="10" width="30" height="60" rx="15" fill="#0d1b2a"/>
  </g>
  <!-- Connector 3-4 faded -->
  <rect x="284" y="192" width="22" height="16" rx="4" fill="#e74c3c" opacity="0.2"/>

  <!-- Link 4 (grayed out — no stock) -->
  <g transform="translate(292, 160)" opacity="0.2">
    <rect x="0" y="0" width="54" height="80" rx="27" fill="none" stroke="#556" stroke-width="8"/>
    <rect x="12" y="10" width="30" height="60" rx="15" fill="#0d1b2a"/>
  </g>

  <!-- Node icons under each link -->
  <text x="61" y="280" text-anchor="middle" font-family="sans-serif" font-size="28" opacity="0.9">🏭</text>
  <text x="109" y="280" text-anchor="middle" font-family="sans-serif" font-size="28" opacity="0.9">⚗️</text>
  <text x="265" y="280" text-anchor="middle" font-family="sans-serif" font-size="28" opacity="0.35">🚚</text>
  <text x="319" y="280" text-anchor="middle" font-family="sans-serif" font-size="28" opacity="0.2">🏪</text>

  <!-- Recovery options row -->
  <g transform="translate(36, 314)">
    <rect x="0" y="0" width="100" height="36" rx="7" fill="#0a1f10" stroke="#00ff88" stroke-width="2"/>
    <!-- Buffer stack icon -->
    <rect x="14" y="8" width="72" height="8" rx="3" fill="#00ff88" opacity="0.8"/>
    <rect x="14" y="20" width="72" height="8" rx="3" fill="#00ff88" opacity="0.5"/>

    <rect x="112" y="0" width="100" height="36" rx="7" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <!-- Market icon -->
    <path d="M 150 28 L 163 10 L 175 22 L 188 8" stroke="#74b9ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="224" y="0" width="140" height="36" rx="7" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <!-- Reroute arrows -->
    <path d="M 246 24 Q 263 10 280 18 Q 297 26 314 12" stroke="#f5c842" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="310,6 320,14 308,18" fill="#f5c842"/>
  </g>
</svg>
