<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg540" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#1b3a20"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg540)"/>

  <text x="200" y="56" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">SOCIAL ENTERPRISE · IMPACT/$</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart inside dollar circle (protagonist) -->
    <g transform="translate(200,208)">
      <!-- Outer dollar circle -->
      <circle r="88" fill="#0a1f0a" stroke="#f5c842" stroke-width="3.5"/>

      <!-- Inner heart -->
      <path d="M 0 24 C -32 0 -48 -20 -32 -40 C -16 -56 0 -40 0 -28 C 0 -40 16 -56 32 -40 C 48 -20 32 0 0 24 Z"
            fill="#52b788" stroke="#95d5b2" stroke-width="3"/>

      <!-- Dollar sign overlay (transparent) -->
      <text x="0" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="22" font-weight="700" fill="#f5c842">$</text>
    </g>

    <!-- Balance indicator (left: impact / right: profit) -->
    <g transform="translate(72,140)">
      <rect width="56" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <path d="M 16 8 C 12 4 8 8 8 14 C 8 18 12 22 16 22 C 20 22 24 18 24 14 C 24 8 20 4 16 8 Z"
            fill="#52b788" transform="translate(12,0)"/>
    </g>

    <g transform="translate(272,140)">
      <rect width="56" height="26" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.5"/>
      <text x="28" y="18" text-anchor="middle" fill="#f5c842" font-size="11" font-family="monospace" font-weight="bold">$</text>
    </g>

    <!-- Connection arrows from each badge to center -->
    <path d="M 128 152 Q 152 168 168 192" stroke="#52b788" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" fill="none"/>
    <path d="M 272 152 Q 248 168 232 192" stroke="#f5c842" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" fill="none"/>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#d8f3dc" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">NPO · Vocational · Bogotá</text>
</svg>
