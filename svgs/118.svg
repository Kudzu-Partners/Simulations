<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg118" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="flask118" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b2fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="bubble118">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg118)"/>
  <!-- Corporate frame (the "corporate antibodies" container) -->
  <rect x="50" y="50" width="300" height="300" rx="14" fill="none" stroke="#00bfff" stroke-width="2.5" stroke-dasharray="8,6" opacity="0.7"/>
  <!-- Corporate building corners (small) -->
  <g fill="#00bfff" opacity="0.5">
    <rect x="50" y="50" width="40" height="14"/>
    <rect x="310" y="50" width="40" height="14"/>
    <rect x="50" y="336" width="40" height="14"/>
    <rect x="310" y="336" width="40" height="14"/>
  </g>
  <!-- Erlenmeyer flask with neural-net inside (innovation lab) -->
  <g transform="translate(200 220)">
    <!-- Flask body -->
    <path d="M-22 -90 L-22 -50 L-78 50 Q-82 78 -50 78 L50 78 Q82 78 78 50 L22 -50 L22 -90 Z"
          fill="url(#flask118)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <!-- Flask neck -->
    <rect x="-26" y="-104" width="52" height="14" rx="3" fill="#7b2fff" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Liquid surface -->
    <line x1="-58" y1="0" x2="58" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <!-- Bubbles rising -->
    <circle cx="-20" cy="20" r="6" fill="url(#bubble118)"/>
    <circle cx="15" cy="40" r="8" fill="url(#bubble118)"/>
    <circle cx="35" cy="10" r="5" fill="url(#bubble118)"/>
    <circle cx="-30" cy="50" r="4" fill="url(#bubble118)"/>
    <!-- Pipeline of innovation projects (3 nodes inside flask) -->
    <g fill="#ffd166" stroke="#ffffff" stroke-width="1.5">
      <circle cx="-30" cy="-30" r="9"/>
      <circle cx="0" cy="-25" r="11"/>
      <circle cx="28" cy="-32" r="8"/>
    </g>
    <g stroke="#ffd166" stroke-width="1.5" opacity="0.7">
      <line x1="-21" y1="-30" x2="-11" y2="-26"/>
      <line x1="11" y1="-25" x2="20" y2="-31"/>
    </g>
    <!-- Spark/lightbulb above flask -->
    <g transform="translate(0 -130)">
      <path d="M0 -20 L4 -8 L16 -6 L7 4 L9 16 L0 10 L-9 16 L-7 4 L-16 -6 L-4 -8 Z"
            fill="#f5c842" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>
  <!-- Antibody arrows pushing in (corporate resistance) -->
  <g stroke="#e74c3c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M85 200 L120 215"/>
    <polyline points="115,210 122,216 116,221"/>
    <path d="M315 200 L280 215"/>
    <polyline points="285,210 278,216 284,221"/>
  </g>
</svg>
