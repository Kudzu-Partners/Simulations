<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg213" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2c5f8a"/>
    </linearGradient>
    <radialGradient id="glow213" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#74b9ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#74b9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="building213" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe6e9"/>
      <stop offset="100%" stop-color="#a8b8c8"/>
    </linearGradient>
    <linearGradient id="screen213" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg213)"/>
  <rect width="400" height="400" rx="32" fill="url(#glow213)"/>

  <!-- ── Academic building silhouette (classical with columns) ── -->
  <g transform="translate(200, 215)">
    <!-- Base / steps -->
    <rect x="-105" y="55" width="210" height="6" rx="1" fill="url(#building213)" opacity="0.85"/>
    <rect x="-110" y="61" width="220" height="6" rx="1" fill="url(#building213)" opacity="0.7"/>

    <!-- Building base block -->
    <rect x="-90" y="-16" width="180" height="72" fill="url(#building213)" opacity="0.92"/>

    <!-- Pediment (triangle roof) -->
    <polygon points="-100,-16 0,-58 100,-16" fill="url(#building213)" opacity="0.95"/>
    <!-- Pediment detail -->
    <circle cx="0" cy="-32" r="6" fill="#1a3a5c" opacity="0.4"/>

    <!-- 4 columns -->
    <rect x="-78" y="-16" width="13" height="72" fill="#dfe6e9"/>
    <rect x="-78" y="-16" width="13" height="4" fill="#1a3a5c" opacity="0.5"/>
    <rect x="-78" y="52" width="13" height="4" fill="#1a3a5c" opacity="0.5"/>
    <rect x="-37" y="-16" width="13" height="72" fill="#dfe6e9"/>
    <rect x="-37" y="-16" width="13" height="4" fill="#1a3a5c" opacity="0.5"/>
    <rect x="-37" y="52" width="13" height="4" fill="#1a3a5c" opacity="0.5"/>
    <rect x="24" y="-16" width="13" height="72" fill="#dfe6e9"/>
    <rect x="24" y="-16" width="13" height="4" fill="#1a3a5c" opacity="0.5"/>
    <rect x="24" y="52" width="13" height="4" fill="#1a3a5c" opacity="0.5"/>
    <rect x="65" y="-16" width="13" height="72" fill="#dfe6e9"/>
    <rect x="65" y="-16" width="13" height="4" fill="#1a3a5c" opacity="0.5"/>
    <rect x="65" y="52" width="13" height="4" fill="#1a3a5c" opacity="0.5"/>

    <!-- Door -->
    <rect x="-9" y="20" width="18" height="36" rx="9 9 0 0" fill="#1a3a5c" opacity="0.85"/>

    <!-- "EDU" engraving -->
    <text y="-30" text-anchor="middle" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#1a3a5c" opacity="0.65" letter-spacing="2">EDU</text>
  </g>

  <!-- ── Enrollment trend line (declining → digital lift) ── -->
  <g transform="translate(60, 95)">
    <text font-family="'Courier New',monospace" font-size="8" fill="#74b9ff" opacity="0.7">ENROLLMENT</text>
    <!-- Curve: starts high, drops, then digital recovery -->
    <path d="M0 16 L20 18 L40 24 L60 32 L80 38 L100 38 L130 32 L160 22 L190 12 L220 6"
          stroke="#74b9ff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Decline marker -->
    <circle cx="80" cy="38" r="4" fill="#0a2342" stroke="#ff6b6b" stroke-width="2"/>
    <!-- Digital recovery -->
    <circle cx="220" cy="6" r="5" fill="#0a2342" stroke="#52b788" stroke-width="2"/>
    <circle cx="220" cy="6" r="2" fill="#52b788"/>
    <!-- Digital pulse around recovery -->
    <circle cx="220" cy="6" r="9" fill="none" stroke="#52b788" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- ── 3 program portfolio chips (left side) ── -->
  <g transform="translate(45, 240)">
    <rect x="0" y="0" width="62" height="22" rx="11" fill="#0a2342" stroke="#74b9ff" stroke-width="1.3" stroke-opacity="0.7"/>
    <text x="31" y="15" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#74b9ff" opacity="0.95">UNDER</text>
  </g>
  <g transform="translate(45, 270)">
    <rect x="0" y="0" width="62" height="22" rx="11" fill="#0a2342" stroke="#74b9ff" stroke-width="1.3" stroke-opacity="0.7"/>
    <text x="31" y="15" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#74b9ff" opacity="0.95">GRAD</text>
  </g>
  <g transform="translate(45, 300)">
    <rect x="0" y="0" width="62" height="22" rx="11" fill="#0a2342" stroke="#74b9ff" stroke-width="1.3" stroke-opacity="0.7"/>
    <text x="31" y="15" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#74b9ff" opacity="0.95">EXEC</text>
  </g>

  <!-- ── Digital screen (right side) — disruption ── -->
  <g transform="translate(295, 270)">
    <rect x="0" y="0" width="60" height="44" rx="4" fill="url(#screen213)" stroke="#52b788" stroke-width="1.8"/>
    <!-- Stand -->
    <rect x="22" y="44" width="16" height="6" fill="#52b788" opacity="0.6"/>
    <rect x="14" y="50" width="32" height="3" rx="1" fill="#52b788" opacity="0.5"/>
    <!-- Screen content -->
    <line x1="6" y1="10" x2="54" y2="10" stroke="#52b788" stroke-width="1.2" opacity="0.6"/>
    <line x1="6" y1="18" x2="40" y2="18" stroke="#52b788" stroke-width="0.8" opacity="0.5"/>
    <line x1="6" y1="26" x2="46" y2="26" stroke="#52b788" stroke-width="0.8" opacity="0.5"/>
    <!-- Play button -->
    <polygon points="22,32 22,40 32,36" fill="#52b788" opacity="0.95"/>
    <!-- Wifi sparks -->
    <path d="M 60 4 Q 66 0 72 4" stroke="#52b788" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M 62 8 Q 66 5 70 8" stroke="#52b788" stroke-width="0.8" fill="none" opacity="0.4"/>
  </g>

  <!-- ── Student silhouettes (bottom) ── -->
  <g transform="translate(0,348)" fill="#dfe6e9">
    <circle cx="160" cy="0" r="3.5" opacity="0.7"/>
    <path d="M155 4 Q160 14 165 4" opacity="0.65"/>
    <circle cx="180" cy="0" r="3.5" opacity="0.85"/>
    <path d="M175 4 Q180 14 185 4" opacity="0.85"/>
    <circle cx="200" cy="-2" r="4" opacity="0.95"/>
    <path d="M194 3 Q200 14 206 3" opacity="0.95"/>
    <circle cx="220" cy="0" r="3.5" opacity="0.85"/>
    <path d="M215 4 Q220 14 225 4" opacity="0.85"/>
    <circle cx="240" cy="0" r="3.5" opacity="0.7"/>
    <path d="M235 4 Q240 14 245 4" opacity="0.65"/>
  </g>

  <!-- Title -->
  <text x="200" y="52" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#dfe6e9" opacity="0.55" letter-spacing="3">UNIVERSITY · 3 YEARS</text>
</svg>
