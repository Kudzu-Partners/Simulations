<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg694" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg694)"/>

  <text x="200" y="56" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.75" letter-spacing="2">COST-BENEFIT · 4 PROJECTS</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 4 stacked bars: cost (red) vs benefit (green) (protagonist) -->
    <g transform="translate(56,312)">
      <!-- Project A -->
      <rect x="16" y="-32" width="56" height="32" rx="3" fill="#e74c3c" opacity="0.85"/>
      <rect x="16" y="-104" width="56" height="72" rx="3" fill="#52b788" opacity="0.85"/>
      <text x="44" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#dfe6e9">A</text>

      <!-- Project B -->
      <rect x="92" y="-80" width="56" height="80" rx="3" fill="#e74c3c" opacity="0.85"/>
      <rect x="92" y="-160" width="56" height="80" rx="3" fill="#52b788" opacity="0.85"/>
      <text x="120" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#dfe6e9">B</text>

      <!-- Project C (winner, gold border) -->
      <rect x="168" y="-48" width="56" height="48" rx="3" fill="#e74c3c" opacity="0.85"/>
      <rect x="168" y="-200" width="56" height="152" rx="3" fill="#52b788"/>
      <rect x="164" y="-204" width="64" height="208" rx="4" fill="none" stroke="#f5c842" stroke-width="3" stroke-dasharray="4 3"/>
      <text x="196" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c842">C ★</text>

      <!-- Project D -->
      <rect x="244" y="-120" width="56" height="120" rx="3" fill="#e74c3c" opacity="0.85"/>
      <rect x="244" y="-152" width="56" height="32" rx="3" fill="#52b788" opacity="0.65"/>
      <text x="272" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#dfe6e9">D</text>

      <!-- Baseline -->
      <line x1="0" y1="0" x2="320" y2="0" stroke="#dfe6e9" stroke-width="2" opacity="0.55"/>
    </g>

    <!-- B/C ratio badge top-left -->
    <g transform="translate(48,84)">
      <rect width="64" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#52b788" font-size="11" font-family="monospace" font-weight="bold">B/C</text>
    </g>

    <!-- DNP badge top-right -->
    <g transform="translate(288,84)">
      <rect width="64" height="26" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#f5c842" font-size="11" font-family="monospace" font-weight="bold">DNP</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#c0cfff" font-size="9" font-family="monospace" opacity="0.4" letter-spacing="1.2">Public Investment CBA · CO</text>
</svg>
