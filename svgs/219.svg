<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg219" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <radialGradient id="glow219" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#e91e63" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e91e63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vinyl219" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="waveStroke219" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e91e63"/>
      <stop offset="50%"  stop-color="#bb86fc"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg219)"/>
  <rect width="400" height="400" rx="32" fill="url(#glow219)"/>

  <!-- ── Vinyl record (top-right behind) ── -->
  <g transform="translate(290, 130)">
    <circle r="62" fill="url(#vinyl219)" stroke="#bb86fc" stroke-width="1.5" opacity="0.9"/>
    <!-- Grooves -->
    <circle r="55" fill="none" stroke="#e91e63" stroke-width="0.4" opacity="0.45"/>
    <circle r="48" fill="none" stroke="#e91e63" stroke-width="0.4" opacity="0.4"/>
    <circle r="41" fill="none" stroke="#e91e63" stroke-width="0.4" opacity="0.35"/>
    <circle r="34" fill="none" stroke="#e91e63" stroke-width="0.4" opacity="0.3"/>
    <!-- Label -->
    <circle r="22" fill="#e91e63" opacity="0.85"/>
    <circle r="22" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.5"/>
    <text y="-3" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="#fff" opacity="0.95" letter-spacing="1">SOUND</text>
    <text y="9"  text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="#fff" opacity="0.95" letter-spacing="1">STAGE</text>
    <!-- Center hole -->
    <circle r="3" fill="#0f3460"/>
    <!-- Reflection -->
    <ellipse cx="-22" cy="-30" rx="14" ry="6" fill="#fff" opacity="0.12" transform="rotate(-30, -22, -30)"/>
  </g>

  <!-- ── Waveform / equalizer (center, bold) ── -->
  <g transform="translate(50, 215)">
    <!-- Center line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#bb86fc" stroke-width="0.6" opacity="0.3"/>
    <!-- Bars representing audio waveform -->
    <g fill="url(#waveStroke219)" opacity="0.95">
      <rect x="0"   y="-12" width="6" height="24" rx="3"/>
      <rect x="12"  y="-22" width="6" height="44" rx="3"/>
      <rect x="24"  y="-32" width="6" height="64" rx="3"/>
      <rect x="36"  y="-18" width="6" height="36" rx="3"/>
      <rect x="48"  y="-44" width="6" height="88" rx="3"/>
      <rect x="60"  y="-28" width="6" height="56" rx="3"/>
      <rect x="72"  y="-15" width="6" height="30" rx="3"/>
      <rect x="84"  y="-38" width="6" height="76" rx="3"/>
      <rect x="96"  y="-50" width="6" height="100" rx="3"/>
      <rect x="108" y="-30" width="6" height="60" rx="3"/>
      <rect x="120" y="-18" width="6" height="36" rx="3"/>
      <rect x="132" y="-42" width="6" height="84" rx="3"/>
      <rect x="144" y="-56" width="6" height="112" rx="3"/>
      <rect x="156" y="-34" width="6" height="68" rx="3"/>
      <rect x="168" y="-20" width="6" height="40" rx="3"/>
      <rect x="180" y="-46" width="6" height="92" rx="3"/>
      <rect x="192" y="-38" width="6" height="76" rx="3"/>
      <rect x="204" y="-25" width="6" height="50" rx="3"/>
      <rect x="216" y="-30" width="6" height="60" rx="3"/>
      <rect x="228" y="-16" width="6" height="32" rx="3"/>
      <rect x="240" y="-22" width="6" height="44" rx="3"/>
      <rect x="252" y="-12" width="6" height="24" rx="3"/>
      <rect x="264" y="-18" width="6" height="36" rx="3"/>
      <rect x="276" y="-10" width="6" height="20" rx="3"/>
      <rect x="288" y="-14" width="6" height="28" rx="3"/>
    </g>

    <!-- Waveform overlay line (smooth) -->
    <path d="M 0 -8 Q 25 -45 50 -32 Q 75 -10 100 -50 Q 125 -28 150 -56 Q 175 -30 200 -42 Q 225 -22 250 -18 Q 275 -10 300 -14"
          stroke="url(#waveStroke219)" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- ── Microphone (left side) ── -->
  <g transform="translate(80, 130)">
    <!-- Mic capsule -->
    <rect x="-14" y="-30" width="28" height="44" rx="14" fill="#2c2c44" stroke="#bb86fc" stroke-width="2"/>
    <!-- Grille lines -->
    <line x1="-10" y1="-22" x2="10" y2="-22" stroke="#bb86fc" stroke-width="0.8" opacity="0.5"/>
    <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#bb86fc" stroke-width="0.8" opacity="0.5"/>
    <line x1="-12" y1="-8"  x2="12" y2="-8"  stroke="#bb86fc" stroke-width="0.8" opacity="0.5"/>
    <line x1="-12" y1="-1"  x2="12" y2="-1"  stroke="#bb86fc" stroke-width="0.8" opacity="0.5"/>
    <line x1="-10" y1="6"   x2="10" y2="6"   stroke="#bb86fc" stroke-width="0.8" opacity="0.5"/>
    <!-- Vertical bar -->
    <line x1="0" y1="-30" x2="0" y2="14" stroke="#bb86fc" stroke-width="0.8" opacity="0.4"/>
    <!-- Stem -->
    <rect x="-2" y="14" width="4" height="14" fill="#bb86fc" opacity="0.7"/>
    <!-- Stand arc -->
    <path d="M -22 28 Q 0 32 22 28" stroke="#bb86fc" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
    <!-- Sound waves emanating from mic -->
    <path d="M 24 -10 Q 32 -8 30 -2" stroke="#e91e63" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M 30 -16 Q 42 -10 38 0" stroke="#e91e63" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 36 -22 Q 52 -12 46 4" stroke="#e91e63" stroke-width="0.8" fill="none" opacity="0.35"/>
  </g>

  <!-- ── 4 revenue stream chips (bottom) ── -->
  <g transform="translate(0, 318)" font-family="'Courier New',monospace" font-size="7" font-weight="bold">
    <rect x="44"  y="0" width="68" height="22" rx="11" fill="#e91e63" opacity="0.28" stroke="#e91e63" stroke-width="1" stroke-opacity="0.6"/>
    <text x="78" y="14" text-anchor="middle" fill="#ff6b9d" opacity="0.95">STREAM</text>

    <rect x="120" y="0" width="68" height="22" rx="11" fill="#ff9800" opacity="0.22" stroke="#ff9800" stroke-width="1" stroke-opacity="0.6"/>
    <text x="154" y="14" text-anchor="middle" fill="#ffb84d" opacity="0.95">PUBLISH</text>

    <rect x="196" y="0" width="60" height="22" rx="11" fill="#2196f3" opacity="0.22" stroke="#2196f3" stroke-width="1" stroke-opacity="0.6"/>
    <text x="226" y="14" text-anchor="middle" fill="#74b9ff" opacity="0.95">LIVE</text>

    <rect x="264" y="0" width="60" height="22" rx="11" fill="#9c27b0" opacity="0.22" stroke="#9c27b0" stroke-width="1" stroke-opacity="0.6"/>
    <text x="294" y="14" text-anchor="middle" fill="#bb86fc" opacity="0.95">SYNC</text>
  </g>

  <!-- AI disruption tag (top-left) -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="74" height="22" rx="5" fill="#1a1a2e" stroke="#bb86fc" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="14" cy="11" r="3" fill="#bb86fc" opacity="0.95"/>
    <text x="44" y="15" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#bb86fc" opacity="0.95" letter-spacing="1">AI</text>
  </g>

  <!-- Footer label -->
  <text x="200" y="378" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#bb86fc" opacity="0.45" letter-spacing="2">MUSIC · 4 STREAMS</text>
</svg>
