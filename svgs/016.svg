<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg016" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#6a0572"/>
    </linearGradient>
    <linearGradient id="bar016a" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg016)"/>

  <!-- Grid lines (dashboard feel) -->
  <g stroke="#ff6b9d" stroke-width="0.5" stroke-opacity="0.15">
    <line x1="55" y1="100" x2="355" y2="100"/>
    <line x1="55" y1="160" x2="355" y2="160"/>
    <line x1="55" y1="220" x2="355" y2="220"/>
    <line x1="55" y1="280" x2="355" y2="280"/>
  </g>

  <!-- Baseline -->
  <line x1="55" y1="310" x2="355" y2="310" stroke="#ff6b9d" stroke-width="2" stroke-opacity="0.50"/>

  <!-- 6 channel bars at different heights (budget allocation) -->
  <!-- Bar 1: SEO — medium -->
  <rect x="65" y="210" width="32" height="100" rx="4" fill="#ff6b9d" fill-opacity="0.75"/>
  <!-- Bar 2: SEM — tallest -->
  <rect x="113" y="130" width="32" height="180" rx="4" fill="url(#bar016a)" fill-opacity="0.90"/>
  <!-- Bar 3: Social — medium-high -->
  <rect x="161" y="170" width="32" height="140" rx="4" fill="#ff6b9d" fill-opacity="0.80"/>
  <!-- Bar 4: Email — low -->
  <rect x="209" y="255" width="32" height="55" rx="4" fill="#ff6b9d" fill-opacity="0.55"/>
  <!-- Bar 5: Display — medium-low -->
  <rect x="257" y="230" width="32" height="80" rx="4" fill="#ff6b9d" fill-opacity="0.65"/>
  <!-- Bar 6: Influencer — medium -->
  <rect x="305" y="200" width="32" height="110" rx="4" fill="url(#bar016a)" fill-opacity="0.75"/>

  <!-- Performance trend line overlaid -->
  <path d="M 81,245 L 129,168 L 177,195 L 225,270 L 273,225 L 321,210"
        fill="none" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.90"/>
  <!-- Trend line dots -->
  <circle cx="81"  cy="245" r="5" fill="#ffd166" fill-opacity="0.90"/>
  <circle cx="129" cy="168" r="5" fill="#ffd166" fill-opacity="0.90"/>
  <circle cx="177" cy="195" r="5" fill="#ffd166" fill-opacity="0.90"/>
  <circle cx="225" cy="270" r="5" fill="#ffd166" fill-opacity="0.90"/>
  <circle cx="273" cy="225" r="5" fill="#ffd166" fill-opacity="0.90"/>
  <circle cx="321" cy="210" r="5" fill="#ffd166" fill-opacity="0.90"/>

  <!-- Channel labels (small, below baseline) -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#ff6b9d" text-anchor="middle" opacity="0.65">
    <text x="81"  y="326">SEO</text>
    <text x="129" y="326">SEM</text>
    <text x="177" y="326">SOC</text>
    <text x="225" y="326">EM</text>
    <text x="273" y="326">DIS</text>
    <text x="321" y="326">INF</text>
  </g>

</svg>
