<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg114" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <radialGradient id="globe114" cx="0.4" cy="0.4" r="0.65">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg114)"/>
  <!-- Globe -->
  <g transform="translate(200 215)">
    <circle r="135" fill="url(#globe114)" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Latitude/longitude -->
    <g fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4">
      <ellipse rx="135" ry="55"/>
      <ellipse rx="135" ry="100"/>
      <ellipse rx="55" ry="135"/>
      <ellipse rx="100" ry="135"/>
      <line x1="-135" y1="0" x2="135" y2="0"/>
      <line x1="0" y1="-135" x2="0" y2="135"/>
    </g>
    <!-- Simple continents (abstract) -->
    <g fill="#52b788" opacity="0.85">
      <path d="M-100 -55 Q-70 -75 -50 -55 Q-30 -40 -55 -25 Q-90 -20 -100 -55 Z"/>
      <path d="M-30 -10 Q0 -25 30 -5 Q40 20 10 30 Q-25 25 -30 -10 Z"/>
      <path d="M55 -65 Q90 -55 95 -25 Q70 -15 55 -45 Z"/>
      <path d="M40 50 Q70 55 75 80 Q50 100 30 80 Z"/>
    </g>
  </g>
  <!-- 3 region pins/flags around globe with arcs -->
  <g stroke="#f5c842" stroke-width="2.5" fill="none" stroke-dasharray="5,4" opacity="0.85">
    <path d="M120 80 Q170 130 165 175"/>
    <path d="M320 100 Q260 140 250 170"/>
    <path d="M310 320 Q280 280 250 260"/>
  </g>
  <!-- Pins -->
  <g>
    <g transform="translate(120 80)">
      <path d="M0 18 L-12 0 Q-12 -14 0 -14 Q12 -14 12 0 Z" fill="#e74c3c" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="0" cy="-4" r="5" fill="#ffffff"/>
    </g>
    <g transform="translate(320 100)">
      <path d="M0 18 L-12 0 Q-12 -14 0 -14 Q12 -14 12 0 Z" fill="#f5c842" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="0" cy="-4" r="5" fill="#1a2744"/>
    </g>
    <g transform="translate(310 320)">
      <path d="M0 18 L-12 0 Q-12 -14 0 -14 Q12 -14 12 0 Z" fill="#52b788" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="0" cy="-4" r="5" fill="#ffffff"/>
    </g>
  </g>
  <!-- Suitcase (expat traveler) at globe top -->
  <g transform="translate(200 75)">
    <rect x="-22" y="-14" width="44" height="30" rx="3" fill="#f5c842" stroke="#ffffff" stroke-width="2"/>
    <rect x="-22" y="-4" width="44" height="3" fill="#1a2744"/>
    <rect x="-9" y="-22" width="18" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-12" cy="0" r="2" fill="#1a2744"/>
    <circle cx="12" cy="0" r="2" fill="#1a2744"/>
  </g>
</svg>
