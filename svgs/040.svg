<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg040" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#1a2a3a"/>
    </linearGradient>
    <linearGradient id="launchArc040" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#00c9a7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg040)"/>

  <!-- Pill / capsule (central symbol, left-center) -->
  <!-- Left half (blue) -->
  <path d="M 118,188 A 38,38 0 0,1 118,268 L 188,268 L 188,188 Z"
        fill="#74b9ff" fill-opacity="0.40" stroke="#74b9ff" stroke-width="2.5"/>
  <!-- Right half (teal) -->
  <path d="M 188,188 L 188,268 L 228,268 A 38,38 0 0,0 228,188 Z"
        fill="#00c9a7" fill-opacity="0.35" stroke="#00c9a7" stroke-width="2.5"/>
  <!-- Pill center seam -->
  <line x1="188" y1="188" x2="188" y2="268" stroke="#0a1a2a" stroke-width="2.5" stroke-opacity="0.80"/>

  <!-- Launch arc from pill top going up-right -->
  <path d="M 188,188 Q 220,120 310,80"
        fill="none" stroke="url(#launchArc040)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrow at arc end -->
  <polygon points="304,72 316,82 308,90" fill="#00c9a7" fill-opacity="0.90"/>

  <!-- Milestone dots on arc -->
  <circle cx="220" cy="158" r="6" fill="#74b9ff" fill-opacity="0.85" stroke="#0a1a2a" stroke-width="1.5"/>
  <circle cx="258" cy="118" r="6" fill="#74b9ff" fill-opacity="0.85" stroke="#0a1a2a" stroke-width="1.5"/>
  <circle cx="310" cy="80"  r="7" fill="#00c9a7" fill-opacity="0.90" stroke="#0a1a2a" stroke-width="1.5"/>

  <!-- 6 strategic lever bars (bottom zone, clearly separated) -->
  <text x="200" y="298" font-family="Arial, sans-serif" font-size="9" fill="#74b9ff" text-anchor="middle" opacity="0.50">6 Strategic Levers</text>
  <g fill-opacity="0.65" rx="2">
    <rect x="58"  y="308" width="36" height="38" rx="2" fill="#74b9ff" fill-opacity="0.30"/>
    <rect x="100" y="315" width="36" height="31" rx="2" fill="#74b9ff" fill-opacity="0.35"/>
    <rect x="142" y="305" width="36" height="41" rx="2" fill="#74b9ff" fill-opacity="0.40"/>
    <rect x="184" y="320" width="36" height="26" rx="2" fill="#00c9a7" fill-opacity="0.40"/>
    <rect x="226" y="310" width="36" height="36" rx="2" fill="#00c9a7" fill-opacity="0.45"/>
    <rect x="268" y="303" width="36" height="43" rx="2" fill="#00c9a7" fill-opacity="0.50"/>
  </g>
  <!-- Baseline for bars -->
  <line x1="52" y1="346" x2="312" y2="346" stroke="#74b9ff" stroke-width="1.5" stroke-opacity="0.30"/>

  <!-- Drug label on pill -->
  <text x="173" y="235" font-family="Arial Black, sans-serif" font-size="9" font-weight="900" fill="#0a1a2a" text-anchor="middle" transform="rotate(-90,173,228)">Rx</text>
</svg>
