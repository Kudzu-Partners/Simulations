<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg635" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg635)"/>

  <text x="200" y="56" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.75" letter-spacing="2">PESTEL · ENTRY ANALYSIS</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Hexagonal 6-segment wheel (protagonist) -->
    <g transform="translate(200,212)">
      <!-- Outer hexagon outline -->
      <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52"
               fill="none" stroke="#f5c842" stroke-width="2.5" opacity="0.4"/>

      <!-- 6 PESTEL letters in hex sectors -->
      <!-- P (top) -->
      <g transform="translate(0,-72)">
        <circle r="28" fill="#1b2d4f" stroke="#74b9ff" stroke-width="3.5"/>
        <text x="0" y="8" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
              font-size="24" font-weight="700" fill="#74b9ff">P</text>
      </g>
      <!-- E (top-right) -->
      <g transform="translate(64,-36)">
        <circle r="28" fill="#1b2d4f" stroke="#00ff88" stroke-width="3.5"/>
        <text x="0" y="8" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
              font-size="24" font-weight="700" fill="#00ff88">E</text>
      </g>
      <!-- S (bottom-right) -->
      <g transform="translate(64,36)">
        <circle r="28" fill="#1b2d4f" stroke="#ff6b9d" stroke-width="3.5"/>
        <text x="0" y="8" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
              font-size="24" font-weight="700" fill="#ff6b9d">S</text>
      </g>
      <!-- T (bottom) -->
      <g transform="translate(0,72)">
        <circle r="28" fill="#1b2d4f" stroke="#00bfff" stroke-width="3.5"/>
        <text x="0" y="8" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
              font-size="24" font-weight="700" fill="#00bfff">T</text>
      </g>
      <!-- E (bottom-left) -->
      <g transform="translate(-64,36)">
        <circle r="28" fill="#1b2d4f" stroke="#52b788" stroke-width="3.5"/>
        <text x="0" y="8" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
              font-size="24" font-weight="700" fill="#52b788">E</text>
      </g>
      <!-- L (top-left) -->
      <g transform="translate(-64,-36)">
        <circle r="28" fill="#1b2d4f" stroke="#f5c842" stroke-width="3.5"/>
        <text x="0" y="8" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
              font-size="24" font-weight="700" fill="#f5c842">L</text>
      </g>

      <!-- Center CO -->
      <circle r="20" fill="#0d1b2a" stroke="#f5c842" stroke-width="2.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f5c842">CO</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#c0cfff" font-size="9" font-family="monospace" opacity="0.4" letter-spacing="1.2">Market Entry · Colombia</text>
</svg>
