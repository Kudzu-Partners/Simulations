<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2c5f8a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <!-- CV Document (left) -->
  <rect x="55" y="88" width="105" height="148" rx="8"
        fill="#74b9ff" fill-opacity="0.1" stroke="#74b9ff" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Photo box -->
  <rect x="65" y="98" width="34" height="38" rx="4"
        fill="#74b9ff" fill-opacity="0.2" stroke="#74b9ff" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="82" cy="113" r="8" fill="#74b9ff" opacity="0.5"/>
  <path d="M70,129 Q82,122 94,129" fill="#74b9ff" opacity="0.4" stroke="none"/>
  <!-- CV text lines -->
  <line x1="108" y1="104" x2="150" y2="104" stroke="#dfe6e9" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="108" y1="114" x2="145" y2="114" stroke="#dfe6e9" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="65" y1="145" x2="150" y2="145" stroke="#74b9ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="65" y1="157" x2="148" y2="157" stroke="#dfe6e9" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="65" y1="169" x2="140" y2="169" stroke="#dfe6e9" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="65" y1="181" x2="144" y2="181" stroke="#dfe6e9" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="65" y1="193" x2="135" y2="193" stroke="#dfe6e9" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="65" y1="205" x2="142" y2="205" stroke="#dfe6e9" stroke-width="1" stroke-opacity="0.25"/>
  <text x="107" y="248" text-anchor="middle" fill="#74b9ff" font-size="12" font-family="monospace" font-weight="bold" opacity="0.65">CV</text>

  <!-- Arrow to center -->
  <path d="M163,162 L178,162" fill="none" stroke="#dfe6e9" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4,3"/>
  <polygon points="178,158 186,162 178,166" fill="#dfe6e9" opacity="0.5"/>

  <!-- STAR badge (center) -->
  <polygon points="200,108 210,140 243,140 217,159 227,191 200,172 173,191 183,159 157,140 190,140"
           fill="#f5c842" fill-opacity="0.15" stroke="#f5c842" stroke-width="2.5" stroke-opacity="0.85"/>
  <text x="200" y="160" text-anchor="middle" fill="#f5c842" font-size="12" font-family="monospace" font-weight="bold" opacity="0.9">STAR</text>

  <!-- Arrow to interview scene -->
  <path d="M214,162 L228,162" fill="none" stroke="#dfe6e9" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4,3"/>
  <polygon points="228,158 236,162 228,166" fill="#dfe6e9" opacity="0.5"/>

  <!-- Interview scene (right): desk + two figures -->
  <rect x="240" y="208" width="108" height="8" rx="3"
        fill="#74b9ff" fill-opacity="0.25" stroke="#74b9ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Interviewer (right figure) -->
  <circle cx="316" cy="173" r="13" fill="#dfe6e9" opacity="0.6"/>
  <line x1="316" y1="186" x2="316" y2="208" stroke="#dfe6e9" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <line x1="316" y1="193" x2="304" y2="204" stroke="#dfe6e9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="316" y1="193" x2="328" y2="204" stroke="#dfe6e9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Andrea (interviewee, left figure) -->
  <circle cx="265" cy="176" r="12" fill="#74b9ff" opacity="0.7"/>
  <line x1="265" y1="188" x2="265" y2="208" stroke="#74b9ff" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <line x1="265" y1="195" x2="254" y2="206" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <line x1="265" y1="195" x2="276" y2="206" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- Speech bubble — interviewer asks -->
  <ellipse cx="335" cy="153" rx="20" ry="13" fill="#1a3a5c" stroke="#dfe6e9" stroke-width="1.5" stroke-opacity="0.55"/>
  <text x="335" y="157" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace" opacity="0.9">?</text>
  <polygon points="323,162 315,171 322,163" fill="#1a3a5c" stroke="#dfe6e9" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Andrea's answer bubble -->
  <ellipse cx="248" cy="155" rx="20" ry="13" fill="#1a3a5c" stroke="#74b9ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="248" y="159" text-anchor="middle" fill="#f5c842" font-size="8" font-family="monospace" opacity="0.9">S·T·A·R</text>
  <polygon points="260,164 268,173 262,165" fill="#1a3a5c" stroke="#74b9ff" stroke-width="1" stroke-opacity="0.45"/>

  <!-- First week panel: AFP + rights + paycheck -->
  <rect x="65" y="278" width="270" height="58" rx="10"
        fill="#74b9ff" fill-opacity="0.07" stroke="#74b9ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="78" y="291" width="48" height="30" rx="5" fill="#74b9ff" fill-opacity="0.15" stroke="#74b9ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="102" y="311" text-anchor="middle" fill="#74b9ff" font-size="10" font-family="monospace" font-weight="bold" opacity="0.8">AFP</text>
  <rect x="136" y="291" width="48" height="30" rx="5" fill="#52b788" fill-opacity="0.12" stroke="#52b788" stroke-width="1" stroke-opacity="0.5"/>
  <text x="160" y="311" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" font-weight="bold" opacity="0.75">DDHH</text>
  <rect x="194" y="291" width="48" height="30" rx="5" fill="#f5c842" fill-opacity="0.1" stroke="#f5c842" stroke-width="1" stroke-opacity="0.45"/>
  <text x="218" y="311" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.75">RESOL.</text>
  <rect x="252" y="291" width="68" height="30" rx="5" fill="#dfe6e9" fill-opacity="0.08" stroke="#dfe6e9" stroke-width="1" stroke-opacity="0.35"/>
  <text x="286" y="311" text-anchor="middle" fill="#dfe6e9" font-size="9" font-family="monospace" opacity="0.65">S/ SUELDO</text>

  <text x="200" y="372" text-anchor="middle" fill="#74b9ff" font-size="10" font-family="sans-serif" opacity="0.4" letter-spacing="1">ANDREA QUISPE · LIMA · 17 años</text>
</svg>
