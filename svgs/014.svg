<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg014" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <radialGradient id="tableGlow014" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg014)"/>

  <!-- Center negotiation table glow -->
  <circle cx="200" cy="200" r="55" fill="url(#tableGlow014)"/>

  <!-- Negotiation lines between all 4 parties (mesh) -->
  <!-- Government (top-left 100,100) ↔ International (top-right 300,100) -->
  <line x1="100" y1="100" x2="300" y2="100" stroke="#c0cfff" stroke-width="1.2" stroke-opacity="0.30"/>
  <!-- Government ↔ EcoLitio (bot-left 100,300) -->
  <line x1="100" y1="100" x2="100" y2="300" stroke="#c0cfff" stroke-width="1.2" stroke-opacity="0.30"/>
  <!-- Government ↔ Indigenous (bot-right 300,300) -->
  <line x1="100" y1="100" x2="300" y2="300" stroke="#c0cfff" stroke-width="1" stroke-opacity="0.20"/>
  <!-- International ↔ Indigenous -->
  <line x1="300" y1="100" x2="300" y2="300" stroke="#c0cfff" stroke-width="1.2" stroke-opacity="0.30"/>
  <!-- International ↔ EcoLitio -->
  <line x1="300" y1="100" x2="100" y2="300" stroke="#c0cfff" stroke-width="1" stroke-opacity="0.20"/>
  <!-- Indigenous ↔ EcoLitio -->
  <line x1="300" y1="300" x2="100" y2="300" stroke="#c0cfff" stroke-width="1.2" stroke-opacity="0.30"/>

  <!-- Lines to center (each party ↔ deal center) -->
  <line x1="100" y1="100" x2="200" y2="200" stroke="#f5c842" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="300" y1="100" x2="200" y2="200" stroke="#f5c842" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="300" y1="300" x2="200" y2="200" stroke="#f5c842" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="100" y1="300" x2="200" y2="200" stroke="#f5c842" stroke-width="2.5" stroke-opacity="0.70"/>

  <!-- Center: deal/agreement node -->
  <circle cx="200" cy="200" r="22" fill="#1a2744" stroke="#f5c842" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="11" fill="#f5c842" fill-opacity="0.85"/>

  <!-- Stakeholder nodes -->
  <!-- Government (top-left) -->
  <circle cx="100" cy="100" r="28" fill="#1a2744" stroke="#c0cfff" stroke-width="2.5"/>
  <rect x="88" y="90" width="24" height="20" rx="3" fill="#c0cfff" fill-opacity="0.65"/>
  <rect x="93" y="87" width="14" height="5" rx="1" fill="#c0cfff" fill-opacity="0.50"/>

  <!-- International Partner (top-right) -->
  <circle cx="300" cy="100" r="28" fill="#1a2744" stroke="#c0cfff" stroke-width="2.5"/>
  <circle cx="300" cy="100" r="12" fill="none" stroke="#c0cfff" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="288" y1="100" x2="312" y2="100" stroke="#c0cfff" stroke-width="1.5" stroke-opacity="0.65"/>
  <line x1="300" y1="88" x2="300" y2="112" stroke="#c0cfff" stroke-width="1.5" stroke-opacity="0.65"/>

  <!-- Indigenous Community (bot-right) -->
  <circle cx="300" cy="300" r="28" fill="#1a2744" stroke="#c0cfff" stroke-width="2.5"/>
  <polygon points="300,286 314,308 286,308" fill="#c0cfff" fill-opacity="0.65"/>

  <!-- EcoLitio (bot-left, the participant — slightly brighter) -->
  <circle cx="100" cy="300" r="28" fill="#1a2744" stroke="#f5c842" stroke-width="3"/>
  <text x="100" y="306" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="900" fill="#f5c842" text-anchor="middle" opacity="0.90">E</text>

</svg>
