<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg162" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg162)"/>

  <!-- Matrix 1: Financial Materiality (solid, slightly left/up) -->
  <!-- Background fill -->
  <rect x="80" y="95" width="180" height="180" rx="6" fill="#52b788" opacity="0.08"/>
  <!-- Border -->
  <rect x="80" y="95" width="180" height="180" rx="6" fill="none" stroke="#52b788" stroke-width="2.5" opacity="0.85"/>
  <!-- Internal dividers -->
  <line x1="170" y1="95" x2="170" y2="275" stroke="#52b788" stroke-width="1.5" opacity="0.5"/>
  <line x1="80" y1="185" x2="260" y2="185" stroke="#52b788" stroke-width="1.5" opacity="0.5"/>
  <!-- Quadrant labels -->
  <text x="125" y="148" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.55">Low Risk</text>
  <text x="215" y="148" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.55">High Risk</text>
  <text x="125" y="235" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.55">Monitor</text>
  <text x="215" y="235" font-family="Arial,sans-serif" font-size="9" fill="#52b788" text-anchor="middle" opacity="0.85">Material</text>
  <!-- Axis labels -->
  <text x="170" y="88" font-family="Arial,sans-serif" font-size="8" fill="#52b788" text-anchor="middle" opacity="0.6">Financial Impact →</text>
  <text x="62" y="185" font-family="Arial,sans-serif" font-size="8" fill="#52b788" text-anchor="middle" opacity="0.6" transform="rotate(-90,62,185)">Likelihood →</text>
  <!-- Data dots in financial matrix -->
  <circle cx="228" cy="150" r="8" fill="#52b788" opacity="0.7"/>
  <circle cx="215" cy="165" r="6" fill="#52b788" opacity="0.55"/>
  <circle cx="240" cy="168" r="5" fill="#52b788" opacity="0.45"/>
  <circle cx="108" cy="135" r="5" fill="#d8f3dc" opacity="0.35"/>
  <circle cx="145" cy="155" r="4" fill="#d8f3dc" opacity="0.3"/>
  <circle cx="225" cy="220" r="7" fill="#52b788" opacity="0.5"/>
  <!-- Matrix 1 label -->
  <text x="170" y="285" font-family="Arial,sans-serif" font-size="8" fill="#52b788" text-anchor="middle" opacity="0.6">Financial Materiality</text>

  <!-- Matrix 2: Environmental Materiality (offset, rotated slightly) -->
  <g transform="rotate(6, 230, 215)">
    <rect x="140" y="125" width="180" height="180" rx="6" fill="#d8f3dc" opacity="0.05"/>
    <rect x="140" y="125" width="180" height="180" rx="6" fill="none" stroke="#d8f3dc" stroke-width="2.5" opacity="0.7"/>
    <line x1="230" y1="125" x2="230" y2="305" stroke="#d8f3dc" stroke-width="1.5" opacity="0.4"/>
    <line x1="140" y1="215" x2="320" y2="215" stroke="#d8f3dc" stroke-width="1.5" opacity="0.4"/>
    <text x="185" y="178" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.45">Low Impact</text>
    <text x="275" y="178" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.45">Significant</text>
    <text x="185" y="262" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.45">Watch</text>
    <text x="275" y="262" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.75">Material</text>
    <!-- Axis label -->
    <text x="230" y="118" font-family="Arial,sans-serif" font-size="8" fill="#d8f3dc" text-anchor="middle" opacity="0.5">Environmental Impact →</text>
    <!-- Data dots in env matrix -->
    <circle cx="288" cy="168" r="9" fill="#d8f3dc" opacity="0.55"/>
    <circle cx="270" cy="185" r="6" fill="#d8f3dc" opacity="0.4"/>
    <circle cx="300" cy="182" r="5" fill="#d8f3dc" opacity="0.35"/>
    <circle cx="168" cy="160" r="4" fill="#d8f3dc" opacity="0.25"/>
    <circle cx="278" cy="248" r="7" fill="#d8f3dc" opacity="0.45"/>
  </g>

  <!-- OVERLAP highlight — intersection zone -->
  <ellipse cx="222" cy="208" rx="28" ry="22" fill="#f5c842" opacity="0.18" transform="rotate(-3,222,208)"/>
  <ellipse cx="222" cy="208" rx="28" ry="22" fill="none" stroke="#f5c842" stroke-width="2" opacity="0.6" transform="rotate(-3,222,208)"/>
  <text x="222" y="213" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#f5c842" text-anchor="middle" opacity="0.85">Double</text>

  <!-- CSRD badge -->
  <rect x="306" y="56" width="56" height="24" rx="12" fill="#d8f3dc" opacity="0.1"/>
  <rect x="306" y="56" width="56" height="24" rx="12" fill="none" stroke="#d8f3dc" stroke-width="1.5" opacity="0.6"/>
  <text x="334" y="72" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#d8f3dc" text-anchor="middle" opacity="0.85">CSRD</text>

  <!-- Bottom label -->
  <text x="200" y="368" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.4" letter-spacing="1">DOUBLE MATERIALITY ASSESSMENT</text>
</svg>
