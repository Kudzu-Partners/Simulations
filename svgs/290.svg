<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg290" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg290)"/>

  <!-- Business wheel -->
  <g transform="translate(200, 195)">
    <!-- Outer ring -->
    <circle r="148" fill="none" stroke="#f5c842" stroke-width="1" opacity="0.15"/>
    <circle r="108" fill="none" stroke="#f5c842" stroke-width="1" opacity="0.12"/>

    <!-- Hub -->
    <circle r="44" fill="#1a3a5c" stroke="#f5c842" stroke-width="3"/>
    <!-- Building/cowork icon in hub -->
    <rect x="-16" y="-20" width="32" height="28" rx="3" fill="#f5c842" opacity="0.85"/>
    <rect x="-10" y="-10" width="8" height="10" rx="1" fill="#1a3a5c"/>
    <rect x="2" y="-10" width="8" height="10" rx="1" fill="#1a3a5c"/>
    <rect x="-6" y="8" width="12" height="8" rx="1" fill="#1a3a5c"/>

    <!-- 6 spokes with colored segment arcs -->
    <!-- Marketing (top, magenta) -->
    <line x1="0" y1="-44" x2="0" y2="-104" stroke="#e040fb" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="-122" r="20" fill="#1a0a2e" stroke="#e040fb" stroke-width="2.5"/>
    <text x="0" y="-116" text-anchor="middle" font-family="sans-serif" font-size="18">📣</text>

    <!-- Finance (top-right, green) -->
    <line x1="38" y1="-22" x2="90" y2="-52" stroke="#00ff88" stroke-width="2.5" opacity="0.7"/>
    <circle cx="108" cy="-62" r="20" fill="#0a1f10" stroke="#00ff88" stroke-width="2.5"/>
    <text x="108" y="-56" text-anchor="middle" font-family="sans-serif" font-size="18">💰</text>

    <!-- Operations (bottom-right, blue) -->
    <line x1="38" y1="22" x2="90" y2="52" stroke="#74b9ff" stroke-width="2.5" opacity="0.7"/>
    <circle cx="108" cy="62" r="20" fill="#1a2744" stroke="#74b9ff" stroke-width="2.5"/>
    <text x="108" y="68" text-anchor="middle" font-family="sans-serif" font-size="18">⚙️</text>

    <!-- HR (bottom, purple) -->
    <line x1="0" y1="44" x2="0" y2="104" stroke="#a29bfe" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="122" r="20" fill="#1a1040" stroke="#a29bfe" stroke-width="2.5"/>
    <text x="0" y="128" text-anchor="middle" font-family="sans-serif" font-size="18">👥</text>

    <!-- Sales (bottom-left, gold) -->
    <line x1="-38" y1="22" x2="-90" y2="52" stroke="#f5c842" stroke-width="2.5" opacity="0.7"/>
    <circle cx="-108" cy="62" r="20" fill="#1a1200" stroke="#f5c842" stroke-width="2.5"/>
    <text x="-108" y="68" text-anchor="middle" font-family="sans-serif" font-size="18">🤝</text>

    <!-- Product/Tech (top-left, red) -->
    <line x1="-38" y1="-22" x2="-90" y2="-52" stroke="#ff7675" stroke-width="2.5" opacity="0.7"/>
    <circle cx="-108" cy="-62" r="20" fill="#1a0a10" stroke="#ff7675" stroke-width="2.5"/>
    <text x="-108" y="-56" text-anchor="middle" font-family="sans-serif" font-size="18">💻</text>
  </g>

  <!-- Bottom alignment bar -->
  <g transform="translate(36, 368)">
    <rect x="0" y="0" width="328" height="12" rx="6" fill="#0a1f10" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <rect x="0" y="0" width="218" height="12" rx="6" fill="#00ff88" opacity="0.6"/>
  </g>
</svg>
