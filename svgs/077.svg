    <rect x="145" y="175" width="20" height="16" rx="2"/>
    <rect x="175" y="175" width="20" height="16" rx="2"/>
    <rect x="205" y="175" width="20" height="16" rx="2"/>
    <rect x="235" y="175" width="20" height="16" rx="2"/>
    <rect x="145" y="200" width="20" height="16" rx="2"/>
    <rect x="175" y="200" width="20" height="16" rx="2"/>
    <rect x="205" y="200" width="20" height="16" rx="2"/>
    <rect x="235" y="200" width="20" height="16" rx="2"/>
  </g>
  <!-- Digital circuit overlay on hotel -->
  <g stroke="#7b2fff" stroke-width="1.5" fill="none" opacity="0.55">
