    <line x1="130" y1="235" x2="270" y2="235"/>
    <line x1="155" y1="255" x2="245" y2="255"/>
    <!-- Vertical traces -->
    <line x1="165" y1="225" x2="165" y2="265"/>
    <line x1="235" y1="225" x2="235" y2="265"/>
    <!-- Node dots -->
