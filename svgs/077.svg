  </g>
  <!-- Budget pie (bottom left) -->
  <circle cx="95" cy="305" r="38" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.4"/>
  <path d="M95,305 L95,267 A38,38 0 0,1 128,324 Z" fill="#00bfff" opacity="0.35"/>
  <path d="M95,305 L128,324 A38,38 0 0,1 62,324 Z" fill="#7b2fff" opacity="0.35"/>
