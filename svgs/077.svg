      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg77)"/>
  <!-- Hotel silhouette -->
  <rect x="130" y="160" width="140" height="155" rx="4" fill="#1b2d4f" stroke="#00bfff" stroke-width="2" opacity="0.9"/>
  <path d="M118,160 L200,100 L282,160 Z" fill="#1b2d4f" stroke="#00bfff" stroke-width="2" opacity="0.9"/>
  <!-- Hotel windows basic -->
