<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg297" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg297)"/>

  <!-- Bank building icon (protagonist) -->
  <g transform="translate(200, 170)">
    <!-- Columns -->
    <rect x="-90" y="-60" width="180" height="120" rx="4" fill="#1a3a5c" stroke="#f5c842" stroke-width="2.5"/>
    <rect x="-70" y="-40" width="16" height="100" rx="3" fill="#f5c842" opacity="0.6"/>
    <rect x="-36" y="-40" width="16" height="100" rx="3" fill="#f5c842" opacity="0.6"/>
    <rect x="-2" y="-40" width="16" height="100" rx="3" fill="#f5c842" opacity="0.6"/>
    <rect x="32" y="-40" width="16" height="100" rx="3" fill="#f5c842" opacity="0.6"/>
    <rect x="66" y="-40" width="16" height="100" rx="3" fill="#f5c842" opacity="0.6"/>
    <!-- Pediment (triangle roof) -->
    <path d="M -96 -60 L 0 -108 L 96 -60 Z" fill="#1a3a5c" stroke="#f5c842" stroke-width="2.5"/>
    <!-- Base -->
    <rect x="-100" y="60" width="200" height="16" rx="3" fill="#f5c842" opacity="0.5"/>
  </g>

  <!-- CAMELS rating gauges (bottom row) -->
  <g transform="translate(28, 300)">
    <!-- 6 CAMELS indicators as colored dots/bars -->
    <!-- C: Capital -->
    <circle cx="30" cy="24" r="20" fill="#0a1f10" stroke="#00ff88" stroke-width="2.5"/>
    <text x="30" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#00ff88">C</text>
    <rect x="14" y="28" width="32" height="6" rx="3" fill="#0d2a1a"/>
    <rect x="14" y="28" width="26" height="6" rx="3" fill="#00ff88" opacity="0.8"/>

    <!-- A: Assets -->
    <circle cx="88" cy="24" r="20" fill="#1a2744" stroke="#74b9ff" stroke-width="2.5"/>
    <text x="88" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#74b9ff">A</text>
    <rect x="72" y="28" width="32" height="6" rx="3" fill="#1a3a5c"/>
    <rect x="72" y="28" width="22" height="6" rx="3" fill="#74b9ff" opacity="0.8"/>

    <!-- M: Management -->
    <circle cx="146" cy="24" r="20" fill="#1a1200" stroke="#f5c842" stroke-width="2.5"/>
    <text x="146" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#f5c842">M</text>
    <rect x="130" y="28" width="32" height="6" rx="3" fill="#1a1200"/>
    <rect x="130" y="28" width="28" height="6" rx="3" fill="#f5c842" opacity="0.8"/>

    <!-- E: Earnings -->
    <circle cx="204" cy="24" r="20" fill="#1a0a2e" stroke="#e040fb" stroke-width="2.5"/>
    <text x="204" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#e040fb">E</text>
    <rect x="188" y="28" width="32" height="6" rx="3" fill="#1a0a2e"/>
    <rect x="188" y="28" width="20" height="6" rx="3" fill="#e040fb" opacity="0.8"/>

    <!-- L: Liquidity -->
    <circle cx="262" cy="24" r="20" fill="#2a0a0a" stroke="#e74c3c" stroke-width="2.5"/>
    <text x="262" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#e74c3c">L</text>
    <rect x="246" y="28" width="32" height="6" rx="3" fill="#2a0a0a"/>
    <rect x="246" y="28" width="16" height="6" rx="3" fill="#e74c3c" opacity="0.8"/>

    <!-- S: Sensitivity -->
    <circle cx="320" cy="24" r="20" fill="#1a1040" stroke="#a29bfe" stroke-width="2.5"/>
    <text x="320" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#a29bfe">S</text>
    <rect x="304" y="28" width="32" height="6" rx="3" fill="#1a1040"/>
    <rect x="304" y="28" width="24" height="6" rx="3" fill="#a29bfe" opacity="0.8"/>
  </g>

  <!-- NIM indicator (top-right corner) -->
  <g transform="translate(300, 52)">
    <rect x="0" y="0" width="72" height="48" rx="10" fill="#0a1f10" stroke="#00ff88" stroke-width="2"/>
    <line x1="10" y1="38" x2="10" y2="10" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="32" x2="22" y2="10" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="22" x2="34" y2="10" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="16" x2="46" y2="10" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="10" x2="58" y2="10" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <text x="36" y="46" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#00ff88" opacity="0.8">NIM</text>
  </g>
</svg>
