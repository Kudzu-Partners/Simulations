<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg298" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="revBar298" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg298)"/>

  <!-- Hotel building (protagonist) -->
  <g transform="translate(200, 175)">
    <!-- Main building -->
    <rect x="-90" y="-100" width="180" height="140" rx="6" fill="#1a2744" stroke="#f5c842" stroke-width="2.5"/>
    <!-- Windows grid 4x3 -->
    <g fill="#f5c842" opacity="0.55">
      <rect x="-70" y="-80" width="24" height="18" rx="3"/>
      <rect x="-28" y="-80" width="24" height="18" rx="3"/>
      <rect x="14" y="-80" width="24" height="18" rx="3"/>
      <rect x="56" y="-80" width="24" height="18" rx="3"/>
      <rect x="-70" y="-48" width="24" height="18" rx="3"/>
      <rect x="-28" y="-48" width="24" height="18" rx="3" opacity="0.85"/>
      <rect x="14" y="-48" width="24" height="18" rx="3"/>
      <rect x="56" y="-48" width="24" height="18" rx="3"/>
      <rect x="-70" y="-16" width="24" height="18" rx="3"/>
      <rect x="-28" y="-16" width="24" height="18" rx="3"/>
      <rect x="14" y="-16" width="24" height="18" rx="3"/>
      <rect x="56" y="-16" width="24" height="18" rx="3"/>
    </g>
    <!-- Door -->
    <rect x="-16" y="16" width="32" height="28" rx="3" fill="#0a1220"/>
    <!-- Base -->
    <rect x="-96" y="40" width="192" height="10" rx="3" fill="#f5c842" opacity="0.4"/>
  </g>

  <!-- Occupancy gauge (left) -->
  <g transform="translate(46, 110)">
    <!-- Donut chart style -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#1a2744" stroke-width="12"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#00ff88" stroke-width="12"
            stroke-dasharray="194 82" stroke-dashoffset="69" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="28" fill="#0a1220"/>
    <!-- Bed icon inside -->
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="20">🛏</text>
  </g>

  <!-- RevPAR bar (right) -->
  <g transform="translate(310, 90)">
    <rect x="-40" y="-44" width="80" height="90" rx="8" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <!-- Bar fill -->
    <rect x="-28" y="-32" width="56" height="66" rx="4" fill="#1a1200"/>
    <rect x="-28" y="2" width="56" height="32" rx="4" fill="url(#revBar298)" opacity="0.85"/>
    <!-- Arrow up -->
    <line x1="0" y1="-20" x2="0" y2="-36" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-6,-28 0,-38 6,-28" fill="#f5c842"/>
  </g>

  <!-- Calendar/booking icons (bottom) -->
  <g transform="translate(36, 310)">
    <!-- Booking calendar 1 -->
    <rect x="0" y="0" width="52" height="52" rx="7" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <rect x="0" y="0" width="52" height="14" rx="7" fill="#74b9ff" opacity="0.7"/>
    <rect x="6" y="20" width="12" height="10" rx="2" fill="#74b9ff" opacity="0.5"/>
    <rect x="22" y="20" width="12" height="10" rx="2" fill="#74b9ff" opacity="0.3"/>
    <rect x="38" y="20" width="8" height="10" rx="2" fill="#74b9ff" opacity="0.3"/>
    <rect x="6" y="34" width="12" height="10" rx="2" fill="#74b9ff" opacity="0.3"/>
    <rect x="22" y="34" width="12" height="10" rx="2" fill="#74b9ff" opacity="0.5"/>
    <rect x="38" y="34" width="8" height="10" rx="2" fill="#00ff88" opacity="0.8"/>

    <!-- Booking calendar 2 (full) -->
    <rect x="60" y="0" width="52" height="52" rx="7" fill="#0a1f10" stroke="#00ff88" stroke-width="2"/>
    <rect x="60" y="0" width="52" height="14" rx="7" fill="#00ff88" opacity="0.7"/>
    <g fill="#00ff88" opacity="0.6">
      <rect x="66" y="20" width="12" height="10" rx="2"/>
      <rect x="82" y="20" width="12" height="10" rx="2"/>
      <rect x="98" y="20" width="8" height="10" rx="2"/>
      <rect x="66" y="34" width="12" height="10" rx="2"/>
      <rect x="82" y="34" width="12" height="10" rx="2"/>
      <rect x="98" y="34" width="8" height="10" rx="2"/>
    </g>

    <!-- Dynamic pricing arrow cluster -->
    <g transform="translate(134, 4)">
      <rect x="0" y="0" width="188" height="52" rx="7" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
      <!-- Price bars going up -->
      <rect x="14" y="36" width="14" height="10" rx="2" fill="#f5c842" opacity="0.5"/>
      <rect x="34" y="26" width="14" height="20" rx="2" fill="#f5c842" opacity="0.6"/>
      <rect x="54" y="16" width="14" height="30" rx="2" fill="#f5c842" opacity="0.75"/>
      <rect x="74" y="10" width="14" height="36" rx="2" fill="#f5c842" opacity="0.9"/>
      <rect x="94" y="6" width="14" height="40" rx="2" fill="#00ff88" opacity="0.9"/>
      <!-- Arrow up -->
      <line x1="158" y1="40" x2="158" y2="12" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
      <polygon points="152,18 158,8 164,18" fill="#f5c842"/>
    </g>
  </g>
</svg>
