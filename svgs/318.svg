<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg318" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="disrupt318" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg318)"/>

  <!-- Battery (protagonist) -->
  <g transform="translate(150, 80)">
    <!-- Battery body -->
    <rect x="0" y="0" width="100" height="180" rx="10" fill="#1a2744" stroke="#f5c842" stroke-width="3"/>
    <!-- Terminal -->
    <rect x="30" y="-16" width="40" height="18" rx="4" fill="#f5c842" opacity="0.8"/>
    <!-- Fill levels (3 battery technologies stacked) -->
    <!-- Legacy (lead acid, bottom, fading) -->
    <rect x="8" y="130" width="84" height="42" rx="6" fill="#555" opacity="0.5"/>
    <!-- Li-Ion (middle, current) -->
    <rect x="8" y="78" width="84" height="48" rx="6" fill="#74b9ff" opacity="0.8"/>
    <!-- LFP / Solid State (top, emerging) -->
    <rect x="8" y="14" width="84" height="60" rx="6" fill="#00ff88" opacity="0.85"/>
    <!-- Lightning bolt -->
    <path d="M 56 30 L 44 64 L 52 64 L 40 100 L 66 58 L 56 58 L 68 30 Z" fill="#f5c842" opacity="0.9"/>
  </g>

  <!-- Disruption S-curves (right) -->
  <g transform="translate(270, 80)">
    <!-- Old tech (fading) -->
    <path d="M 0 170 Q 20 130 30 90 Q 40 56 90 40"
          stroke="#555" stroke-width="2.5" fill="none" stroke-dasharray="6,4" opacity="0.5"/>
    <!-- Li-Ion (current) -->
    <path d="M 0 165 Q 30 120 50 80 Q 65 50 90 32"
          stroke="#74b9ff" stroke-width="3" fill="none"/>
    <!-- Solid State (emerging, steeper) -->
    <path d="M 30 170 Q 50 140 65 100 Q 78 65 90 20"
          stroke="url(#disrupt318)" stroke-width="4" fill="none"/>

    <!-- Inflection dot on new curve -->
    <circle cx="62" cy="108" r="8" fill="#00ff88" opacity="0.9"/>
    <circle cx="62" cy="108" r="14" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- R&D portfolio (bottom) -->
  <g transform="translate(36, 310)">
    <rect x="0" y="0" width="80" height="48" rx="8" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <text x="40" y="20" text-anchor="middle" font-family="sans-serif" font-size="16">🔬</text>
    <rect x="8" y="28" width="64" height="10" rx="3" fill="#1a3a5c"/>
    <rect x="8" y="28" width="44" height="10" rx="3" fill="#74b9ff" opacity="0.7"/>

    <rect x="90" y="0" width="80" height="48" rx="8" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <text x="130" y="20" text-anchor="middle" font-family="sans-serif" font-size="16">⚡</text>
    <rect x="98" y="28" width="64" height="10" rx="3" fill="#1a1200"/>
    <rect x="98" y="28" width="52" height="10" rx="3" fill="#f5c842" opacity="0.7"/>

    <rect x="180" y="0" width="80" height="48" rx="8" fill="#0a1f10" stroke="#00ff88" stroke-width="2.5"/>
    <text x="220" y="20" text-anchor="middle" font-family="sans-serif" font-size="16">🔋</text>
    <rect x="188" y="28" width="64" height="10" rx="3" fill="#0a1f10"/>
    <rect x="188" y="28" width="60" height="10" rx="3" fill="#00ff88" opacity="0.8"/>

    <!-- Innovator dilemma badge -->
    <rect x="272" y="0" width="92" height="48" rx="8" fill="#1a0a2e" stroke="#e040fb" stroke-width="2"/>
    <text x="318" y="20" text-anchor="middle" font-family="sans-serif" font-size="16">🎯</text>
    <!-- two arrows: sustain vs disrupt -->
    <line x1="284" y1="38" x2="356" y2="38" stroke="#e040fb" stroke-width="1.5" opacity="0.5"/>
    <polygon points="284,34 276,38 284,42" fill="#74b9ff" opacity="0.7"/>
    <polygon points="356,34 364,38 356,42" fill="#e040fb" opacity="0.9"/>
  </g>
</svg>
