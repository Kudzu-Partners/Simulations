<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg190" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#6a0572"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg190)"/>

  <!-- Creator pyramid (4 tiers, bottom to top) -->

  <!-- Tier 1: Nano (wide base) -->
  <path d="M 60 300 L 340 300 L 310 258 L 90 258 Z" fill="#ff6b9d" opacity="0.18"/>
  <path d="M 60 300 L 340 300 L 310 258 L 90 258 Z" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="283" font-family="Arial,sans-serif" font-size="9" fill="#ff6b9d" text-anchor="middle" opacity="0.85">Nano · 1K–10K</text>
  <!-- Nano creator icons (small circles) -->
  <circle cx="130" cy="279" r="4" fill="#ff6b9d" opacity="0.5"/>
  <circle cx="148" cy="279" r="4" fill="#ff6b9d" opacity="0.5"/>
  <circle cx="248" cy="279" r="4" fill="#ff6b9d" opacity="0.5"/>
  <circle cx="266" cy="279" r="4" fill="#ff6b9d" opacity="0.5"/>

  <!-- Tier 2: Micro -->
  <path d="M 90 252 L 310 252 L 282 212 L 118 212 Z" fill="#ff6b9d" opacity="0.22"/>
  <path d="M 90 252 L 310 252 L 282 212 L 118 212 Z" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.65"/>
  <text x="200" y="236" font-family="Arial,sans-serif" font-size="9" fill="#ffd166" text-anchor="middle" opacity="0.85">Micro · 10K–100K</text>

  <!-- Tier 3: Macro -->
  <path d="M 118 206 L 282 206 L 256 168 L 144 168 Z" fill="#ff6b9d" opacity="0.27"/>
  <path d="M 118 206 L 282 206 L 256 168 L 144 168 Z" fill="none" stroke="#ffd166" stroke-width="2" opacity="0.7"/>
  <text x="200" y="191" font-family="Arial,sans-serif" font-size="9" fill="#ffd166" text-anchor="middle" opacity="0.9">Macro · 100K–1M</text>

  <!-- Tier 4: Mega (apex) -->
  <path d="M 144 162 L 256 162 L 230 124 L 170 124 Z" fill="#ffd166" opacity="0.25"/>
  <path d="M 144 162 L 256 162 L 230 124 L 170 124 Z" fill="none" stroke="#ffd166" stroke-width="2.5" opacity="0.85"/>
  <text x="200" y="147" font-family="Arial,sans-serif" font-size="9" fill="#ffd166" text-anchor="middle" opacity="0.95">Mega · 1M+</text>

  <!-- Star at apex -->
  <text x="200" y="116" font-family="Arial,sans-serif" font-size="18" fill="#ffd166" text-anchor="middle" opacity="0.85">★</text>

  <!-- Platform icons (left side) -->
  <!-- TikTok -->
  <rect x="30" y="200" width="26" height="26" rx="6" fill="#ff6b9d" opacity="0.2"/>
  <rect x="30" y="200" width="26" height="26" rx="6" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.65"/>
  <text x="43" y="217" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#ff6b9d" text-anchor="middle" opacity="0.8">TT</text>

  <!-- Instagram -->
  <rect x="30" y="234" width="26" height="26" rx="6" fill="#ffd166" opacity="0.2"/>
  <rect x="30" y="234" width="26" height="26" rx="6" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.65"/>
  <circle cx="43" cy="247" r="6" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.75"/>
  <circle cx="49" cy="240" r="2" fill="#ffd166" opacity="0.7"/>

  <!-- YouTube -->
  <rect x="30" y="268" width="26" height="26" rx="6" fill="#ff6b9d" opacity="0.2"/>
  <rect x="30" y="268" width="26" height="26" rx="6" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.6"/>
  <polygon points="39,275 39,287 52,281" fill="#ff6b9d" opacity="0.7"/>

  <!-- $500K budget badge -->
  <rect x="272" y="68" width="88" height="28" rx="8" fill="#ffd166" opacity="0.12"/>
  <rect x="272" y="68" width="88" height="28" rx="8" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.6"/>
  <text x="316" y="82" font-family="Arial,sans-serif" font-size="8" fill="#ffd166" text-anchor="middle" opacity="0.8">Budget</text>
  <text x="316" y="93" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffd166" text-anchor="middle" opacity="0.9">$500K</text>

  <!-- Creator crisis badge (red warning) -->
  <circle cx="62" cy="148" r="22" fill="#e74c3c" opacity="0.12"/>
  <circle cx="62" cy="148" r="22" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.6"/>
  <text x="62" y="144" font-family="Arial,sans-serif" font-size="9" fill="#e74c3c" text-anchor="middle" opacity="0.8">⚠</text>
  <text x="62" y="158" font-family="Arial,sans-serif" font-size="6" fill="#e74c3c" text-anchor="middle" opacity="0.7">Crisis</text>

  <!-- Community-led arrow at bottom -->
  <path d="M 105 320 Q 200 335 295 320" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.45"/>
  <text x="200" y="345" font-family="Arial,sans-serif" font-size="7" fill="#ff6b9d" text-anchor="middle" opacity="0.55">→ community-led organic growth</text>

  <!-- Label -->
  <text x="200" y="370" font-family="Arial,sans-serif" font-size="8" fill="#ffd166" text-anchor="middle" opacity="0.4" letter-spacing="1">CREATOR ECONOMY · AURA COSMETICS</text>
</svg>
