      <stop offset="0%" stop-color="#31203a"/>
      <stop offset="100%" stop-color="#54355e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg1422)"/>

  <!-- Negotiation table -->
  <ellipse cx="200" cy="286" rx="128" ry="34" fill="#e9dff0" fill-opacity="0.14" stroke="#e9dff0" stroke-width="2" stroke-opacity="0.5"/>
  <!-- The one deal document at center -->
  <rect x="178" y="262" width="44" height="34" rx="4" fill="#f2c94c" fill-opacity="0.9"/>
  <line x1="186" y1="272" x2="214" y2="272" stroke="#31203a" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="186" y1="280" x2="214" y2="280" stroke="#31203a" stroke-width="2.5" stroke-opacity="0.5"/>
  <!-- Three cultural lenses: distinct geometries converging -->
  <circle cx="110" cy="140" r="44" fill="none" stroke="#7fd88f" stroke-width="4" stroke-opacity="0.85"/>
  <rect x="252" y="96" width="84" height="84" rx="10" fill="none" stroke="#6fb8e8" stroke-width="4" stroke-opacity="0.85"/>
  <path d="M 200,64 L 236,124 L 164,124 Z" fill="none" stroke="#e8837a" stroke-width="4" stroke-opacity="0.85"/>
  <!-- Sightlines from each lens to the deal -->
  <line x1="122" y1="182" x2="184" y2="260" stroke="#7fd88f" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <line x1="288" y1="182" x2="216" y2="260" stroke="#6fb8e8" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <line x1="200" y1="128" x2="200" y2="258" stroke="#e8837a" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="6 5"/>

