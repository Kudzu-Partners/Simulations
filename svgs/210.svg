<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg210" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <radialGradient id="hubGlow210" cx="50%" cy="50%" r="32%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg210)"/>
  <rect width="400" height="400" rx="32" fill="url(#hubGlow210)"/>

  <!-- Background dots grid -->
  <g fill="#f5c842" opacity="0.06">
    <circle cx="60" cy="60" r="1"/><circle cx="140" cy="60" r="1"/><circle cx="220" cy="60" r="1"/><circle cx="300" cy="60" r="1"/>
    <circle cx="60" cy="140" r="1"/><circle cx="140" cy="140" r="1"/><circle cx="220" cy="140" r="1"/><circle cx="300" cy="140" r="1"/>
    <circle cx="60" cy="220" r="1"/><circle cx="140" cy="220" r="1"/><circle cx="220" cy="220" r="1"/><circle cx="300" cy="220" r="1"/>
    <circle cx="60" cy="300" r="1"/><circle cx="140" cy="300" r="1"/><circle cx="220" cy="300" r="1"/><circle cx="300" cy="300" r="1"/>
    <circle cx="60" cy="340" r="1"/><circle cx="340" cy="340" r="1"/>
  </g>

  <!-- ── Central capital pool ── -->
  <circle cx="200" cy="200" r="42" fill="#1a2744" stroke="#f5c842" stroke-width="3"/>
  <circle cx="200" cy="200" r="32" fill="#f5c842" opacity="0.18"/>
  <text x="200" y="195" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#f5c842" opacity="0.95">$</text>
  <text x="200" y="212" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#f5c842" opacity="0.75">CAPITAL</text>

  <!-- Pulse ring -->
  <circle cx="200" cy="200" r="50" fill="none" stroke="#f5c842" stroke-width="1.2" opacity="0.4"/>
  <circle cx="200" cy="200" r="58" fill="none" stroke="#f5c842" stroke-width="0.8" opacity="0.22"/>

  <!-- ── 5 investment opportunity nodes (around the hub) ── -->
  <!-- Sized by allocation; positioned at angles -->

  <!-- Position 1: top — large allocation (NPV strong) -->
  <line x1="200" y1="158" x2="200" y2="100" stroke="#52b788" stroke-width="2.5" opacity="0.8"/>
  <polygon points="194,108 200,98 206,108" fill="#52b788" opacity="0.85"/>
  <circle cx="200" cy="78" r="22" fill="#0a0f1e" stroke="#52b788" stroke-width="2.5"/>
  <text x="200" y="76" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#52b788" opacity="0.95">+NPV</text>
  <text x="200" y="86" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#52b788" opacity="0.7">PROJ 1</text>

  <!-- Position 2: top-right — medium (good IRR) -->
  <line x1="232" y1="172" x2="290" y2="118" stroke="#52b788" stroke-width="2" opacity="0.7"/>
  <polygon points="285,124 292,114 296,126" fill="#52b788" opacity="0.8"/>
  <circle cx="305" cy="100" r="18" fill="#0a0f1e" stroke="#52b788" stroke-width="2"/>
  <text x="305" y="98" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#52b788" opacity="0.95">IRR</text>
  <text x="305" y="108" text-anchor="middle" font-family="'Courier New',monospace" font-size="6.5" fill="#52b788" opacity="0.7">PROJ 2</text>

  <!-- Position 3: right — medium-small -->
  <line x1="242" y1="200" x2="320" y2="200" stroke="#d4a574" stroke-width="1.8" opacity="0.7"/>
  <polygon points="315,196 325,200 315,204" fill="#d4a574" opacity="0.8"/>
  <circle cx="345" cy="200" r="16" fill="#0a0f1e" stroke="#d4a574" stroke-width="2"/>
  <text x="345" y="204" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#d4a574" opacity="0.95">P3</text>

  <!-- Position 4: bottom-right — declined (red, X) -->
  <line x1="232" y1="228" x2="298" y2="290" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.55"/>
  <circle cx="312" cy="305" r="16" fill="#0a0f1e" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="304" y1="297" x2="320" y2="313" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="320" y1="297" x2="304" y2="313" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
  <text x="312" y="333" text-anchor="middle" font-family="'Courier New',monospace" font-size="6.5" fill="#ff6b6b" opacity="0.75">REJECT</text>

  <!-- Position 5: bottom — debt repayment (down arrow, gold) -->
  <line x1="200" y1="242" x2="200" y2="300" stroke="#d4a574" stroke-width="2" opacity="0.75"/>
  <polygon points="194,292 200,302 206,292" fill="#d4a574" opacity="0.85"/>
  <circle cx="200" cy="320" r="18" fill="#0a0f1e" stroke="#d4a574" stroke-width="2"/>
  <text x="200" y="318" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#d4a574" opacity="0.95">DEBT</text>
  <text x="200" y="328" text-anchor="middle" font-family="'Courier New',monospace" font-size="6.5" fill="#d4a574" opacity="0.7">PROJ 5</text>

  <!-- Position 6: left — working capital release -->
  <line x1="158" y1="200" x2="80" y2="200" stroke="#74b9ff" stroke-width="1.8" opacity="0.7"/>
  <polygon points="85,196 75,200 85,204" fill="#74b9ff" opacity="0.8"/>
  <circle cx="55" cy="200" r="18" fill="#0a0f1e" stroke="#74b9ff" stroke-width="2"/>
  <text x="55" y="197" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" font-weight="bold" fill="#74b9ff" opacity="0.95">WC</text>
  <text x="55" y="207" text-anchor="middle" font-family="'Courier New',monospace" font-size="6.5" fill="#74b9ff" opacity="0.7">RELEASE</text>

  <!-- ── WACC formula label (top-left) ── -->
  <g transform="translate(30,30)">
    <rect x="0" y="0" width="120" height="26" rx="5" fill="#0a0f1e" stroke="#f5c842" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="10" y="17" font-family="'Courier New',monospace" font-size="9" fill="#f5c842" opacity="0.95">WACC = 9.2%</text>
  </g>

  <!-- ── Credit rating gauge (bottom-left) ── -->
  <g transform="translate(70,346)">
    <rect x="-32" y="-8" width="64" height="20" rx="5" fill="#0a0f1e" stroke="#52b788" stroke-width="1.2" stroke-opacity="0.55"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#52b788" opacity="0.95">BBB+</text>
  </g>

  <!-- Capital structure mini bar (top-right) -->
  <g transform="translate(330,40)">
    <rect x="-30" y="0" width="60" height="6" rx="2" fill="#1a2744"/>
    <rect x="-30" y="0" width="36" height="6" rx="2" fill="#52b788" opacity="0.85"/>
    <rect x="6"   y="0" width="24" height="6" rx="2" fill="#d4a574" opacity="0.85"/>
    <text x="0" y="-4" text-anchor="middle" font-family="'Courier New',monospace" font-size="6.5" fill="#c0cfff" opacity="0.7" letter-spacing="1">EQUITY · DEBT</text>
  </g>

  <text x="200" y="378" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c0cfff" opacity="0.4" letter-spacing="2">CAPITAL ALLOCATION · CFO</text>
</svg>
