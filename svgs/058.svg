<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg058" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg058)"/>

  <!-- HUMAN FIGURE (left zone) -->
  <!-- Head -->
  <circle cx="90" cy="148" r="22" fill="#c0cfff" fill-opacity="0.20" stroke="#c0cfff" stroke-width="2" stroke-opacity="0.60"/>
  <!-- Body -->
  <rect x="76" y="172" width="28" height="48" rx="6"
        fill="#c0cfff" fill-opacity="0.18" stroke="#c0cfff" stroke-width="1.8" stroke-opacity="0.55"/>
  <!-- Arms -->
  <line x1="76"  y1="185" x2="58" y2="205" stroke="#c0cfff" stroke-width="2" stroke-opacity="0.45"/>
  <line x1="104" y1="185" x2="122" y2="205" stroke="#c0cfff" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Legs -->
  <line x1="83"  y1="220" x2="78" y2="248" stroke="#c0cfff" stroke-width="2" stroke-opacity="0.45"/>
  <line x1="97"  y1="220" x2="102" y2="248" stroke="#c0cfff" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Thought/prompt arrow going right -->
  <line x1="128" y1="185" x2="168" y2="185" stroke="#f5c842" stroke-width="2" stroke-opacity="0.65" stroke-dasharray="5,3"/>
  <polygon points="165,180 175,185 165,190" fill="#f5c842" fill-opacity="0.65"/>

  <!-- PROMPT BOX (center) -->
  <rect x="178" y="158" width="82" height="54" rx="6"
        fill="#7b2fff" fill-opacity="0.18" stroke="#7b2fff" stroke-width="2" stroke-opacity="0.65"/>
  <!-- Prompt text lines -->
  <g stroke="#7b2fff" stroke-width="1.2" stroke-opacity="0.50">
    <line x1="188" y1="173" x2="250" y2="173"/>
    <line x1="188" y1="183" x2="250" y2="183"/>
    <line x1="188" y1="193" x2="232" y2="193"/>
  </g>
  <!-- Cursor blink -->
  <rect x="235" y="188" width="2" height="10" rx="1" fill="#7b2fff" fill-opacity="0.70"/>
  <!-- Arrow into AI node -->
  <line x1="260" y1="185" x2="292" y2="185" stroke="#00bfff" stroke-width="2" stroke-opacity="0.65"/>
  <polygon points="289,180 299,185 289,190" fill="#00bfff" fill-opacity="0.65"/>

  <!-- AI BRAIN NODE (right-center) -->
  <circle cx="318" cy="185" r="32" fill="#0d1b2a" fill-opacity="0.90" stroke="#00bfff" stroke-width="2.5" stroke-opacity="0.80"/>
  <!-- Circuit lines inside -->
  <g stroke="#00bfff" stroke-width="1" stroke-opacity="0.40">
    <line x1="300" y1="178" x2="316" y2="178"/>
    <line x1="316" y1="178" x2="316" y2="168"/>
    <line x1="316" y1="185" x2="330" y2="185"/>
    <line x1="330" y1="185" x2="330" y2="195"/>
    <line x1="310" y1="195" x2="330" y2="195"/>
    <line x1="310" y1="185" x2="310" y2="200"/>
  </g>
  <circle cx="316" cy="178" r="2.5" fill="#00bfff" fill-opacity="0.70"/>
  <circle cx="330" cy="185" r="2.5" fill="#00bfff" fill-opacity="0.70"/>
  <circle cx="310" cy="195" r="2.5" fill="#00bfff" fill-opacity="0.70"/>
  <!-- "AI" label -->
  <text x="318" y="190" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#00bfff" text-anchor="middle" opacity="0.80">AI</text>

  <!-- 5 OUTPUT DECISIONS (fanning out below-right) -->
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.40">5 Business Scenarios</text>
  <!-- Output dots with lines from AI node -->
  <line x1="296" y1="212" x2="248" y2="255" stroke="#00bfff" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="308" y1="216" x2="278" y2="260" stroke="#00bfff" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="318" y1="217" x2="318" y2="262" stroke="#00bfff" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="330" y1="215" x2="350" y2="255" stroke="#00bfff" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="340" y1="210" x2="368" y2="248" stroke="#00bfff" stroke-width="1.2" stroke-opacity="0.35"/>

  <circle cx="248" cy="262" r="7" fill="#00bfff" fill-opacity="0.40" stroke="#00bfff" stroke-width="1.2"/>
  <circle cx="278" cy="267" r="7" fill="#00bfff" fill-opacity="0.40" stroke="#00bfff" stroke-width="1.2"/>
  <circle cx="318" cy="269" r="7" fill="#00bfff" fill-opacity="0.45" stroke="#00bfff" stroke-width="1.2"/>
  <circle cx="350" cy="262" r="7" fill="#00bfff" fill-opacity="0.40" stroke="#00bfff" stroke-width="1.2"/>
  <circle cx="368" cy="255" r="7" fill="#00bfff" fill-opacity="0.35" stroke="#00bfff" stroke-width="1.2"/>

  <!-- Hallucination warning (small alert, bottom-left) -->
  <polygon points="88,318 100,298 112,318" fill="#e74c3c" fill-opacity="0.45" stroke="#e74c3c" stroke-width="1"/>
  <text x="100" y="314" font-family="Arial Black, sans-serif" font-size="7" font-weight="900" fill="#e74c3c" text-anchor="middle" opacity="0.80">!</text>
  <text x="130" y="316" font-family="Arial, sans-serif" font-size="7" fill="#e74c3c" opacity="0.55">Hallucination risk</text>
</svg>
