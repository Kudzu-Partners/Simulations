<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg112" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <linearGradient id="king112" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#b88420"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg112)"/>
  <!-- Chess board base -->
  <g transform="translate(200 320)">
    <ellipse rx="160" ry="22" fill="#000" opacity="0.4"/>
    <g>
      <rect x="-140" y="-12" width="35" height="24" fill="#c0cfff" opacity="0.85"/>
      <rect x="-105" y="-12" width="35" height="24" fill="#1a2744"/>
      <rect x="-70" y="-12" width="35" height="24" fill="#c0cfff" opacity="0.85"/>
      <rect x="-35" y="-12" width="35" height="24" fill="#1a2744"/>
      <rect x="0" y="-12" width="35" height="24" fill="#c0cfff" opacity="0.85"/>
      <rect x="35" y="-12" width="35" height="24" fill="#1a2744"/>
      <rect x="70" y="-12" width="35" height="24" fill="#c0cfff" opacity="0.85"/>
      <rect x="105" y="-12" width="35" height="24" fill="#1a2744"/>
    </g>
    <rect x="-140" y="-12" width="280" height="24" fill="none" stroke="#f5c842" stroke-width="2"/>
  </g>
  <!-- Coalition lines connecting pieces -->
  <g stroke="#f5c842" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.55" fill="none">
    <path d="M120 220 Q160 180 200 170"/>
    <path d="M280 220 Q240 180 200 170"/>
    <path d="M120 220 Q200 250 280 220"/>
  </g>
  <!-- King (center, hero piece) -->
  <g transform="translate(200 215)">
    <ellipse cx="0" cy="80" rx="32" ry="6" fill="#000" opacity="0.4"/>
    <rect x="-28" y="60" width="56" height="20" rx="3" fill="url(#king112)" stroke="#ffffff" stroke-width="2"/>
    <path d="M-22 60 L-18 20 Q-18 5 0 5 Q18 5 18 20 L22 60 Z" fill="url(#king112)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="-5" r="9" fill="url(#king112)" stroke="#ffffff" stroke-width="2"/>
    <!-- crown cross -->
    <rect x="-2" y="-28" width="4" height="14" fill="#f5c842"/>
    <rect x="-7" y="-22" width="14" height="4" fill="#f5c842"/>
  </g>
  <!-- Pawns flanking -->
  <g transform="translate(120 240)">
    <ellipse cx="0" cy="60" rx="22" ry="5" fill="#000" opacity="0.4"/>
    <rect x="-20" y="45" width="40" height="14" rx="2" fill="#c0cfff" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M-14 45 L-10 18 Q-10 8 0 8 Q10 8 10 18 L14 45 Z" fill="#c0cfff" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="0" cy="2" r="9" fill="#c0cfff" stroke="#ffffff" stroke-width="1.8"/>
  </g>
  <g transform="translate(280 240)">
    <ellipse cx="0" cy="60" rx="22" ry="5" fill="#000" opacity="0.4"/>
    <rect x="-20" y="45" width="40" height="14" rx="2" fill="#c0cfff" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M-14 45 L-10 18 Q-10 8 0 8 Q10 8 10 18 L14 45 Z" fill="#c0cfff" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="0" cy="2" r="9" fill="#c0cfff" stroke="#ffffff" stroke-width="1.8"/>
  </g>
  <!-- Opposing piece (rival) -->
  <g transform="translate(60 270)" opacity="0.7">
    <rect x="-16" y="38" width="32" height="12" rx="2" fill="#e74c3c" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M-12 38 L-8 14 Q-8 6 0 6 Q8 6 8 14 L12 38 Z" fill="#e74c3c" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-13" y="-2" width="6" height="10" fill="#e74c3c"/>
    <rect x="-3" y="-6" width="6" height="14" fill="#e74c3c"/>
    <rect x="7" y="-2" width="6" height="10" fill="#e74c3c"/>
    <rect x="-15" y="6" width="30" height="6" fill="#e74c3c" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
