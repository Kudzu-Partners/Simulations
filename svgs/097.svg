<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg97" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#6a0572"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg97)"/>
  <!-- Clapperboard -->
  <!-- Main board body -->
  <rect x="95" y="160" width="210" height="155" rx="6" fill="#2d0a4e" stroke="#ff6b9d" stroke-width="2.5" opacity="0.95"/>
  <!-- Clapper top part (stripes) -->
  <rect x="95" y="120" width="210" height="42" rx="6" fill="#ff6b9d" opacity="0.3" stroke="#ff6b9d" stroke-width="2"/>
  <!-- Stripe pattern on clapper -->
  <g fill="#ffd166" opacity="0.6">
    <polygon points="105,120 125,120 105,162"/>
    <polygon points="145,120 165,120 145,162 125,162"/>
    <polygon points="185,120 205,120 185,162 165,162"/>
    <polygon points="225,120 245,120 225,162 205,162"/>
    <polygon points="265,120 285,120 265,162 245,162"/>
    <polygon points="285,120 305,120 285,162"/>
  </g>
  <!-- Clapper hinge -->
  <rect x="95" y="118" width="210" height="6" rx="3" fill="#ff6b9d" opacity="0.5"/>
  <!-- Board content -->
  <g fill="#ff6b9d" opacity="0.6" font-family="monospace" font-size="10">
    <text x="115" y="190">STUDIO:</text>
    <text x="195" y="190" fill="#ffd166" opacity="0.8">LATAM</text>
    <text x="115" y="207">SCENE:</text>
    <text x="195" y="207" fill="#ffd166" opacity="0.8">CONTENT</text>
    <text x="115" y="224">TAKE:</text>
    <text x="195" y="224" fill="#ffd166" opacity="0.8">3 YEARS</text>
  </g>
  <!-- Streaming arrows radiating out (distribution platforms) -->
  <line x1="200" y1="315" x2="200" y2="355" stroke="#ff6b9d" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="315" x2="155" y2="350" stroke="#ffd166" stroke-width="2" opacity="0.55"/>
  <line x1="200" y1="315" x2="245" y2="350" stroke="#c084fc" stroke-width="2" opacity="0.55"/>
  <line x1="200" y1="315" x2="115" y2="345" stroke="#ff6b9d" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="315" x2="285" y2="345" stroke="#ffd166" stroke-width="1.5" opacity="0.4"/>
  <!-- Platform dots -->
  <circle cx="200" cy="357" r="6" fill="#ff6b9d" opacity="0.7"/>
  <circle cx="153" cy="352" r="6" fill="#ffd166" opacity="0.65"/>
  <circle cx="247" cy="352" r="6" fill="#c084fc" opacity="0.65"/>
  <circle cx="113" cy="347" r="5" fill="#ff6b9d" opacity="0.5"/>
  <circle cx="287" cy="347" r="5" fill="#ffd166" opacity="0.5"/>
  <!-- IP label -->
  <text x="200" y="96" font-family="sans-serif" font-size="12" fill="#ffd166" text-anchor="middle" opacity="0.7">IP · CONTENT · STREAMING</text>
</svg>
