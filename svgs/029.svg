<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg029" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <radialGradient id="platformGlow029" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg029)"/>
  <rect cx="200" cy="200" x="155" y="168" width="90" height="64" rx="8" fill="url(#platformGlow029)"/>

  <!-- PLATFORM CENTER (NEXUS bridge) -->
  <rect x="155" y="172" width="90" height="56" rx="8" fill="#0d1b2a" stroke="#00bfff" stroke-width="2.5"/>
  <text x="200" y="204" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#00bfff" text-anchor="middle" opacity="0.92">NEXUS</text>

  <!-- PROVIDER nodes (left cluster) -->
  <circle cx="72"  cy="118" r="16" fill="#1b2d4f" stroke="#7b2fff" stroke-width="2.2"/>
  <circle cx="72"  cy="118" r="7"  fill="#7b2fff" fill-opacity="0.80"/>

  <circle cx="55"  cy="200" r="18" fill="#1b2d4f" stroke="#7b2fff" stroke-width="2.5"/>
  <circle cx="55"  cy="200" r="8"  fill="#7b2fff" fill-opacity="0.85"/>

  <circle cx="72"  cy="282" r="16" fill="#1b2d4f" stroke="#7b2fff" stroke-width="2.2"/>
  <circle cx="72"  cy="282" r="7"  fill="#7b2fff" fill-opacity="0.80"/>

  <circle cx="112" cy="148" r="13" fill="#1b2d4f" stroke="#7b2fff" stroke-width="1.8" stroke-opacity="0.70"/>
  <circle cx="112" cy="148" r="6"  fill="#7b2fff" fill-opacity="0.60"/>

  <circle cx="112" cy="252" r="13" fill="#1b2d4f" stroke="#7b2fff" stroke-width="1.8" stroke-opacity="0.70"/>
  <circle cx="112" cy="252" r="6"  fill="#7b2fff" fill-opacity="0.60"/>

  <!-- CONSUMER nodes (right cluster) -->
  <circle cx="328" cy="118" r="16" fill="#1b2d4f" stroke="#00bfff" stroke-width="2.2"/>
  <circle cx="328" cy="118" r="7"  fill="#00bfff" fill-opacity="0.80"/>

  <circle cx="345" cy="200" r="18" fill="#1b2d4f" stroke="#00bfff" stroke-width="2.5"/>
  <circle cx="345" cy="200" r="8"  fill="#00bfff" fill-opacity="0.85"/>

  <circle cx="328" cy="282" r="16" fill="#1b2d4f" stroke="#00bfff" stroke-width="2.2"/>
  <circle cx="328" cy="282" r="7"  fill="#00bfff" fill-opacity="0.80"/>

  <circle cx="288" cy="148" r="13" fill="#1b2d4f" stroke="#00bfff" stroke-width="1.8" stroke-opacity="0.70"/>
  <circle cx="288" cy="148" r="6"  fill="#00bfff" fill-opacity="0.60"/>

  <circle cx="288" cy="252" r="13" fill="#1b2d4f" stroke="#00bfff" stroke-width="1.8" stroke-opacity="0.70"/>
  <circle cx="288" cy="252" r="6"  fill="#00bfff" fill-opacity="0.60"/>

  <!-- Provider → Platform flows -->
  <g stroke="#7b2fff" stroke-width="1.8" stroke-opacity="0.50">
    <line x1="88"  y1="118" x2="155" y2="185"/>
    <line x1="73"  y1="200" x2="155" y2="200"/>
    <line x1="88"  y1="282" x2="155" y2="215"/>
    <line x1="124" y1="148" x2="155" y2="185"/>
    <line x1="124" y1="252" x2="155" y2="215"/>
  </g>

  <!-- Platform → Consumer flows -->
  <g stroke="#00bfff" stroke-width="1.8" stroke-opacity="0.50">
    <line x1="245" y1="185" x2="312" y2="118"/>
    <line x1="245" y1="200" x2="327" y2="200"/>
    <line x1="245" y1="215" x2="312" y2="282"/>
    <line x1="245" y1="185" x2="276" y2="148"/>
    <line x1="245" y1="215" x2="276" y2="252"/>
  </g>

  <!-- Side labels -->
  <text x="62"  y="58" font-family="Arial, sans-serif" font-size="10" fill="#7b2fff" text-anchor="middle" opacity="0.65">Providers</text>
  <text x="338" y="58" font-family="Arial, sans-serif" font-size="10" fill="#00bfff" text-anchor="middle" opacity="0.65">Clients</text>

</svg>
