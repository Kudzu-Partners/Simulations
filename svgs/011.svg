<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg011" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <radialGradient id="crisis011" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg011)"/>

  <!-- Chain baseline -->
  <line x1="65" y1="200" x2="335" y2="200" stroke="#95a5a6" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Normal connections (left side, orange) -->
  <line x1="75" y1="200" x2="147" y2="200" stroke="#e67e22" stroke-width="2.5" stroke-opacity="0.70"/>
  <line x1="147" y1="200" x2="200" y2="200" stroke="#e67e22" stroke-width="2.5" stroke-opacity="0.70"/>

  <!-- Disrupted connections (right side, red dashed) -->
  <line x1="200" y1="200" x2="253" y2="200" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.65" stroke-dasharray="6,4"/>
  <line x1="253" y1="200" x2="325" y2="200" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="6,4"/>

  <!-- Alternate path (backup route, dashed gray) -->
  <path d="M 75,200 Q 120,140 200,135 Q 280,130 325,200" fill="none" stroke="#95a5a6" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="5,5"/>

  <!-- Crisis glow at node 3 -->
  <circle cx="200" cy="200" r="55" fill="url(#crisis011)"/>

  <!-- Node 1: Supplier -->
  <circle cx="75" cy="200" r="22" fill="#2c3e50" stroke="#e67e22" stroke-width="2.5"/>
  <rect x="63" y="191" width="24" height="18" rx="2" fill="#e67e22" fill-opacity="0.70"/>

  <!-- Node 2: Factory -->
  <circle cx="147" cy="200" r="22" fill="#2c3e50" stroke="#e67e22" stroke-width="2.5"/>
  <polygon points="147,189 158,207 136,207" fill="#e67e22" fill-opacity="0.70"/>

  <!-- Node 3: Hub — crisis point (red, larger, cracked) -->
  <circle cx="200" cy="200" r="30" fill="#1c2333" stroke="#e74c3c" stroke-width="3" stroke-opacity="0.90"/>
  <circle cx="200" cy="200" r="22" fill="#e74c3c" fill-opacity="0.20" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.60"/>
  <!-- Crack lines -->
  <path d="M 193,186 L 201,200 L 195,214" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.95"/>
  <path d="M 201,200 L 210,195" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75"/>
  <!-- Alert pulse rings -->
  <circle cx="200" cy="200" r="40" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="200" cy="200" r="52" fill="none" stroke="#e74c3c" stroke-width="1" stroke-opacity="0.20"/>

  <!-- Node 4: Distribution (impacted, dimmer) -->
  <circle cx="253" cy="200" r="22" fill="#2c3e50" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.60"/>
  <rect x="243" y="192" width="20" height="16" rx="1" fill="#e74c3c" fill-opacity="0.35"/>
  <polygon points="248,208 258,208 263,200" fill="#e74c3c" fill-opacity="0.25"/>

  <!-- Node 5: Retail (most disrupted, very dim) -->
  <circle cx="325" cy="200" r="22" fill="#2c3e50" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="316" y="192" width="18" height="16" rx="2" fill="#e74c3c" fill-opacity="0.20"/>

</svg>
