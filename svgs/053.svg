<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg053" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg053)"/>

  <!-- Rate dial (large circle, center) -->
  <circle cx="200" cy="195" r="108" fill="none" stroke="#00bfff" stroke-width="1.5" stroke-opacity="0.20"/>
  <circle cx="200" cy="195" r="90"  fill="#0a0f1e" fill-opacity="0.60" stroke="#00bfff" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Dial tick marks (from ~210° to ~330° = rate range 0–12%) -->
  <!-- Tick marks at 10° intervals across 180° arc (left bottom to right bottom) -->
  <g stroke="#c0cfff" stroke-width="1.5" stroke-opacity="0.40">
    <!-- 0% at 225° -->
    <line x1="136" y1="259" x2="129" y2="268"/>
    <!-- 2% at 247° -->
    <line x1="152" y1="278" x2="147" y2="288"/>
    <!-- 4% at 270° -->
    <line x1="200" y1="285" x2="200" y2="295"/>
    <!-- 6% at 292° -->
    <line x1="248" y1="278" x2="253" y2="288"/>
    <!-- 8% at 315° -->
    <line x1="264" y1="259" x2="271" y2="268"/>
    <!-- 10% at 337° -->
    <line x1="268" y1="228" x2="278" y2="230"/>
  </g>
  <!-- Rate labels -->
  <text x="120" y="280" font-family="Arial, sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.50">0%</text>
  <text x="200" y="312" font-family="Arial, sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.50">6%</text>
  <text x="285" y="245" font-family="Arial, sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.50">10%</text>

  <!-- Needle (pointing to ~4.5% — ~280° position) -->
  <!-- Needle from center pointing toward 280° -->
  <line x1="200" y1="195" x2="210" y2="283"
        stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
  <!-- Needle pivot -->
  <circle cx="200" cy="195" r="8" fill="#f5c842" fill-opacity="0.80"/>
  <circle cx="200" cy="195" r="4" fill="#0a0f1e"/>

  <!-- Zone arcs (danger red top, target green center, danger red right) -->
  <!-- Target zone arc (2%–6%): 247°–293° -->
  <path d="M 144,241 A 90,90 0 0,1 256,241"
        fill="none" stroke="#52b788" stroke-width="8" stroke-opacity="0.25" stroke-linecap="round"/>
  <!-- Tightening zone (6%–10%): 292°–337° -->
  <path d="M 256,241 A 90,90 0 0,1 284,123"
        fill="none" stroke="#e74c3c" stroke-width="8" stroke-opacity="0.20" stroke-linecap="round"/>

  <!-- "%" rate indicator label -->
  <text x="200" y="172" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#f5c842" text-anchor="middle" opacity="0.80">4.5%</text>
  <text x="200" y="150" font-family="Arial, sans-serif" font-size="9" fill="#c0cfff" text-anchor="middle" opacity="0.50">Policy Rate</text>

  <!-- Inflation indicator (top-left) -->
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c" text-anchor="middle" opacity="0.70">Inflation</text>
  <line x1="90" y1="102" x2="90" y2="142" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.50"/>
  <polygon points="85,102 95,102 90,92" fill="#e74c3c" fill-opacity="0.65"/>

  <!-- Output/GDP indicator (top-right) -->
  <text x="310" y="95" font-family="Arial, sans-serif" font-size="9" fill="#00bfff" text-anchor="middle" opacity="0.70">Output</text>
  <line x1="310" y1="102" x2="310" y2="142" stroke="#00bfff" stroke-width="2" stroke-opacity="0.50"/>
  <polygon points="305,142 315,142 310,152" fill="#00bfff" fill-opacity="0.65"/>

  <!-- Credibility bar (bottom) -->
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.50">Credibility</text>
  <!-- Bar track -->
  <rect x="120" y="350" width="160" height="10" rx="5" fill="#c0cfff" fill-opacity="0.12"/>
  <!-- Bar fill (78% credibility) -->
  <rect x="120" y="350" width="125" height="10" rx="5" fill="#f5c842" fill-opacity="0.55"/>
</svg>
