<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg005" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg005)"/>

  <!-- Large background gear outline (low opacity, manufacturing identity) -->
  <circle cx="200" cy="195" r="118" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-opacity="0.15"/>
  <circle cx="200" cy="195" r="85" fill="none" stroke="#e67e22" stroke-width="1" stroke-opacity="0.10"/>
  <!-- Gear teeth (12 radial tick marks) -->
  <g stroke="#e67e22" stroke-width="8" stroke-opacity="0.12" stroke-linecap="round">
    <line x1="200" y1="72" x2="200" y2="58"/>
    <line x1="257" y1="87" x2="263" y2="74"/>
    <line x1="299" y1="130" x2="311" y2="124"/>
    <line x1="315" y1="190" x2="329" y2="190"/>
    <line x1="299" y1="250" x2="311" y2="256"/>
    <line x1="257" y1="293" x2="263" y2="307"/>
    <line x1="200" y1="313" x2="200" y2="327"/>
    <line x1="143" y1="293" x2="137" y2="307"/>
    <line x1="101" y1="250" x2="89" y2="256"/>
    <line x1="85" y1="190" x2="71" y2="190"/>
    <line x1="101" y1="130" x2="89" y2="124"/>
    <line x1="143" y1="87" x2="137" y2="74"/>
  </g>

  <!-- Factory silhouette (left side) -->
  <rect x="58" y="248" width="62" height="55" fill="#95a5a6" fill-opacity="0.18" stroke="#95a5a6" stroke-width="1.5" stroke-opacity="0.50"/>
  <rect x="65" y="220" width="14" height="32" fill="#95a5a6" fill-opacity="0.22" stroke="#95a5a6" stroke-width="1.2" stroke-opacity="0.50"/>
  <rect x="86" y="228" width="14" height="24" fill="#95a5a6" fill-opacity="0.22" stroke="#95a5a6" stroke-width="1.2" stroke-opacity="0.50"/>

  <!-- Roadmap baseline -->
  <line x1="120" y1="230" x2="350" y2="230" stroke="#e67e22" stroke-width="2.5" stroke-opacity="0.70"/>
  <polygon points="350,225 360,230 350,235" fill="#e67e22" fill-opacity="0.70"/>

  <!-- Phase 1 node — IoT (x=165) -->
  <circle cx="168" cy="230" r="14" fill="#1c2333" stroke="#e67e22" stroke-width="2.5"/>
  <circle cx="168" cy="230" r="6" fill="#e67e22" fill-opacity="0.90"/>
  <!-- IoT wifi rings above node -->
  <g fill="none" stroke="#e67e22" stroke-opacity="0.70" stroke-width="1.5">
    <path d="M155,210 Q168,200 181,210"/>
    <path d="M149,203 Q168,190 187,203"/>
  </g>

  <!-- Phase 2 node — Cloud (x=240) -->
  <circle cx="240" cy="230" r="14" fill="#1c2333" stroke="#95a5a6" stroke-width="2.5"/>
  <circle cx="240" cy="230" r="6" fill="#95a5a6" fill-opacity="0.90"/>
  <!-- Cloud icon above node -->
  <path d="M228,210 Q228,202 236,202 Q237,196 245,197 Q252,194 254,202 Q260,202 260,210 Z"
        fill="#95a5a6" fill-opacity="0.55" stroke="#95a5a6" stroke-width="1.2" stroke-opacity="0.75"/>

  <!-- Phase 3 node — AI/Digital (x=315) -->
  <circle cx="315" cy="230" r="16" fill="#1c2333" stroke="#7b2fff" stroke-width="2.8"/>
  <circle cx="315" cy="230" r="7" fill="#7b2fff" fill-opacity="0.90"/>
  <!-- Circuit chip above node -->
  <rect x="307" y="198" width="16" height="16" rx="2" fill="none" stroke="#7b2fff" stroke-width="1.8" stroke-opacity="0.80"/>
  <line x1="311" y1="198" x2="311" y2="194" stroke="#7b2fff" stroke-width="1.2" stroke-opacity="0.70"/>
  <line x1="315" y1="198" x2="315" y2="194" stroke="#7b2fff" stroke-width="1.2" stroke-opacity="0.70"/>
  <line x1="319" y1="198" x2="319" y2="194" stroke="#7b2fff" stroke-width="1.2" stroke-opacity="0.70"/>
  <line x1="311" y1="214" x2="311" y2="218" stroke="#7b2fff" stroke-width="1.2" stroke-opacity="0.70"/>
  <line x1="315" y1="214" x2="315" y2="218" stroke="#7b2fff" stroke-width="1.2" stroke-opacity="0.70"/>
  <line x1="319" y1="214" x2="319" y2="218" stroke="#7b2fff" stroke-width="1.2" stroke-opacity="0.70"/>

  <!-- Phase connectors (dashed segments) -->
  <line x1="120" y1="230" x2="154" y2="230" stroke="#e67e22" stroke-width="2" stroke-opacity="0.50" stroke-dasharray="4,3"/>
  <line x1="182" y1="230" x2="226" y2="230" stroke="#e67e22" stroke-width="2" stroke-opacity="0.50" stroke-dasharray="4,3"/>
  <line x1="254" y1="230" x2="299" y2="230" stroke="#e67e22" stroke-width="2" stroke-opacity="0.50" stroke-dasharray="4,3"/>

  <!-- Phase labels below baseline -->
  <text x="168" y="256" font-family="Arial, sans-serif" font-size="9" fill="#e67e22" text-anchor="middle" opacity="0.65">IoT</text>
  <text x="240" y="256" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6" text-anchor="middle" opacity="0.65">Cloud</text>
  <text x="315" y="256" font-family="Arial, sans-serif" font-size="9" fill="#7b2fff" text-anchor="middle" opacity="0.75">AI</text>

  <!-- CDO label -->
  <text x="200" y="362" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#e67e22" text-anchor="middle" opacity="0.85">CDO</text>

</svg>
