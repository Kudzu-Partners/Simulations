<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg159" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="wave159" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00bfff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg159)"/>

  <!-- Org chart hierarchy boxes -->
  <!-- Level 1: CTO (top) -->
  <rect x="162" y="55" width="76" height="36" rx="6" fill="#00bfff" opacity="0.25"/>
  <rect x="162" y="55" width="76" height="36" rx="6" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.85"/>
  <text x="200" y="78" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#00bfff" text-anchor="middle" opacity="0.9">CTO</text>

  <!-- Level 1 to 2 connectors -->
  <line x1="200" y1="91" x2="200" y2="115" stroke="#c0cfff" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="115" x2="280" y2="115" stroke="#c0cfff" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="115" x2="120" y2="130" stroke="#c0cfff" stroke-width="1.5" opacity="0.3"/>
  <line x1="200" y1="115" x2="200" y2="130" stroke="#c0cfff" stroke-width="1.5" opacity="0.3"/>
  <line x1="280" y1="115" x2="280" y2="130" stroke="#c0cfff" stroke-width="1.5" opacity="0.3"/>

  <!-- Level 2: 3 VPs -->
  <rect x="82" y="130" width="76" height="36" rx="6" fill="#00bfff" opacity="0.25"/>
  <rect x="82" y="130" width="76" height="36" rx="6" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.85"/>
  <text x="120" y="153" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.9">VP Ops</text>

  <rect x="162" y="130" width="76" height="36" rx="6" fill="#7b2fff" opacity="0.15"/>
  <rect x="162" y="130" width="76" height="36" rx="6" fill="none" stroke="#7b2fff" stroke-width="2" opacity="0.7"/>
  <text x="200" y="153" font-family="Arial,sans-serif" font-size="8" fill="#7b2fff" text-anchor="middle" opacity="0.85">VP Prod</text>

  <rect x="242" y="130" width="76" height="36" rx="6" fill="#00bfff" opacity="0.25"/>
  <rect x="242" y="130" width="76" height="36" rx="6" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.85"/>
  <text x="280" y="153" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.9">VP HR</text>

  <!-- Level 2 to 3 connectors -->
  <line x1="120" y1="166" x2="120" y2="190" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>
  <line x1="88" y1="190" x2="152" y2="190" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>
  <line x1="88" y1="190" x2="88" y2="202" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>
  <line x1="152" y1="190" x2="152" y2="202" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>

  <line x1="200" y1="166" x2="200" y2="202" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>

  <line x1="280" y1="166" x2="280" y2="190" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>
  <line x1="248" y1="190" x2="312" y2="190" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>
  <line x1="248" y1="190" x2="248" y2="202" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>
  <line x1="312" y1="190" x2="312" y2="202" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>

  <!-- Level 3: Manager boxes (some adopted = bright, some resistant = dim) -->
  <!-- Left branch -->
  <rect x="62" y="202" width="56" height="30" rx="5" fill="#00bfff" opacity="0.35"/>
  <rect x="62" y="202" width="56" height="30" rx="5" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.8"/>
  <text x="90" y="221" font-family="Arial,sans-serif" font-size="7" fill="#00bfff" text-anchor="middle" opacity="0.9">Mgr A</text>

  <rect x="126" y="202" width="56" height="30" rx="5" fill="#c0cfff" opacity="0.08"/>
  <rect x="126" y="202" width="56" height="30" rx="5" fill="none" stroke="#c0cfff" stroke-width="1" opacity="0.3"/>
  <text x="154" y="221" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.35">Mgr B</text>

  <!-- Center -->
  <rect x="172" y="202" width="56" height="30" rx="5" fill="#c0cfff" opacity="0.08"/>
  <rect x="172" y="202" width="56" height="30" rx="5" fill="none" stroke="#c0cfff" stroke-width="1" opacity="0.3"/>
  <text x="200" y="221" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.35">Mgr C</text>

  <!-- Right branch -->
  <rect x="222" y="202" width="56" height="30" rx="5" fill="#00bfff" opacity="0.35"/>
  <rect x="222" y="202" width="56" height="30" rx="5" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.8"/>
  <text x="250" y="221" font-family="Arial,sans-serif" font-size="7" fill="#00bfff" text-anchor="middle" opacity="0.9">Mgr D</text>

  <rect x="286" y="202" width="56" height="30" rx="5" fill="#c0cfff" opacity="0.08"/>
  <rect x="286" y="202" width="56" height="30" rx="5" fill="none" stroke="#c0cfff" stroke-width="1" opacity="0.3"/>
  <text x="314" y="221" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.35">Mgr E</text>

  <!-- AI ADOPTION WAVE — diagonal sweep from top-left to bottom-right -->
  <path d="M 50 80 Q 140 160 230 240 Q 280 290 350 350" fill="none" stroke="url(#wave159)" stroke-width="28" opacity="0.35" stroke-linecap="round"/>
  <path d="M 50 80 Q 140 160 230 240 Q 280 290 350 350" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.5" stroke-dasharray="8 5"/>

  <!-- Wave front label -->
  <text x="270" y="270" font-family="Arial,sans-serif" font-size="9" fill="#00bfff" text-anchor="middle" opacity="0.65" transform="rotate(45,270,270)">AI Wave</text>

  <!-- Resistance symbols on dark boxes -->
  <line x1="136" y1="209" x2="176" y2="229" stroke="#e74c3c" stroke-width="1.5" opacity="0.4"/>
  <line x1="176" y1="209" x2="136" y2="229" stroke="#e74c3c" stroke-width="1.5" opacity="0.4"/>
  <line x1="180" y1="209" x2="220" y2="229" stroke="#e74c3c" stroke-width="1.5" opacity="0.35"/>
  <line x1="220" y1="209" x2="180" y2="229" stroke="#e74c3c" stroke-width="1.5" opacity="0.35"/>
  <line x1="294" y1="209" x2="334" y2="229" stroke="#e74c3c" stroke-width="1.5" opacity="0.3"/>
  <line x1="334" y1="209" x2="294" y2="229" stroke="#e74c3c" stroke-width="1.5" opacity="0.3"/>

  <!-- Bottom label -->
  <text x="200" y="358" font-family="Arial,sans-serif" font-size="9" fill="#00bfff" text-anchor="middle" opacity="0.45" letter-spacing="1">AI CHANGE MANAGEMENT · INSURANCE</text>
</svg>
