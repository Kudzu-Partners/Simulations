<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg621" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#1b3a20"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg621)"/>

  <text x="200" y="56" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">EXPERIENTIAL · ECO-TOURISM</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Andean mountains + trail (protagonist) -->
    <g transform="translate(200,232)">
      <!-- Sky / sun -->
      <circle cx="-72" cy="-80" r="20" fill="#f5c842" opacity="0.85"/>

      <!-- Mountain back -->
      <path d="M -160 80 L -88 -32 L -24 32 L 24 -56 L 96 16 L 160 80 Z" fill="#52b788" opacity="0.85" stroke="#0a1f0a" stroke-width="2"/>
      <!-- Snow caps -->
      <path d="M -100 -16 L -88 -32 L -76 -16 Z" fill="#d8f3dc"/>
      <path d="M 12 -40 L 24 -56 L 36 -40 Z" fill="#d8f3dc"/>

      <!-- Mountain front -->
      <path d="M -160 80 L -56 -8 L 56 64 L 160 80 Z" fill="#1b3a20" stroke="#52b788" stroke-width="2.5"/>

      <!-- Trail / footpath -->
      <path d="M -32 80 Q -16 64 0 56 Q 16 48 32 32 Q 48 24 64 16"
            stroke="#f5c842" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>

      <!-- Person silhouette on trail -->
      <g transform="translate(0,56)">
        <circle cx="0" cy="-12" r="5" fill="#ffd166"/>
        <path d="M -6 0 Q 0 -6 6 0" fill="#ffd166"/>
      </g>

      <!-- Tree -->
      <g transform="translate(-120,40)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#1b3a20" stroke-width="2.5"/>
        <path d="M -12 -4 L 0 -24 L 12 -4 Z" fill="#52b788" stroke="#0a1f0a" stroke-width="1.5"/>
        <path d="M -10 -16 L 0 -36 L 10 -16 Z" fill="#52b788" stroke="#0a1f0a" stroke-width="1.5"/>
      </g>
      <g transform="translate(116,40)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#1b3a20" stroke-width="2.5"/>
        <path d="M -10 -4 L 0 -20 L 10 -4 Z" fill="#52b788" stroke="#0a1f0a" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Heart badge top-left -->
    <g transform="translate(48,84)">
      <rect width="56" height="26" rx="4" fill="#ff6b9d" fill-opacity="0.18" stroke="#ff6b9d" stroke-width="1.5"/>
      <path d="M 28 22 C 20 18 12 12 16 6 C 20 2 28 6 28 10 C 28 6 36 2 40 6 C 44 12 36 18 28 22 Z"
            fill="#ff6b9d"/>
    </g>

    <!-- ECO badge top-right -->
    <g transform="translate(288,84)">
      <rect width="64" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#52b788" font-size="11" font-family="monospace" font-weight="bold">ECO</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#d8f3dc" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Andes · Tourism · CO</text>
</svg>
