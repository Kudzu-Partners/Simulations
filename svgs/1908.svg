<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg1908" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122c38"/>
      <stop offset="100%" stop-color="#1f4d5e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg1908)"/>

  <!-- Sprint loop (agile) -->
  <path d="M 148,128 A 60,60 0 1 1 88,188" fill="none" stroke="#f2a950" stroke-width="6" stroke-linecap="round"/>
  <polygon points="78,196 92,172 106,194" fill="#f2a950"/>
  <circle cx="148" cy="128" r="7" fill="#f2a950"/>
  <!-- Flow arrow (lean) -->
  <line x1="70" y1="300" x2="310" y2="300" stroke="#7fd8c4" stroke-width="6" stroke-linecap="round"/>
  <polygon points="306,286 334,300 306,314" fill="#7fd8c4"/>
  <!-- Kanban cards riding the flow -->
  <rect x="102" y="278" width="34" height="22" rx="4" fill="#e6f2ee" fill-opacity="0.35"/>
  <rect x="168" y="278" width="34" height="22" rx="4" fill="#e6f2ee" fill-opacity="0.55"/>
  <rect x="234" y="278" width="34" height="22" rx="4" fill="#e6f2ee" fill-opacity="0.75"/>
  <!-- Decision diamond between them -->
  <rect x="222" y="128" width="76" height="76" rx="10" transform="rotate(45 260 166)" fill="none" stroke="#e6f2ee" stroke-width="3" stroke-opacity="0.7"/>
  <text x="260" y="176" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#e6f2ee" text-anchor="middle" opacity="0.9">?</text>
  <!-- Connectors -->
  <line x1="196" y1="166" x2="160" y2="166" stroke="#e6f2ee" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="5 5"/>
  <line x1="260" y1="220" x2="260" y2="272" stroke="#e6f2ee" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="5 5"/>

</svg>
