<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg61" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <linearGradient id="king61" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#c89a10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg61)"/>
  <!-- Map grid -->
  <g opacity="0.12" stroke="#c0cfff" stroke-width="1">
    <line x1="50" y1="110" x2="350" y2="110"/>
    <line x1="50" y1="160" x2="350" y2="160"/>
    <line x1="50" y1="210" x2="350" y2="210"/>
    <line x1="50" y1="260" x2="350" y2="260"/>
    <line x1="50" y1="310" x2="350" y2="310"/>
    <line x1="110" y1="70" x2="110" y2="345"/>
    <line x1="160" y1="70" x2="160" y2="345"/>
    <line x1="210" y1="70" x2="210" y2="345"/>
    <line x1="260" y1="70" x2="260" y2="345"/>
    <line x1="310" y1="70" x2="310" y2="345"/>
  </g>
  <!-- Risk zones (red = high, orange = medium, yellow = low) -->
  <circle cx="135" cy="195" r="34" fill="#e74c3c" opacity="0.2"/>
  <circle cx="135" cy="195" r="20" fill="#e74c3c" opacity="0.3"/>
  <circle cx="135" cy="195" r="8" fill="#e74c3c" opacity="0.7"/>
  <circle cx="285" cy="255" r="24" fill="#e67e22" opacity="0.2"/>
  <circle cx="285" cy="255" r="13" fill="#e67e22" opacity="0.35"/>
  <circle cx="285" cy="255" r="5" fill="#e67e22" opacity="0.7"/>
  <circle cx="215" cy="300" r="18" fill="#f5c842" opacity="0.25"/>
  <circle cx="215" cy="300" r="9" fill="#f5c842" opacity="0.4"/>
  <!-- Dashed lines from king to risk zones -->
  <line x1="200" y1="185" x2="147" y2="200" stroke="#f5c842" stroke-width="1.5" opacity="0.45" stroke-dasharray="5,4"/>
  <line x1="200" y1="185" x2="273" y2="252" stroke="#f5c842" stroke-width="1.5" opacity="0.45" stroke-dasharray="5,4"/>
  <line x1="200" y1="185" x2="215" y2="291" stroke="#f5c842" stroke-width="1.5" opacity="0.45" stroke-dasharray="5,4"/>
  <!-- Chess king piece -->
  <g transform="translate(200,80)">
    <rect x="-24" y="75" width="48" height="11" rx="4" fill="url(#king61)"/>
    <rect x="-17" y="38" width="34" height="40" rx="3" fill="url(#king61)"/>
    <rect x="-9" y="26" width="18" height="14" rx="2" fill="url(#king61)"/>
    <rect x="-4" y="6" width="8" height="24" rx="2" fill="url(#king61)"/>
    <rect x="-13" y="13" width="26" height="7" rx="2" fill="url(#king61)"/>
  </g>
</svg>
