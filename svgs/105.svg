<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg105" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2c5f8a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg105)"/>
  <!-- Queue line of customers (left) feeding multiple servers (right) -->
  <!-- Queue path -->
  <path d="M40 280 Q40 230 100 230 Q160 230 160 200" fill="none" stroke="#dfe6e9" stroke-width="2" stroke-dasharray="3,4" opacity="0.5"/>
  <!-- Customers waiting (heads in line) -->
  <g>
    <g transform="translate(50 280)"><circle cx="0" cy="0" r="11" fill="#74b9ff"/><path d="M-13 18 Q0 8 13 18 L13 26 L-13 26 Z" fill="#74b9ff"/></g>
    <g transform="translate(50 248)"><circle cx="0" cy="0" r="11" fill="#74b9ff" opacity="0.85"/><path d="M-13 18 Q0 8 13 18 L13 26 L-13 26 Z" fill="#74b9ff" opacity="0.85"/></g>
    <g transform="translate(78 230)"><circle cx="0" cy="0" r="11" fill="#74b9ff" opacity="0.75"/><path d="M-13 18 Q0 8 13 18 L13 26 L-13 26 Z" fill="#74b9ff" opacity="0.75"/></g>
    <g transform="translate(110 230)"><circle cx="0" cy="0" r="11" fill="#74b9ff" opacity="0.6"/><path d="M-13 18 Q0 8 13 18 L13 26 L-13 26 Z" fill="#74b9ff" opacity="0.6"/></g>
    <g transform="translate(140 230)"><circle cx="0" cy="0" r="11" fill="#74b9ff" opacity="0.45"/><path d="M-13 18 Q0 8 13 18 L13 26 L-13 26 Z" fill="#74b9ff" opacity="0.45"/></g>
  </g>
  <!-- Split point -->
  <circle cx="190" cy="200" r="6" fill="#f5c842"/>
  <!-- Lines to 3 servers -->
  <g stroke="#f5c842" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M190 200 L290 110"/>
    <path d="M190 200 L290 200"/>
    <path d="M190 200 L290 290"/>
  </g>
  <!-- Three servers (counters) -->
  <g>
    <g transform="translate(320 110)">
      <rect x="-32" y="-22" width="64" height="44" rx="6" fill="#dfe6e9" stroke="#1a3a5c" stroke-width="2"/>
      <rect x="-32" y="-22" width="64" height="14" rx="6" fill="#74b9ff"/>
      <circle cx="0" cy="-6" r="6" fill="#1a3a5c"/>
      <rect x="-10" y="2" width="20" height="14" rx="3" fill="#1a3a5c"/>
    </g>
    <g transform="translate(320 200)">
      <rect x="-32" y="-22" width="64" height="44" rx="6" fill="#dfe6e9" stroke="#1a3a5c" stroke-width="2"/>
      <rect x="-32" y="-22" width="64" height="14" rx="6" fill="#74b9ff"/>
      <circle cx="0" cy="-6" r="6" fill="#1a3a5c"/>
      <rect x="-10" y="2" width="20" height="14" rx="3" fill="#1a3a5c"/>
    </g>
    <g transform="translate(320 290)">
      <rect x="-32" y="-22" width="64" height="44" rx="6" fill="#dfe6e9" stroke="#1a3a5c" stroke-width="2"/>
      <rect x="-32" y="-22" width="64" height="14" rx="6" fill="#74b9ff"/>
      <circle cx="0" cy="-6" r="6" fill="#1a3a5c"/>
      <rect x="-10" y="2" width="20" height="14" rx="3" fill="#1a3a5c"/>
    </g>
  </g>
  <!-- ρ utilization meter on top -->
  <g transform="translate(60 70)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f5c842">ρ</text>
    <rect x="32" y="-20" width="240" height="14" rx="7" fill="#1a3a5c" stroke="#dfe6e9" stroke-width="1.5"/>
    <rect x="32" y="-20" width="180" height="14" rx="7" fill="#f5c842" opacity="0.85"/>
    <line x1="232" y1="-26" x2="232" y2="2" stroke="#e74c3c" stroke-width="2"/>
  </g>
</svg>
