<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg186" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#6a0572"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg186)"/>

  <!-- Marketing funnel (trapezoids) -->
  <!-- Stage 1: Awareness (top, wide) -->
  <path d="M 55 68 L 345 68 L 310 118 L 90 118 Z" fill="#ff6b9d" opacity="0.15"/>
  <path d="M 55 68 L 345 68 L 310 118 L 90 118 Z" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="98" font-family="Arial,sans-serif" font-size="10" fill="#ff6b9d" text-anchor="middle" opacity="0.85">Awareness</text>

  <!-- Stage 2: Interest -->
  <path d="M 90 124 L 310 124 L 278 170 L 122 170 Z" fill="#ff6b9d" opacity="0.18"/>
  <path d="M 90 124 L 310 124 L 278 170 L 122 170 Z" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="152" font-family="Arial,sans-serif" font-size="9" fill="#ffd166" text-anchor="middle" opacity="0.85">Interest</text>

  <!-- Stage 3: Intent -->
  <path d="M 122 176 L 278 176 L 248 220 L 152 220 Z" fill="#ff6b9d" opacity="0.22"/>
  <path d="M 122 176 L 278 176 L 248 220 L 152 220 Z" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.65"/>
  <text x="200" y="203" font-family="Arial,sans-serif" font-size="9" fill="#ffd166" text-anchor="middle" opacity="0.9">Intent</text>

  <!-- Stage 4: Purchase (narrow) -->
  <path d="M 152 226 L 248 226 L 224 265 L 176 265 Z" fill="#ff6b9d" opacity="0.28"/>
  <path d="M 152 226 L 248 226 L 224 265 L 176 265 Z" fill="none" stroke="#ffd166" stroke-width="2" opacity="0.75"/>
  <text x="200" y="250" font-family="Arial,sans-serif" font-size="9" fill="#ffd166" text-anchor="middle" opacity="0.95">Purchase</text>

  <!-- Channel icons feeding into top of funnel (left) -->
  <!-- Instagram -->
  <rect x="28" y="72" width="24" height="24" rx="6" fill="#ff6b9d" opacity="0.3"/>
  <rect x="28" y="72" width="24" height="24" rx="6" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.7"/>
  <circle cx="40" cy="84" r="5" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.8"/>
  <circle cx="45" cy="78" r="2" fill="#ff6b9d" opacity="0.8"/>
  <!-- Arrow -->
  <line x1="52" y1="84" x2="68" y2="88" stroke="#ff6b9d" stroke-width="1.5" opacity="0.5"/>

  <!-- TikTok -->
  <rect x="28" y="102" width="24" height="24" rx="6" fill="#ffd166" opacity="0.25"/>
  <rect x="28" y="102" width="24" height="24" rx="6" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.65"/>
  <text x="40" y="118" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffd166" text-anchor="middle" opacity="0.8">TT</text>
  <line x1="52" y1="114" x2="72" y2="110" stroke="#ffd166" stroke-width="1.5" opacity="0.45"/>

  <!-- iOS Privacy wall (cutting channels on right) -->
  <rect x="328" y="62" width="18" height="120" rx="3" fill="#e74c3c" opacity="0.15"/>
  <rect x="328" y="62" width="18" height="120" rx="3" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="337" y="128" font-family="Arial,sans-serif" font-size="7" fill="#e74c3c" text-anchor="middle" opacity="0.75" transform="rotate(90,337,128)">iOS Privacy</text>
  <!-- X marks showing blocked attribution -->
  <line x1="322" y1="80" x2="310" y2="92" stroke="#e74c3c" stroke-width="2" opacity="0.6"/>
  <line x1="310" y1="80" x2="322" y2="92" stroke="#e74c3c" stroke-width="2" opacity="0.6"/>
  <line x1="322" y1="105" x2="310" y2="117" stroke="#e74c3c" stroke-width="1.5" opacity="0.5"/>
  <line x1="310" y1="105" x2="322" y2="117" stroke="#e74c3c" stroke-width="1.5" opacity="0.5"/>

  <!-- Attribution model (dotted lines from purchase back up) -->
  <line x1="200" y1="265" x2="200" y2="280" stroke="#ffd166" stroke-width="2" opacity="0.5"/>
  <!-- Multi-touch attribution lines -->
  <path d="M 190 280 Q 140 260 100 200 Q 80 165 90 124" fill="none" stroke="#ffd166" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 200 280 Q 200 270 180 240 Q 155 210 140 176" fill="none" stroke="#ffd166" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <text x="100" y="285" font-family="Arial,sans-serif" font-size="8" fill="#ffd166" text-anchor="middle" opacity="0.55">Multi-touch attribution</text>

  <!-- A/B test badge -->
  <rect x="154" y="295" width="92" height="22" rx="11" fill="#ff6b9d" opacity="0.15"/>
  <rect x="154" y="295" width="92" height="22" rx="11" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="310" font-family="Arial,sans-serif" font-size="9" fill="#ff6b9d" text-anchor="middle" opacity="0.8">A/B Testing</text>

  <!-- Brand vs Performance label -->
  <text x="200" y="350" font-family="Arial,sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.4">Brand Building ↔ Performance</text>
  <text x="200" y="366" font-family="Arial,sans-serif" font-size="9" fill="#ffd166" text-anchor="middle" opacity="0.4" letter-spacing="1">D2C BEAUTY · CMO LAB</text>
</svg>
