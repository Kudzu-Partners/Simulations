<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg136" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <radialGradient id="sigmaGlow136" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e67e22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg136)"/>
  <rect width="400" height="400" rx="32" fill="url(#sigmaGlow136)"/>

  <!-- Sigma symbol — large background watermark -->
  <text x="200" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="210" font-weight="bold"
        fill="#e67e22" opacity="0.07">σ</text>

  <!-- ── SPC Control Chart ── -->
  <!-- Chart area -->
  <rect x="52" y="85" width="296" height="210" rx="4" fill="#ffffff" opacity="0.03" stroke="#95a5a6" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Y axis -->
  <line x1="72" y1="80" x2="72" y2="305" stroke="#95a5a6" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <!-- X axis -->
  <line x1="72" y1="305" x2="358" y2="305" stroke="#95a5a6" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

  <!-- UCL line (Upper Control Limit) -->
  <line x1="72" y1="118" x2="355" y2="118" stroke="#e67e22" stroke-width="1.8" stroke-dasharray="7,4" opacity="0.85"/>
  <text x="358" y="122" font-family="'Courier New',monospace" font-size="9" fill="#e67e22" opacity="0.8">UCL</text>

  <!-- CL line (Center Line / mean) -->
  <line x1="72" y1="195" x2="355" y2="195" stroke="#95a5a6" stroke-width="1.5" opacity="0.55"/>
  <text x="358" y="199" font-family="'Courier New',monospace" font-size="9" fill="#95a5a6" opacity="0.7">CL</text>

  <!-- LCL line (Lower Control Limit) -->
  <line x1="72" y1="272" x2="355" y2="272" stroke="#e67e22" stroke-width="1.8" stroke-dasharray="7,4" opacity="0.85"/>
  <text x="358" y="276" font-family="'Courier New',monospace" font-size="9" fill="#e67e22" opacity="0.8">LCL</text>

  <!-- Data points (process measurements) — in-control -->
  <!-- Points at x: 100, 128, 156, 184, 212, 240, 268, 296, 324 -->
  <!-- Y values vary around CL=195: normal variation within UCL=118, LCL=272 -->
  <polyline
    points="100,182 128,210 156,168 184,220 212,192 240,178 268,215 296,200"
    fill="none" stroke="#e67e22" stroke-width="2" stroke-opacity="0.7" stroke-linejoin="round"/>

  <circle cx="100" cy="182" r="5.5" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <circle cx="128" cy="210" r="5.5" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <circle cx="156" cy="168" r="5.5" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <circle cx="184" cy="220" r="5.5" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <circle cx="212" cy="192" r="5.5" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <circle cx="240" cy="178" r="5.5" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <circle cx="268" cy="215" r="5.5" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <circle cx="296" cy="200" r="5.5" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>

  <!-- OUT OF CONTROL point (defect — above UCL) -->
  <line x1="296" y1="200" x2="324" y2="92" stroke="#e67e22" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="324" cy="92" r="8" fill="#e67e22" opacity="0.9"/>
  <circle cx="324" cy="92" r="14" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.45"/>
  <circle cx="324" cy="92" r="20" fill="none" stroke="#e67e22" stroke-width="1" opacity="0.22"/>

  <!-- Root cause arrow from outlier -->
  <line x1="332" y1="86" x2="350" y2="72" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- ── DMAIC stage markers (bottom, 5 dots) ── -->
  <g transform="translate(0,335)">
    <!-- D -->
    <circle cx="104" cy="0" r="14" fill="#1c2333" stroke="#e67e22" stroke-width="2"/>
    <text x="104" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#e67e22">D</text>
    <!-- M -->
    <circle cx="152" cy="0" r="14" fill="#1c2333" stroke="#e67e22" stroke-width="2"/>
    <text x="152" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#e67e22">M</text>
    <!-- A -->
    <circle cx="200" cy="0" r="14" fill="#1c2333" stroke="#e67e22" stroke-width="2"/>
    <text x="200" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#e67e22">A</text>
    <!-- I -->
    <circle cx="248" cy="0" r="14" fill="#1c2333" stroke="#e67e22" stroke-width="2"/>
    <text x="248" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#e67e22">I</text>
    <!-- C — highlighted (control phase) -->
    <circle cx="296" cy="0" r="14" fill="#e67e22" stroke="#e67e22" stroke-width="2"/>
    <text x="296" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#1c2333">C</text>
    <!-- connectors -->
    <line x1="118" y1="0" x2="138" y2="0" stroke="#e67e22" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="166" y1="0" x2="186" y2="0" stroke="#e67e22" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="214" y1="0" x2="234" y2="0" stroke="#e67e22" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="262" y1="0" x2="282" y2="0" stroke="#e67e22" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Top label -->
  <text x="200" y="58" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#95a5a6" opacity="0.6" letter-spacing="2">STATISTICAL PROCESS CONTROL</text>
</svg>
