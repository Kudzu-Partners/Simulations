<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg287" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2d1b4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg287)"/>

  <!-- 4 quadrant grid -->
  <line x1="200" y1="48" x2="200" y2="352" stroke="#e040fb" stroke-width="2" opacity="0.3"/>
  <line x1="48" y1="200" x2="352" y2="200" stroke="#e040fb" stroke-width="2" opacity="0.3"/>

  <!-- Q1: Product (top-left) - package icon -->
  <g transform="translate(124,124)">
    <rect x="-52" y="-52" width="104" height="104" rx="14" fill="#1a1040" stroke="#74b9ff" stroke-width="2"/>
    <!-- Box icon -->
    <rect x="-24" y="-18" width="48" height="38" rx="4" fill="#74b9ff" opacity="0.8"/>
    <line x1="-24" y1="-4" x2="24" y2="-4" stroke="#1a1040" stroke-width="3"/>
    <line x1="0" y1="-18" x2="0" y2="-4" stroke="#1a1040" stroke-width="3"/>
    <!-- Label dot -->
    <circle cx="28" cy="-26" r="7" fill="#74b9ff"/>
  </g>

  <!-- Q2: Price (top-right) - coin/dollar icon -->
  <g transform="translate(276,124)">
    <rect x="-52" y="-52" width="104" height="104" rx="14" fill="#0a1f10" stroke="#00ff88" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#00ff88" stroke-width="3.5"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>
    <line x1="-14" y1="-8" x2="14" y2="-8" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <line x1="-14" y1="8" x2="14" y2="8" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Q3: Place (bottom-left) - map pin icon -->
  <g transform="translate(124,276)">
    <rect x="-52" y="-52" width="104" height="104" rx="14" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <circle cx="0" cy="-8" r="20" fill="#f5c842" opacity="0.85"/>
    <path d="M 0 12 L -14 -8 L 14 -8 Z" fill="#f5c842" opacity="0.85"/>
    <circle cx="0" cy="-8" r="8" fill="#1a1200"/>
  </g>

  <!-- Q4: Promotion (bottom-right) - megaphone icon -->
  <g transform="translate(276,276)">
    <rect x="-52" y="-52" width="104" height="104" rx="14" fill="#1a0a2e" stroke="#e040fb" stroke-width="2"/>
    <!-- Megaphone -->
    <path d="M -8 -14 L 24 -26 L 24 26 L -8 14 Z" fill="#e040fb" opacity="0.85"/>
    <rect x="-24" y="-12" width="18" height="24" rx="4" fill="#e040fb" opacity="0.7"/>
    <!-- Sound waves -->
    <path d="M 28 -14 Q 38 0 28 14" stroke="#e040fb" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 32 -22 Q 46 0 32 22" stroke="#e040fb" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Center node -->
  <circle cx="200" cy="200" r="14" fill="#e040fb" opacity="0.9"/>
  <circle cx="200" cy="200" r="22" fill="none" stroke="#e040fb" stroke-width="2" opacity="0.4"/>
</svg>
