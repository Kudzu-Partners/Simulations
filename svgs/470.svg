<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg470" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg470)"/>

  <text x="200" y="58" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">CAFTA-DR · TARIFF · NEARSHORE</text>

  <!-- CONTAINER stack (hero, central) -->
  <g transform="translate(200,235)">
    <!-- shadow -->
    <ellipse cx="0" cy="68" rx="115" ry="8" fill="#000" fill-opacity="0.45"/>
    <!-- bottom row -->
    <g stroke="#1a2744" stroke-width="1.5">
      <rect x="-90" y="20" width="60" height="44" fill="#52b788"/>
      <rect x="-30" y="20" width="60" height="44" fill="#f5c842"/>
      <rect x="30" y="20" width="60" height="44" fill="#c0392b"/>
    </g>
    <!-- top row -->
    <g stroke="#1a2744" stroke-width="1.5">
      <rect x="-60" y="-24" width="60" height="44" fill="#7b2fff"/>
      <rect x="0" y="-24" width="60" height="44" fill="#00bfff"/>
    </g>
    <!-- container details (ridges) -->
    <g stroke="#1a2744" stroke-width="0.6" opacity="0.55">
      <line x1="-75" y1="25" x2="-75" y2="59"/>
      <line x1="-60" y1="25" x2="-60" y2="59"/>
      <line x1="-45" y1="25" x2="-45" y2="59"/>
      <line x1="-15" y1="25" x2="-15" y2="59"/>
      <line x1="0" y1="25" x2="0" y2="59"/>
      <line x1="15" y1="25" x2="15" y2="59"/>
      <line x1="45" y1="25" x2="45" y2="59"/>
      <line x1="60" y1="25" x2="60" y2="59"/>
      <line x1="75" y1="25" x2="75" y2="59"/>
      <line x1="-45" y1="-19" x2="-45" y2="15"/>
      <line x1="-30" y1="-19" x2="-30" y2="15"/>
      <line x1="-15" y1="-19" x2="-15" y2="15"/>
      <line x1="15" y1="-19" x2="15" y2="15"/>
      <line x1="30" y1="-19" x2="30" y2="15"/>
      <line x1="45" y1="-19" x2="45" y2="15"/>
    </g>
  </g>

  <!-- TARIFF stamp on containers (overlapping) -->
  <g transform="translate(200,180) rotate(-10)">
    <rect x="-50" y="-14" width="100" height="28" rx="3" fill="#ff6b6b" fill-opacity="0.85" stroke="#fff" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#fff" font-size="14" font-family="monospace" font-weight="bold">+$ TARIFF</text>
  </g>

  <!-- CAFTA badge (top-left) -->
  <g transform="translate(55,90)">
    <rect x="0" y="0" width="68" height="28" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.3"/>
    <text x="34" y="14" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" font-weight="bold">CAFTA-DR</text>
    <text x="34" y="22" text-anchor="middle" fill="#52b788" font-size="5" font-family="monospace" opacity="0.85">trade pact</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,90)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Cuota · CAFTA-DR · HN Textil</text>
</svg>
