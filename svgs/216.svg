<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg216" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <radialGradient id="glow216" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b2fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ctrl216" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2058"/>
      <stop offset="100%" stop-color="#150a2e"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg216)"/>
  <rect width="400" height="400" rx="32" fill="url(#glow216)"/>

  <!-- ── Game controller ── -->
  <g transform="translate(200, 220)">
    <!-- Main body (peanut shape) -->
    <path d="M -110 0
             Q -120 -36 -82 -42
             L -38 -42
             Q -22 -42 -10 -32
             Q 0 -28 10 -32
             Q 22 -42 38 -42
             L 82 -42
             Q 120 -36 110 0
             Q 100 36 70 38
             Q 52 38 42 22
             L 32 6
             Q 18 -6 0 -6
             Q -18 -6 -32 6
             L -42 22
             Q -52 38 -70 38
             Q -100 36 -110 0 Z"
          fill="url(#ctrl216)" stroke="#00bfff" stroke-width="2.5"/>
    <path d="M -110 0
             Q -120 -36 -82 -42
             L -38 -42
             Q -22 -42 -10 -32
             Q 0 -28 10 -32
             Q 22 -42 38 -42
             L 82 -42
             Q 120 -36 110 0
             Q 100 36 70 38
             Q 52 38 42 22
             L 32 6
             Q 18 -6 0 -6
             Q -18 -6 -32 6
             L -42 22
             Q -52 38 -70 38
             Q -100 36 -110 0 Z"
          fill="none" stroke="#00bfff" stroke-width="0.8" opacity="0.4" transform="scale(0.92)"/>

    <!-- D-pad (left) -->
    <g transform="translate(-72, -10)">
      <rect x="-3" y="-12" width="6" height="24" rx="1" fill="#00bfff" opacity="0.85"/>
      <rect x="-12" y="-3" width="24" height="6" rx="1" fill="#00bfff" opacity="0.85"/>
      <circle r="2" fill="#0a0f1e"/>
    </g>

    <!-- ABXY buttons (right, diamond) -->
    <g transform="translate(72, -10)">
      <circle cx="0"   cy="-12" r="6" fill="#ffd166" opacity="0.95"/>
      <text x="0" y="-9" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#1a1a2e">Y</text>
      <circle cx="-12" cy="0"   r="6" fill="#7b2fff" opacity="0.95"/>
      <text x="-12" y="3" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fff">X</text>
      <circle cx="12"  cy="0"   r="6" fill="#ff6b9d" opacity="0.95"/>
      <text x="12" y="3" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fff">B</text>
      <circle cx="0"   cy="12"  r="6" fill="#52b788" opacity="0.95"/>
      <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fff">A</text>
    </g>

    <!-- Sticks -->
    <g transform="translate(-30, 16)">
      <circle r="14" fill="#0a0f1e" stroke="#00bfff" stroke-width="1.5" opacity="0.95"/>
      <circle r="9" fill="url(#ctrl216)" stroke="#a572ff" stroke-width="1.2"/>
    </g>
    <g transform="translate(30, 16)">
      <circle r="14" fill="#0a0f1e" stroke="#00bfff" stroke-width="1.5" opacity="0.95"/>
      <circle r="9" fill="url(#ctrl216)" stroke="#a572ff" stroke-width="1.2"/>
    </g>

    <!-- Center logo / power -->
    <circle cy="-22" r="6" fill="#0a0f1e" stroke="#a572ff" stroke-width="1.5"/>
    <circle cy="-22" r="2" fill="#a572ff"/>
  </g>

  <!-- ── XP / Level bar (top) ── -->
  <g transform="translate(40, 60)">
    <text y="-4" font-family="'Courier New',monospace" font-size="8" fill="#a572ff" opacity="0.85" letter-spacing="2">LIVE OPS</text>
    <rect x="0" y="0" width="320" height="14" rx="7" fill="#1a1a2e" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.55"/>
    <rect x="2" y="2" width="220" height="10" rx="5" fill="#7b2fff" opacity="0.85"/>
    <!-- XP markers -->
    <line x1="80" y1="0" x2="80" y2="14" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="160" y1="0" x2="160" y2="14" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="240" y1="0" x2="240" y2="14" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="320" y="-4" text-anchor="end" font-family="'Courier New',monospace" font-size="8" fill="#00ff88" opacity="0.95">LVL 12</text>
  </g>

  <!-- ── Game tiles / portfolio (top-left & top-right) ── -->
  <g transform="translate(36, 100)">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#7b2fff" opacity="0.7" stroke="#a572ff" stroke-width="1.2"/>
    <text x="25" y="29" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff" opacity="0.95">★</text>
    <text x="25" y="40" text-anchor="middle" font-family="'Courier New',monospace" font-size="6" fill="#fff">RPG</text>
  </g>
  <g transform="translate(96, 110)">
    <rect x="0" y="0" width="42" height="42" rx="5" fill="#ff6b9d" opacity="0.6" stroke="#ff6b9d" stroke-width="1"/>
    <polygon points="14,12 14,30 30,21" fill="#fff" opacity="0.95"/>
    <text x="21" y="38" text-anchor="middle" font-family="'Courier New',monospace" font-size="6" fill="#fff">FPS</text>
  </g>

  <g transform="translate(280, 108)">
    <rect x="0" y="0" width="46" height="46" rx="5" fill="#52b788" opacity="0.6" stroke="#52b788" stroke-width="1"/>
    <text x="23" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff" opacity="0.95">⚔</text>
    <text x="23" y="39" text-anchor="middle" font-family="'Courier New',monospace" font-size="6" fill="#fff">MOBA</text>
  </g>
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="38" height="38" rx="5" fill="#ffd166" opacity="0.55" stroke="#ffd166" stroke-width="1"/>
    <text x="19" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a2e" opacity="0.95">♟</text>
  </g>

  <!-- ── Monetization stack (bottom-right) ── -->
  <g transform="translate(295, 290)">
    <rect x="0" y="0"  width="60" height="14" rx="3" fill="#7b2fff" opacity="0.7"/>
    <text x="30" y="11" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#fff">PREMIUM</text>
    <rect x="0" y="18" width="60" height="14" rx="3" fill="#a572ff" opacity="0.6"/>
    <text x="30" y="29" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#fff">SEASON</text>
    <rect x="0" y="36" width="60" height="14" rx="3" fill="#a572ff" opacity="0.45"/>
    <text x="30" y="47" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#fff">F2P</text>
  </g>

  <!-- ── eSports trophy (bottom-left) ── -->
  <g transform="translate(70, 310)">
    <path d="M -10 -16 L -10 -8 Q -10 6 0 8 Q 10 6 10 -8 L 10 -16 Z" fill="#ffd166" stroke="#f5c842" stroke-width="1.2"/>
    <path d="M -16 -14 Q -20 -8 -14 -6 L -10 -6 L -10 -14 Z" fill="#ffd166" opacity="0.85"/>
    <path d="M 16 -14 Q 20 -8 14 -6 L 10 -6 L 10 -14 Z" fill="#ffd166" opacity="0.85"/>
    <rect x="-8" y="8" width="16" height="4" fill="#f5c842"/>
    <rect x="-12" y="12" width="24" height="4" rx="1" fill="#f5c842"/>
    <text y="32" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#ffd166" opacity="0.85">ESPORTS</text>
  </g>

  <text x="200" y="380" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#a572ff" opacity="0.4" letter-spacing="2">GAMING STUDIO</text>
</svg>
