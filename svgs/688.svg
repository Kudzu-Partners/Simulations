<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg688" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg688)"/>

  <text x="200" y="56" text-anchor="middle" fill="#74b9ff" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">WATER SCARCITY · AGRO</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Water drop with crack (protagonist) -->
    <g transform="translate(200,200)">
      <!-- Drop -->
      <path d="M 0 88 C -56 56 -72 8 -56 -32 C -32 -64 0 -88 0 -88 C 0 -88 32 -64 56 -32 C 72 8 56 56 0 88 Z"
            fill="#74b9ff" stroke="#dfe6e9" stroke-width="3.5"/>
      <!-- Highlight -->
      <ellipse cx="-16" cy="-20" rx="6" ry="14" fill="#dfe6e9" opacity="0.65"/>

      <!-- Crack across drop (scarcity) -->
      <path d="M -40 -16 L -16 8 L -28 24 L 8 36 L -4 64"
            stroke="#1a3a5c" stroke-width="4"/>

      <!-- Wheat stalks emerging from drop bottom -->
      <g transform="translate(-32,72)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#f5c842" stroke-width="2.5"/>
        <ellipse cx="-3" cy="2" rx="3" ry="6" fill="#f5c842" transform="rotate(-20,-3,2)"/>
        <ellipse cx="3" cy="2" rx="3" ry="6" fill="#f5c842" transform="rotate(20,3,2)"/>
      </g>
      <g transform="translate(32,72)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#f5c842" stroke-width="2.5"/>
        <ellipse cx="-3" cy="2" rx="3" ry="6" fill="#f5c842" transform="rotate(-20,-3,2)"/>
        <ellipse cx="3" cy="2" rx="3" ry="6" fill="#f5c842" transform="rotate(20,3,2)"/>
      </g>
    </g>

    <!-- H2O badge top-left -->
    <g transform="translate(48,84)">
      <rect width="68" height="26" rx="4" fill="#74b9ff" fill-opacity="0.18" stroke="#74b9ff" stroke-width="1.5"/>
      <text x="34" y="18" text-anchor="middle" fill="#74b9ff" font-size="11" font-family="monospace" font-weight="bold">H₂O ↓</text>
    </g>

    <!-- Crop badge top-right -->
    <g transform="translate(284,84)">
      <rect width="68" height="26" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.5"/>
      <text x="34" y="18" text-anchor="middle" fill="#f5c842" font-size="11" font-family="monospace" font-weight="bold">CROP</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#dfe6e9" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Agro · Water Economics · CO</text>
</svg>
