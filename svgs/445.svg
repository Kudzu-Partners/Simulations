<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg445" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1f08"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="cup445" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5a3210"/>
      <stop offset="100%" stop-color="#2a1505"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg445)"/>

  <text x="200" y="58" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">MARKET ENTRY · PREMIUM COFFEE</text>

  <!-- WORLD MAP DOTS (background) -->
  <g opacity="0.55">
    <circle cx="80" cy="105" r="3" fill="#52b788"/>
    <circle cx="100" cy="120" r="3" fill="#52b788"/>
    <circle cx="290" cy="105" r="3" fill="#52b788"/>
    <circle cx="320" cy="120" r="3" fill="#52b788"/>
    <circle cx="340" cy="295" r="3" fill="#52b788"/>
    <circle cx="60" cy="280" r="3" fill="#52b788"/>
    <line x1="200" y1="200" x2="80" y2="105" stroke="#f5c842" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="200" y1="200" x2="290" y2="105" stroke="#f5c842" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="200" y1="200" x2="340" y2="295" stroke="#f5c842" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="200" y1="200" x2="60" y2="280" stroke="#f5c842" stroke-width="0.8" stroke-dasharray="3,3"/>
  </g>

  <!-- COFFEE CUP (hero, central) -->
  <g transform="translate(200,225)">
    <!-- steam wisps -->
    <g fill="none" stroke="#c0cfff" stroke-width="2" stroke-linecap="round" opacity="0.65">
      <path d="M -16 -65 q -5 -10 2 -16 q 5 -8 -2 -16"/>
      <path d="M 0 -68 q 5 -10 -2 -16 q -5 -8 2 -16"/>
      <path d="M 16 -65 q -5 -10 2 -16 q 5 -8 -2 -16"/>
    </g>
    <!-- saucer -->
    <ellipse cx="0" cy="65" rx="80" ry="14" fill="#5a3210" stroke="#3d1f08" stroke-width="2"/>
    <ellipse cx="0" cy="62" rx="75" ry="10" fill="#7a4a18" stroke="#3d1f08" stroke-width="1.2"/>
    <!-- cup body -->
    <path d="M -45 -40 Q -50 30 -20 55 L 20 55 Q 50 30 45 -40 Z" fill="url(#cup445)" stroke="#1a0a04" stroke-width="2.5"/>
    <!-- coffee surface -->
    <ellipse cx="0" cy="-40" rx="45" ry="10" fill="#3d1f08" stroke="#1a0a04" stroke-width="1.5"/>
    <ellipse cx="-12" cy="-42" rx="14" ry="3" fill="#5a3210" opacity="0.75"/>
    <!-- handle -->
    <path d="M 44 -10 Q 70 -5 70 15 Q 70 35 44 35" fill="none" stroke="#3d1f08" stroke-width="6" stroke-linecap="round"/>
    <!-- premium ribbon -->
    <g transform="translate(0,5)">
      <rect x="-22" y="-6" width="44" height="14" rx="2" fill="#f5c842" stroke="#5a3210" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" fill="#5a3210" font-size="7" font-family="monospace" font-weight="bold">PREMIUM</text>
    </g>
  </g>

  <!-- MARKET entry tag (top-left) -->
  <g transform="translate(55,90)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#52b788" fill-opacity="0.2" stroke="#52b788" stroke-width="1.3"/>
    <text x="30" y="14" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" font-weight="bold">ENTRY</text>
    <text x="30" y="22" text-anchor="middle" fill="#52b788" font-size="5" font-family="monospace" opacity="0.85">CAGE</text>
  </g>

  <!-- HONDURAS pin (origin) -->
  <g transform="translate(345,90)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Expansión · Café · Honduras</text>
</svg>
