<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg435" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="news435" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfe6e9"/>
      <stop offset="100%" stop-color="#a9b5b9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg435)"/>

  <text x="200" y="58" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">BUSINESS MODEL INNOVATION</text>

  <!-- NEWSPAPER (hero, left) -->
  <g transform="translate(135,235)">
    <rect x="-65" y="-90" width="130" height="170" rx="2" fill="url(#news435)" stroke="#1a2744" stroke-width="2"/>
    <rect x="-58" y="-82" width="116" height="20" fill="#1a2744"/>
    <text x="0" y="-67" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="11" font-weight="bold" letter-spacing="2">DIARIO</text>
    <g stroke="#1a2744" stroke-width="0.7" opacity="0.6">
      <line x1="-58" y1="-50" x2="58" y2="-50"/>
      <line x1="-58" y1="-42" x2="50" y2="-42"/>
      <line x1="-58" y1="-34" x2="58" y2="-34"/>
      <line x1="-58" y1="-26" x2="44" y2="-26"/>
    </g>
    <rect x="-58" y="-18" width="46" height="34" fill="#5a6f9c" opacity="0.6"/>
    <g stroke="#1a2744" stroke-width="0.7" opacity="0.6">
      <line x1="-8" y1="-14" x2="58" y2="-14"/>
      <line x1="-8" y1="-6" x2="50" y2="-6"/>
      <line x1="-8" y1="2" x2="58" y2="2"/>
      <line x1="-8" y1="10" x2="56" y2="10"/>
      <line x1="-58" y1="24" x2="58" y2="24"/>
      <line x1="-58" y1="32" x2="50" y2="32"/>
      <line x1="-58" y1="40" x2="58" y2="40"/>
      <line x1="-58" y1="48" x2="44" y2="48"/>
      <line x1="-58" y1="56" x2="58" y2="56"/>
    </g>
    <!-- declining arrow inside -->
    <g transform="translate(0,68)">
      <path d="M -20 -4 L 20 4" stroke="#ff6b6b" stroke-width="2"/>
      <polygon points="20,4 12,0 14,8" fill="#ff6b6b"/>
    </g>
  </g>

  <!-- TABLET (hero right) -->
  <g transform="translate(285,235)">
    <rect x="-44" y="-90" width="88" height="160" rx="6" fill="#0d1b2a" stroke="#00bfff" stroke-width="2.5"/>
    <rect x="-38" y="-82" width="76" height="120" rx="2" fill="#1a2744" stroke="#00bfff" stroke-width="1" opacity="0.7"/>
    <!-- digital news -->
    <text x="0" y="-65" text-anchor="middle" fill="#00bfff" font-size="6" font-family="monospace" font-weight="bold">NEWS · DIGITAL</text>
    <g fill="#00bfff" opacity="0.7">
      <rect x="-32" y="-55" width="64" height="22" rx="2"/>
    </g>
    <g stroke="#c0cfff" stroke-width="0.6" opacity="0.55">
      <line x1="-32" y1="-25" x2="32" y2="-25"/>
      <line x1="-32" y1="-17" x2="20" y2="-17"/>
      <line x1="-32" y1="-9" x2="32" y2="-9"/>
      <line x1="-32" y1="-1" x2="28" y2="-1"/>
    </g>
    <rect x="-32" y="6" width="64" height="20" rx="2" fill="#52b788" fill-opacity="0.35"/>
    <text x="0" y="20" text-anchor="middle" fill="#52b788" font-size="6" font-family="monospace" font-weight="bold">SUBSCRIBE</text>
    <!-- rising arrow on screen -->
    <g transform="translate(0,55)">
      <path d="M -16 4 L 16 -4" stroke="#52b788" stroke-width="2"/>
      <polygon points="16,-4 8,-8 8,0" fill="#52b788"/>
    </g>
    <circle cx="0" cy="58" r="3" fill="none" stroke="#c0cfff" stroke-width="1.3"/>
  </g>

  <!-- arrow between (transformation) -->
  <g transform="translate(210,215)">
    <path d="M -5 0 L 5 0" stroke="#f5c842" stroke-width="3" fill="none"/>
    <polygon points="5,0 -3,-6 -3,6" fill="#f5c842"/>
    <text x="0" y="-12" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.85">PIVOT</text>
  </g>

  <!-- 24m roadmap badge (top-left) -->
  <g transform="translate(55,90)">
    <rect x="0" y="0" width="58" height="28" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.3"/>
    <text x="29" y="14" text-anchor="middle" fill="#f5c842" font-size="11" font-family="monospace" font-weight="bold">24m</text>
    <text x="29" y="22" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.85">roadmap</text>
  </g>

  <!-- canvas chip (top-right) -->
  <g transform="translate(290,90)">
    <rect x="0" y="0" width="60" height="28" rx="3" fill="#c0cfff" fill-opacity="0.15" stroke="#c0cfff" stroke-width="1.3"/>
    <g stroke="#c0cfff" stroke-width="0.7" opacity="0.6">
      <line x1="20" y1="0" x2="20" y2="28"/>
      <line x1="40" y1="0" x2="40" y2="28"/>
      <line x1="0" y1="14" x2="60" y2="14"/>
    </g>
    <text x="30" y="40" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" opacity="0.85">BMC</text>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Modelo · Digital · Newspaper</text>
</svg>
