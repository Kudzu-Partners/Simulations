<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="adjGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0"/>
      <stop offset="80%" stop-color="#00bfff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="transGlow" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#7b2fff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#7b2fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <!-- Background glow layers -->
  <circle cx="200" cy="195" r="155" fill="url(#transGlow)"/>
  <circle cx="200" cy="195" r="100" fill="url(#adjGlow)"/>
  <circle cx="200" cy="195" r="50" fill="url(#coreGlow)"/>

  <!-- OUTER ring: Transformational (H3) -->
  <circle cx="200" cy="195" r="152" fill="none" stroke="#7b2fff" stroke-width="2" stroke-opacity="0.55"/>
  <text x="200" y="46" text-anchor="middle" fill="#7b2fff" font-size="11" font-family="monospace" font-weight="bold" opacity="0.75">H3 · TRANSFORMACIONAL</text>
  <!-- H3 idea dots scattered on outer ring -->
  <circle cx="200" cy="43" r="5" fill="#7b2fff" opacity="0.6"/>
  <circle cx="308" cy="73" r="4" fill="#7b2fff" opacity="0.5"/>
  <circle cx="350" cy="170" r="5" fill="#7b2fff" opacity="0.6"/>
  <circle cx="336" cy="285" r="4" fill="#7b2fff" opacity="0.5"/>
  <circle cx="92" cy="73" r="4" fill="#7b2fff" opacity="0.5"/>
  <circle cx="52" cy="175" r="5" fill="#7b2fff" opacity="0.6"/>

  <!-- MIDDLE ring: Adjacent (H2) -->
  <circle cx="200" cy="195" r="98" fill="none" stroke="#00bfff" stroke-width="2" stroke-opacity="0.65"/>
  <text x="200" y="100" text-anchor="middle" fill="#00bfff" font-size="11" font-family="monospace" opacity="0.7">H2 · ADYACENTE</text>
  <!-- H2 dots -->
  <circle cx="200" cy="97" r="5" fill="#00bfff" opacity="0.7"/>
  <circle cx="278" cy="122" r="5" fill="#00bfff" opacity="0.65"/>
  <circle cx="292" cy="210" r="4" fill="#00bfff" opacity="0.6"/>
  <circle cx="108" cy="122" r="5" fill="#00bfff" opacity="0.65"/>
  <circle cx="112" cy="245" r="4" fill="#00bfff" opacity="0.6"/>

  <!-- INNER ring: Core (H1) -->
  <circle cx="200" cy="195" r="48" fill="#ffd166" fill-opacity="0.12" stroke="#ffd166" stroke-width="2.5" stroke-opacity="0.85"/>
  <text x="200" y="188" text-anchor="middle" fill="#ffd166" font-size="12" font-family="monospace" font-weight="bold" opacity="0.9">H1</text>
  <text x="200" y="204" text-anchor="middle" fill="#ffd166" font-size="9" font-family="monospace" opacity="0.7">CORE</text>

  <!-- STAGE-GATE funnel cutting across from left -->
  <!-- Funnel entering from left side -->
  <path d="M52,260 L52,318 L152,302 L152,276 Z"
        fill="#ffd166" fill-opacity="0.08" stroke="#ffd166" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Gate 1 -->
  <line x1="85" y1="256" x2="85" y2="322" stroke="#ffd166" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,3"/>
  <circle cx="85" cy="289" r="7" fill="#ffd166" opacity="0.6"/>
  <!-- Gate 2 -->
  <line x1="118" y1="262" x2="118" y2="316" stroke="#ffd166" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="4,3"/>
  <circle cx="118" cy="289" r="7" fill="#ffd166" opacity="0.55"/>
  <!-- Gate 3 -->
  <line x1="150" y1="268" x2="150" y2="310" stroke="#ffd166" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="150" cy="289" r="6" fill="#ffd166" opacity="0.5"/>
  <!-- Arrow entering funnel -->
  <polygon points="52,274 62,289 52,304" fill="#ffd166" opacity="0.5"/>
  <!-- "Idea" light dots going into funnel -->
  <circle cx="42" cy="275" r="4" fill="#7b2fff" opacity="0.7"/>
  <circle cx="38" cy="289" r="3" fill="#00bfff" opacity="0.6"/>
  <circle cx="42" cy="302" r="3" fill="#7b2fff" opacity="0.55"/>

  <!-- Stage-gate label -->
  <text x="100" y="342" text-anchor="middle" fill="#ffd166" font-size="9" font-family="monospace" opacity="0.55" letter-spacing="1">STAGE GATE</text>

  <!-- MVP badge -->
  <rect x="310" y="285" width="48" height="26" rx="6"
        fill="#00bfff" fill-opacity="0.2" stroke="#00bfff" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="334" y="302" text-anchor="middle" fill="#00bfff" font-size="11" font-family="monospace" font-weight="bold" opacity="0.85">MVP</text>

  <text x="200" y="372" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.38" letter-spacing="1">CONGLOMERADO CONSUMO · MÉXICO</text>
</svg>
