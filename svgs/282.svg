<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg282" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg282)"/>

  <!-- Chess board 4x4 -->
  <g transform="translate(82, 60)">
    <rect width="236" height="236" rx="6" fill="#1a2744" stroke="#f5c842" stroke-width="2.5"/>
    <g opacity="0.28">
      <rect x="0" y="0" width="59" height="59" fill="#f5c842"/>
      <rect x="118" y="0" width="59" height="59" fill="#f5c842"/>
      <rect x="59" y="59" width="59" height="59" fill="#f5c842"/>
      <rect x="177" y="59" width="59" height="59" fill="#f5c842"/>
      <rect x="0" y="118" width="59" height="59" fill="#f5c842"/>
      <rect x="118" y="118" width="59" height="59" fill="#f5c842"/>
      <rect x="59" y="177" width="59" height="59" fill="#f5c842"/>
      <rect x="177" y="177" width="59" height="59" fill="#f5c842"/>
    </g>
    <!-- Blue king piece -->
    <g transform="translate(88,88)">
      <rect x="-16" y="-26" width="32" height="36" rx="5" fill="#74b9ff"/>
      <rect x="-8" y="-38" width="16" height="14" rx="3" fill="#74b9ff"/>
      <rect x="-20" y="10" width="40" height="8" rx="4" fill="#5fa8e8"/>
    </g>
    <!-- Blue knight -->
    <g transform="translate(30,148)">
      <ellipse cx="0" cy="0" rx="18" ry="22" fill="#74b9ff"/>
      <ellipse cx="0" cy="-22" rx="10" ry="14" fill="#74b9ff"/>
    </g>
    <!-- Red queen (opponent) -->
    <g transform="translate(148,148)">
      <ellipse cx="0" cy="0" rx="18" ry="22" fill="#e74c3c"/>
      <rect x="-18" y="-32" width="36" height="14" rx="3" fill="#e74c3c"/>
      <circle cx="-14" cy="-34" r="5" fill="#e74c3c"/>
      <circle cx="0" cy="-38" r="5" fill="#e74c3c"/>
      <circle cx="14" cy="-34" r="5" fill="#e74c3c"/>
    </g>
    <!-- Red rook -->
    <g transform="translate(88,178)">
      <rect x="-14" y="-30" width="28" height="40" rx="3" fill="#e74c3c"/>
      <rect x="-18" y="-40" width="10" height="12" rx="2" fill="#e74c3c"/>
      <rect x="-4" y="-40" width="10" height="12" rx="2" fill="#e74c3c"/>
      <rect x="8" y="-40" width="10" height="12" rx="2" fill="#e74c3c"/>
    </g>
    <!-- Move arrow -->
    <line x1="148" y1="148" x2="90" y2="90" stroke="#f5c842" stroke-width="3" stroke-dasharray="6,4" opacity="0.9"/>
    <polygon points="86,84 98,92 90,104" fill="#f5c842" opacity="0.9"/>
  </g>

  <!-- Corner badge -->
  <g transform="translate(296, 316)">
    <circle r="34" fill="#1a2744" stroke="#e74c3c" stroke-width="2.5"/>
    <circle r="34" cx="0" cy="0" fill="none" stroke="#74b9ff" stroke-width="2.5" stroke-dasharray="8,8" opacity="0.5"/>
    <text y="6" text-anchor="middle" font-family="sans-serif" font-size="26">⚔</text>
  </g>
</svg>
