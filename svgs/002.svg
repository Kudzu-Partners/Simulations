<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg002" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="phoneStroke002" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00bfff"/>
    </linearGradient>
    <linearGradient id="barGrad002" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="phoneGlow002" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow002">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg002)"/>

  <!-- Circuit grid -->
  <g stroke="#00bfff" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <!-- Circuit dots at intersections -->
  <g fill="#00bfff" opacity="0.1">
    <circle cx="80" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="240" cy="80" r="3"/><circle cx="320" cy="80" r="3"/>
    <circle cx="80" cy="160" r="3"/><circle cx="160" cy="160" r="3"/><circle cx="240" cy="160" r="3"/><circle cx="320" cy="160" r="3"/>
    <circle cx="80" cy="240" r="3"/><circle cx="160" cy="240" r="3"/><circle cx="240" cy="240" r="3"/><circle cx="320" cy="240" r="3"/>
    <circle cx="80" cy="320" r="3"/><circle cx="160" cy="320" r="3"/><circle cx="240" cy="320" r="3"/><circle cx="320" cy="320" r="3"/>
  </g>

  <!-- ═══ CLASSIC BANK BUILDING (left, muted) ═══ -->
  <g opacity="0.55">
    <!-- Pediment (triangle) -->
    <polygon points="44,182 166,182 105,136" fill="#1a2f4a" fill-opacity="0.6" stroke="#5a80a8" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Entablature (horizontal beam) -->
    <rect x="46" y="182" width="118" height="14" fill="#1a2f4a" fill-opacity="0.7" stroke="#5a80a8" stroke-width="1.2"/>
    <!-- 4 columns -->
    <rect x="57" y="196" width="11" height="104" fill="#1a2f4a" fill-opacity="0.5" stroke="#5a80a8" stroke-width="1"/>
    <rect x="84" y="196" width="11" height="104" fill="#1a2f4a" fill-opacity="0.5" stroke="#5a80a8" stroke-width="1"/>
    <rect x="111" y="196" width="11" height="104" fill="#1a2f4a" fill-opacity="0.5" stroke="#5a80a8" stroke-width="1"/>
    <rect x="138" y="196" width="11" height="104" fill="#1a2f4a" fill-opacity="0.5" stroke="#5a80a8" stroke-width="1"/>
    <!-- Plinth (base) -->
    <rect x="46" y="300" width="118" height="14" fill="#1a2f4a" fill-opacity="0.7" stroke="#5a80a8" stroke-width="1.2"/>
    <!-- Steps -->
    <rect x="38" y="312" width="134" height="9" fill="#1a2f4a" fill-opacity="0.5" stroke="#5a80a8" stroke-width="0.8"/>
    <rect x="30" y="319" width="150" height="8" fill="#1a2f4a" fill-opacity="0.4" stroke="#5a80a8" stroke-width="0.6"/>
  </g>

  <!-- ═══ DISRUPTION ARROW (center) ═══ -->
  <!-- Speed lines behind arrow -->
  <g stroke="#00ff88" stroke-width="1.2" opacity="0.3" stroke-linecap="round">
    <line x1="170" y1="208" x2="183" y2="208"/>
    <line x1="167" y1="218" x2="182" y2="218"/>
    <line x1="170" y1="228" x2="183" y2="228"/>
  </g>
  <!-- Right-pointing arrow -->
  <polygon points="184,208 218,208 218,198 236,218 218,238 218,228 184,228" fill="#00ff88" opacity="0.88" filter="url(#softGlow002)"/>

  <!-- ═══ SMARTPHONE (right, glowing) ═══ -->
  <!-- Phone glow aura -->
  <ellipse cx="290" cy="228" rx="68" ry="95" fill="url(#phoneGlow002)"/>
  <!-- Phone body -->
  <rect x="232" y="145" width="112" height="192" rx="16" fill="#071828" stroke="url(#phoneStroke002)" stroke-width="2.5"/>
  <!-- Screen -->
  <rect x="243" y="159" width="90" height="164" rx="7" fill="#050e1a"/>
  <!-- Front camera -->
  <circle cx="288" cy="152" r="3.5" fill="#00ff88" opacity="0.45"/>

  <!-- Phone UI elements -->
  <!-- Status bar -->
  <rect x="248" y="163" width="80" height="4" rx="2" fill="#00bfff" opacity="0.25"/>

  <!-- App icon grid (2x3) -->
  <g fill="#00bfff" opacity="0.45">
    <rect x="253" y="176" width="20" height="20" rx="5"/>
    <rect x="279" y="176" width="20" height="20" rx="5"/>
    <rect x="305" y="176" width="20" height="20" rx="5"/>
    <rect x="253" y="204" width="20" height="20" rx="5"/>
    <rect x="279" y="204" width="20" height="20" rx="5"/>
    <rect x="305" y="204" width="20" height="20" rx="5"/>
  </g>

  <!-- Divider line -->
  <line x1="248" y1="233" x2="328" y2="233" stroke="#00bfff" stroke-width="0.8" opacity="0.3"/>

  <!-- Bar chart (growth data) — key visual: fintech growth -->
  <g fill="url(#barGrad002)" opacity="0.82">
    <rect x="255" y="262" width="16" height="44" rx="3"/>
    <rect x="278" y="248" width="16" height="58" rx="3"/>
    <rect x="301" y="237" width="16" height="69" rx="3"/>
  </g>
  <!-- Chart baseline -->
  <line x1="251" y1="307" x2="325" y2="307" stroke="#00ff88" stroke-width="1" opacity="0.35"/>

  <!-- Home bar -->
  <line x1="272" y1="326" x2="304" y2="326" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
