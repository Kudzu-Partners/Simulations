<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg206" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <radialGradient id="tableGlow206" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="contract206" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e8e0c8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg206)"/>
  <rect width="400" height="400" rx="32" fill="url(#tableGlow206)"/>

  <!-- ── Round negotiation table (ellipse) ── -->
  <ellipse cx="200" cy="220" rx="135" ry="72" fill="#3d2b08" opacity="0.35" stroke="#f5c842" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="200" cy="218" rx="120" ry="60" fill="none" stroke="#f5c842" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Wood grain on table -->
  <ellipse cx="200" cy="220" rx="100" ry="48" fill="none" stroke="#d4a574" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="200" cy="220" rx="80"  ry="36" fill="none" stroke="#d4a574" stroke-width="0.6" opacity="0.25"/>

  <!-- ── Central contract document ── -->
  <g transform="translate(200,210) rotate(-3)">
    <rect x="-32" y="-26" width="64" height="80" rx="3" fill="url(#contract206)" stroke="#1a2744" stroke-width="1.2"/>
    <line x1="-24" y1="-14" x2="22" y2="-14" stroke="#1a2744" stroke-width="1.2" opacity="0.7"/>
    <line x1="-24" y1="-7"  x2="18" y2="-7"  stroke="#1a2744" stroke-width="0.8" opacity="0.5"/>
    <line x1="-24" y1="-1"  x2="20" y2="-1"  stroke="#1a2744" stroke-width="0.8" opacity="0.5"/>
    <line x1="-24" y1="5"   x2="14" y2="5"   stroke="#1a2744" stroke-width="0.8" opacity="0.5"/>
    <line x1="-24" y1="11"  x2="22" y2="11"  stroke="#1a2744" stroke-width="0.8" opacity="0.5"/>
    <line x1="-24" y1="17"  x2="16" y2="17"  stroke="#1a2744" stroke-width="0.8" opacity="0.5"/>
    <line x1="-24" y1="23"  x2="20" y2="23"  stroke="#1a2744" stroke-width="0.8" opacity="0.5"/>
    <!-- Resolved clause checkmarks -->
    <path d="M-22 -7 L-19 -4 L-14 -10" stroke="#52b788" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M-22 -1 L-19 2 L-14 -4" stroke="#52b788" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Unresolved (red dot) -->
    <circle cx="-19" cy="11" r="1.8" fill="#ff6b6b"/>
    <circle cx="-19" cy="23" r="1.8" fill="#ff6b6b"/>
    <!-- Signature line -->
    <line x1="-24" y1="42" x2="22" y2="42" stroke="#1a2744" stroke-width="1.2" opacity="0.7"/>
    <text x="-22" y="48" font-family="Georgia,serif" font-size="6" fill="#1a2744" opacity="0.6">SIGN</text>
  </g>

  <!-- ── 4 parties around the table ── -->
  <!-- Party 1: Grupo Andino (top — gold, you) -->
  <g transform="translate(200, 110)">
    <circle r="22" fill="#1a2744" stroke="#f5c842" stroke-width="2.8"/>
    <circle cy="-5" r="6" fill="#f5c842" opacity="0.85"/>
    <path d="M-9 8 Q0 12 9 8" stroke="#f5c842" stroke-width="1.8" fill="none"/>
    <text y="-32" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#f5c842" opacity="0.95">YOU · ANDINO</text>
  </g>

  <!-- Party 2: Lumina (left) -->
  <g transform="translate(72, 220)">
    <circle r="18" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <circle cy="-4" r="5" fill="#74b9ff" opacity="0.8"/>
    <path d="M-7 7 Q0 10 7 7" stroke="#74b9ff" stroke-width="1.5" fill="none"/>
    <text x="0" y="38" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#74b9ff" opacity="0.85">LUMINA AI</text>
  </g>

  <!-- Party 3: PacificTrade (bottom-right) -->
  <g transform="translate(312, 250)">
    <circle r="18" fill="#1a2744" stroke="#52b788" stroke-width="2"/>
    <circle cy="-4" r="5" fill="#52b788" opacity="0.8"/>
    <path d="M-7 7 Q0 10 7 7" stroke="#52b788" stroke-width="1.5" fill="none"/>
    <text x="0" y="38" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#52b788" opacity="0.85">PACIFIC</text>
  </g>

  <!-- Party 4: Crestline (bottom-left) -->
  <g transform="translate(108, 308)">
    <circle r="18" fill="#1a2744" stroke="#ff6b9d" stroke-width="2"/>
    <circle cy="-4" r="5" fill="#ff6b9d" opacity="0.8"/>
    <path d="M-7 7 Q0 10 7 7" stroke="#ff6b9d" stroke-width="1.5" fill="none"/>
    <text x="0" y="-26" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#ff6b9d" opacity="0.85">CRESTLINE</text>
  </g>

  <!-- Connection lines from each party to contract -->
  <line x1="200" y1="132" x2="200" y2="184" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="90"  y1="220" x2="170" y2="218" stroke="#74b9ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="294" y1="248" x2="232" y2="225" stroke="#52b788" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="124" y1="296" x2="180" y2="245" stroke="#ff6b9d" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- BATNA shield (top-left corner) -->
  <g transform="translate(45,55)">
    <path d="M0 0 L26 0 L26 18 Q26 28 13 32 Q0 28 0 18 Z" fill="#1a2744" stroke="#d4a574" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="13" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#d4a574" opacity="0.95">BATNA</text>
  </g>

  <!-- Round counter (top-right) -->
  <g transform="translate(330,55)">
    <rect x="-30" y="0" width="50" height="22" rx="5" fill="#1a2744" stroke="#f5c842" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="-5" y="15" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#f5c842" opacity="0.9">R 1/4</text>
  </g>

  <text x="200" y="378" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c0cfff" opacity="0.45" letter-spacing="2">5-YEAR LICENSING DEAL</text>
</svg>
