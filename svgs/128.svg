<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg128" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <linearGradient id="bridge128" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#a87a10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg128)"/>
  <!-- Bridge connecting two cliffs/sides -->
  <!-- Left cliff (DE side - black/red/yellow flag) -->
  <g transform="translate(60 280)">
    <path d="M0 60 L0 -10 L80 -10 L80 60 Z" fill="#2d3f6b" stroke="#ffffff" stroke-width="2"/>
    <!-- DE flag pole -->
    <line x1="40" y1="-10" x2="40" y2="-90" stroke="#ffffff" stroke-width="2.5"/>
    <g stroke="#ffffff" stroke-width="1.2">
      <rect x="40" y="-90" width="44" height="9" fill="#000000"/>
      <rect x="40" y="-81" width="44" height="9" fill="#e74c3c"/>
      <rect x="40" y="-72" width="44" height="9" fill="#f5c842"/>
    </g>
  </g>
  <!-- Right cliff (JP side - white with red sun) -->
  <g transform="translate(260 280)">
    <path d="M0 60 L0 -10 L80 -10 L80 60 Z" fill="#2d3f6b" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="-10" x2="40" y2="-90" stroke="#ffffff" stroke-width="2.5"/>
    <g stroke="#ffffff" stroke-width="1.2">
      <rect x="40" y="-90" width="44" height="27" fill="#ffffff"/>
      <circle cx="62" cy="-77" r="9" fill="#e74c3c"/>
    </g>
  </g>
  <!-- Bridge deck -->
  <path d="M60 270 Q200 180 340 270" fill="none" stroke="url(#bridge128)" stroke-width="10" stroke-linecap="round"/>
  <path d="M60 270 Q200 180 340 270" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Suspension cables -->
  <g stroke="url(#bridge128)" stroke-width="2.5" fill="none" opacity="0.95">
    <line x1="200" y1="125" x2="200" y2="195"/>
    <line x1="160" y1="155" x2="160" y2="200"/>
    <line x1="240" y1="155" x2="240" y2="200"/>
    <line x1="120" y1="190" x2="120" y2="220"/>
    <line x1="280" y1="190" x2="280" y2="220"/>
    <line x1="90" y1="225" x2="90" y2="245"/>
    <line x1="310" y1="225" x2="310" y2="245"/>
  </g>
  <!-- Top main cable -->
  <path d="M60 270 Q200 105 340 270" fill="none" stroke="url(#bridge128)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Two figures shaking hands at center of bridge -->
  <g transform="translate(200 198)">
    <!-- Left figure -->
    <circle cx="-22" cy="-22" r="9" fill="#c0cfff" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M-36 -8 Q-22 -18 -12 -8 L-12 14 L-36 14 Z" fill="#c0cfff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right figure -->
    <circle cx="22" cy="-22" r="9" fill="#c0cfff" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M36 -8 Q22 -18 12 -8 L12 14 L36 14 Z" fill="#c0cfff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Handshake -->
    <rect x="-12" y="-6" width="24" height="6" rx="2" fill="#f5c842" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
