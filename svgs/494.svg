<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg494" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg494)"/>

  <text x="200" y="58" text-anchor="middle" fill="#00ff88" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">LINEAR PROGRAMMING · MIX</text>

  <!-- LP feasibility region (hero) -->
  <g transform="translate(200,225)">
    <!-- axes -->
    <line x1="-130" y1="100" x2="130" y2="100" stroke="#c0cfff" stroke-width="1.2" opacity="0.6"/>
    <line x1="-130" y1="-100" x2="-130" y2="100" stroke="#c0cfff" stroke-width="1.2" opacity="0.6"/>
    <text x="125" y="115" text-anchor="end" fill="#c0cfff" font-size="6" font-family="monospace" opacity="0.7">SKU-B →</text>
    <text x="-135" y="-95" text-anchor="end" fill="#c0cfff" font-size="6" font-family="monospace" opacity="0.7">SKU-A ↑</text>

    <!-- constraints lines -->
    <line x1="-130" y1="-30" x2="40" y2="100" stroke="#ff6b6b" stroke-width="1.5" opacity="0.8"/>
    <line x1="-130" y1="30" x2="130" y2="-50" stroke="#ff6b6b" stroke-width="1.5" opacity="0.8"/>
    <line x1="-130" y1="-60" x2="80" y2="100" stroke="#ff6b6b" stroke-width="1.5" opacity="0.8"/>

    <!-- feasible region (shaded polygon) -->
    <polygon points="-130,30 -130,-30 -50,-70 30,-50 -10,40 -90,90" fill="#52b788" fill-opacity="0.55" stroke="#52b788" stroke-width="2"/>

    <!-- objective gradient arrow -->
    <g>
      <line x1="-100" y1="80" x2="-30" y2="-50" stroke="#f5c842" stroke-width="2" stroke-dasharray="3,2"/>
      <polygon points="-30,-50 -22,-43 -38,-40" fill="#f5c842"/>
    </g>

    <!-- optimal vertex -->
    <circle cx="-50" cy="-70" r="8" fill="#f5c842" stroke="#fff" stroke-width="2"/>
    <text x="-50" y="-83" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" font-weight="bold">OPT</text>
    <text x="0" y="60" text-anchor="middle" fill="#52b788" font-size="7" font-family="monospace" font-weight="bold">FEASIBLE</text>
  </g>

  <!-- 12 SKU badge (top-left) -->
  <g transform="translate(55,90)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#c0cfff" fill-opacity="0.15" stroke="#c0cfff" stroke-width="1.3"/>
    <text x="30" y="14" text-anchor="middle" fill="#c0cfff" font-size="11" font-family="monospace" font-weight="bold">12 SKU</text>
    <text x="30" y="22" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" opacity="0.85">mix</text>
  </g>

  <!-- MAX profit chip (top-right) -->
  <g transform="translate(290,90)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.3"/>
    <text x="30" y="14" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" font-weight="bold">MAX $</text>
    <text x="30" y="22" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.85">profit</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,340)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">LP · Mix · Alimentos · HN</text>
</svg>
