<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg295" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="profit295" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="40%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg295)"/>

  <!-- Revenue/Cost area chart -->
  <!-- Cost area (red) -->
  <path d="M 50 310 L 50 180 L 150 170 L 200 165 L 280 160 L 350 155 L 350 310 Z"
        fill="#e74c3c" opacity="0.22"/>
  <path d="M 50 180 L 150 170 L 200 165 L 280 160 L 350 155"
        stroke="#e74c3c" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Revenue line (going up, green) -->
  <path d="M 50 300 L 100 270 L 160 240 L 220 205 L 280 165 L 350 118"
        stroke="#00ff88" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Revenue area -->
  <path d="M 50 300 L 100 270 L 160 240 L 220 205 L 280 165 L 350 118 L 350 310 L 50 310 Z"
        fill="#00ff88" opacity="0.1"/>

  <!-- Breakeven intersection dot -->
  <circle cx="190" cy="208" r="16" fill="#0d1b2a" stroke="#f5c842" stroke-width="4"/>
  <circle cx="190" cy="208" r="7" fill="#f5c842"/>
  <!-- Pulse -->
  <circle cx="190" cy="208" r="26" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.4"/>

  <!-- Axes -->
  <line x1="50" y1="50" x2="50" y2="310" stroke="#8899aa" stroke-width="1.5" opacity="0.35"/>
  <line x1="50" y1="310" x2="360" y2="310" stroke="#8899aa" stroke-width="1.5" opacity="0.35"/>

  <!-- Fixed cost horizontal line (dashed) -->
  <line x1="50" y1="230" x2="350" y2="230" stroke="#a29bfe" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- LOSS zone label (icon: down arrow) -->
  <g transform="translate(80, 250)">
    <circle r="18" fill="#2a0a0a" stroke="#e74c3c" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-6,4 0,12 6,4" fill="#e74c3c"/>
  </g>

  <!-- PROFIT zone label (icon: up arrow) -->
  <g transform="translate(300, 160)">
    <circle r="18" fill="#0a1f10" stroke="#00ff88" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="8" x2="0" y2="-8" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-6,-4 0,-12 6,-4" fill="#00ff88"/>
  </g>

  <!-- Dashed vertical breakeven line -->
  <line x1="190" y1="208" x2="190" y2="310" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Bottom money/coin row -->
  <g transform="translate(36, 348)">
    <circle cx="20" cy="16" r="14" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <text x="20" y="21" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#f5c842">$</text>
    <circle cx="60" cy="16" r="14" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <text x="60" y="21" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#f5c842">$</text>
    <circle cx="100" cy="16" r="14" fill="#1a1200" stroke="#f5c842" stroke-width="2"/>
    <text x="100" y="21" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#f5c842">$</text>
    <!-- Profit bar gradient -->
    <rect x="136" y="4" width="192" height="24" rx="6" fill="url(#profit295)" opacity="0.85"/>
  </g>
</svg>
