<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg620" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#6a0572"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg620)"/>

  <text x="200" y="56" text-anchor="middle" fill="#ff6b9d" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">SOCIAL MEDIA · MULTI-PLATFORM</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Phone with grid of platforms (protagonist) -->
    <g transform="translate(200,208)">
      <!-- Phone outline -->
      <rect x="-72" y="-120" width="144" height="240" rx="20" fill="#2d0a4e" stroke="#ff6b9d" stroke-width="3.5"/>
      <!-- Inner screen -->
      <rect x="-64" y="-104" width="128" height="208" rx="6" fill="#1a0033" stroke="#ff6b9d" stroke-width="1.5"/>

      <!-- Top status bar -->
      <line x1="-56" y1="-92" x2="-32" y2="-92" stroke="#ff6b9d" stroke-width="2" opacity="0.7"/>
      <circle cx="48"  cy="-92" r="3" fill="#ffd166"/>

      <!-- App grid 3x2 (6 platforms simplified) -->
      <!-- App 1 (camera/IG) -->
      <rect x="-52" y="-72" width="36" height="36" rx="8" fill="#ff6b9d"/>
      <circle r="8" cx="-34" cy="-54" fill="none" stroke="#1a0033" stroke-width="2.5"/>
      <circle r="3" cx="-22" cy="-66" fill="#1a0033"/>

      <!-- App 2 (FB) -->
      <rect x="-12" y="-72" width="36" height="36" rx="8" fill="#74b9ff"/>
      <text x="6" y="-50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="700" fill="#1a0033">f</text>

      <!-- App 3 (X/Twitter) -->
      <rect x="28" y="-72" width="36" height="36" rx="8" fill="#ffd166"/>
      <text x="46" y="-50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="700" fill="#1a0033">X</text>

      <!-- App 4 (TikTok) -->
      <rect x="-52" y="-28" width="36" height="36" rx="8" fill="#ffffff"/>
      <text x="-34" y="-6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="700" fill="#1a0033">♪</text>

      <!-- App 5 (YT play) -->
      <rect x="-12" y="-28" width="36" height="36" rx="8" fill="#e74c3c"/>
      <path d="M -2 -18 L -2 0 L 14 -9 Z" fill="#1a0033"/>

      <!-- App 6 (linkedin) -->
      <rect x="28" y="-28" width="36" height="36" rx="8" fill="#1a3a5c"/>
      <text x="46" y="-6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#ff6b9d">in</text>

      <!-- Engagement chart (bottom) -->
      <rect x="-56" y="24" width="112" height="40" rx="4" fill="#2d0a4e" stroke="#ff6b9d" stroke-width="1.5"/>
      <path d="M -48 56 L -32 40 L -16 44 L 0 32 L 16 36 L 32 24 L 48 28" stroke="#ffd166" stroke-width="2" fill="none"/>

      <!-- Home button -->
      <circle cx="0" cy="84" r="6" fill="none" stroke="#ff6b9d" stroke-width="2"/>
    </g>

    <!-- Viral badge top-left -->
    <g transform="translate(48,84)">
      <rect width="72" height="26" rx="4" fill="#e74c3c" fill-opacity="0.18" stroke="#e74c3c" stroke-width="1.5"/>
      <text x="36" y="18" text-anchor="middle" fill="#e74c3c" font-size="11" font-family="monospace" font-weight="bold">VIRAL!</text>
    </g>

    <!-- Reach badge top-right -->
    <g transform="translate(284,84)">
      <rect width="68" height="26" rx="4" fill="#ffd166" fill-opacity="0.18" stroke="#ffd166" stroke-width="1.5"/>
      <text x="34" y="18" text-anchor="middle" fill="#ffd166" font-size="11" font-family="monospace" font-weight="bold">2M</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#ffd166" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Energy Drink · CO</text>
</svg>
