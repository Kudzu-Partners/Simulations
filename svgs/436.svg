<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg436" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0a2418"/>
    </linearGradient>
    <radialGradient id="bulb436" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#c98a2b"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg436)"/>

  <text x="200" y="58" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">OPEN INNOVATION · R&amp;D</text>

  <!-- patent shield danger (background, behind bulb) -->
  <g transform="translate(200,225)" opacity="0.55">
    <path d="M 0 -100 L 80 -86 L 80 30 Q 80 70 0 90 Q -80 70 -80 30 L -80 -86 Z"
          fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="0" y="-105" text-anchor="middle" fill="#ff6b6b" font-size="6" font-family="monospace" opacity="0.85">PATENT RISK</text>
  </g>

  <!-- LIGHT BULB (hero, central) -->
  <g transform="translate(200,200)">
    <!-- glass -->
    <path d="M 0 -55 Q -38 -55 -38 -20 Q -38 5 -22 25 L 22 25 Q 38 5 38 -20 Q 38 -55 0 -55 Z"
          fill="url(#bulb436)" stroke="#5a3210" stroke-width="2.5"/>
    <!-- filament -->
    <path d="M -14 -5 Q -8 -25 0 -15 Q 8 -25 14 -5" fill="none" stroke="#c98a2b" stroke-width="2"/>
    <!-- highlight -->
    <ellipse cx="-12" cy="-30" rx="5" ry="14" fill="#ffffff" fill-opacity="0.35"/>
    <!-- base threads -->
    <g fill="#5a6f9c" stroke="#1a2744" stroke-width="1">
      <rect x="-18" y="25" width="36" height="6"/>
      <rect x="-15" y="32" width="30" height="5"/>
      <rect x="-12" y="38" width="24" height="5"/>
    </g>
    <!-- bottom contact -->
    <rect x="-5" y="44" width="10" height="6" fill="#1a2744"/>
    <!-- glow rays -->
    <g stroke="#f5c842" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="-55" y1="-30" x2="-48" y2="-28"/>
      <line x1="55" y1="-30" x2="48" y2="-28"/>
      <line x1="-55" y1="-10" x2="-46" y2="-15"/>
      <line x1="55" y1="-10" x2="46" y2="-15"/>
      <line x1="0" y1="-75" x2="0" y2="-68"/>
    </g>
  </g>

  <!-- TWO OPEN HANDS supporting bulb -->
  <g transform="translate(200,275)">
    <path d="M -50 0 Q -40 -8 -25 -2 L -25 8 Q -40 4 -50 0 Z" fill="#c98a2b" stroke="#5a3210" stroke-width="1.3"/>
    <path d="M 50 0 Q 40 -8 25 -2 L 25 8 Q 40 4 50 0 Z" fill="#c98a2b" stroke="#5a3210" stroke-width="1.3"/>
  </g>

  <!-- LEAF (agro, top-right) -->
  <g transform="translate(335,90)">
    <path d="M 0 0 Q 14 -16 24 -2 Q 18 14 0 8 Z" fill="#52b788" stroke="#1a4d3a" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="20" y2="-6" stroke="#1a4d3a" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- OPEN vs CLOSED toggle (top-left) -->
  <g transform="translate(55,90)" font-family="monospace" font-size="7" font-weight="bold">
    <rect x="0" y="0" width="42" height="14" rx="2" fill="#52b788" fill-opacity="0.35" stroke="#52b788" stroke-width="1"/>
    <text x="21" y="10" text-anchor="middle" fill="#52b788">OPEN</text>
    <rect x="0" y="16" width="42" height="14" rx="2" fill="#1a2744" stroke="#c0cfff" stroke-width="1"/>
    <text x="21" y="26" text-anchor="middle" fill="#c0cfff">CLOSED</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,340)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="380" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Open Innovation · AgroTech · HN</text>
</svg>
