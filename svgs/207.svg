<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg207" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <radialGradient id="glow207" cx="65%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet207" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3556"/>
      <stop offset="100%" stop-color="#0a1e34"/>
    </linearGradient>
    <linearGradient id="sheet207Top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d4d7a"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg207)"/>
  <rect width="400" height="400" rx="32" fill="url(#glow207)"/>

  <!-- ── Stacked spreadsheet sheets (3D angled) ── -->
  <!-- Sheet 3 (back) -->
  <g transform="translate(80, 100) skewY(-8)">
    <rect width="220" height="160" rx="4" fill="url(#sheet207)" stroke="#00bfff" stroke-width="1" stroke-opacity="0.35"/>
    <!-- Header row -->
    <rect width="220" height="14" rx="4" fill="#00bfff" opacity="0.18"/>
    <!-- Grid lines -->
    <g stroke="#00bfff" stroke-width="0.4" opacity="0.25">
      <line x1="0" y1="14" x2="220" y2="14"/>
      <line x1="0" y1="32" x2="220" y2="32"/>
      <line x1="0" y1="50" x2="220" y2="50"/>
      <line x1="0" y1="68" x2="220" y2="68"/>
      <line x1="0" y1="86" x2="220" y2="86"/>
      <line x1="0" y1="104" x2="220" y2="104"/>
      <line x1="0" y1="122" x2="220" y2="122"/>
      <line x1="0" y1="140" x2="220" y2="140"/>
      <line x1="44"  y1="0" x2="44"  y2="160"/>
      <line x1="88"  y1="0" x2="88"  y2="160"/>
      <line x1="132" y1="0" x2="132" y2="160"/>
      <line x1="176" y1="0" x2="176" y2="160"/>
    </g>
  </g>

  <!-- Sheet 2 (mid) -->
  <g transform="translate(70, 120) skewY(-8)">
    <rect width="220" height="160" rx="4" fill="url(#sheet207)" stroke="#00bfff" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="220" height="14" rx="4" fill="#00bfff" opacity="0.22"/>
    <g stroke="#00bfff" stroke-width="0.5" opacity="0.3">
      <line x1="0" y1="14" x2="220" y2="14"/>
      <line x1="0" y1="32" x2="220" y2="32"/>
      <line x1="0" y1="50" x2="220" y2="50"/>
      <line x1="0" y1="68" x2="220" y2="68"/>
      <line x1="0" y1="86" x2="220" y2="86"/>
      <line x1="0" y1="104" x2="220" y2="104"/>
      <line x1="0" y1="122" x2="220" y2="122"/>
      <line x1="0" y1="140" x2="220" y2="140"/>
      <line x1="44"  y1="0" x2="44"  y2="160"/>
      <line x1="88"  y1="0" x2="88"  y2="160"/>
      <line x1="132" y1="0" x2="132" y2="160"/>
      <line x1="176" y1="0" x2="176" y2="160"/>
    </g>
  </g>

  <!-- Sheet 1 (front, brightest) -->
  <g transform="translate(60, 140) skewY(-8)">
    <rect width="220" height="160" rx="4" fill="url(#sheet207Top)" stroke="#00bfff" stroke-width="1.5" stroke-opacity="0.85"/>
    <!-- Header row -->
    <rect width="220" height="14" rx="4" fill="#00bfff" opacity="0.35"/>
    <!-- Column headers ABCD -->
    <g font-family="'Courier New',monospace" font-size="7" fill="#00bfff" opacity="0.85">
      <text x="22"  y="10" text-anchor="middle">A</text>
      <text x="66"  y="10" text-anchor="middle">B</text>
      <text x="110" y="10" text-anchor="middle">C</text>
      <text x="154" y="10" text-anchor="middle">D</text>
      <text x="198" y="10" text-anchor="middle">E</text>
    </g>
    <!-- Grid lines -->
    <g stroke="#00bfff" stroke-width="0.5" opacity="0.4">
      <line x1="0" y1="14" x2="220" y2="14"/>
      <line x1="0" y1="32" x2="220" y2="32"/>
      <line x1="0" y1="50" x2="220" y2="50"/>
      <line x1="0" y1="68" x2="220" y2="68"/>
      <line x1="0" y1="86" x2="220" y2="86"/>
      <line x1="0" y1="104" x2="220" y2="104"/>
      <line x1="0" y1="122" x2="220" y2="122"/>
      <line x1="0" y1="140" x2="220" y2="140"/>
      <line x1="44"  y1="0" x2="44"  y2="160"/>
      <line x1="88"  y1="0" x2="88"  y2="160"/>
      <line x1="132" y1="0" x2="132" y2="160"/>
      <line x1="176" y1="0" x2="176" y2="160"/>
    </g>
    <!-- Cell values (sample data) -->
    <g font-family="'Courier New',monospace" font-size="7" fill="#c0cfff">
      <text x="22"  y="27">2025</text>
      <text x="66"  y="27">2026</text>
      <text x="110" y="27">2027</text>
      <text x="154" y="27">2028</text>
      <text x="198" y="27">2029</text>
      <text x="22"  y="45">142</text>
      <text x="66"  y="45">158</text>
      <text x="110" y="45">175</text>
      <text x="154" y="45">192</text>
      <text x="198" y="45">208</text>
    </g>
    <!-- Highlighted DCF row (gold) -->
    <rect x="0" y="86" width="220" height="18" fill="#f5c842" opacity="0.18"/>
    <text x="22"  y="99" font-family="'Courier New',monospace" font-size="7" fill="#f5c842">NPV</text>

    <!-- Mini sparkline chart in bottom rows -->
    <polyline points="2,150 22,144 44,138 66,128 88,118 110,108 132,98 154,90 176,84 198,76 218,68"
              stroke="#00ff88" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="218" cy="68" r="3" fill="#00ff88"/>
  </g>

  <!-- ── Formula bar (top floating) ── -->
  <g transform="translate(40,55)">
    <rect width="320" height="22" rx="5" fill="#0a0f1e" stroke="#00bfff" stroke-width="1" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#00bfff" opacity="0.25"/>
    <text x="11" y="16" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#00bfff">ƒx</text>
    <text x="32" y="16" font-family="'Courier New',monospace" font-size="9" fill="#00ff88" opacity="0.95">=NPV(WACC, FCFF)/((1+r)^t)</text>
  </g>

  <!-- DCF curve overlay (top-right floating) -->
  <g transform="translate(305,90)">
    <polyline points="0,40 10,36 20,30 30,22 40,12 50,4" stroke="#00ff88" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="4" r="3" fill="#00ff88"/>
    <text x="-2" y="56" font-family="'Courier New',monospace" font-size="7" fill="#00ff88" opacity="0.7">DCF</text>
  </g>

  <!-- Bottom indicator -->
  <text x="200" y="380" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#00bfff" opacity="0.45" letter-spacing="2">3PL VALUATION · 8 ROUNDS</text>
</svg>
