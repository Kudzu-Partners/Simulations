<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg457" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg457)"/>

  <text x="200" y="58" text-anchor="middle" fill="#00ff88" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">ECONOMIC CYCLE · MACRO</text>

  <!-- Cycle phases labels (background) -->
  <g opacity="0.7" font-family="monospace" font-size="6">
    <text x="90" y="120" fill="#52b788" font-weight="bold">EXPANSION</text>
    <text x="290" y="120" text-anchor="end" fill="#f5c842" font-weight="bold">PEAK</text>
    <text x="290" y="320" text-anchor="end" fill="#ff6b6b" font-weight="bold">RECESSION</text>
    <text x="90" y="320" fill="#c0cfff" font-weight="bold">TROUGH</text>
  </g>

  <!-- baseline -->
  <line x1="60" y1="220" x2="350" y2="220" stroke="#c0cfff" stroke-width="0.8" opacity="0.55" stroke-dasharray="3,3"/>

  <!-- SINE WAVE CYCLE (hero) -->
  <path d="M 60 220 Q 110 130 175 130 Q 240 130 290 220 Q 340 310 350 270"
        fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>

  <!-- Phase markers -->
  <circle cx="120" cy="160" r="6" fill="#52b788" stroke="#fff" stroke-width="1.5"/>
  <circle cx="200" cy="125" r="7" fill="#f5c842" stroke="#fff" stroke-width="1.5"/>
  <circle cx="280" cy="230" r="6" fill="#ff6b6b" stroke="#fff" stroke-width="1.5"/>
  <circle cx="340" cy="275" r="6" fill="#c0cfff" stroke="#fff" stroke-width="1.5"/>

  <!-- Current position arrow (we are between peak and recession) -->
  <g transform="translate(245,170)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="14" y2="14" stroke="#ff6b6b" stroke-width="2"/>
    <text x="14" y="32" text-anchor="middle" fill="#ff6b6b" font-size="6" font-family="monospace" font-weight="bold">HOY</text>
  </g>

  <!-- Recession badge (top-right) -->
  <g transform="translate(290,80)">
    <rect x="0" y="0" width="62" height="28" rx="4" fill="#ff6b6b" fill-opacity="0.18" stroke="#ff6b6b" stroke-width="1.3"/>
    <text x="31" y="14" text-anchor="middle" fill="#ff6b6b" font-size="9" font-family="monospace" font-weight="bold">REC ↓</text>
    <text x="31" y="22" text-anchor="middle" fill="#ff6b6b" font-size="6" font-family="monospace" opacity="0.85">signals</text>
  </g>

  <!-- Inflation badge (top-left) -->
  <g transform="translate(55,80)">
    <rect x="0" y="0" width="62" height="28" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.3"/>
    <text x="31" y="14" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" font-weight="bold">INFL ↑</text>
    <text x="31" y="22" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.85">CPI</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,340)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Ciclo · Macro · Manufactura HN</text>
</svg>
