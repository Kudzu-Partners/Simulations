<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg204" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <radialGradient id="syncGlow204" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="circA204" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74b9ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1a3a5c" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="circB204" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1b5e20" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg204)"/>
  <rect width="400" height="400" rx="32" fill="url(#syncGlow204)"/>

  <!-- ── Two overlapping circles (Acquirer + Target → merging) ── -->
  <!-- Circle A (Acquirer) -->
  <circle cx="148" cy="180" r="92" fill="url(#circA204)" stroke="#74b9ff" stroke-width="2.5" opacity="0.85"/>
  <circle cx="148" cy="180" r="92" fill="none" stroke="#74b9ff" stroke-width="1" opacity="0.4"/>
  <text x="105" y="142" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#74b9ff" opacity="0.95" letter-spacing="1">ACQUIRER</text>
  <!-- A internal grid pattern -->
  <g stroke="#74b9ff" stroke-width="0.6" opacity="0.25">
    <line x1="80" y1="180" x2="220" y2="180"/>
    <line x1="148" y1="100" x2="148" y2="260"/>
    <line x1="100" y1="135" x2="200" y2="225"/>
  </g>

  <!-- Circle B (Target) -->
  <circle cx="252" cy="180" r="78" fill="url(#circB204)" stroke="#52b788" stroke-width="2.5" opacity="0.85"/>
  <circle cx="252" cy="180" r="78" fill="none" stroke="#52b788" stroke-width="1" opacity="0.4"/>
  <text x="295" y="142" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#52b788" opacity="0.95" letter-spacing="1">TARGET</text>
  <g stroke="#52b788" stroke-width="0.6" opacity="0.25">
    <line x1="180" y1="180" x2="324" y2="180"/>
    <line x1="252" y1="106" x2="252" y2="254"/>
  </g>

  <!-- Synergy lens (intersection — gold glow) -->
  <ellipse cx="200" cy="180" rx="20" ry="60" fill="#f5c842" opacity="0.28"/>

  <!-- Synergy energy beams -->
  <line x1="184" y1="148" x2="216" y2="148" stroke="#f5c842" stroke-width="1.5" opacity="0.7"/>
  <line x1="180" y1="180" x2="220" y2="180" stroke="#f5c842" stroke-width="2"   opacity="0.85"/>
  <line x1="184" y1="212" x2="216" y2="212" stroke="#f5c842" stroke-width="1.5" opacity="0.7"/>

  <!-- € value badge in lens -->
  <circle cx="200" cy="180" r="14" fill="#1a2744" stroke="#f5c842" stroke-width="2"/>
  <text x="200" y="186" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#f5c842">€</text>

  <!-- Synergy label -->
  <text x="200" y="120" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#f5c842" opacity="0.95" letter-spacing="2">SYNERGY</text>
  <line x1="186" y1="125" x2="214" y2="125" stroke="#f5c842" stroke-width="1" opacity="0.5"/>

  <!-- ── 5 integration workstreams (bottom pipeline) ── -->
  <!-- Stream rail -->
  <rect x="55" y="305" width="290" height="2" rx="1" fill="#c0cfff" opacity="0.25"/>

  <g font-family="'Courier New',monospace" font-size="7" fill="#c0cfff">
    <!-- Stream 1: People -->
    <circle cx="75" cy="306" r="11" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <circle cx="75" cy="302" r="3" fill="#74b9ff"/>
    <path d="M70 309 Q75 311 80 309" stroke="#74b9ff" stroke-width="1.2" fill="none"/>
    <text x="75" y="334" text-anchor="middle" opacity="0.75">PEOPLE</text>

    <!-- Stream 2: Customers -->
    <circle cx="138" cy="306" r="11" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <path d="M132 311 L144 311 M133 304 Q138 300 143 304" stroke="#74b9ff" stroke-width="1.5" fill="none"/>
    <text x="138" y="334" text-anchor="middle" opacity="0.75">CUSTOMERS</text>

    <!-- Stream 3: Tech (center, highlight) -->
    <circle cx="200" cy="306" r="13" fill="#2d3f6b" stroke="#f5c842" stroke-width="2.5"/>
    <rect x="195" y="301" width="10" height="10" rx="1" fill="none" stroke="#f5c842" stroke-width="1.4"/>
    <text x="200" y="334" text-anchor="middle" fill="#f5c842" opacity="0.9">TECH</text>

    <!-- Stream 4: Finance -->
    <circle cx="262" cy="306" r="11" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <text x="262" y="310" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#74b9ff">$</text>
    <text x="262" y="334" text-anchor="middle" opacity="0.75">FINANCE</text>

    <!-- Stream 5: Culture -->
    <circle cx="325" cy="306" r="11" fill="#1a2744" stroke="#74b9ff" stroke-width="2"/>
    <path d="M320 305 Q325 300 330 305 Q330 310 325 312 Q320 310 320 305" fill="#74b9ff" opacity="0.85" stroke="none"/>
    <text x="325" y="334" text-anchor="middle" opacity="0.75">CULTURE</text>
  </g>

  <!-- IMO label and value -->
  <text x="200" y="56" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c0cfff" opacity="0.55" letter-spacing="2">IMO · €2.5B</text>

  <!-- 12 month horizon -->
  <text x="200" y="378" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#c0cfff" opacity="0.4" letter-spacing="1">12-MONTH INTEGRATION</text>
</svg>
