<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg412" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="table412" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#3d1f08"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg412)"/>

  <text x="200" y="58" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">BATNA · ZOPA · NEGOTIATION</text>

  <!-- ZOPA range bar (background top) -->
  <g transform="translate(200,110)">
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#c0cfff" stroke-width="1.5" opacity="0.55"/>
    <!-- buyer reservation -->
    <line x1="-70" y1="-10" x2="-70" y2="10" stroke="#ff6b6b" stroke-width="2"/>
    <text x="-70" y="-15" text-anchor="middle" fill="#ff6b6b" font-size="6" font-family="monospace">RP-B</text>
    <!-- seller reservation -->
    <line x1="60" y1="-10" x2="60" y2="10" stroke="#52b788" stroke-width="2"/>
    <text x="60" y="-15" text-anchor="middle" fill="#52b788" font-size="6" font-family="monospace">RP-S</text>
    <!-- ZOPA zone -->
    <rect x="-70" y="-5" width="130" height="10" fill="#f5c842" fill-opacity="0.5"/>
    <text x="-5" y="22" text-anchor="middle" fill="#f5c842" font-size="7" font-family="monospace" font-weight="bold">ZOPA</text>
  </g>

  <!-- ROUND TABLE (hero, central) -->
  <g transform="translate(200,250)">
    <ellipse cx="0" cy="20" rx="130" ry="14" fill="#000" fill-opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="130" ry="35" fill="url(#table412)" stroke="#3d1f08" stroke-width="2.5"/>
    <ellipse cx="0" cy="-2" rx="130" ry="33" fill="#5a3210" opacity="0.65"/>
    <!-- table top inner -->
    <ellipse cx="0" cy="-5" rx="110" ry="26" fill="#7a4a18" stroke="#3d1f08" stroke-width="1.3"/>
    <!-- two figures across the table -->
    <g>
      <!-- left figure -->
      <circle cx="-92" cy="-26" r="9" fill="#c0cfff"/>
      <path d="M -100 -16 L -100 6 L -84 6 L -84 -16 Z" fill="#1a4480"/>
      <!-- right figure -->
      <circle cx="92" cy="-26" r="9" fill="#f5c842"/>
      <path d="M 84 -16 L 84 6 L 100 6 L 100 -16 Z" fill="#c98a2b"/>
    </g>
    <!-- middle papers -->
    <rect x="-22" y="-15" width="20" height="12" fill="#ffffff" stroke="#1a2744" stroke-width="0.8" transform="rotate(-8 -12 -9)"/>
    <rect x="2" y="-15" width="20" height="12" fill="#ffffff" stroke="#1a2744" stroke-width="0.8" transform="rotate(6 12 -9)"/>
    <!-- coffee cups -->
    <ellipse cx="-50" cy="-12" rx="5" ry="3" fill="#1a2744"/>
    <rect x="-55" y="-14" width="10" height="6" rx="1" fill="#1a2744"/>
    <ellipse cx="50" cy="-12" rx="5" ry="3" fill="#1a2744"/>
    <rect x="45" y="-14" width="10" height="6" rx="1" fill="#1a2744"/>
  </g>

  <!-- STEEL ingot/bar icon (top-right) -->
  <g transform="translate(305,80)">
    <path d="M 0 0 L 46 0 L 50 10 L -4 10 Z" fill="#5a6f9c" stroke="#1a2744" stroke-width="1.5"/>
    <rect x="0" y="10" width="46" height="14" fill="#7a8fb4" stroke="#1a2744" stroke-width="1.3"/>
    <text x="23" y="38" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" opacity="0.85">B2B STEEL</text>
  </g>

  <!-- BATNA shield (top-left) -->
  <g transform="translate(70,90)">
    <path d="M 0 0 L 22 -4 L 22 14 Q 22 24 0 30 Q -22 24 -22 14 L -22 -4 Z"
          fill="#52b788" fill-opacity="0.2" stroke="#52b788" stroke-width="1.4"/>
    <text x="0" y="14" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" font-weight="bold">BATNA</text>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">BATNA · ZOPA · Steel B2B</text>
</svg>
