<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg189" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg189)"/>

  <!-- Bridge silhouette (central, large) -->
  <!-- Bridge deck -->
  <rect x="52" y="220" width="296" height="10" rx="3" fill="#c0cfff" opacity="0.6"/>
  <!-- Left tower -->
  <rect x="112" y="120" width="14" height="110" rx="2" fill="#c0cfff" opacity="0.55"/>
  <!-- Right tower -->
  <rect x="274" y="120" width="14" height="110" rx="2" fill="#c0cfff" opacity="0.55"/>
  <!-- Tower crossbars -->
  <rect x="108" y="148" width="22" height="6" rx="1" fill="#c0cfff" opacity="0.4"/>
  <rect x="108" y="168" width="22" height="6" rx="1" fill="#c0cfff" opacity="0.35"/>
  <rect x="270" y="148" width="22" height="6" rx="1" fill="#c0cfff" opacity="0.4"/>
  <rect x="270" y="168" width="22" height="6" rx="1" fill="#c0cfff" opacity="0.35"/>
  <!-- Suspension cables left tower -->
  <line x1="119" y1="122" x2="52" y2="220" stroke="#c0cfff" stroke-width="1.5" opacity="0.4"/>
  <line x1="119" y1="122" x2="119" y2="220" stroke="#c0cfff" stroke-width="1.5" opacity="0.35"/>
  <line x1="119" y1="122" x2="175" y2="220" stroke="#c0cfff" stroke-width="1.5" opacity="0.35"/>
  <!-- Suspension cables right tower -->
  <line x1="281" y1="122" x2="348" y2="220" stroke="#c0cfff" stroke-width="1.5" opacity="0.4"/>
  <line x1="281" y1="122" x2="281" y2="220" stroke="#c0cfff" stroke-width="1.5" opacity="0.35"/>
  <line x1="281" y1="122" x2="225" y2="220" stroke="#c0cfff" stroke-width="1.5" opacity="0.35"/>
  <!-- Center cable -->
  <line x1="119" y1="122" x2="200" y2="220" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>
  <line x1="281" y1="122" x2="200" y2="220" stroke="#c0cfff" stroke-width="1" opacity="0.25"/>

  <!-- Capital stack layers (vertical, right side) -->
  <!-- Stack positioned below bridge, right area -->
  <rect x="286" y="248" width="70" height="18" rx="3" fill="#e74c3c" opacity="0.25"/>
  <rect x="286" y="248" width="70" height="18" rx="3" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.65"/>
  <text x="321" y="261" font-family="Arial,sans-serif" font-size="7" fill="#e74c3c" text-anchor="middle" opacity="0.8">Equity</text>

  <rect x="286" y="268" width="70" height="18" rx="3" fill="#f5c842" opacity="0.2"/>
  <rect x="286" y="268" width="70" height="18" rx="3" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.65"/>
  <text x="321" y="281" font-family="Arial,sans-serif" font-size="7" fill="#f5c842" text-anchor="middle" opacity="0.8">Mezzanine</text>

  <rect x="286" y="288" width="70" height="18" rx="3" fill="#52b788" opacity="0.2"/>
  <rect x="286" y="288" width="70" height="18" rx="3" fill="none" stroke="#52b788" stroke-width="1.5" opacity="0.65"/>
  <text x="321" y="301" font-family="Arial,sans-serif" font-size="7" fill="#52b788" text-anchor="middle" opacity="0.8">Senior Debt</text>

  <rect x="286" y="308" width="70" height="18" rx="3" fill="#00bfff" opacity="0.2"/>
  <rect x="286" y="308" width="70" height="18" rx="3" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.6"/>
  <text x="321" y="321" font-family="Arial,sans-serif" font-size="7" fill="#00bfff" text-anchor="middle" opacity="0.8">Govt / IFI</text>

  <!-- PPP handshake icon (left side) -->
  <circle cx="80" cy="285" r="30" fill="#f5c842" opacity="0.07"/>
  <circle cx="80" cy="285" r="30" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.4"/>
  <!-- Handshake: two hands -->
  <path d="M 58 285 Q 65 278 75 282 L 85 286 Q 95 282 102 285" fill="none" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <text x="80" y="305" font-family="Arial,sans-serif" font-size="7" fill="#f5c842" text-anchor="middle" opacity="0.7">PPP</text>

  <!-- Risk allocation arrows -->
  <text x="175" y="258" font-family="Arial,sans-serif" font-size="7" fill="#c0cfff" text-anchor="middle" opacity="0.45">Risk Allocation</text>
  <line x1="140" y1="262" x2="110" y2="275" stroke="#c0cfff" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
  <line x1="210" y1="262" x2="240" y2="270" stroke="#c0cfff" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- Phase markers on bridge deck -->
  <circle cx="100" cy="220" r="5" fill="#f5c842" opacity="0.7"/>
  <circle cx="160" cy="220" r="5" fill="#f5c842" opacity="0.6"/>
  <circle cx="200" cy="220" r="5" fill="#52b788" opacity="0.8"/>
  <circle cx="240" cy="220" r="5" fill="#f5c842" opacity="0.6"/>
  <circle cx="300" cy="220" r="5" fill="#f5c842" opacity="0.7"/>

  <!-- Phase labels above deck -->
  <text x="100" y="210" font-family="Arial,sans-serif" font-size="6" fill="#f5c842" text-anchor="middle" opacity="0.6">Dev</text>
  <text x="160" y="210" font-family="Arial,sans-serif" font-size="6" fill="#f5c842" text-anchor="middle" opacity="0.55">Finance</text>
  <text x="200" y="210" font-family="Arial,sans-serif" font-size="6" fill="#52b788" text-anchor="middle" opacity="0.75">Build</text>
  <text x="240" y="210" font-family="Arial,sans-serif" font-size="6" fill="#f5c842" text-anchor="middle" opacity="0.55">Ops</text>
  <text x="300" y="210" font-family="Arial,sans-serif" font-size="6" fill="#f5c842" text-anchor="middle" opacity="0.6">Transfer</text>

  <!-- InfraVerde label -->
  <text x="200" y="358" font-family="Arial,sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.35">InfraVerde · Infrastructure Finance</text>
  <text x="200" y="374" font-family="Arial,sans-serif" font-size="9" fill="#52b788" text-anchor="middle" opacity="0.4" letter-spacing="1">PPP · CAPITAL STACK · LATAM</text>
</svg>
