<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg631" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg631)"/>

  <text x="200" y="56" text-anchor="middle" fill="#e74c3c" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">PHARMA MKT · HYPERTENSION</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Pill bottle + heart pulse (protagonist) -->
    <g transform="translate(200,216)">
      <!-- Bottle body -->
      <rect x="-48" y="-32" width="96" height="120" rx="6" fill="#1a3a5c" stroke="#dfe6e9" stroke-width="3.5"/>
      <!-- Cap -->
      <rect x="-32" y="-56" width="64" height="28" rx="4" fill="#e74c3c" stroke="#0a2342" stroke-width="2.5"/>
      <line x1="-32" y1="-44" x2="32" y2="-44" stroke="#0a2342" stroke-width="1.5" opacity="0.6"/>

      <!-- Label -->
      <rect x="-40" y="-8" width="80" height="80" rx="3" fill="#dfe6e9" stroke="#0a2342" stroke-width="2"/>

      <!-- Heart with pulse line inside label -->
      <g transform="translate(0,16)">
        <path d="M 0 14 C -16 4 -24 -6 -16 -14 C -8 -20 0 -14 0 -8 C 0 -14 8 -20 16 -14 C 24 -6 16 4 0 14 Z"
              fill="#e74c3c" stroke="#0a2342" stroke-width="1.5"/>
      </g>
      <!-- Pulse line below heart -->
      <path d="M -30 50 L -20 50 L -14 38 L -6 58 L 4 50 L 30 50"
            stroke="#e74c3c" stroke-width="2.5" fill="none"/>

      <!-- Pills falling out (decorative) -->
      <ellipse cx="60" cy="36" rx="10" ry="6" fill="#74b9ff" stroke="#0a2342" stroke-width="2" transform="rotate(30,60,36)"/>
      <ellipse cx="76" cy="60" rx="10" ry="6" fill="#dfe6e9" stroke="#0a2342" stroke-width="2" transform="rotate(15,76,60)"/>
    </g>

    <!-- Rx symbol top-left -->
    <g transform="translate(48,84)">
      <rect width="56" height="26" rx="4" fill="#74b9ff" fill-opacity="0.18" stroke="#74b9ff" stroke-width="1.5"/>
      <text x="28" y="18" text-anchor="middle" fill="#74b9ff" font-size="13" font-family="serif" font-weight="bold">℞</text>
    </g>

    <!-- INVIMA badge top-right -->
    <g transform="translate(284,84)">
      <rect width="80" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <text x="40" y="18" text-anchor="middle" fill="#52b788" font-size="11" font-family="monospace" font-weight="bold">INVIMA</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#dfe6e9" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">HTN Medication · CO</text>
</svg>
