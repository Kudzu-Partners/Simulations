<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg315" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#1b3a20"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg315)"/>

  <!-- Circular economy loop (protagonist) -->
  <g transform="translate(200, 195)">
    <!-- Main circular arrow (clockwise) -->
    <circle r="118" fill="none" stroke="#52b788" stroke-width="3" opacity="0.2"/>
    <!-- Arc segments with arrows -->
    <!-- Top arc (Design) -->
    <path d="M -84 -84 A 118 118 0 0 1 84 -84" fill="none" stroke="#52b788" stroke-width="5" stroke-linecap="round"/>
    <polygon points="80,-92 88,-76 96,-90" fill="#52b788"/>
    <!-- Right arc (Use) -->
    <path d="M 118 0 A 118 118 0 0 1 0 118" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
    <polygon points="-8,116 4,128 14,114" fill="#00ff88"/>
    <!-- Bottom arc (Recover) -->
    <path d="M 0 118 A 118 118 0 0 1 -118 0" fill="none" stroke="#f5c842" stroke-width="5" stroke-linecap="round"/>
    <polygon points="-120,-8 -108,4 -120,14" fill="#f5c842"/>
    <!-- Left arc (Remake) -->
    <path d="M -118 0 A 118 118 0 0 1 -84 -84" fill="none" stroke="#74b9ff" stroke-width="5" stroke-linecap="round"/>
    <polygon points="-90,-90 -76,-82 -88,-72" fill="#74b9ff"/>

    <!-- Center icons -->
    <circle r="48" fill="#0a1f0a" stroke="#52b788" stroke-width="2" opacity="0.8"/>
    <text y="-8" text-anchor="middle" font-family="sans-serif" font-size="26">♻️</text>
    <text y="16" text-anchor="middle" font-family="sans-serif" font-size="14">📦</text>

    <!-- Node icons on arc -->
    <text x="0" y="-130" text-anchor="middle" font-family="sans-serif" font-size="20">✏️</text>
    <text x="130" y="0" text-anchor="middle" font-family="sans-serif" font-size="20">🏭</text>
    <text x="0" y="134" text-anchor="middle" font-family="sans-serif" font-size="20">🗑</text>
    <text x="-130" y="0" text-anchor="middle" font-family="sans-serif" font-size="20">🔄</text>
  </g>

  <!-- EPR badge (bottom left) -->
  <g transform="translate(36, 334)">
    <rect x="0" y="0" width="80" height="36" rx="8" fill="#0a1f10" stroke="#52b788" stroke-width="2"/>
    <text x="40" y="16" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#52b788">EPR</text>
    <text x="40" y="28" text-anchor="middle" font-family="sans-serif" font-size="11">⚖️</text>
  </g>

  <!-- Industrial symbiosis arrows (bottom right) -->
  <g transform="translate(230, 334)">
    <rect x="0" y="0" width="134" height="36" rx="8" fill="#0a1f10" stroke="#f5c842" stroke-width="2"/>
    <!-- Waste = resource -->
    <text x="20" y="24" font-family="sans-serif" font-size="20">🗑</text>
    <line x1="40" y1="18" x2="60" y2="18" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="56,13 66,18 56,23" fill="#f5c842"/>
    <text x="78" y="24" font-family="sans-serif" font-size="20">⚡</text>
    <line x1="98" y1="18" x2="118" y2="18" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="114,13 124,18 114,23" fill="#f5c842"/>
  </g>
</svg>
