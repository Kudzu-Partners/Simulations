<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg487" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="paper487" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6e9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg487)"/>

  <text x="200" y="58" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">TAX PLANNING · TRANSFER PRICING</text>

  <!-- BALANCE SCALE (hero, central) -->
  <g transform="translate(200,250)">
    <rect x="-3" y="-50" width="6" height="80" fill="#f5c842"/>
    <line x1="-80" y1="-50" x2="80" y2="-50" stroke="#f5c842" stroke-width="5" stroke-linecap="round"/>
    <polygon points="0,-50 -10,-40 0,-32 10,-40" fill="#f5c842" stroke="#5a3210" stroke-width="1.3"/>
    <rect x="-14" y="30" width="28" height="10" fill="#5a3210"/>
    <!-- left: paying $ tax -->
    <line x1="-80" y1="-50" x2="-80" y2="-25" stroke="#c0cfff" stroke-width="0.8"/>
    <ellipse cx="-80" cy="-20" rx="32" ry="6" fill="#52b788" stroke="#1a4d3a" stroke-width="1.3"/>
    <circle cx="-80" cy="-28" r="9" fill="#f5c842" stroke="#5a3210" stroke-width="1"/>
    <text x="-80" y="-25" text-anchor="middle" fill="#5a3210" font-size="9" font-family="Georgia" font-weight="bold">$</text>
    <!-- right: compliance paper -->
    <line x1="80" y1="-50" x2="80" y2="-25" stroke="#c0cfff" stroke-width="0.8"/>
    <ellipse cx="80" cy="-20" rx="32" ry="6" fill="#c0cfff" fill-opacity="0.45" stroke="#1a2744" stroke-width="1.3"/>
    <rect x="68" y="-44" width="24" height="22" rx="2" fill="url(#paper487)" stroke="#1a2744" stroke-width="1.2"/>
    <line x1="71" y1="-39" x2="89" y2="-39" stroke="#1a2744" stroke-width="0.5"/>
    <line x1="71" y1="-34" x2="86" y2="-34" stroke="#1a2744" stroke-width="0.5"/>
    <line x1="71" y1="-29" x2="89" y2="-29" stroke="#1a2744" stroke-width="0.5"/>
  </g>

  <!-- SAR badge (top-right) -->
  <g transform="translate(285,80)">
    <rect x="0" y="0" width="70" height="30" rx="4" fill="#ff6b6b" fill-opacity="0.18" stroke="#ff6b6b" stroke-width="1.3"/>
    <text x="35" y="14" text-anchor="middle" fill="#ff6b6b" font-size="11" font-family="monospace" font-weight="bold">SAR</text>
    <text x="35" y="24" text-anchor="middle" fill="#ff6b6b" font-size="5" font-family="monospace" opacity="0.85">tax authority</text>
  </g>

  <!-- ALD (Anti-Lavado) badge (top-left) -->
  <g transform="translate(50,80)">
    <rect x="0" y="0" width="64" height="30" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.3"/>
    <text x="32" y="14" text-anchor="middle" fill="#52b788" font-size="11" font-family="monospace" font-weight="bold">ALD</text>
    <text x="32" y="24" text-anchor="middle" fill="#52b788" font-size="5" font-family="monospace" opacity="0.85">compliance</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,340)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Tax Planning · TP · SAR · HN</text>
</svg>
