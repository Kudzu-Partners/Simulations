<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg404" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg404)"/>

  <text x="200" y="58" text-anchor="middle" fill="#00bfff" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">AGILE AT SCALE · SCRUM</text>

  <!-- SCRUM BOARD (background) -->
  <g transform="translate(200,330)" opacity="0.7">
    <rect x="-120" y="-32" width="240" height="60" rx="3" fill="#1c2333" stroke="#c0cfff" stroke-width="1.3"/>
    <line x1="-60" y1="-32" x2="-60" y2="28" stroke="#c0cfff" stroke-width="0.8" opacity="0.55"/>
    <line x1="0" y1="-32" x2="0" y2="28" stroke="#c0cfff" stroke-width="0.8" opacity="0.55"/>
    <line x1="60" y1="-32" x2="60" y2="28" stroke="#c0cfff" stroke-width="0.8" opacity="0.55"/>
    <!-- column headers -->
    <text x="-90" y="-22" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" font-weight="bold">TODO</text>
    <text x="-30" y="-22" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" font-weight="bold">DOING</text>
    <text x="30" y="-22" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" font-weight="bold">REVIEW</text>
    <text x="90" y="-22" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" font-weight="bold">DONE</text>
    <!-- sticky notes -->
    <rect x="-110" y="-14" width="20" height="14" rx="1" fill="#f5c842"/>
    <rect x="-110" y="2" width="20" height="14" rx="1" fill="#f5c842"/>
    <rect x="-50" y="-14" width="20" height="14" rx="1" fill="#ff6b9d"/>
    <rect x="10" y="-14" width="20" height="14" rx="1" fill="#c0cfff"/>
    <rect x="70" y="-14" width="20" height="14" rx="1" fill="#52b788"/>
    <rect x="70" y="2" width="20" height="14" rx="1" fill="#52b788"/>
    <rect x="92" y="2" width="20" height="14" rx="1" fill="#52b788"/>
  </g>

  <!-- SPRINT LOOP (hero, central) -->
  <g transform="translate(200,205)">
    <!-- main loop (circular sprint arrow) -->
    <path d="M 0 -75 A 75 75 0 1 1 -72 22" fill="none" stroke="#00bfff" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-72,22 -64,12 -78,32" fill="#00bfff"/>
    <!-- inner cycle markers (4 sprint events) -->
    <g fill="#00bfff">
      <circle cx="0" cy="-75" r="5"/>
      <circle cx="75" cy="0" r="5"/>
      <circle cx="0" cy="75" r="5"/>
      <circle cx="-75" cy="0" r="5"/>
    </g>
    <!-- labels -->
    <text x="0" y="-83" text-anchor="middle" fill="#00bfff" font-size="6" font-family="monospace" font-weight="bold">PLAN</text>
    <text x="84" y="3" fill="#00bfff" font-size="6" font-family="monospace" font-weight="bold">DAILY</text>
    <text x="0" y="92" text-anchor="middle" fill="#00bfff" font-size="6" font-family="monospace" font-weight="bold">DEMO</text>
    <text x="-84" y="3" text-anchor="end" fill="#00bfff" font-size="6" font-family="monospace" font-weight="bold">RETRO</text>
    <!-- center text -->
    <circle cx="0" cy="0" r="28" fill="#1a2744" stroke="#7b2fff" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace" font-weight="bold">SPRINT</text>
    <text x="0" y="10" text-anchor="middle" fill="#fff" font-size="6" font-family="monospace" opacity="0.85">2 weeks</text>
  </g>

  <!-- SAFe / LeSS / Scrum@Scale chips (top-left) -->
  <g transform="translate(50,80)">
    <rect x="0" y="0" width="36" height="14" rx="2" fill="#7b2fff" fill-opacity="0.3" stroke="#7b2fff" stroke-width="1"/>
    <text x="18" y="10" text-anchor="middle" fill="#7b2fff" font-size="7" font-family="monospace" font-weight="bold">SAFe</text>
    <rect x="0" y="18" width="36" height="14" rx="2" fill="#7b2fff" fill-opacity="0.3" stroke="#7b2fff" stroke-width="1"/>
    <text x="18" y="28" text-anchor="middle" fill="#7b2fff" font-size="7" font-family="monospace" font-weight="bold">LeSS</text>
    <rect x="0" y="36" width="36" height="14" rx="2" fill="#7b2fff" fill-opacity="0.3" stroke="#7b2fff" stroke-width="1"/>
    <text x="18" y="46" text-anchor="middle" fill="#7b2fff" font-size="6" font-family="monospace" font-weight="bold">S@S</text>
  </g>

  <!-- BUILD/BUY/PARTNER (top-right) -->
  <g transform="translate(280,80)">
    <rect x="0" y="0" width="70" height="50" rx="3" fill="#52b788" fill-opacity="0.15" stroke="#52b788" stroke-width="1.3"/>
    <text x="35" y="14" text-anchor="middle" fill="#52b788" font-size="6" font-family="monospace" font-weight="bold">BUILD</text>
    <line x1="6" y1="20" x2="64" y2="20" stroke="#52b788" stroke-width="0.6" opacity="0.55"/>
    <text x="35" y="30" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" font-weight="bold">BUY</text>
    <line x1="6" y1="34" x2="64" y2="34" stroke="#52b788" stroke-width="0.6" opacity="0.55"/>
    <text x="35" y="44" text-anchor="middle" fill="#ff6b9d" font-size="6" font-family="monospace" font-weight="bold">PARTNER</text>
  </g>

  <!-- MEXICO pin -->
  <g transform="translate(60,210)">
    <rect x="-10" y="-7" width="7" height="14" fill="#1b5e20" opacity="0.9"/>
    <rect x="-3" y="-7" width="7" height="14" fill="#ffffff" opacity="0.9"/>
    <rect x="4" y="-7" width="7" height="14" fill="#c0392b" opacity="0.9"/>
  </g>

  <text x="200" y="380" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Agile@Scale · Fintech · México</text>
</svg>
