<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg438" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg438)"/>

  <text x="200" y="58" text-anchor="middle" fill="#00bfff" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">CALIBRATION · OKR · PERFORMANCE</text>

  <!-- BELL CURVE (hero) -->
  <g transform="translate(200,230)">
    <line x1="-140" y1="50" x2="140" y2="50" stroke="#c0cfff" stroke-width="1.2" opacity="0.55"/>
    <path d="M -130 50 Q -100 50 -85 40 Q -65 20 -45 -10 Q -25 -40 0 -50 Q 25 -40 45 -10 Q 65 20 85 40 Q 100 50 130 50 Z"
          fill="#00bfff" fill-opacity="0.15" stroke="#00bfff" stroke-width="2.5"/>
    <!-- segments under curve -->
    <line x1="-65" y1="50" x2="-65" y2="20" stroke="#c0cfff" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2"/>
    <line x1="65" y1="50" x2="65" y2="20" stroke="#c0cfff" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2"/>
    <!-- labels: ratings -->
    <g font-family="monospace" font-size="7" font-weight="bold">
      <text x="-95" y="65" text-anchor="middle" fill="#ff6b6b">10%</text>
      <text x="-95" y="78" text-anchor="middle" fill="#ff6b6b" font-size="6" font-weight="normal">PIP</text>
      <text x="0" y="65" text-anchor="middle" fill="#52b788">70%</text>
      <text x="0" y="78" text-anchor="middle" fill="#52b788" font-size="6" font-weight="normal">MEETS</text>
      <text x="95" y="65" text-anchor="middle" fill="#f5c842">20%</text>
      <text x="95" y="78" text-anchor="middle" fill="#f5c842" font-size="6" font-weight="normal">EXCEEDS</text>
    </g>
    <!-- needle at center (calibration) -->
    <line x1="0" y1="-50" x2="0" y2="55" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="3,2"/>
    <polygon points="0,-50 -4,-44 4,-44" fill="#f5c842"/>
  </g>

  <!-- OKR target mini (top-left) -->
  <g transform="translate(60,95)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#7b2fff" stroke-width="2"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#7b2fff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="7" fill="#7b2fff" fill-opacity="0.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#fff" font-size="7" font-family="monospace" font-weight="bold">OKR</text>
  </g>

  <!-- RETENTION badge (top-right) -->
  <g transform="translate(295,90)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.3"/>
    <text x="30" y="14" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" font-weight="bold">RETAIN</text>
    <text x="30" y="23" text-anchor="middle" fill="#52b788" font-size="6" font-family="monospace" opacity="0.85">talent</text>
  </g>

  <!-- EL SALVADOR pin -->
  <g transform="translate(345,340)">
    <circle cx="0" cy="0" r="11" fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <rect x="-9" y="-1.5" width="18" height="3" fill="#c0cfff" opacity="0.85"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Calibración · Fintech · SV</text>
</svg>
