<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg144" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg144)"/>

  <!-- Balance beam -->
  <rect x="188" y="172" width="24" height="120" rx="4" fill="#d8f3dc" opacity="0.3"/>
  <!-- Fulcrum triangle -->
  <polygon points="200,292 170,332 230,332" fill="#52b788" opacity="0.7"/>
  <!-- Base -->
  <rect x="155" y="330" width="90" height="10" rx="5" fill="#52b788" opacity="0.5"/>

  <!-- Horizontal beam -->
  <rect x="70" y="168" width="260" height="10" rx="5" fill="#d8f3dc" opacity="0.55"/>

  <!-- Left chain -->
  <line x1="105" y1="178" x2="105" y2="215" stroke="#d8f3dc" stroke-width="2" opacity="0.5" stroke-dasharray="4 3"/>
  <!-- Right chain -->
  <line x1="295" y1="178" x2="295" y2="215" stroke="#d8f3dc" stroke-width="2" opacity="0.5" stroke-dasharray="4 3"/>

  <!-- Left pan -->
  <path d="M 68 218 Q 105 228 142 218" fill="none" stroke="#52b788" stroke-width="3" opacity="0.85"/>
  <path d="M 68 218 L 68 222 Q 105 234 142 222 L 142 218" fill="#52b788" opacity="0.2"/>

  <!-- Right pan -->
  <path d="M 258 218 Q 295 228 332 218" fill="none" stroke="#52b788" stroke-width="3" opacity="0.85"/>
  <path d="M 258 218 L 258 222 Q 295 234 332 222 L 332 218" fill="#52b788" opacity="0.2"/>

  <!-- Left pan content: wheat/crop sprout -->
  <line x1="105" y1="222" x2="105" y2="192" stroke="#52b788" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- Leaves -->
  <path d="M 105 210 Q 88 202 84 192" fill="none" stroke="#52b788" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 105 202 Q 122 194 126 184" fill="none" stroke="#52b788" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Wheat head -->
  <ellipse cx="105" cy="188" rx="7" ry="12" fill="#d8f3dc" opacity="0.7"/>
  <!-- Small grain dots -->
  <circle cx="100" cy="196" r="3" fill="#d8f3dc" opacity="0.6"/>
  <circle cx="110" cy="196" r="3" fill="#d8f3dc" opacity="0.6"/>
  <circle cx="105" cy="186" r="3" fill="#d8f3dc" opacity="0.7"/>
  <!-- Label -->
  <text x="105" y="250" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.6">Social</text>

  <!-- Right pan content: bank/columns -->
  <rect x="273" y="196" width="44" height="26" rx="2" fill="#d8f3dc" opacity="0.12"/>
  <rect x="273" y="196" width="44" height="4" rx="1" fill="#d8f3dc" opacity="0.5"/>
  <!-- Columns -->
  <rect x="278" y="200" width="7" height="20" rx="1" fill="#d8f3dc" opacity="0.45"/>
  <rect x="290" y="200" width="7" height="20" rx="1" fill="#d8f3dc" opacity="0.45"/>
  <rect x="302" y="200" width="7" height="20" rx="1" fill="#d8f3dc" opacity="0.45"/>
  <!-- Base -->
  <rect x="271" y="220" width="48" height="4" rx="1" fill="#d8f3dc" opacity="0.5"/>
  <!-- Label -->
  <text x="295" y="250" font-family="Arial,sans-serif" font-size="9" fill="#d8f3dc" text-anchor="middle" opacity="0.6">Financial</text>

  <!-- Pivot dot -->
  <circle cx="200" cy="172" r="8" fill="#52b788" opacity="0.9"/>

  <!-- Dual scorecard label -->
  <text x="200" y="118" font-family="Arial,sans-serif" font-size="11" fill="#d8f3dc" text-anchor="middle" opacity="0.55" letter-spacing="2">DUAL SCORECARD</text>
  <!-- 12K members -->
  <text x="200" y="88" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#52b788" text-anchor="middle" opacity="0.85">12K</text>
  <text x="200" y="106" font-family="Arial,sans-serif" font-size="10" fill="#d8f3dc" text-anchor="middle" opacity="0.4">members</text>

  <!-- Decorative grid dots -->
  <circle cx="340" cy="80" r="2" fill="#d8f3dc" opacity="0.15"/>
  <circle cx="355" cy="80" r="2" fill="#d8f3dc" opacity="0.15"/>
  <circle cx="340" cy="95" r="2" fill="#d8f3dc" opacity="0.15"/>
  <circle cx="355" cy="95" r="2" fill="#d8f3dc" opacity="0.15"/>
  <circle cx="60" cy="80" r="2" fill="#d8f3dc" opacity="0.15"/>
  <circle cx="45" cy="80" r="2" fill="#d8f3dc" opacity="0.15"/>
  <circle cx="60" cy="95" r="2" fill="#d8f3dc" opacity="0.15"/>
  <circle cx="45" cy="95" r="2" fill="#d8f3dc" opacity="0.15"/>
</svg>
