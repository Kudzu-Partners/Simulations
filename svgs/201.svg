<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg201" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <radialGradient id="glow201" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qHigh201" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="qLow201" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0cfff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#c0cfff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg201)"/>
  <rect width="400" height="400" rx="32" fill="url(#glow201)"/>

  <!-- Power × Interest matrix -->
  <rect x="60" y="60" width="280" height="280" rx="6" fill="none" stroke="#c0cfff" stroke-width="1.2" stroke-opacity="0.28"/>
  <line x1="200" y1="60" x2="200" y2="340" stroke="#c0cfff" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="60" y1="200" x2="340" y2="200" stroke="#c0cfff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Quadrant fills -->
  <rect x="200" y="60"  width="140" height="140" fill="url(#qHigh201)"/>
  <rect x="60"  y="60"  width="140" height="140" fill="url(#qLow201)"/>
  <rect x="60"  y="200" width="140" height="140" fill="url(#qLow201)"/>
  <rect x="200" y="200" width="140" height="140" fill="url(#qLow201)"/>

  <!-- Axis labels -->
  <text x="200" y="48" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c0cfff" opacity="0.55" letter-spacing="2">INTEREST →</text>
  <text x="38" y="200" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c0cfff" opacity="0.55" letter-spacing="2" transform="rotate(-90,38,200)">POWER ↑</text>

  <!-- Quadrant labels -->
  <text x="270" y="80" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" fill="#f5c842" opacity="0.85" letter-spacing="1">MANAGE CLOSELY</text>
  <text x="130" y="80" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" fill="#c0cfff" opacity="0.55">KEEP SATISFIED</text>
  <text x="270" y="328" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" fill="#c0cfff" opacity="0.55">KEEP INFORMED</text>
  <text x="130" y="328" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" fill="#c0cfff" opacity="0.45">MONITOR</text>

  <!-- Coalition connection lines (dashed gold between champions) -->
  <line x1="252" y1="118" x2="298" y2="148" stroke="#f5c842" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="298" y1="148" x2="262" y2="172" stroke="#f5c842" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="252" y1="118" x2="262" y2="172" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Stakeholder nodes -->
  <!-- High power, high interest (champions) - gold -->
  <circle cx="252" cy="118" r="13" fill="#1a2744" stroke="#f5c842" stroke-width="2.5"/>
  <circle cx="252" cy="113" r="4" fill="#f5c842" opacity="0.85"/>
  <path d="M244 124 Q252 128 260 124" stroke="#f5c842" stroke-width="1.5" fill="none" opacity="0.85"/>

  <circle cx="298" cy="148" r="11" fill="#1a2744" stroke="#f5c842" stroke-width="2.2"/>
  <circle cx="298" cy="143" r="3.5" fill="#f5c842" opacity="0.85"/>
  <path d="M291 153 Q298 156 305 153" stroke="#f5c842" stroke-width="1.3" fill="none" opacity="0.85"/>

  <circle cx="262" cy="172" r="10" fill="#1a2744" stroke="#f5c842" stroke-width="2"/>
  <circle cx="262" cy="167" r="3" fill="#f5c842" opacity="0.85"/>
  <path d="M256 176 Q262 179 268 176" stroke="#f5c842" stroke-width="1.2" fill="none" opacity="0.85"/>

  <!-- High power, low interest (resistance — red ring) -->
  <circle cx="148" cy="125" r="12" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2.5"/>
  <circle cx="148" cy="120" r="4" fill="#ff6b6b" opacity="0.85"/>
  <path d="M141 130 Q148 134 155 130" stroke="#ff6b6b" stroke-width="1.4" fill="none" opacity="0.85"/>
  <circle cx="148" cy="125" r="18" fill="none" stroke="#ff6b6b" stroke-width="1.2" opacity="0.4"/>
  <text x="148" y="153" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#ff6b6b" opacity="0.85">RESIST</text>

  <!-- Low power, high interest (engaged) -->
  <circle cx="248" cy="262" r="9" fill="#1a2744" stroke="#74b9ff" stroke-width="1.8"/>
  <circle cx="248" cy="258" r="3" fill="#74b9ff" opacity="0.8"/>
  <path d="M243 266 Q248 268 253 266" stroke="#74b9ff" stroke-width="1.2" fill="none" opacity="0.8"/>

  <circle cx="290" cy="290" r="8" fill="#1a2744" stroke="#74b9ff" stroke-width="1.6"/>
  <circle cx="290" cy="286" r="2.5" fill="#74b9ff" opacity="0.8"/>

  <!-- Low/low (background) -->
  <circle cx="120" cy="280" r="7" fill="#1a2744" stroke="#c0cfff" stroke-width="1.2" opacity="0.5"/>
  <circle cx="155" cy="305" r="6" fill="#1a2744" stroke="#c0cfff" stroke-width="1.2" opacity="0.4"/>
  <circle cx="98"  cy="240" r="6" fill="#1a2744" stroke="#c0cfff" stroke-width="1.2" opacity="0.4"/>

  <!-- Quick win arrow (rising bolt-like) -->
  <path d="M70 360 L130 320 L150 340 L210 280" stroke="#52b788" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="2,3" opacity="0.55"/>
  <circle cx="210" cy="280" r="4" fill="#52b788" opacity="0.85"/>
  <text x="138" y="378" font-family="'Courier New',monospace" font-size="8" fill="#52b788" opacity="0.7" letter-spacing="1">QUICK WINS</text>

  <!-- Coalition badge -->
  <rect x="260" y="62" width="58" height="14" rx="4" fill="#f5c842" opacity="0.18" stroke="#f5c842" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="289" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" font-weight="bold" fill="#f5c842" opacity="0.9">COALITION</text>
</svg>
