<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg454" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <radialGradient id="globe454" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0a2418"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg454)"/>

  <text x="200" y="58" text-anchor="middle" fill="#00ff88" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">MACRO · 100M USD · LATAM</text>

  <!-- 5 scenarios as rays from globe (background) -->
  <g opacity="0.55">
    <line x1="200" y1="220" x2="60" y2="120" stroke="#f5c842" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="200" y1="220" x2="340" y2="120" stroke="#52b788" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="200" y1="220" x2="350" y2="220" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="200" y1="220" x2="60" y2="220" stroke="#c0cfff" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="200" y1="220" x2="200" y2="330" stroke="#7b2fff" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- GLOBE (hero, central) -->
  <g transform="translate(200,220)">
    <circle cx="0" cy="0" r="68" fill="url(#globe454)" stroke="#52b788" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="68" ry="22" fill="none" stroke="#c0cfff" stroke-width="0.8" stroke-opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="35" ry="68" fill="none" stroke="#c0cfff" stroke-width="0.8" stroke-opacity="0.55"/>
    <path d="M -25 -20 q 14 -8 24 4 q -4 14 -20 8 q -10 -10 -4 -12" fill="#52b788" opacity="0.85"/>
    <path d="M 12 25 q 12 -2 18 6 q -4 12 -18 4 z" fill="#52b788" opacity="0.85"/>
    <!-- center $100M -->
    <circle cx="0" cy="0" r="24" fill="#1a2744" stroke="#00ff88" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" fill="#00ff88" font-size="11" font-family="Georgia, serif" font-weight="bold">$100M</text>
  </g>

  <!-- 5 SCENARIO labels at ray ends -->
  <g font-family="monospace" font-size="6" font-weight="bold">
    <g transform="translate(50,115)">
      <circle cx="0" cy="0" r="11" fill="#f5c842" stroke="#1a2744" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#1a2744">US↓</text>
    </g>
    <g transform="translate(350,115)">
      <circle cx="0" cy="0" r="11" fill="#52b788" stroke="#1a2744" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#fff">COMM</text>
    </g>
    <g transform="translate(355,225)">
      <circle cx="0" cy="0" r="11" fill="#ff6b6b" stroke="#1a2744" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#fff">INFL</text>
    </g>
    <g transform="translate(45,225)">
      <circle cx="0" cy="0" r="11" fill="#c0cfff" stroke="#1a2744" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#1a2744">BR↓</text>
    </g>
    <g transform="translate(200,335)">
      <circle cx="0" cy="0" r="11" fill="#7b2fff" stroke="#1a2744" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#fff">POL</text>
    </g>
  </g>

  <!-- ASSET allocation pie mini (top-left) -->
  <g transform="translate(70,90)" opacity="0.85">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#c0cfff" stroke-width="0.7"/>
    <path d="M 0 0 L 0 -14 A 14 14 0 0 1 14 0 Z" fill="#52b788"/>
    <path d="M 0 0 L 14 0 A 14 14 0 0 1 -8 12 Z" fill="#f5c842"/>
    <path d="M 0 0 L -8 12 A 14 14 0 0 1 0 -14 Z" fill="#ff6b9d"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Macro · Portfolio · LATAM</text>
</svg>
