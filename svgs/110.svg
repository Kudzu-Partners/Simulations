<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg110" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="brain110" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#7b2fff"/>
    </linearGradient>
    <radialGradient id="halo110" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7b2fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg110)"/>
  <circle cx="200" cy="180" r="140" fill="url(#halo110)"/>
  <!-- Brain silhouette (left hemisphere drawn, mirrored) -->
  <g transform="translate(200 180)">
    <!-- Brain body -->
    <path d="M-90 -10
             Q-100 -50 -70 -70
             Q-65 -88 -40 -90
             Q-25 -102 -5 -98
             Q0 -104 10 -100
             Q35 -106 55 -88
             Q82 -84 90 -55
             Q105 -40 95 -15
             Q102 5 88 25
             Q90 50 60 58
             Q35 72 10 65
             Q-15 75 -40 62
             Q-70 60 -82 38
             Q-100 20 -90 -10 Z"
          fill="url(#brain110)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Folds -->
    <g fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.55" stroke-linecap="round">
      <path d="M-60 -55 Q-40 -45 -50 -25 Q-65 -10 -45 5"/>
      <path d="M-15 -75 Q-5 -55 -20 -40 Q-30 -25 -15 -10 Q0 5 -15 25"/>
      <path d="M30 -70 Q15 -50 30 -35 Q45 -20 30 -5 Q15 10 30 30"/>
      <path d="M65 -50 Q50 -30 65 -15 Q80 5 60 25"/>
    </g>
    <!-- Central division -->
    <path d="M0 -100 Q0 -50 0 65" stroke="#ffffff" stroke-width="2" opacity="0.4" fill="none"/>
  </g>
  <!-- EEG electrodes on top of brain -->
  <g fill="#00bfff" stroke="#ffffff" stroke-width="1.5">
    <circle cx="155" cy="100" r="6"/>
    <circle cx="200" cy="88" r="6"/>
    <circle cx="245" cy="100" r="6"/>
  </g>
  <!-- EEG wires -->
  <g stroke="#00bfff" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M155 100 Q140 70 90 60"/>
    <path d="M200 88 Q200 60 200 45"/>
    <path d="M245 100 Q260 70 310 60"/>
  </g>
  <!-- EEG waveform across bottom -->
  <g stroke="#00ff88" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M40 350 L80 350 L90 320 L100 380 L115 340 L130 360 L150 350 L170 350 L180 315 L195 385 L210 335 L225 365 L245 350 L280 350 L290 325 L302 375 L315 345 L335 355 L360 350"/>
  </g>
</svg>
