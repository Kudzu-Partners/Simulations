<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="60%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#7b2fff"/>
    </linearGradient>
    <linearGradient id="shiftCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#c0cfff" stroke-opacity="0.07" stroke-width="1">
    <line x1="80" y1="80" x2="80" y2="320"/>
    <line x1="140" y1="80" x2="140" y2="320"/>
    <line x1="200" y1="80" x2="200" y2="320"/>
    <line x1="260" y1="80" x2="260" y2="320"/>
    <line x1="320" y1="80" x2="320" y2="320"/>
    <line x1="60" y1="120" x2="360" y2="120"/>
    <line x1="60" y1="180" x2="360" y2="180"/>
    <line x1="60" y1="240" x2="360" y2="240"/>
  </g>

  <!-- Axes -->
  <line x1="68" y1="310" x2="355" y2="310" stroke="#c0cfff" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="68" y1="310" x2="68" y2="75" stroke="#c0cfff" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Axis arrows -->
  <polygon points="355,307 362,310 355,313" fill="#c0cfff" opacity="0.4"/>
  <polygon points="65,78 68,70 71,78" fill="#c0cfff" opacity="0.4"/>

  <!-- Axis labels -->
  <text x="210" y="340" text-anchor="middle" fill="#c0cfff" font-size="11" font-family="monospace" opacity="0.5">DURACIÓN (años)</text>
  <text x="40" y="195" text-anchor="middle" fill="#c0cfff" font-size="11" font-family="monospace" opacity="0.5" transform="rotate(-90, 40, 195)">TASA (%)</text>

  <!-- X-axis duration labels -->
  <text x="80" y="324" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.5">1Y</text>
  <text x="140" y="324" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.5">3Y</text>
  <text x="200" y="324" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.5">5Y</text>
  <text x="260" y="324" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.5">10Y</text>
  <text x="320" y="324" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.5">30Y</text>

  <!-- SHIFTED yield curve (before — dashed, warmer) -->
  <path d="M80,260 C95,245 115,225 140,205 C165,185 190,168 220,158 C250,148 280,145 320,143"
        fill="none" stroke="url(#shiftCurve)" stroke-width="2" stroke-dasharray="7,5"/>

  <!-- MAIN yield curve (current — solid, gradient) -->
  <path d="M80,285 C95,262 115,237 140,210 C165,183 190,164 220,150 C250,136 280,130 320,126"
        fill="none" stroke="url(#curveGrad)" stroke-width="3.5"/>
  <!-- Area under main curve -->
  <path d="M80,310 L80,285 C95,262 115,237 140,210 C165,183 190,164 220,150 C250,136 280,130 320,126 L320,310 Z"
        fill="#00ff88" fill-opacity="0.05"/>

  <!-- Bond dots on main curve -->
  <!-- 1Y bond -->
  <circle cx="80" cy="285" r="7" fill="#00ff88" opacity="0.9" stroke="#0a0f1e" stroke-width="1.5"/>
  <!-- 3Y bond -->
  <circle cx="140" cy="210" r="7" fill="#00bfff" opacity="0.85" stroke="#0a0f1e" stroke-width="1.5"/>
  <!-- 5Y bond -->
  <circle cx="200" cy="158" r="8" fill="#00bfff" opacity="0.9" stroke="#0a0f1e" stroke-width="1.5"/>
  <!-- 10Y bond -->
  <circle cx="260" cy="138" r="7" fill="#7b2fff" opacity="0.85" stroke="#0a0f1e" stroke-width="1.5"/>
  <!-- 30Y bond (big portfolio position) -->
  <circle cx="320" cy="126" r="10" fill="#7b2fff" opacity="0.9" stroke="#0a0f1e" stroke-width="1.5"/>
  <!-- Large bond indicator ring -->
  <circle cx="320" cy="126" r="16" fill="none" stroke="#7b2fff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Portfolio label -->
  <text x="200" y="90" text-anchor="middle" fill="#00ff88" font-size="11" font-family="monospace" opacity="0.65">COP 850B</text>
  <text x="200" y="104" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.45">Fiduciaria Central S.A.</text>

  <!-- Shift arrow (macro change) -->
  <path d="M170,175 L170,158" stroke="#ffd166" stroke-width="2" stroke-opacity="0.7" marker-end="url(#arr)"/>
  <polygon points="167,158 170,148 173,158" fill="#ffd166" opacity="0.7"/>
  <text x="155" y="145" fill="#ffd166" font-size="9" font-family="monospace" opacity="0.65">macro</text>
</svg>
