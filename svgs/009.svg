<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg009" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="alertGlow009" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg009)"/>

  <!-- Alert pulse rings (concentric, red, fading outward) -->
  <circle cx="200" cy="205" r="140" fill="none" stroke="#e74c3c" stroke-width="1" stroke-opacity="0.12"/>
  <circle cx="200" cy="205" r="112" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.20"/>
  <circle cx="200" cy="205" r="85" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.30"/>
  <circle cx="200" cy="205" r="58" fill="none" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Red glow behind lock -->
  <circle cx="200" cy="205" r="90" fill="url(#alertGlow009)"/>

  <!-- Padlock shackle (U-shape) -->
  <path d="M 168,195 L 168,158 Q 168,125 200,125 Q 232,125 232,158 L 232,195"
        fill="none" stroke="#f5c842" stroke-width="9" stroke-linecap="round" stroke-opacity="0.88"/>
  <!-- Shackle break (crack at top-right) -->
  <path d="M 225,145 L 235,138 L 228,152"
        fill="none" stroke="#e74c3c" stroke-width="4" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- Lock body -->
  <rect x="152" y="192" width="96" height="82" rx="10" fill="#1a1a2e" fill-opacity="0.85" stroke="#f5c842" stroke-width="2.5" stroke-opacity="0.80"/>

  <!-- Crack across lock body -->
  <path d="M 178,192 L 188,220 L 178,240 L 190,282"
        fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.90"/>

  <!-- "60" inside lock body -->
  <text x="210" y="248" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#f5c842" text-anchor="middle" opacity="0.92">60</text>

  <!-- Warning triangles (top corners) -->
  <polygon points="68,72 52,100 84,100" fill="none" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.65"/>
  <text x="68" y="96" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" opacity="0.70">!</text>

  <polygon points="332,72 316,100 348,100" fill="none" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.65"/>
  <text x="332" y="96" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" opacity="0.70">!</text>

  <!-- Data leak lines (from crack) -->
  <g stroke="#e74c3c" stroke-width="1.2" stroke-opacity="0.40" stroke-dasharray="3,4">
    <line x1="178" y1="230" x2="130" y2="260"/>
    <line x1="180" y1="245" x2="118" y2="285"/>
    <line x1="182" y1="260" x2="140" y2="310"/>
  </g>

</svg>
