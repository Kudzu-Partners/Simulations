<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg575" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg575)"/>

  <text x="200" y="56" text-anchor="middle" fill="#74b9ff" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">CHIP · GOV ACCOUNTING</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Ledger book + hospital cross emblem (protagonist) -->
    <g transform="translate(200,208)">
      <!-- Open ledger -->
      <path d="M -104 -72 L -8 -64 L -8 80 L -104 64 Z" fill="#1a3a5c" stroke="#74b9ff" stroke-width="3.5"/>
      <path d="M 8 -64 L 104 -72 L 104 64 L 8 80 Z" fill="#1a3a5c" stroke="#74b9ff" stroke-width="3.5"/>
      <!-- Spine -->
      <line x1="-8" y1="-64" x2="-8" y2="80" stroke="#74b9ff" stroke-width="2.5"/>
      <line x1="8"  y1="-64" x2="8"  y2="80" stroke="#74b9ff" stroke-width="2.5"/>

      <!-- Left page lines -->
      <line x1="-88" y1="-48" x2="-24" y2="-44" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>
      <line x1="-88" y1="-32" x2="-32" y2="-28" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>
      <line x1="-88" y1="-16" x2="-24" y2="-12" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>
      <line x1="-88" y1="0"   x2="-36" y2="4" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>
      <line x1="-88" y1="16"  x2="-24" y2="20" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>
      <line x1="-88" y1="32"  x2="-32" y2="36" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>
      <line x1="-88" y1="48"  x2="-24" y2="52" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>

      <!-- Right page: hospital cross emblem -->
      <rect x="40" y="-32" width="40" height="64" rx="6" fill="#1a3a5c" stroke="#e74c3c" stroke-width="2.5"/>
      <rect x="52" y="-20" width="16" height="40" rx="2" fill="#e74c3c"/>
      <rect x="44" y="-8" width="32" height="16" rx="2" fill="#e74c3c"/>

      <!-- Numbers/figures on right -->
      <line x1="24" y1="40" x2="96" y2="44" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>
      <line x1="24" y1="56" x2="80" y2="60" stroke="#dfe6e9" stroke-width="1.5" opacity="0.55"/>

      <!-- COL stamp top -->
      <circle cx="-56" cy="-80" r="16" fill="none" stroke="#f5c842" stroke-width="3" transform="rotate(-12,-56,-80)"/>
      <text x="-56" y="-75" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="11" font-weight="700" fill="#f5c842" transform="rotate(-12,-56,-80)">CO</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#dfe6e9" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Hospital San Roberto · Cali</text>
</svg>
