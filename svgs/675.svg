<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg675" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg675)"/>

  <text x="200" y="56" text-anchor="middle" fill="#00ff88" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">CENTRAL BANK · INTEREST RATE</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Rate dial gauge (protagonist) -->
    <g transform="translate(200,224)">
      <!-- Outer dial -->
      <circle r="96" fill="#1a2744" stroke="#dfe6e9" stroke-width="3.5"/>
      <!-- Inner ring -->
      <circle r="80" fill="none" stroke="#dfe6e9" stroke-width="2" opacity="0.55"/>

      <!-- Gauge arc -->
      <path d="M -72 0 A 72 72 0 0 1 72 0" fill="none" stroke="#0a0f1e" stroke-width="10"/>
      <!-- Green zone (low) -->
      <path d="M -72 0 A 72 72 0 0 1 -52 -50" fill="none" stroke="#52b788" stroke-width="10"/>
      <!-- Yellow zone (mid) -->
      <path d="M -52 -50 A 72 72 0 0 1 52 -50" fill="none" stroke="#f5c842" stroke-width="10"/>
      <!-- Red zone (high) -->
      <path d="M 52 -50 A 72 72 0 0 1 72 0" fill="none" stroke="#e74c3c" stroke-width="10"/>

      <!-- Needle (current rate ~ middle-high) -->
      <line x1="0" y1="8" x2="40" y2="-56" stroke="#dfe6e9" stroke-width="4"/>
      <circle r="8" fill="#dfe6e9"/>
      <circle r="3" fill="#0a0f1e"/>

      <!-- Tick numbers (% indicators) -->
      <text x="-86" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#52b788">4%</text>
      <text x="-52" y="-66" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c842">8%</text>
      <text x="52" y="-66" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c842">12%</text>
      <text x="86" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#e74c3c">15%</text>

      <!-- Center % label -->
      <text x="0" y="48" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#dfe6e9" letter-spacing="2">%</text>
    </g>

    <!-- BR badge top-left -->
    <g transform="translate(48,84)">
      <rect width="64" height="26" rx="4" fill="#dfe6e9" fill-opacity="0.18" stroke="#dfe6e9" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#dfe6e9" font-size="11" font-family="monospace" font-weight="bold">BR</text>
    </g>

    <!-- TPM badge top-right -->
    <g transform="translate(284,84)">
      <rect width="68" height="26" rx="4" fill="#00ff88" fill-opacity="0.18" stroke="#00ff88" stroke-width="1.5"/>
      <text x="34" y="18" text-anchor="middle" fill="#00ff88" font-size="11" font-family="monospace" font-weight="bold">TPM</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#c0cfff" font-size="9" font-family="monospace" opacity="0.4" letter-spacing="1.2">Banco República · CO</text>
</svg>
