<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <linearGradient id="spiralGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0cfff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <!-- GROW MODEL — four nodes in an upward spiral path -->

  <!-- Spiral/path connecting the 4 nodes -->
  <path d="M130,310 C105,285 95,255 115,225 C135,195 168,188 190,168 C212,148 222,125 245,105"
        fill="none" stroke="url(#spiralGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- NODE G: Goal (bottom-left, starting point) -->
  <circle cx="130" cy="310" r="36" fill="#1a2744" fill-opacity="0.9" stroke="#c0cfff" stroke-width="2.5" stroke-opacity="0.6"/>
  <circle cx="130" cy="310" r="36" fill="none" stroke="#c0cfff" stroke-width="2.5" stroke-opacity="0.6"/>
  <text x="130" y="304" text-anchor="middle" fill="#c0cfff" font-size="22" font-family="monospace" font-weight="bold" opacity="0.9">G</text>
  <text x="130" y="322" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="sans-serif" opacity="0.65">Goal</text>
  <!-- Target icon hint -->
  <circle cx="130" cy="305" r="6" fill="none" stroke="#c0cfff" stroke-width="1" opacity="0.4"/>

  <!-- NODE R: Reality (lower-right area) -->
  <circle cx="270" cy="255" r="34" fill="#1a2744" fill-opacity="0.9" stroke="#74b9ff" stroke-width="2.5" stroke-opacity="0.65"/>
  <text x="270" y="249" text-anchor="middle" fill="#74b9ff" font-size="22" font-family="monospace" font-weight="bold" opacity="0.9">R</text>
  <text x="270" y="267" text-anchor="middle" fill="#74b9ff" font-size="10" font-family="sans-serif" opacity="0.65">Reality</text>
  <!-- Mirror/reflection hint -->
  <line x1="258" y1="250" x2="282" y2="250" stroke="#74b9ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="258" y1="245" x2="282" y2="245" stroke="#74b9ff" stroke-width="1" opacity="0.3"/>

  <!-- NODE O: Options (middle) -->
  <circle cx="165" cy="180" r="34" fill="#1a2744" fill-opacity="0.9" stroke="#f5c842" stroke-width="2.5" stroke-opacity="0.7"/>
  <text x="165" y="174" text-anchor="middle" fill="#f5c842" font-size="22" font-family="monospace" font-weight="bold" opacity="0.9">O</text>
  <text x="165" y="192" text-anchor="middle" fill="#f5c842" font-size="10" font-family="sans-serif" opacity="0.65">Options</text>
  <!-- Branch/fork hint -->
  <path d="M158,172 L155,165 M165,170 L165,162 M172,172 L175,165"
        stroke="#f5c842" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>

  <!-- NODE W: Will/Way forward (top-right, highest point) -->
  <circle cx="298" cy="112" r="36" fill="#1a2744" fill-opacity="0.9" stroke="#f5c842" stroke-width="3" stroke-opacity="0.85"/>
  <circle cx="298" cy="112" r="44" fill="none" stroke="#f5c842" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="298" y="106" text-anchor="middle" fill="#f5c842" font-size="22" font-family="monospace" font-weight="bold" opacity="0.95">W</text>
  <text x="298" y="124" text-anchor="middle" fill="#f5c842" font-size="10" font-family="sans-serif" opacity="0.7">Will</text>

  <!-- Connecting path between R and O -->
  <path d="M250,240 C220,220 198,200 182,188"
        fill="none" stroke="url(#spiralGrad)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5,4"/>
  <!-- O to W connector -->
  <path d="M195,165 C220,148 255,130 270,120"
        fill="none" stroke="url(#spiralGrad)" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Manager coach figure (center, subtle) -->
  <circle cx="212" cy="248" r="14" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="212" cy="242" r="6" fill="#f5c842" opacity="0.4"/>
  <path d="M203,256 Q212,250 221,256" fill="#f5c842" opacity="0.35" stroke="none"/>
  <!-- Coaching speech bubble from manager -->
  <ellipse cx="238" cy="235" rx="18" ry="12" fill="#1a2744" stroke="#f5c842" stroke-width="1.5" stroke-opacity="0.55"/>
  <text x="238" y="239" text-anchor="middle" fill="#f5c842" font-size="8" font-family="monospace" opacity="0.8">COACH</text>
  <polygon points="224,244 218,252 228,244" fill="#1a2744" stroke="#f5c842" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 70-20-10 label bottom -->
  <text x="200" y="368" text-anchor="middle" fill="#c0cfff" font-size="11" font-family="monospace" opacity="0.45" letter-spacing="1">70 · 20 · 10  ·  IDP</text>
  <!-- SBI hint -->
  <text x="200" y="385" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.35">SBI feedback · GROW · LATAM</text>
</svg>
