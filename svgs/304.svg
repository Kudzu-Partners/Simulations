<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg304" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg304)"/>

  <!-- Portfolio pie chart (main visual) -->
  <g transform="translate(200, 185)">
    <!-- Segments -->
    <!-- Equities 40% (blue) ~144deg -->
    <path d="M 0 0 L 0 -120 A 120 120 0 0 1 114 -36 Z" fill="#74b9ff" opacity="0.85"/>
    <!-- Fixed Income 25% (gold) ~90deg -->
    <path d="M 0 0 L 114 -36 A 120 120 0 0 1 114 36 Z" fill="#f5c842" opacity="0.85"/>
    <!-- Alternatives 20% (green) ~72deg -->
    <path d="M 0 0 L 114 36 A 120 120 0 0 1 22 118 Z" fill="#00ff88" opacity="0.8"/>
    <!-- Cash 15% (purple) ~54deg -->
    <path d="M 0 0 L 22 118 A 120 120 0 0 1 -120 0 Z" fill="#a29bfe" opacity="0.75"/>
    <!-- Rest to close -->
    <path d="M 0 0 L -120 0 A 120 120 0 0 1 0 -120 Z" fill="#e74c3c" opacity="0.7"/>

    <!-- Donut hole -->
    <circle r="58" fill="#0a1220"/>
    <!-- Center icon -->
    <text y="6" text-anchor="middle" font-family="sans-serif" font-size="32">📊</text>

    <!-- Outer ring -->
    <circle r="122" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Legend dots (bottom) -->
  <g transform="translate(44, 334)">
    <circle cx="12" cy="12" r="10" fill="#74b9ff" opacity="0.85"/>
    <circle cx="52" cy="12" r="10" fill="#f5c842" opacity="0.85"/>
    <circle cx="92" cy="12" r="10" fill="#00ff88" opacity="0.8"/>
    <circle cx="132" cy="12" r="10" fill="#a29bfe" opacity="0.75"/>
    <circle cx="172" cy="12" r="10" fill="#e74c3c" opacity="0.7"/>

    <!-- CAPM efficiency frontier line -->
    <g transform="translate(204, -20)">
      <rect x="0" y="0" width="120" height="52" rx="8" fill="#1a2744" stroke="#f5c842" stroke-width="1.5"/>
      <!-- Curved frontier -->
      <path d="M 10 42 Q 40 30 60 18 Q 85 8 110 6" stroke="#f5c842" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Optimal point -->
      <circle cx="68" cy="16" r="6" fill="#f5c842"/>
    </g>
  </g>

  <!-- Risk/Return axes (top-left corner) -->
  <g transform="translate(36, 52)">
    <rect x="0" y="0" width="72" height="72" rx="8" fill="#1a2744" stroke="#74b9ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="60" x2="12" y2="12" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="12" y1="60" x2="62" y2="60" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <polygon points="8,18 12,8 16,18" fill="#74b9ff" opacity="0.7"/>
    <polygon points="56,56 66,60 56,64" fill="#74b9ff" opacity="0.7"/>
    <!-- Dot on frontier -->
    <circle cx="46" cy="26" r="6" fill="#00ff88" opacity="0.9"/>
  </g>
</svg>
