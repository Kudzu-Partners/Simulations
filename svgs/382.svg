<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg382" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="cart382" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#a04a13"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg382)"/>

  <text x="200" y="58" text-anchor="middle" fill="#e67e22" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">RETAIL · OMNI-CHANNEL</text>

  <!-- Shelf rows (background) -->
  <g stroke="#c98a2b" stroke-width="1" opacity="0.4" fill="none">
    <line x1="40" y1="105" x2="360" y2="105"/>
    <line x1="40" y1="140" x2="360" y2="140"/>
    <line x1="40" y1="295" x2="360" y2="295"/>
    <line x1="40" y1="330" x2="360" y2="330"/>
  </g>
  <g fill="#c98a2b" opacity="0.45">
    <rect x="50" y="78" width="14" height="24"/>
    <rect x="70" y="84" width="10" height="18"/>
    <rect x="86" y="76" width="12" height="26"/>
    <rect x="310" y="80" width="12" height="22"/>
    <rect x="328" y="78" width="14" height="24"/>
    <rect x="50" y="118" width="10" height="20"/>
    <rect x="66" y="115" width="14" height="23"/>
    <rect x="320" y="115" width="14" height="23"/>
    <rect x="340" y="120" width="10" height="18"/>
    <rect x="50" y="268" width="12" height="24"/>
    <rect x="68" y="270" width="10" height="22"/>
    <rect x="320" y="270" width="10" height="22"/>
    <rect x="336" y="266" width="14" height="26"/>
  </g>

  <!-- SHOPPING CART (hero, central) -->
  <g transform="translate(200,210)">
    <!-- handle -->
    <path d="M -90 -40 L -70 -40 L -55 30 L 55 30 L 70 -10 L -55 -10"
          fill="none" stroke="url(#cart382)" stroke-width="4" stroke-linejoin="round"/>
    <!-- basket -->
    <path d="M -55 -10 L 70 -10 L 60 38 L -45 38 Z"
          fill="url(#cart382)" fill-opacity="0.4" stroke="url(#cart382)" stroke-width="2.5"/>
    <!-- basket grid -->
    <g stroke="#c98a2b" stroke-width="1" opacity="0.7">
      <line x1="-30" y1="-10" x2="-28" y2="38"/>
      <line x1="-5" y1="-10" x2="-3" y2="38"/>
      <line x1="20" y1="-10" x2="20" y2="38"/>
      <line x1="45" y1="-10" x2="43" y2="38"/>
      <line x1="-52" y1="2" x2="65" y2="2"/>
      <line x1="-50" y1="16" x2="63" y2="16"/>
    </g>
    <!-- items inside -->
    <rect x="-40" y="-38" width="18" height="28" rx="2" fill="#c0cfff" stroke="#5a3210" stroke-width="1"/>
    <rect x="-15" y="-32" width="22" height="22" rx="2" fill="#52b788" stroke="#5a3210" stroke-width="1"/>
    <circle cx="32" cy="-22" r="12" fill="#ff6b9d" stroke="#5a3210" stroke-width="1"/>
    <!-- wheels -->
    <circle cx="-40" cy="48" r="8" fill="#1a2744" stroke="#c98a2b" stroke-width="2"/>
    <circle cx="-40" cy="48" r="2" fill="#c98a2b"/>
    <circle cx="50" cy="48" r="8" fill="#1a2744" stroke="#c98a2b" stroke-width="2"/>
    <circle cx="50" cy="48" r="2" fill="#c98a2b"/>
  </g>

  <!-- DYNAMIC PRICING tag (top-left) -->
  <g transform="translate(50,75)">
    <path d="M 0 0 L 50 0 L 60 14 L 50 28 L 0 28 Z" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.3"/>
    <circle cx="50" cy="14" r="2.5" fill="#f5c842"/>
    <text x="25" y="18" text-anchor="middle" fill="#f5c842" font-size="8" font-family="monospace" font-weight="bold">$ ⇄</text>
    <text x="25" y="40" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.85">DYN PRICE</text>
  </g>

  <!-- DIGITAL screen (top-right) -->
  <g transform="translate(300,75)">
    <rect x="0" y="0" width="50" height="34" rx="3" fill="#0d1b2a" stroke="#00bfff" stroke-width="1.3"/>
    <rect x="2" y="2" width="46" height="22" fill="#1a2744"/>
    <g stroke="#00bfff" stroke-width="1.2" fill="none">
      <path d="M 6 18 L 14 12 L 22 16 L 30 8 L 42 10"/>
    </g>
    <rect x="14" y="26" width="22" height="2" fill="#00bfff"/>
    <text x="25" y="46" text-anchor="middle" fill="#00bfff" font-size="6" font-family="monospace" opacity="0.85">E-COMMERCE</text>
  </g>

  <!-- WC turnover (bottom-left) -->
  <g transform="translate(60,335)">
    <circle cx="0" cy="0" r="14" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.3"/>
    <path d="M -6 -2 A 8 8 0 1 1 -2 8" fill="none" stroke="#52b788" stroke-width="1.8"/>
    <polygon points="-2,8 -7,8 -4,12" fill="#52b788"/>
    <text x="0" y="28" text-anchor="middle" fill="#52b788" font-size="6" font-family="monospace" opacity="0.85">WC TURN</text>
  </g>

  <!-- PERU pin -->
  <g transform="translate(340,340)">
    <rect x="-10" y="-7" width="7" height="14" fill="#c0392b" opacity="0.9"/>
    <rect x="-3" y="-7" width="7" height="14" fill="#ffffff" opacity="0.9"/>
    <rect x="4" y="-7" width="7" height="14" fill="#c0392b" opacity="0.9"/>
  </g>

  <text x="200" y="380" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Retail · Pricing · Perú</text>
</svg>
