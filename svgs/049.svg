<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg049" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1500"/>
      <stop offset="100%" stop-color="#4a2a00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg049)"/>

  <!-- Master franchise node (center-top) -->
  <circle cx="200" cy="88" r="30" fill="#2d1500" stroke="#f5c842" stroke-width="3"/>
  <circle cx="200" cy="88" r="16" fill="#f5c842" fill-opacity="0.80"/>
  <!-- Brand flame icon inside master node -->
  <path d="M 200,78 Q 206,83 204,90 Q 208,85 207,92 Q 204,88 200,95 Q 196,88 193,92 Q 192,85 196,90 Q 194,83 200,78 Z"
        fill="#2d1500" fill-opacity="0.85"/>

  <!-- Level 1 branches (3 regional nodes) -->
  <!-- Left regional -->
  <line x1="176" y1="108" x2="108" y2="172" stroke="#f5c842" stroke-width="2.5" stroke-opacity="0.60"/>
  <circle cx="96"  cy="185" r="22" fill="#2d1500" stroke="#f5c842" stroke-width="2"/>
  <circle cx="96"  cy="185" r="10" fill="#f5c842" fill-opacity="0.60"/>

  <!-- Center regional -->
  <line x1="200" y1="118" x2="200" y2="168" stroke="#f5c842" stroke-width="2.5" stroke-opacity="0.60"/>
  <circle cx="200" cy="182" r="22" fill="#2d1500" stroke="#f5c842" stroke-width="2"/>
  <circle cx="200" cy="182" r="10" fill="#f5c842" fill-opacity="0.60"/>

  <!-- Right regional -->
  <line x1="224" y1="108" x2="292" y2="172" stroke="#f5c842" stroke-width="2.5" stroke-opacity="0.60"/>
  <circle cx="304" cy="185" r="22" fill="#2d1500" stroke="#f5c842" stroke-width="2"/>
  <circle cx="304" cy="185" r="10" fill="#f5c842" fill-opacity="0.60"/>

  <!-- Level 2 branches (franchise units — 2 per regional) -->
  <!-- From left regional -->
  <line x1="80"  y1="204" x2="60"  y2="258" stroke="#e67e22" stroke-width="1.8" stroke-opacity="0.55"/>
  <line x1="108" y1="204" x2="122" y2="258" stroke="#e67e22" stroke-width="1.8" stroke-opacity="0.55"/>
  <circle cx="55"  cy="270" r="16" fill="#2d1500" stroke="#e67e22" stroke-width="1.8"/>
  <circle cx="55"  cy="270" r="7"  fill="#e67e22" fill-opacity="0.65"/>
  <circle cx="128" cy="270" r="16" fill="#2d1500" stroke="#e67e22" stroke-width="1.8"/>
  <circle cx="128" cy="270" r="7"  fill="#e67e22" fill-opacity="0.65"/>

  <!-- From center regional -->
  <line x1="188" y1="202" x2="162" y2="258" stroke="#e67e22" stroke-width="1.8" stroke-opacity="0.55"/>
  <line x1="212" y1="202" x2="238" y2="258" stroke="#e67e22" stroke-width="1.8" stroke-opacity="0.55"/>
  <circle cx="156" cy="270" r="16" fill="#2d1500" stroke="#e67e22" stroke-width="1.8"/>
  <circle cx="156" cy="270" r="7"  fill="#e67e22" fill-opacity="0.65"/>
  <circle cx="244" cy="270" r="16" fill="#2d1500" stroke="#e67e22" stroke-width="1.8"/>
  <circle cx="244" cy="270" r="7"  fill="#e67e22" fill-opacity="0.65"/>

  <!-- From right regional -->
  <line x1="290" y1="204" x2="272" y2="258" stroke="#e67e22" stroke-width="1.8" stroke-opacity="0.55"/>
  <line x1="318" y1="204" x2="340" y2="258" stroke="#e67e22" stroke-width="1.8" stroke-opacity="0.55"/>
  <circle cx="268" cy="270" r="16" fill="#2d1500" stroke="#e67e22" stroke-width="1.8"/>
  <circle cx="268" cy="270" r="7"  fill="#e67e22" fill-opacity="0.65"/>
  <circle cx="346" cy="270" r="16" fill="#2d1500" stroke="#e67e22" stroke-width="1.8"/>
  <circle cx="346" cy="270" r="7"  fill="#e67e22" fill-opacity="0.65"/>

  <!-- Level 3 hint (small dots below, suggesting further expansion) -->
  <g fill="#e67e22" fill-opacity="0.30">
    <circle cx="55"  cy="308" r="8"/>
    <circle cx="128" cy="308" r="8"/>
    <circle cx="200" cy="312" r="8"/>
    <circle cx="272" cy="308" r="8"/>
    <circle cx="346" cy="308" r="8"/>
  </g>

  <!-- Label at bottom -->
  <text x="200" y="358" font-family="Arial, sans-serif" font-size="9" fill="#f5c842" text-anchor="middle" opacity="0.55">Franchise Network Expansion</text>
</svg>
