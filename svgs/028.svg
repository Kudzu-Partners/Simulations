<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg028" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="100%" stop-color="#2d1f10"/>
    </linearGradient>
    <radialGradient id="compassGlow028" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg028)"/>

  <!-- Turbulent waves / crisis environment (background) -->
  <g fill="none" stroke="#c0392b" stroke-opacity="0.18" stroke-width="1.5">
    <path d="M 30,100 Q 80,75  130,100 Q 180,125 230,100 Q 280,75  330,100 Q 370,118 400,100"/>
    <path d="M 30,130 Q 80,108 130,130 Q 180,152 230,130 Q 280,108 330,130 Q 365,145 400,130"/>
    <path d="M 0,310  Q 50,285 100,310 Q 150,335 200,310 Q 250,285 300,310 Q 350,335 400,310"/>
    <path d="M 0,340  Q 50,318 100,340 Q 150,362 200,340 Q 250,318 300,340 Q 350,362 400,340"/>
    <path d="M 30,280 Q 80,258 130,280 Q 180,302 230,280 Q 280,258 330,280 Q 365,295 400,280"/>
  </g>

  <!-- Compass rose glow -->
  <circle cx="200" cy="210" r="115" fill="url(#compassGlow028)"/>

  <!-- Compass outer ring -->
  <circle cx="200" cy="210" r="112" fill="none" stroke="#f5a623" stroke-width="2" stroke-opacity="0.30"/>
  <circle cx="200" cy="210" r="100" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.20"/>

  <!-- Compass cardinal lines -->
  <g stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.40">
    <line x1="200" y1="112" x2="200" y2="308"/>
    <line x1="102"  y1="210" x2="298" y2="210"/>
    <line x1="131"  y1="141" x2="269" y2="279"/>
    <line x1="269"  y1="141" x2="131" y2="279"/>
  </g>

  <!-- Compass needle (pointing slightly off-north — adaptive, finding new direction) -->
  <!-- North tip (primary direction, bright) -->
  <polygon points="200,130 192,210 200,200 208,210" fill="#f5a623" fill-opacity="0.90"/>
  <!-- South tail (contrasting, dark) -->
  <polygon points="200,290 192,210 200,220 208,210" fill="#c0392b" fill-opacity="0.70"/>

  <!-- Center pivot -->
  <circle cx="200" cy="210" r="10" fill="#1a0f0a" stroke="#f5a623" stroke-width="2.5"/>
  <circle cx="200" cy="210" r="4"  fill="#f5a623" fill-opacity="0.90"/>

  <!-- Cardinal labels -->
  <text x="200" y="105" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#f5a623" text-anchor="middle" opacity="0.85">N</text>
  <text x="200" y="326" font-family="Arial, sans-serif" font-size="12" fill="#f5a623" text-anchor="middle" opacity="0.40">S</text>
  <text x="300" y="215" font-family="Arial, sans-serif" font-size="12" fill="#f5a623" text-anchor="middle" opacity="0.40">E</text>
  <text x="100" y="215" font-family="Arial, sans-serif" font-size="12" fill="#f5a623" text-anchor="middle" opacity="0.40">W</text>

  <!-- 4 phase markers on outer ring -->
  <circle cx="200" cy="98"  r="7" fill="#f5a623" fill-opacity="0.80"/>
  <circle cx="312" cy="210" r="7" fill="#f5a623" fill-opacity="0.60"/>
  <circle cx="200" cy="322" r="7" fill="#f5a623" fill-opacity="0.45"/>
  <circle cx="88"  cy="210" r="7" fill="#f5a623" fill-opacity="0.60"/>

</svg>
