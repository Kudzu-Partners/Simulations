<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg616" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#6a0572"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg616)"/>

  <text x="200" y="56" text-anchor="middle" fill="#ff6b9d" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">QUANT RESEARCH · MARKET SIZE</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Survey/data bars + sample (protagonist) -->
    <g transform="translate(200,224)">
      <!-- Axes -->
      <line x1="-120" y1="80" x2="120" y2="80" stroke="#ffd166" stroke-width="1.5" opacity="0.4"/>
      <line x1="-120" y1="-80" x2="-120" y2="80" stroke="#ffd166" stroke-width="1.5" opacity="0.4"/>

      <!-- Histogram bars (normal-ish distribution) -->
      <rect x="-112" y="56" width="20" height="24" rx="2" fill="#ff6b9d" opacity="0.65"/>
      <rect x="-88"  y="32" width="20" height="48" rx="2" fill="#ff6b9d" opacity="0.75"/>
      <rect x="-64"  y="0"  width="20" height="80" rx="2" fill="#ff6b9d" opacity="0.85"/>
      <rect x="-40"  y="-40" width="20" height="120" rx="2" fill="#ff6b9d"/>
      <rect x="-16"  y="-64" width="20" height="144" rx="2" fill="#ffd166"/>
      <rect x="8"    y="-40" width="20" height="120" rx="2" fill="#ff6b9d"/>
      <rect x="32"   y="0"   width="20" height="80" rx="2" fill="#ff6b9d" opacity="0.85"/>
      <rect x="56"   y="32"  width="20" height="48" rx="2" fill="#ff6b9d" opacity="0.75"/>
      <rect x="80"   y="56"  width="20" height="24" rx="2" fill="#ff6b9d" opacity="0.65"/>

      <!-- Normal curve overlay -->
      <path d="M -120 64 Q -80 40 -40 -32 Q -10 -76 18 -32 Q 60 40 120 64"
            stroke="#ffd166" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
    </g>

    <!-- Sample size badge top-left -->
    <g transform="translate(48,84)">
      <rect width="72" height="26" rx="4" fill="#ff6b9d" fill-opacity="0.18" stroke="#ff6b9d" stroke-width="1.5"/>
      <text x="36" y="18" text-anchor="middle" fill="#ff6b9d" font-size="11" font-family="monospace" font-weight="bold">N=384</text>
    </g>

    <!-- TAM badge top-right -->
    <g transform="translate(284,84)">
      <rect width="68" height="26" rx="4" fill="#ffd166" fill-opacity="0.18" stroke="#ffd166" stroke-width="1.5"/>
      <text x="34" y="18" text-anchor="middle" fill="#ffd166" font-size="11" font-family="monospace" font-weight="bold">TAM</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#ffd166" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Healthy Food Market · CO</text>
</svg>
