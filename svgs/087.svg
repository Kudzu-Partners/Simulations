<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg87" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <linearGradient id="pyr87" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg87)"/>
  <!-- Consulting staffing pyramid -->
  <!-- Level 1: Analysts / Consultants (wide base) -->
  <path d="M80,305 L320,305 L280,255 L120,255 Z" fill="url(#pyr87)" opacity="0.35" stroke="#f5c842" stroke-width="1.5"/>
  <text x="200" y="285" font-family="sans-serif" font-size="11" fill="#f5c842" text-anchor="middle" opacity="0.8">CONSULTANTS</text>
  <!-- Level 2: Managers -->
  <path d="M120,255 L280,255 L245,205 L155,205 Z" fill="url(#pyr87)" opacity="0.45" stroke="#f5c842" stroke-width="1.5"/>
  <text x="200" y="235" font-family="sans-serif" font-size="11" fill="#f5c842" text-anchor="middle" opacity="0.85">MANAGERS</text>
  <!-- Level 3: Partners -->
  <path d="M155,205 L245,205 L200,140 Z" fill="url(#pyr87)" opacity="0.65" stroke="#f5c842" stroke-width="2"/>
  <text x="200" y="182" font-family="sans-serif" font-size="11" fill="#f5c842" text-anchor="middle" opacity="0.9">PARTNERS</text>
  <!-- Utilization gauge (right side) -->
  <path d="M305,190 A55,55 0 0,1 355,245" fill="none" stroke="#1a2744" stroke-width="12" opacity="0.7"/>
  <path d="M305,190 A55,55 0 0,1 345,230" fill="none" stroke="#f5c842" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  <text x="330" y="260" font-family="sans-serif" font-size="9" fill="#c0cfff" text-anchor="middle" opacity="0.65">UTIL%</text>
  <!-- Client portfolio (left): briefcases -->
  <g transform="translate(65,200)">
    <rect x="-20" y="0" width="40" height="30" rx="4" fill="#c0cfff" opacity="0.3" stroke="#c0cfff" stroke-width="1.5"/>
    <rect x="-8" y="-8" width="16" height="10" rx="3" fill="none" stroke="#c0cfff" stroke-width="1.5" opacity="0.6"/>
    <line x1="-20" y1="12" x2="20" y2="12" stroke="#c0cfff" stroke-width="1" opacity="0.4"/>
  </g>
  <g transform="translate(65,245)">
    <rect x="-20" y="0" width="40" height="30" rx="4" fill="#c0cfff" opacity="0.25" stroke="#c0cfff" stroke-width="1.5"/>
    <rect x="-8" y="-8" width="16" height="10" rx="3" fill="none" stroke="#c0cfff" stroke-width="1.5" opacity="0.5"/>
    <line x1="-20" y1="12" x2="20" y2="12" stroke="#c0cfff" stroke-width="1" opacity="0.35"/>
  </g>
  <!-- Margin label -->
  <text x="200" y="355" font-family="sans-serif" font-size="10" fill="#c0cfff" text-anchor="middle" opacity="0.5">MARGIN · UTILIZATION · GROWTH</text>
</svg>
