<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg495" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg495)"/>

  <text x="200" y="58" text-anchor="middle" fill="#7b2fff" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">MONTE CARLO · 10K ITER</text>

  <!-- BELL HISTOGRAM (hero) -->
  <g transform="translate(200,250)">
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#c0cfff" stroke-width="1.2" opacity="0.6"/>
    <!-- bars distributed in bell -->
    <g fill="#7b2fff" opacity="0.7" stroke="#1a2744" stroke-width="0.7">
      <rect x="-125" y="-8" width="10" height="8"/>
      <rect x="-113" y="-14" width="10" height="14"/>
      <rect x="-101" y="-22" width="10" height="22"/>
      <rect x="-89" y="-32" width="10" height="32"/>
      <rect x="-77" y="-46" width="10" height="46"/>
      <rect x="-65" y="-62" width="10" height="62"/>
      <rect x="-53" y="-78" width="10" height="78"/>
      <rect x="-41" y="-92" width="10" height="92"/>
      <rect x="-29" y="-104" width="10" height="104"/>
      <rect x="-17" y="-114" width="10" height="114"/>
      <rect x="-5" y="-120" width="10" height="120"/>
      <rect x="7" y="-116" width="10" height="116"/>
      <rect x="19" y="-108" width="10" height="108"/>
      <rect x="31" y="-95" width="10" height="95"/>
      <rect x="43" y="-78" width="10" height="78"/>
      <rect x="55" y="-58" width="10" height="58"/>
      <rect x="67" y="-42" width="10" height="42"/>
      <rect x="79" y="-30" width="10" height="30"/>
      <rect x="91" y="-22" width="10" height="22"/>
      <rect x="103" y="-15" width="10" height="15"/>
      <rect x="115" y="-9" width="10" height="9"/>
    </g>
    <!-- bell curve overlay -->
    <path d="M -125 -8 Q -50 -120 0 -125 Q 50 -120 125 -10"
          fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <!-- mean line -->
    <line x1="0" y1="-125" x2="0" y2="0" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="0" y="-135" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" font-weight="bold">μ</text>
  </g>

  <!-- DICE (top-left, randomness) -->
  <g transform="translate(60,100)">
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#ffffff" stroke="#1a2744" stroke-width="1.8" transform="rotate(-15 0 0)"/>
    <g fill="#1a2744">
      <circle cx="-8" cy="-8" r="2" transform="rotate(-15 0 0)"/>
      <circle cx="0" cy="0" r="2" transform="rotate(-15 0 0)"/>
      <circle cx="8" cy="8" r="2" transform="rotate(-15 0 0)"/>
    </g>
  </g>

  <!-- Hydro turbine icon (top-right) -->
  <g transform="translate(335,90)">
    <circle cx="0" cy="0" r="14" fill="#00bfff" fill-opacity="0.25" stroke="#00bfff" stroke-width="1.4"/>
    <g fill="#00bfff">
      <path d="M 0 0 L -4 -12 L 4 -8 Z"/>
      <path d="M 0 0 L 12 -4 L 8 4 Z"/>
      <path d="M 0 0 L 4 12 L -4 8 Z"/>
      <path d="M 0 0 L -12 4 L -8 -4 Z"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>

  <!-- 10K iter badge (bottom-center) -->
  <g transform="translate(200,335)">
    <rect x="-32" y="-12" width="64" height="24" rx="4" fill="#7b2fff" fill-opacity="0.25" stroke="#7b2fff" stroke-width="1.3"/>
    <text x="0" y="4" text-anchor="middle" fill="#7b2fff" font-size="11" font-family="monospace" font-weight="bold">10,000×</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,340)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Monte Carlo · Hidro · HN</text>
</svg>
