<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg212" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <radialGradient id="glow212" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4dd0e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="subBox212" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#0a2030"/>
    </linearGradient>
    <linearGradient id="parentBox212" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#009688" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#004d40" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg212)"/>
  <rect width="400" height="400" rx="32" fill="url(#glow212)"/>

  <!-- ── Three subsidiary boxes (top) flowing into parent group (center) ── -->

  <!-- Subsidiary 1: Colombia (COP, 70%) -->
  <g transform="translate(75, 70)">
    <rect width="76" height="74" rx="6" fill="url(#subBox212)" stroke="#4dd0e1" stroke-width="1.5"/>
    <rect width="76" height="20" rx="6" fill="#4dd0e1" opacity="0.25"/>
    <text x="38" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" font-weight="bold" fill="#4dd0e1">COLOMBIA</text>
    <text x="38" y="36" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#80cbc4">COP</text>
    <text x="38" y="50" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#80cbc4" opacity="0.7">70% NCI</text>
    <!-- Small ledger -->
    <line x1="10" y1="58" x2="66" y2="58" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
    <line x1="10" y1="63" x2="50" y2="63" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
    <line x1="10" y1="68" x2="58" y2="68" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Subsidiary 2: Mexico (MXN, 100%) -->
  <g transform="translate(162, 60)">
    <rect width="76" height="74" rx="6" fill="url(#subBox212)" stroke="#4dd0e1" stroke-width="1.5"/>
    <rect width="76" height="20" rx="6" fill="#4dd0e1" opacity="0.25"/>
    <text x="38" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" font-weight="bold" fill="#4dd0e1">MEXICO</text>
    <text x="38" y="36" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#80cbc4">MXN</text>
    <text x="38" y="50" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#80cbc4" opacity="0.7">100%</text>
    <line x1="10" y1="58" x2="66" y2="58" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
    <line x1="10" y1="63" x2="55" y2="63" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
    <line x1="10" y1="68" x2="60" y2="68" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Subsidiary 3: Spain (EUR, 100%) -->
  <g transform="translate(249, 70)">
    <rect width="76" height="74" rx="6" fill="url(#subBox212)" stroke="#4dd0e1" stroke-width="1.5"/>
    <rect width="76" height="20" rx="6" fill="#4dd0e1" opacity="0.25"/>
    <text x="38" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" font-weight="bold" fill="#4dd0e1">SPAIN</text>
    <text x="38" y="36" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#80cbc4">EUR</text>
    <text x="38" y="50" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#80cbc4" opacity="0.7">100%</text>
    <line x1="10" y1="58" x2="66" y2="58" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
    <line x1="10" y1="63" x2="48" y2="63" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
    <line x1="10" y1="68" x2="62" y2="68" stroke="#80cbc4" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- ── Translation/elimination flow lines down to parent ── -->
  <g stroke="#4dd0e1" fill="none" opacity="0.55">
    <path d="M113 144 Q 130 175 200 215" stroke-width="1.8"/>
    <path d="M200 134 L200 215" stroke-width="2"/>
    <path d="M287 144 Q 270 175 200 215" stroke-width="1.8"/>
  </g>

  <!-- IFRS adjustment badges along the flows -->
  <g font-family="'Courier New',monospace" font-size="7" font-weight="bold">
    <rect x="98"  y="166" width="34" height="16" rx="3" fill="#0f2027" stroke="#ff9800" stroke-width="1" stroke-opacity="0.85"/>
    <text x="115" y="177" text-anchor="middle" fill="#ff9800" opacity="0.95">FX</text>

    <rect x="183" y="166" width="42" height="16" rx="3" fill="#0f2027" stroke="#9c27b0" stroke-width="1" stroke-opacity="0.85"/>
    <text x="204" y="177" text-anchor="middle" fill="#bb86fc" opacity="0.95">IFRS15</text>

    <rect x="265" y="166" width="42" height="16" rx="3" fill="#0f2027" stroke="#03a9f4" stroke-width="1" stroke-opacity="0.85"/>
    <text x="286" y="177" text-anchor="middle" fill="#4dd0e1" opacity="0.95">IAS36</text>
  </g>

  <!-- ── Parent group consolidation document ── -->
  <g transform="translate(120, 215)">
    <rect width="160" height="120" rx="8" fill="url(#parentBox212)" stroke="#009688" stroke-width="2.5"/>
    <rect width="160" height="24" rx="8" fill="#009688"/>
    <text x="80" y="17" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" font-weight="bold" fill="#fff" letter-spacing="2">CONDOR GROUP</text>

    <!-- Consolidated table rows -->
    <g stroke="#80cbc4" stroke-width="0.6" opacity="0.45">
      <line x1="12" y1="42" x2="148" y2="42"/>
      <line x1="12" y1="58" x2="148" y2="58"/>
      <line x1="12" y1="74" x2="148" y2="74"/>
      <line x1="12" y1="90" x2="148" y2="90"/>
      <line x1="12" y1="106" x2="148" y2="106"/>
    </g>

    <g font-family="'Courier New',monospace" font-size="7.5" fill="#cfd8dc">
      <text x="14" y="40">Revenue</text>
      <text x="146" y="40" text-anchor="end" fill="#80cbc4">$842M</text>
      <text x="14" y="56">Operating</text>
      <text x="146" y="56" text-anchor="end" fill="#80cbc4">$94M</text>
      <text x="14" y="72">NCI Share</text>
      <text x="146" y="72" text-anchor="end" fill="#ff9800">$8M</text>
      <text x="14" y="88">FX Reserve</text>
      <text x="146" y="88" text-anchor="end" fill="#ff9800">($3M)</text>
    </g>
    <line x1="12" y1="100" x2="148" y2="100" stroke="#80cbc4" stroke-width="1"/>
    <text x="14" y="116" font-family="'Courier New',monospace" font-size="8.5" font-weight="bold" fill="#fff">NET</text>
    <text x="146" y="116" text-anchor="end" font-family="'Courier New',monospace" font-size="8.5" font-weight="bold" fill="#52b788">$83M</text>
  </g>

  <!-- ── Audit stamp / sign-off ── -->
  <g transform="translate(308,348)">
    <circle r="22" fill="none" stroke="#ff9800" stroke-width="2" opacity="0.85"/>
    <circle r="22" fill="#ff9800" opacity="0.06"/>
    <text y="-3" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#ff9800" opacity="0.95" letter-spacing="1">AUDIT</text>
    <text y="9" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" font-weight="bold" fill="#ff9800" opacity="0.95">Q3</text>
  </g>

  <!-- Header label -->
  <text x="200" y="48" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#80cbc4" opacity="0.55" letter-spacing="3">FINANCIAL CLOSE · IFRS</text>
</svg>
