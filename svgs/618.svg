<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg618" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#4a1968"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg618)"/>

  <text x="200" y="56" text-anchor="middle" fill="#ff6b9d" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">CONTENT MARKETING · INSURANCE</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Stack of content cards (protagonist) -->
    <g transform="translate(200,210)">
      <!-- Card 3 (back) -->
      <rect x="-72" y="-72" width="144" height="180" rx="8" fill="#2d0a4e" stroke="#ff6b9d" stroke-width="2" opacity="0.4" transform="rotate(-8)"/>
      <!-- Card 2 (mid) -->
      <rect x="-72" y="-72" width="144" height="180" rx="8" fill="#2d0a4e" stroke="#ff6b9d" stroke-width="2" opacity="0.65" transform="rotate(-4)"/>
      <!-- Card 1 (front, prominent) -->
      <rect x="-72" y="-72" width="144" height="180" rx="8" fill="#1a0033" stroke="#ff6b9d" stroke-width="3.5"/>

      <!-- Header image area -->
      <rect x="-60" y="-60" width="120" height="56" rx="3" fill="#ff6b9d" opacity="0.5"/>
      <!-- Play/icon -->
      <circle r="14" cx="0" cy="-32" fill="#ffd166"/>
      <path d="M -5 -38 L -5 -26 L 7 -32 Z" fill="#1a0033"/>

      <!-- Title lines -->
      <rect x="-60" y="8" width="100" height="6" rx="2" fill="#ff6b9d"/>
      <rect x="-60" y="22" width="76" height="4" rx="1.5" fill="#ff6b9d" opacity="0.6"/>
      <rect x="-60" y="34" width="100" height="4" rx="1.5" fill="#ff6b9d" opacity="0.5"/>
      <rect x="-60" y="46" width="84" height="4" rx="1.5" fill="#ff6b9d" opacity="0.5"/>

      <!-- Engagement metrics -->
      <circle cx="-50" cy="74" r="4" fill="#ffd166"/>
      <circle cx="-30" cy="74" r="4" fill="#ffd166"/>
      <circle cx="-10" cy="74" r="4" fill="#ffd166"/>
      <rect x="6" y="70" width="28" height="8" rx="2" fill="#ffd166" opacity="0.5"/>
    </g>

    <!-- COP badge top-left -->
    <g transform="translate(48,84)">
      <rect width="72" height="26" rx="4" fill="#ff6b9d" fill-opacity="0.18" stroke="#ff6b9d" stroke-width="1.5"/>
      <text x="36" y="18" text-anchor="middle" fill="#ff6b9d" font-size="11" font-family="monospace" font-weight="bold">80M</text>
    </g>

    <!-- CTR badge top-right -->
    <g transform="translate(280,84)">
      <rect width="80" height="26" rx="4" fill="#ffd166" fill-opacity="0.18" stroke="#ffd166" stroke-width="1.5"/>
      <text x="40" y="18" text-anchor="middle" fill="#ffd166" font-size="11" font-family="monospace" font-weight="bold">CTR 4.2%</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#ffd166" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Seguros Vida · CO</text>
</svg>
