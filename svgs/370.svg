<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg370" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#0d1421"/>
    </linearGradient>
    <linearGradient id="helmet370" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#c98a2b"/>
    </linearGradient>
    <linearGradient id="hand370a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#a04a13"/>
    </linearGradient>
    <linearGradient id="hand370b" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c0cfff"/>
      <stop offset="100%" stop-color="#5a6f9c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg370)"/>

  <!-- Sparks in background (metalworker context) -->
  <g fill="#f5c842" opacity="0.6">
    <circle cx="80" cy="75" r="1.5"/>
    <circle cx="110" cy="60" r="1"/>
    <circle cx="140" cy="80" r="1.2"/>
    <circle cx="310" cy="65" r="1.5"/>
    <circle cx="340" cy="85" r="1"/>
    <circle cx="280" cy="55" r="1.2"/>
  </g>

  <!-- HARD HAT (top, hero context) -->
  <g transform="translate(200,130)">
    <path d="M -45 10 L 45 10 L 45 0 Q 45 -32 0 -32 Q -45 -32 -45 0 Z"
          fill="url(#helmet370)" stroke="#5a3210" stroke-width="2"/>
    <rect x="-50" y="10" width="100" height="6" fill="#5a3210" stroke="#3d1f08" stroke-width="1.2"/>
    <rect x="-15" y="-5" width="30" height="14" fill="#1a2744" fill-opacity="0.45" stroke="#5a3210" stroke-width="1"/>
    <line x1="-15" y1="2" x2="15" y2="2" stroke="#f5c842" stroke-width="1.3"/>
  </g>

  <!-- HANDSHAKE (hero — labor + management) -->
  <g>
    <!-- left arm -->
    <path d="M 30 220 L 170 220 Q 185 220 192 230 L 197 240 L 192 250 Q 185 260 170 260 L 30 260 Z"
          fill="url(#hand370a)" stroke="#3d1f08" stroke-width="2"/>
    <rect x="34" y="218" width="14" height="44" fill="#1c2333" stroke="#c0cfff" stroke-width="1.2" opacity="0.85"/>
    <!-- right arm -->
    <path d="M 370 220 L 230 220 Q 215 220 208 230 L 203 240 L 208 250 Q 215 260 230 260 L 370 260 Z"
          fill="url(#hand370b)" stroke="#1a2744" stroke-width="2"/>
    <rect x="352" y="218" width="14" height="44" fill="#1c2333" stroke="#f5c842" stroke-width="1.2" opacity="0.85"/>
    <!-- finger crossings -->
    <g stroke="#1c2333" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M 188 230 Q 200 228 212 230"/>
      <path d="M 188 240 Q 200 240 212 240"/>
      <path d="M 188 250 Q 200 252 212 250"/>
    </g>
  </g>

  <!-- CBA document (top-left) -->
  <g transform="translate(50,55)">
    <rect x="0" y="0" width="50" height="60" rx="2" fill="#c0cfff" fill-opacity="0.15" stroke="#c0cfff" stroke-width="1.3"/>
    <line x1="6" y1="14" x2="44" y2="14" stroke="#c0cfff" stroke-width="0.7" opacity="0.6"/>
    <line x1="6" y1="22" x2="38" y2="22" stroke="#c0cfff" stroke-width="0.7" opacity="0.6"/>
    <line x1="6" y1="30" x2="44" y2="30" stroke="#c0cfff" stroke-width="0.7" opacity="0.6"/>
    <line x1="6" y1="38" x2="36" y2="38" stroke="#c0cfff" stroke-width="0.7" opacity="0.6"/>
    <circle cx="38" cy="50" r="6" fill="#ff6b6b" fill-opacity="0.55"/>
    <text x="25" y="74" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" opacity="0.85">CBA</text>
  </g>

  <!-- Productivity chart (top-right) -->
  <g transform="translate(290,55)">
    <rect x="0" y="0" width="60" height="50" rx="3" fill="#52b788" fill-opacity="0.12" stroke="#52b788" stroke-width="1.3"/>
    <g stroke="#52b788" stroke-width="2" fill="none">
      <path d="M 5 42 L 18 32 L 30 24 L 42 18 L 55 10"/>
    </g>
    <g fill="#52b788">
      <circle cx="5" cy="42" r="2"/>
      <circle cx="30" cy="24" r="2"/>
      <circle cx="55" cy="10" r="2"/>
    </g>
    <text x="30" y="64" text-anchor="middle" fill="#52b788" font-size="6" font-family="monospace" opacity="0.85">PRODUCTIVITY</text>
  </g>

  <!-- UNION fist (bottom-left) -->
  <g transform="translate(60,330)">
    <circle cx="0" cy="0" r="16" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="1.4"/>
    <rect x="-7" y="-4" width="14" height="10" rx="2" fill="#c0392b"/>
    <rect x="-7" y="-12" width="3" height="9" rx="1" fill="#c0392b"/>
    <rect x="-3.5" y="-12" width="3" height="9" rx="1" fill="#c0392b"/>
    <rect x="0" y="-12" width="3" height="9" rx="1" fill="#c0392b"/>
    <rect x="3.5" y="-12" width="3" height="9" rx="1" fill="#c0392b"/>
  </g>

  <!-- BRAZIL pin (bottom-right) -->
  <g transform="translate(340,335)">
    <circle cx="0" cy="0" r="11" fill="#52b788" fill-opacity="0.3" stroke="#52b788" stroke-width="1.3"/>
    <polygon points="0,-7 9,0 0,7 -9,0" fill="#f5c842"/>
    <circle cx="0" cy="0" r="3" fill="#1a4480"/>
  </g>

  <text x="200" y="382" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">CBA · Productividad · Brasil</text>
</svg>
