<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg372" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <radialGradient id="globe372" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0a2a1a"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg372)"/>

  <text x="200" y="58" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">SUPPLY CHAIN ARCHITECTURE</text>

  <!-- Latitude/longitude grid -->
  <g fill="none" stroke="#c0cfff" stroke-opacity="0.1" stroke-width="0.8">
    <ellipse cx="200" cy="215" rx="135" ry="55"/>
    <ellipse cx="200" cy="215" rx="135" ry="100"/>
    <line x1="65" y1="215" x2="335" y2="215"/>
    <line x1="200" y1="115" x2="200" y2="315"/>
  </g>

  <!-- GLOBE / NETWORK (hero) -->
  <circle cx="200" cy="215" r="100" fill="url(#globe372)" stroke="#52b788" stroke-width="2" opacity="0.9"/>
  <ellipse cx="200" cy="215" rx="100" ry="38" fill="none" stroke="#c0cfff" stroke-width="0.8" stroke-opacity="0.55"/>
  <ellipse cx="200" cy="215" rx="50" ry="100" fill="none" stroke="#c0cfff" stroke-width="0.8" stroke-opacity="0.55"/>

  <!-- continent splotches -->
  <g fill="#52b788" opacity="0.85">
    <path d="M 175 180 q 12 -8 24 0 q 4 12 -8 18 q -18 4 -16 -18"/>
    <path d="M 160 235 q 8 4 18 0 q 6 12 -6 16 q -14 0 -12 -16"/>
    <path d="M 225 245 q 10 -2 18 4 q -2 14 -16 10 q -8 -6 -2 -14"/>
  </g>

  <!-- Network nodes (suppliers/factories/customers) -->
  <g>
    <circle cx="115" cy="160" r="7" fill="#f5c842" stroke="#1a2744" stroke-width="1.2"/>
    <circle cx="285" cy="155" r="7" fill="#f5c842" stroke="#1a2744" stroke-width="1.2"/>
    <circle cx="320" cy="250" r="7" fill="#ff6b6b" stroke="#1a2744" stroke-width="1.2"/>
    <circle cx="100" cy="280" r="7" fill="#c0cfff" stroke="#1a2744" stroke-width="1.2"/>
    <circle cx="200" cy="115" r="7" fill="#52b788" stroke="#1a2744" stroke-width="1.2"/>
    <!-- Argentina hub (larger) -->
    <circle cx="180" cy="265" r="10" fill="#ff6b9d" stroke="#fff" stroke-width="1.5"/>
    <text x="180" y="268" text-anchor="middle" fill="#fff" font-size="6" font-family="monospace" font-weight="bold">AR</text>
  </g>

  <!-- Flow arrows -->
  <g stroke="#f5c842" stroke-width="1.2" fill="none" opacity="0.75" stroke-dasharray="3,2">
    <path d="M 115 160 Q 150 200 178 265"/>
    <path d="M 285 155 Q 240 200 188 263"/>
    <path d="M 200 115 Q 200 180 180 257"/>
    <path d="M 100 280 L 170 270"/>
    <path d="M 188 265 L 312 250"/>
  </g>

  <!-- TCO badge (top-left) -->
  <g transform="translate(50,85)">
    <rect x="0" y="0" width="56" height="28" rx="5" fill="#f5c842" fill-opacity="0.15" stroke="#f5c842" stroke-width="1.3"/>
    <text x="28" y="13" text-anchor="middle" fill="#f5c842" font-size="10" font-family="monospace" font-weight="bold">TCO</text>
    <text x="28" y="22" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.75">total cost</text>
  </g>

  <!-- FX risk (top-right) -->
  <g transform="translate(294,85)">
    <rect x="0" y="0" width="56" height="28" rx="5" fill="#ff6b6b" fill-opacity="0.15" stroke="#ff6b6b" stroke-width="1.3"/>
    <text x="28" y="13" text-anchor="middle" fill="#ff6b6b" font-size="10" font-family="monospace" font-weight="bold">FX</text>
    <text x="28" y="22" text-anchor="middle" fill="#ff6b6b" font-size="6" font-family="monospace" opacity="0.75">currency risk</text>
  </g>

  <!-- DISRUPT alert (bottom-left) -->
  <g transform="translate(70,340)">
    <polygon points="0,-12 14,12 -14,12" fill="#ff6b6b" fill-opacity="0.2" stroke="#ff6b6b" stroke-width="1.3"/>
    <text x="0" y="9" text-anchor="middle" fill="#ff6b6b" font-size="9" font-family="monospace" font-weight="bold">!</text>
    <text x="0" y="26" text-anchor="middle" fill="#ff6b6b" font-size="6" font-family="monospace" opacity="0.85">DISRUPT</text>
  </g>

  <!-- Ship/cargo icon (bottom-right) -->
  <g transform="translate(330,340)">
    <path d="M -18 0 L 18 0 L 14 8 L -14 8 Z" fill="#c0cfff" fill-opacity="0.6" stroke="#c0cfff" stroke-width="1.2"/>
    <rect x="-12" y="-10" width="6" height="10" fill="#c0cfff" fill-opacity="0.55"/>
    <rect x="-3" y="-14" width="6" height="14" fill="#c0cfff" fill-opacity="0.55"/>
    <rect x="6" y="-10" width="6" height="10" fill="#c0cfff" fill-opacity="0.55"/>
  </g>

  <text x="200" y="380" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">TCO · Risk · Argentina</text>
</svg>
