<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg117" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="corp117" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#0a4070"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg117)"/>
  <!-- Corporate HQ tower (parent) -->
  <g transform="translate(200 200)">
    <rect x="-45" y="-110" width="90" height="220" rx="3" fill="url(#corp117)" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Window grid -->
    <g fill="#0a0f1e" opacity="0.85">
      <rect x="-35" y="-95" width="14" height="14"/>
      <rect x="-15" y="-95" width="14" height="14"/>
      <rect x="5" y="-95" width="14" height="14"/>
      <rect x="25" y="-95" width="14" height="14"/>
      <rect x="-35" y="-75" width="14" height="14"/>
      <rect x="-15" y="-75" width="14" height="14"/>
      <rect x="5" y="-75" width="14" height="14"/>
      <rect x="25" y="-75" width="14" height="14"/>
      <rect x="-35" y="-55" width="14" height="14"/>
      <rect x="-15" y="-55" width="14" height="14"/>
      <rect x="5" y="-55" width="14" height="14"/>
      <rect x="25" y="-55" width="14" height="14"/>
      <rect x="-35" y="-35" width="14" height="14"/>
      <rect x="-15" y="-35" width="14" height="14"/>
      <rect x="5" y="-35" width="14" height="14"/>
      <rect x="25" y="-35" width="14" height="14"/>
    </g>
    <!-- $100M label on tower -->
    <rect x="-35" y="0" width="70" height="36" rx="3" fill="#0a0f1e" stroke="#f5c842" stroke-width="2"/>
    <text y="22" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5c842" text-anchor="middle">$100M</text>
    <!-- door -->
    <rect x="-12" y="80" width="24" height="30" fill="#0a0f1e" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <!-- Branches to 4 startup investments -->
  <g stroke="#f5c842" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.7">
    <path d="M155 220 Q100 240 70 280"/>
    <path d="M165 240 Q140 290 130 320"/>
    <path d="M235 240 Q260 290 270 320"/>
    <path d="M245 220 Q300 240 330 280"/>
  </g>
  <!-- Startup nodes (rockets / small companies) -->
  <g>
    <g transform="translate(60 305)">
      <path d="M0 -16 L10 0 L10 14 L-10 14 L-10 0 Z" fill="#00ff88" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="0" cy="-2" r="3" fill="#0a0f1e"/>
      <path d="M-10 8 L-16 18 L-6 14 Z" fill="#e74c3c"/>
      <path d="M10 8 L16 18 L6 14 Z" fill="#e74c3c"/>
    </g>
    <g transform="translate(135 340)">
      <circle r="14" fill="#ff6b9d" stroke="#ffffff" stroke-width="1.8"/>
      <text y="5" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">▲</text>
    </g>
    <g transform="translate(265 340)">
      <rect x="-13" y="-13" width="26" height="26" rx="4" fill="#7b2fff" stroke="#ffffff" stroke-width="1.8"/>
      <path d="M-7 0 L-2 5 L7 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(340 305)">
      <polygon points="0,-15 13,-5 9,12 -9,12 -13,-5" fill="#ffd166" stroke="#ffffff" stroke-width="1.8"/>
      <circle r="4" fill="#0a0f1e"/>
    </g>
  </g>
  <!-- IRR/MOIC arrow up at top -->
  <g transform="translate(85 90)" stroke="#00ff88" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="0,30 12,18 22,24 36,6"/>
    <polyline points="30,4 38,4 38,12"/>
  </g>
</svg>
