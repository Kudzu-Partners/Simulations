<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg309" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
    <linearGradient id="tri309a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>
    <linearGradient id="tri309b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="tri309c" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#74b9ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg309)"/>

  <!-- Triple constraint triangle (protagonist) -->
  <!-- Fill -->
  <path d="M 200 48 L 356 312 L 44 312 Z" fill="#1a2744" opacity="0.6"/>
  <!-- Three colored sides -->
  <line x1="200" y1="48" x2="356" y2="312" stroke="url(#tri309a)" stroke-width="6" stroke-linecap="round"/>
  <line x1="356" y1="312" x2="44" y2="312" stroke="url(#tri309b)" stroke-width="6" stroke-linecap="round"/>
  <line x1="44" y1="312" x2="200" y2="48" stroke="url(#tri309c)" stroke-width="6" stroke-linecap="round"/>

  <!-- Corner nodes -->
  <!-- SCOPE (top) -->
  <circle cx="200" cy="48" r="22" fill="#1a2744" stroke="#f5c842" stroke-width="3"/>
  <text x="200" y="54" text-anchor="middle" font-family="sans-serif" font-size="18">🎯</text>

  <!-- TIME (bottom-right) -->
  <circle cx="356" cy="312" r="22" fill="#1a2744" stroke="#74b9ff" stroke-width="3"/>
  <text x="356" y="318" text-anchor="middle" font-family="sans-serif" font-size="18">⏱</text>

  <!-- COST (bottom-left) -->
  <circle cx="44" cy="312" r="22" fill="#1a2744" stroke="#00ff88" stroke-width="3"/>
  <text x="44" y="318" text-anchor="middle" font-family="sans-serif" font-size="18">💰</text>

  <!-- Critical path inside triangle -->
  <g opacity="0.7">
    <circle cx="200" cy="148" r="8" fill="#f5c842"/>
    <circle cx="260" cy="220" r="8" fill="#f5c842"/>
    <circle cx="150" cy="252" r="8" fill="#f5c842"/>
    <line x1="200" y1="70" x2="200" y2="140" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="200" y1="148" x2="260" y2="220" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="260" y1="220" x2="150" y2="252" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="150" y1="252" x2="80" y2="294" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="6,4"/>
  </g>

  <!-- EVM indicator (bottom center) -->
  <g transform="translate(140, 348)">
    <rect x="0" y="0" width="120" height="28" rx="7" fill="#1a2744" stroke="#74b9ff" stroke-width="1.5"/>
    <!-- EV bar -->
    <rect x="8" y="8" width="104" height="12" rx="4" fill="#1a3a5c"/>
    <rect x="8" y="8" width="68" height="12" rx="4" fill="#74b9ff" opacity="0.8"/>
    <!-- Planned value line -->
    <line x1="80" y1="5" x2="80" y2="23" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="3,2"/>
  </g>
</svg>
