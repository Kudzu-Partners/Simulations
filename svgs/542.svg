<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg542" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#1b3a20"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg542)"/>

  <text x="200" y="56" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">B-CORP · CARBON ACCOUNTING</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Certificate medal (protagonist) -->
    <g transform="translate(200,200)">
      <!-- Ribbon left -->
      <path d="M -40 0 L -56 48 L -32 40 L -20 64 L -8 32 Z" fill="#52b788" stroke="#0a1f0a" stroke-width="2.5"/>
      <!-- Ribbon right -->
      <path d="M 40 0 L 56 48 L 32 40 L 20 64 L 8 32 Z" fill="#52b788" stroke="#0a1f0a" stroke-width="2.5"/>

      <!-- Outer star/medal -->
      <circle r="64" fill="#0a1f0a" stroke="#f5c842" stroke-width="3.5"/>
      <!-- Inner ring -->
      <circle r="48" fill="#1b3a20" stroke="#52b788" stroke-width="2.5"/>

      <!-- "B" letter for B-Corp -->
      <text x="0" y="14" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="48" font-weight="700" fill="#f5c842">B</text>

      <!-- Sparkle indicators around medal -->
      <circle cx="-72" cy="-40" r="3" fill="#95d5b2"/>
      <circle cx="72"  cy="-40" r="3" fill="#95d5b2"/>
      <circle cx="-72" cy="40"  r="3" fill="#95d5b2"/>
      <circle cx="72"  cy="40"  r="3" fill="#95d5b2"/>
    </g>

    <!-- Leaf badge top-left -->
    <g transform="translate(48,84)">
      <rect width="56" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <path d="M 28 8 Q 16 14 14 22 Q 24 26 28 22 Q 32 14 28 8 Z" fill="#52b788"/>
    </g>

    <!-- CO2 badge top-right -->
    <g transform="translate(288,84)">
      <rect width="64" height="26" rx="4" fill="#74b9ff" fill-opacity="0.18" stroke="#74b9ff" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#74b9ff" font-size="11" font-family="monospace" font-weight="bold">CO₂</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#d8f3dc" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Coffee Co-op · ESG · CO</text>
</svg>
