  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg64)"/>
  <!-- Currency labels FX -->
  <text x="80" y="115" font-family="monospace" font-size="22" font-weight="bold" fill="#00ff88" opacity="0.9">ARS</text>
  <text x="168" y="115" font-family="monospace" font-size="22" font-weight="bold" fill="#00bfff" opacity="0.9">BRL</text>
