<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg577" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="paper577" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#d8d8d0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg577)"/>

  <text x="200" y="56" text-anchor="middle" fill="#00ff88" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">PERSONAL TAX · DIAN</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Tax form (protagonist) -->
    <g transform="translate(200,216)">
      <rect x="-80" y="-104" width="160" height="200" rx="6" fill="url(#paper577)" stroke="#1a2744" stroke-width="3"/>
      <!-- Header -->
      <rect x="-72" y="-96" width="144" height="20" rx="3" fill="#1a2744"/>
      <text x="0" y="-82" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00ff88">DIAN F210</text>

      <!-- Rows with totals -->
      <line x1="-64" y1="-56" x2="64" y2="-56" stroke="#1a2744" stroke-width="1.5" opacity="0.5"/>
      <text x="-56" y="-44" font-family="monospace" font-size="8" fill="#1a2744">INGRESOS</text>
      <line x1="-64" y1="-32" x2="64" y2="-32" stroke="#1a2744" stroke-width="1" opacity="0.3"/>
      <text x="-56" y="-20" font-family="monospace" font-size="8" fill="#1a2744">DEDUC</text>
      <line x1="-64" y1="-8" x2="64" y2="-8" stroke="#1a2744" stroke-width="1" opacity="0.3"/>
      <text x="-56" y="4" font-family="monospace" font-size="8" fill="#1a2744">RENTA</text>
      <line x1="-64" y1="16" x2="64" y2="16" stroke="#1a2744" stroke-width="1" opacity="0.3"/>
      <text x="-56" y="28" font-family="monospace" font-size="8" fill="#1a2744">IMPTO</text>

      <!-- Total box -->
      <rect x="16" y="-44" width="48" height="14" rx="2" fill="#52b788" opacity="0.65"/>
      <rect x="16" y="-20" width="40" height="14" rx="2" fill="#e74c3c" opacity="0.55"/>
      <rect x="16" y="4"   width="44" height="14" rx="2" fill="#74b9ff" opacity="0.65"/>
      <rect x="16" y="28"  width="36" height="14" rx="2" fill="#1a2744"/>

      <!-- Signature stamp -->
      <line x1="-64" y1="64" x2="64" y2="64" stroke="#1a2744" stroke-width="2"/>
      <path d="M -48 60 Q -32 48 -16 56 Q 0 62 16 52 Q 28 46 40 54"
            stroke="#1a2744" stroke-width="2.5" fill="none"/>
      <circle cx="44" cy="80" r="14" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
      <text x="44" y="85" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#e74c3c">DIAN</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#c0cfff" font-size="9" font-family="monospace" opacity="0.4" letter-spacing="1.2">Personal Income Tax · CO</text>
</svg>
