<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg155" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg155)"/>

  <!-- Negotiation table (side view, simplified) -->
  <rect x="100" y="220" width="200" height="14" rx="4" fill="#c0cfff" opacity="0.15"/>
  <rect x="100" y="220" width="200" height="14" rx="4" fill="none" stroke="#c0cfff" stroke-width="1.5" opacity="0.35"/>
  <!-- Table legs -->
  <rect x="110" y="234" width="8" height="30" rx="3" fill="#c0cfff" opacity="0.15"/>
  <rect x="282" y="234" width="8" height="30" rx="3" fill="#c0cfff" opacity="0.15"/>

  <!-- Contract document on table -->
  <rect x="172" y="190" width="56" height="34" rx="3" fill="#f5c842" opacity="0.12"/>
  <rect x="172" y="190" width="56" height="34" rx="3" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.55"/>
  <line x1="179" y1="200" x2="221" y2="200" stroke="#f5c842" stroke-width="1" opacity="0.5"/>
  <line x1="179" y1="208" x2="221" y2="208" stroke="#f5c842" stroke-width="1" opacity="0.5"/>
  <line x1="179" y1="216" x2="210" y2="216" stroke="#f5c842" stroke-width="1" opacity="0.5"/>
  <!-- Signature line -->
  <line x1="179" y1="218" x2="221" y2="218" stroke="#f5c842" stroke-width="0.5" opacity="0.3"/>

  <!-- LEFT side: Robot arm (AI agent) -->
  <!-- Arm segments -->
  <rect x="52" y="148" width="16" height="50" rx="6" fill="#00bfff" opacity="0.3"/>
  <rect x="52" y="148" width="16" height="50" rx="6" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.7"/>
  <!-- Elbow joint -->
  <circle cx="60" cy="200" r="8" fill="#00bfff" opacity="0.5"/>
  <!-- Forearm -->
  <rect x="68" y="192" width="70" height="16" rx="6" fill="#00bfff" opacity="0.3"/>
  <rect x="68" y="192" width="70" height="16" rx="6" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.7"/>
  <!-- Robot hand/gripper -->
  <rect x="136" y="185" width="22" height="8" rx="3" fill="#00bfff" opacity="0.6"/>
  <rect x="136" y="207" width="22" height="8" rx="3" fill="#00bfff" opacity="0.6"/>
  <rect x="155" y="192" width="8" height="16" rx="3" fill="#00bfff" opacity="0.4"/>

  <!-- Robot body/head (left side) -->
  <rect x="38" y="90" width="50" height="58" rx="8" fill="#00bfff" opacity="0.12"/>
  <rect x="38" y="90" width="50" height="58" rx="8" fill="none" stroke="#00bfff" stroke-width="2" opacity="0.7"/>
  <!-- Robot eyes -->
  <rect x="46" y="102" width="12" height="8" rx="3" fill="#00bfff" opacity="0.7"/>
  <rect x="68" y="102" width="12" height="8" rx="3" fill="#00bfff" opacity="0.7"/>
  <!-- Robot mouth — flat line -->
  <line x1="48" y1="124" x2="78" y2="124" stroke="#00bfff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- AI label -->
  <text x="63" y="168" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#00bfff" text-anchor="middle" opacity="0.7">AI</text>

  <!-- RIGHT side: Human hand (organic) -->
  <!-- Arm -->
  <path d="M 350 148 L 330 148 L 330 200" fill="none" stroke="#f5c842" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
  <path d="M 350 148 L 330 148 L 330 200" fill="none" stroke="#f5c842" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Hand with fingers -->
  <path d="M 215 200 L 240 192 L 248 182 Q 252 176 258 182 L 252 196 L 268 182 Q 274 176 278 182 L 264 200 L 280 190 Q 286 184 290 190 L 276 208 L 290 200 Q 296 196 298 202 L 280 218 L 215 218 Z" fill="#f5c842" opacity="0.3"/>
  <path d="M 215 200 L 240 192 L 248 182 Q 252 176 258 182 L 252 196 L 268 182 Q 274 176 278 182 L 264 200 L 280 190 Q 286 184 290 190 L 276 208 L 290 200 Q 296 196 298 202 L 280 218 L 215 218 Z" fill="none" stroke="#f5c842" stroke-width="2" opacity="0.75"/>
  <!-- Human label -->
  <text x="330" y="168" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#f5c842" text-anchor="middle" opacity="0.7">Human</text>

  <!-- Tension arrows pointing at contract -->
  <line x1="158" y1="207" x2="172" y2="207" stroke="#c0cfff" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 3"/>
  <line x1="228" y1="207" x2="215" y2="207" stroke="#c0cfff" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 3"/>

  <!-- Label -->
  <text x="200" y="310" font-family="Arial,sans-serif" font-size="10" fill="#c0cfff" text-anchor="middle" opacity="0.4">Procurement Strategy</text>
  <text x="200" y="330" font-family="Arial,sans-serif" font-size="9" fill="#00bfff" text-anchor="middle" opacity="0.35">AI Agent  vs  Relationship</text>
</svg>
