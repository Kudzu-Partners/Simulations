<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg001" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <radialGradient id="center001" cx="50%" cy="48%" r="22%">
      <stop offset="0%" stop-color="#d8f3dc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#52b788" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg001)"/>

  <!-- Dot grid texture -->
  <g fill="#d8f3dc" opacity="0.07">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/><circle cx="200" cy="50" r="2"/><circle cx="250" cy="50" r="2"/><circle cx="300" cy="50" r="2"/><circle cx="350" cy="50" r="2"/>
    <circle cx="50" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="150" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="250" cy="100" r="2"/><circle cx="300" cy="100" r="2"/><circle cx="350" cy="100" r="2"/>
    <circle cx="50" cy="150" r="2"/><circle cx="100" cy="150" r="2"/><circle cx="150" cy="150" r="2"/><circle cx="200" cy="150" r="2"/><circle cx="250" cy="150" r="2"/><circle cx="300" cy="150" r="2"/><circle cx="350" cy="150" r="2"/>
    <circle cx="50" cy="200" r="2"/><circle cx="100" cy="200" r="2"/><circle cx="150" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="250" cy="200" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="350" cy="200" r="2"/>
    <circle cx="50" cy="250" r="2"/><circle cx="100" cy="250" r="2"/><circle cx="150" cy="250" r="2"/><circle cx="200" cy="250" r="2"/><circle cx="250" cy="250" r="2"/><circle cx="300" cy="250" r="2"/><circle cx="350" cy="250" r="2"/>
    <circle cx="50" cy="300" r="2"/><circle cx="100" cy="300" r="2"/><circle cx="150" cy="300" r="2"/><circle cx="200" cy="300" r="2"/><circle cx="250" cy="300" r="2"/><circle cx="300" cy="300" r="2"/><circle cx="350" cy="300" r="2"/>
    <circle cx="50" cy="350" r="2"/><circle cx="100" cy="350" r="2"/><circle cx="150" cy="350" r="2"/><circle cx="200" cy="350" r="2"/><circle cx="250" cy="350" r="2"/><circle cx="300" cy="350" r="2"/><circle cx="350" cy="350" r="2"/>
  </g>

  <!-- Venn circles: E (Environmental), S (Social), G (Governance) -->
  <circle cx="155" cy="158" r="90" fill="#52b788" fill-opacity="0.20" stroke="#52b788" stroke-width="2.5" stroke-opacity="0.85"/>
  <circle cx="245" cy="158" r="90" fill="#74c69d" fill-opacity="0.20" stroke="#74c69d" stroke-width="2.5" stroke-opacity="0.85"/>
  <circle cx="200" cy="248" r="90" fill="#d8f3dc" fill-opacity="0.18" stroke="#d8f3dc" stroke-width="2.5" stroke-opacity="0.80"/>

  <!-- Center intersection glow where all three overlap -->
  <circle cx="200" cy="193" r="48" fill="url(#center001)"/>
  <circle cx="200" cy="193" r="12" fill="#ffffff" fill-opacity="0.85"/>

  <!-- E label — unique region of Environmental circle (upper-left) -->
  <text x="104" y="120" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#d8f3dc" text-anchor="middle" opacity="0.92">E</text>

  <!-- S label — unique region of Social circle (upper-right) -->
  <text x="296" y="120" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#d8f3dc" text-anchor="middle" opacity="0.92">S</text>

  <!-- G label — unique region of Governance circle (bottom) -->
  <text x="200" y="326" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#d8f3dc" text-anchor="middle" opacity="0.92">G</text>

</svg>
