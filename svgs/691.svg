<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg691" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#1b3a20"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg691)"/>

  <text x="200" y="56" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">SUSTAINABLE TOURISM</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Suitcase with destination tags (protagonist) -->
    <g transform="translate(200,212)">
      <!-- Suitcase body -->
      <rect x="-80" y="-48" width="160" height="120" rx="10" fill="#1b3a20" stroke="#f5c842" stroke-width="3.5"/>
      <!-- Handle -->
      <rect x="-24" y="-72" width="48" height="24" rx="6" fill="none" stroke="#f5c842" stroke-width="3"/>
      <!-- Latches -->
      <rect x="-56" y="-44" width="10" height="6" rx="1" fill="#f5c842"/>
      <rect x="46" y="-44" width="10" height="6" rx="1" fill="#f5c842"/>
      <!-- Stripe / decorative band -->
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#f5c842" stroke-width="2.5"/>

      <!-- Travel stickers (round) -->
      <circle cx="-40" cy="-16" r="14" fill="#52b788" stroke="#0a1f0a" stroke-width="2"/>
      <text x="-40" y="-12" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="12" font-weight="700" fill="#0a1f0a">CO</text>

      <circle cx="0" cy="40" r="14" fill="#ff6b9d" stroke="#0a1f0a" stroke-width="2"/>
      <path d="M -7 40 L -2 44 L 7 36" stroke="#0a1f0a" stroke-width="2" fill="none"/>

      <circle cx="40" cy="-16" r="14" fill="#74b9ff" stroke="#0a1f0a" stroke-width="2"/>
      <circle cx="40" cy="-16" r="6" fill="#0a1f0a"/>

      <!-- Leaf in corner -->
      <path d="M 56 56 Q 64 48 72 56 Q 64 64 56 56 Z" fill="#52b788"/>
    </g>

    <!-- Eco badge top-left -->
    <g transform="translate(48,84)">
      <rect width="64" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#52b788" font-size="11" font-family="monospace" font-weight="bold">ECO</text>
    </g>

    <!-- Regional dev badge top-right -->
    <g transform="translate(284,84)">
      <rect width="68" height="26" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.5"/>
      <text x="34" y="18" text-anchor="middle" fill="#f5c842" font-size="11" font-family="monospace" font-weight="bold">REG</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#d8f3dc" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Regional Tourism · CO</text>
</svg>
