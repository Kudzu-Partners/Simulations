<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg104" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="station104" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#b35e10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg104)"/>
  <!-- 3-station serial line with 2 buffers -->
  <!-- Conveyor base -->
  <rect x="40" y="220" width="320" height="6" fill="#95a5a6" opacity="0.6"/>
  <g fill="#95a5a6" opacity="0.4">
    <circle cx="55" cy="223" r="6"/><circle cx="95" cy="223" r="6"/>
    <circle cx="170" cy="223" r="6"/><circle cx="230" cy="223" r="6"/>
    <circle cx="305" cy="223" r="6"/><circle cx="345" cy="223" r="6"/>
  </g>
  <!-- Station 1 (gear) -->
  <g transform="translate(80 170)">
    <circle r="32" fill="url(#station104)" stroke="#ffffff" stroke-width="2"/>
    <g fill="#ffffff">
      <rect x="-5" y="-42" width="10" height="12"/>
      <rect x="-5" y="30" width="10" height="12"/>
      <rect x="-42" y="-5" width="12" height="10"/>
      <rect x="30" y="-5" width="12" height="10"/>
      <rect x="-30" y="-30" width="10" height="10" transform="rotate(45)"/>
      <rect x="20" y="20" width="10" height="10" transform="rotate(45)"/>
    </g>
    <circle r="10" fill="#1c2333"/>
  </g>
  <!-- Buffer 1 (queue of WIP between station 1 and 2) -->
  <g transform="translate(140 175)">
    <rect x="0" y="-22" width="60" height="44" rx="3" fill="none" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <g fill="#e67e22" opacity="0.75">
      <rect x="6" y="-6" width="12" height="12"/>
      <rect x="22" y="-6" width="12" height="12"/>
      <rect x="38" y="-6" width="12" height="12"/>
      <rect x="6" y="-20" width="12" height="12"/>
      <rect x="22" y="-20" width="12" height="12"/>
    </g>
  </g>
  <!-- Station 2 -->
  <g transform="translate(230 170)">
    <circle r="32" fill="url(#station104)" stroke="#ffffff" stroke-width="2"/>
    <g fill="#ffffff">
      <rect x="-5" y="-42" width="10" height="12"/>
      <rect x="-5" y="30" width="10" height="12"/>
      <rect x="-42" y="-5" width="12" height="10"/>
      <rect x="30" y="-5" width="12" height="10"/>
    </g>
    <circle r="10" fill="#1c2333"/>
  </g>
  <!-- Buffer 2 (smaller — bottleneck signal) -->
  <g transform="translate(275 175)">
    <rect x="0" y="-22" width="40" height="44" rx="3" fill="none" stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="4,3"/>
    <g fill="#e67e22" opacity="0.75">
      <rect x="6" y="-6" width="12" height="12"/>
      <rect x="22" y="-6" width="12" height="12"/>
    </g>
  </g>
  <!-- Station 3 -->
  <g transform="translate(335 170)">
    <circle r="28" fill="url(#station104)" stroke="#ffffff" stroke-width="2"/>
    <g fill="#ffffff">
      <rect x="-5" y="-38" width="10" height="11"/>
      <rect x="-5" y="27" width="10" height="11"/>
      <rect x="-38" y="-5" width="11" height="10"/>
      <rect x="27" y="-5" width="11" height="10"/>
    </g>
    <circle r="9" fill="#1c2333"/>
  </g>
  <!-- Flow arrows -->
  <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M115 170 L138 170"/><polyline points="132,165 140,170 132,175"/>
    <path d="M205 170 L228 170"/><polyline points="222,165 230,170 222,175"/>
    <path d="M320 170 L308 170"/>
  </g>
  <!-- Variability waveform on top (station inputs) -->
  <g stroke="#95a5a6" stroke-width="2" fill="none" opacity="0.55">
    <path d="M50 80 Q70 60 90 80 T130 80 T170 80 T210 80 T250 80 T290 80 T330 80 T370 80"/>
  </g>
  <text x="200" y="55" font-family="sans-serif" font-size="22" font-weight="700" fill="#e67e22" text-anchor="middle" opacity="0.85">CONWIP</text>
</svg>
