<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg232" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg232)"/>

  <!-- Branches: level 0 → 1 -->
  <line x1="68"  y1="200" x2="148" y2="143" stroke="#00bfff" stroke-width="2"   opacity="0.7"/>
  <line x1="68"  y1="200" x2="148" y2="257" stroke="#00bfff" stroke-width="2"   opacity="0.7"/>

  <!-- Branches: level 1 → 2 -->
  <line x1="148" y1="143" x2="228" y2="103" stroke="#00bfff" stroke-width="1.8" opacity="0.65"/>
  <line x1="148" y1="143" x2="228" y2="200" stroke="#00bfff" stroke-width="1.8" opacity="0.65"/>
  <line x1="148" y1="257" x2="228" y2="200" stroke="#00bfff" stroke-width="1.8" opacity="0.65"/>
  <line x1="148" y1="257" x2="228" y2="297" stroke="#00bfff" stroke-width="1.8" opacity="0.65"/>

  <!-- Branches: level 2 → 3 -->
  <line x1="228" y1="103" x2="315" y2="72"  stroke="#52b788" stroke-width="1.5" opacity="0.6"/>
  <line x1="228" y1="103" x2="315" y2="143" stroke="#52b788" stroke-width="1.5" opacity="0.6"/>
  <line x1="228" y1="200" x2="315" y2="143" stroke="#52b788" stroke-width="1.5" opacity="0.6"/>
  <line x1="228" y1="200" x2="315" y2="257" stroke="#52b788" stroke-width="1.5" opacity="0.6"/>
  <line x1="228" y1="297" x2="315" y2="257" stroke="#52b788" stroke-width="1.5" opacity="0.6"/>
  <line x1="228" y1="297" x2="315" y2="328" stroke="#52b788" stroke-width="1.5" opacity="0.6"/>

  <!-- Nodes level 0 -->
  <circle cx="68"  cy="200" r="13" fill="#1b2d4f" stroke="#00bfff" stroke-width="2.5"/>
  <text x="68"  y="204" font-family="monospace" font-size="9" fill="#00bfff" text-anchor="middle">S₀</text>

  <!-- Nodes level 1 -->
  <circle cx="148" cy="143" r="12" fill="#1b2d4f" stroke="#00bfff" stroke-width="2"/>
  <text x="148" y="147" font-family="monospace" font-size="8" fill="#00bfff" text-anchor="middle">uS</text>
  <circle cx="148" cy="257" r="12" fill="#1b2d4f" stroke="#00bfff" stroke-width="2"/>
  <text x="148" y="261" font-family="monospace" font-size="8" fill="#00bfff" text-anchor="middle">dS</text>

  <!-- Nodes level 2 -->
  <circle cx="228" cy="103" r="11" fill="#1b2d4f" stroke="#52b788" stroke-width="2"/>
  <circle cx="228" cy="200" r="11" fill="#1b2d4f" stroke="#52b788" stroke-width="2"/>
  <circle cx="228" cy="297" r="11" fill="#1b2d4f" stroke="#52b788" stroke-width="2"/>

  <!-- Nodes level 3 — terminal (American put: ITM node highlighted) -->
  <circle cx="315" cy="72"  r="10" fill="#1b2d4f" stroke="#52b788" stroke-width="1.8"/>
  <circle cx="315" cy="143" r="10" fill="#1b2d4f" stroke="#52b788" stroke-width="1.8"/>
  <circle cx="315" cy="257" r="10" fill="#1b2d4f" stroke="#52b788" stroke-width="1.8"/>
  <!-- ITM terminal node -->
  <circle cx="315" cy="328" r="12" fill="#f5c842" opacity="0.25" stroke="#f5c842" stroke-width="2.5"/>
  <text x="315" y="332" font-family="monospace" font-size="7.5" fill="#f5c842" text-anchor="middle">PUT</text>

  <!-- Early exercise arrow -->
  <path d="M 228,297 Q 248,312 267,320" fill="none" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Convergence curve at bottom -->
  <path d="M 60,362 Q 150,350 240,358 Q 295,365 348,358"
        fill="none" stroke="#00bfff" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.3"/>
  <text x="204" y="380" font-family="monospace" font-size="9" fill="#a0aec0" text-anchor="middle" opacity="0.38">Δt → 0  convergence</text>
</svg>
