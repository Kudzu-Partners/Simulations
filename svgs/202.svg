<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg202" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <radialGradient id="glow202" cx="65%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="payoff202" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#d4a574" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg202)"/>
  <rect width="400" height="400" rx="32" fill="url(#glow202)"/>

  <!-- Background grid -->
  <g stroke="#00bfff" stroke-width="0.4" opacity="0.07">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="220" x2="400" y2="220"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="80"  y1="0" x2="80"  y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Axis -->
  <line x1="55" y1="270" x2="358" y2="270" stroke="#95a5a6" stroke-width="1.2" opacity="0.4"/>
  <line x1="55" y1="65"  x2="55"  y2="275" stroke="#95a5a6" stroke-width="1.2" opacity="0.4"/>
  <text x="42" y="74" font-family="'Courier New',monospace" font-size="8" fill="#95a5a6" opacity="0.55">P/L</text>
  <text x="356" y="285" text-anchor="end" font-family="'Courier New',monospace" font-size="8" fill="#95a5a6" opacity="0.55">S</text>

  <!-- Strike marker (vertical dashed) -->
  <line x1="200" y1="65" x2="200" y2="275" stroke="#00bfff" stroke-width="1" stroke-dasharray="3,4" opacity="0.45"/>
  <text x="200" y="290" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#00bfff" opacity="0.7">K</text>

  <!-- Long call payoff (hockey stick): flat → bend at strike → up -->
  <path d="M62 245 L200 245 L340 92" stroke="url(#payoff202)" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
  <!-- Premium dotted line below (cost basis) -->
  <line x1="62" y1="259" x2="200" y2="259" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
  <line x1="200" y1="259" x2="218" y2="245" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- Breakeven point dot -->
  <circle cx="218" cy="245" r="4.5" fill="#0a0f1e" stroke="#d4a574" stroke-width="2"/>
  <text x="222" y="237" font-family="'Courier New',monospace" font-size="7" fill="#d4a574" opacity="0.8">BE</text>

  <!-- Strike point -->
  <circle cx="200" cy="245" r="4" fill="#0a0f1e" stroke="#00bfff" stroke-width="1.8"/>

  <!-- Payoff endpoint -->
  <circle cx="340" cy="92" r="6" fill="#0a0f1e" stroke="#00ff88" stroke-width="2.5"/>
  <circle cx="340" cy="92" r="2.5" fill="#00ff88"/>

  <!-- Volatility curve (smile in background) -->
  <path d="M70 130 Q140 170 200 152 Q260 134 330 175"
        stroke="#7b2fff" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- Greek letters Δ (Delta) — large symbol -->
  <text x="98" y="108" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#00bfff" opacity="0.85">Δ</text>

  <!-- Other greeks — small chip badges -->
  <g transform="translate(60,330)">
    <rect x="0" y="0" width="36" height="22" rx="5" fill="#00bfff" opacity="0.12" stroke="#00bfff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="15" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#00bfff" opacity="0.9">Γ</text>
  </g>
  <g transform="translate(102,330)">
    <rect x="0" y="0" width="36" height="22" rx="5" fill="#7b2fff" opacity="0.14" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="15" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#a572ff" opacity="0.9">ν</text>
  </g>
  <g transform="translate(144,330)">
    <rect x="0" y="0" width="36" height="22" rx="5" fill="#ff6b6b" opacity="0.12" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="15" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#ff8888" opacity="0.9">θ</text>
  </g>
  <g transform="translate(186,330)">
    <rect x="0" y="0" width="36" height="22" rx="5" fill="#52b788" opacity="0.12" stroke="#52b788" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="15" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#74c69d" opacity="0.9">ρ</text>
  </g>

  <!-- Volatility tag -->
  <text x="340" y="148" text-anchor="end" font-family="'Courier New',monospace" font-size="8" fill="#7b2fff" opacity="0.7" letter-spacing="1">σ IV</text>

  <!-- Title strip -->
  <text x="290" y="378" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#00bfff" opacity="0.45" letter-spacing="2">DERIVATIVES DESK</text>
</svg>
