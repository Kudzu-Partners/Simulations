<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg99" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="water99" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1c2333" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg99)"/>
  <!-- Water -->
  <path d="M40,270 Q100,250 160,270 Q220,290 280,265 Q320,250 360,270 L360,380 L40,380 Z" fill="url(#water99)"/>
  <path d="M40,275 Q100,257 160,275 Q220,293 280,270 Q320,255 360,275" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.3"/>
  <!-- Container crane (gantry) -->
  <!-- Vertical legs -->
  <rect x="110" y="130" width="12" height="145" rx="3" fill="#e67e22" opacity="0.7"/>
  <rect x="235" y="130" width="12" height="145" rx="3" fill="#e67e22" opacity="0.7"/>
  <!-- Horizontal beam -->
  <rect x="95" y="120" width="175" height="14" rx="3" fill="#e67e22" opacity="0.8"/>
  <!-- Trolley -->
  <rect x="170" y="114" width="30" height="10" rx="3" fill="#95a5a6" opacity="0.8"/>
  <!-- Hoist cable -->
  <line x1="185" y1="134" x2="185" y2="175" stroke="#e67e22" stroke-width="2" opacity="0.6"/>
  <!-- Container hanging -->
  <rect x="163" y="175" width="44" height="28" rx="3" fill="#e67e22" opacity="0.7"/>
  <line x1="170" y1="178" x2="170" y2="200" stroke="#95a5a6" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="178" x2="200" y2="200" stroke="#95a5a6" stroke-width="1" opacity="0.5"/>
  <!-- Stacked containers on dock -->
  <g opacity="0.7">
    <rect x="55" y="218" width="52" height="22" rx="3" fill="#e67e22" opacity="0.7"/>
    <rect x="55" y="198" width="52" height="22" rx="3" fill="#95a5a6" opacity="0.6"/>
    <rect x="65" y="178" width="42" height="22" rx="3" fill="#e67e22" opacity="0.55"/>
  </g>
  <g opacity="0.65">
    <rect x="260" y="218" width="52" height="22" rx="3" fill="#95a5a6" opacity="0.7"/>
    <rect x="260" y="198" width="52" height="22" rx="3" fill="#e67e22" opacity="0.6"/>
    <rect x="268" y="178" width="36" height="22" rx="3" fill="#95a5a6" opacity="0.5"/>
  </g>
  <!-- Flow arrows (logistics direction) -->
  <path d="M107" y1="230" x2="160" y2="230" fill="none"/>
  <line x1="107" y1="235" x2="155" y2="235" stroke="#e67e22" stroke-width="2" opacity="0.5" stroke-dasharray="5,3"/>
  <polygon points="155,235 145,229 145,241" fill="#e67e22" opacity="0.6"/>
  <line x1="245" y1="235" x2="260" y2="235" stroke="#e67e22" stroke-width="2" opacity="0.45" stroke-dasharray="5,3"/>
  <!-- Port label -->
  <text x="200" y="90" font-family="sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" opacity="0.7">PORT OPERATIONS</text>
  <!-- Ship silhouette (faint) at water line -->
  <path d="M60,268 L80,255 L320,255 L340,268 Q340,275 300,278 L100,278 Q60,275 60,268 Z" fill="#2c3e50" stroke="#e67e22" stroke-width="1.5" opacity="0.6"/>
</svg>
