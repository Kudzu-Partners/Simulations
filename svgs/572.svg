<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg572" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#1b3a20"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg572)"/>

  <text x="200" y="56" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">SYSTEMS THINKING · COFFEE</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Causal loop diagram (protagonist) -->
    <g transform="translate(200,208)">
      <!-- Outer circular loop -->
      <circle r="104" fill="none" stroke="#52b788" stroke-width="4" stroke-dasharray="2 6" opacity="0.45"/>

      <!-- 4 nodes in cycle: Price, Production, Quality, Demand -->
      <!-- Top (Price) -->
      <circle cx="0" cy="-104" r="24" fill="#1b3a20" stroke="#f5c842" stroke-width="3.5"/>
      <text x="0" y="-100" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="18" font-weight="700" fill="#f5c842">$</text>

      <!-- Right (Production) -->
      <circle cx="104" cy="0" r="24" fill="#1b3a20" stroke="#52b788" stroke-width="3"/>
      <rect x="92" y="-12" width="24" height="24" rx="3" fill="none" stroke="#52b788" stroke-width="2.5"/>
      <line x1="100" y1="-6" x2="108" y2="-6" stroke="#52b788" stroke-width="2"/>
      <line x1="100" y1="2"  x2="108" y2="2"  stroke="#52b788" stroke-width="2"/>
      <line x1="100" y1="10" x2="108" y2="10" stroke="#52b788" stroke-width="2"/>

      <!-- Bottom (Quality) -->
      <circle cx="0" cy="104" r="24" fill="#1b3a20" stroke="#52b788" stroke-width="3"/>
      <path d="M 0 90 L 4 100 L 12 100 L 6 106 L 8 116 L 0 110 L -8 116 L -6 106 L -12 100 L -4 100 Z"
            fill="#52b788"/>

      <!-- Left (Demand) -->
      <circle cx="-104" cy="0" r="24" fill="#1b3a20" stroke="#52b788" stroke-width="3"/>
      <path d="M -114 -8 Q -104 -16 -94 -8" stroke="#52b788" stroke-width="2.5" fill="none"/>
      <path d="M -114 4 Q -104 12 -94 4" stroke="#52b788" stroke-width="2.5" fill="none"/>

      <!-- Connecting arrows (cycle) -->
      <path d="M 24 -96 Q 60 -80 88 -32" stroke="#dfe6e9" stroke-width="2.5" fill="none" opacity="0.55"/>
      <path d="M 80 -28 L 88 -32 L 88 -22" stroke="#dfe6e9" stroke-width="2.5" fill="none" opacity="0.55"/>

      <path d="M 96 24 Q 80 60 32 88" stroke="#dfe6e9" stroke-width="2.5" fill="none" opacity="0.55"/>
      <path d="M 28 80 L 32 88 L 22 88" stroke="#dfe6e9" stroke-width="2.5" fill="none" opacity="0.55"/>

      <path d="M -24 96 Q -60 80 -88 32" stroke="#dfe6e9" stroke-width="2.5" fill="none" opacity="0.55"/>
      <path d="M -80 28 L -88 32 L -88 22" stroke="#dfe6e9" stroke-width="2.5" fill="none" opacity="0.55"/>

      <path d="M -96 -24 Q -80 -60 -32 -88" stroke="#e74c3c" stroke-width="2.5" fill="none" opacity="0.7"/>
      <path d="M -28 -80 L -32 -88 L -22 -88" stroke="#e74c3c" stroke-width="2.5" fill="none" opacity="0.7"/>

      <!-- Center R/B indicator (reinforcing/balancing) -->
      <circle r="20" fill="#1b3a20" stroke="#f5c842" stroke-width="2.5"/>
      <text x="0" y="6" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="20" font-weight="700" fill="#f5c842">R</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#d8f3dc" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">Café · Value Chain · CO</text>
</svg>
