<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg522" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg522)"/>

  <text x="200" y="56" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" opacity="0.75" letter-spacing="2">CORPORATE FORM · S.A. vs SAS</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left option: S.A. -->
    <g transform="translate(112,200)">
      <rect x="-56" y="-88" width="112" height="176" rx="10" fill="#1b2d4f" stroke="#74b9ff" stroke-width="3.5"/>
      <!-- Roof / formal indicator -->
      <path d="M -56 -88 L 0 -120 L 56 -88" fill="none" stroke="#74b9ff" stroke-width="3.5"/>
      <!-- Internal columns (formality) -->
      <line x1="-32" y1="-72" x2="-32" y2="56" stroke="#74b9ff" stroke-width="2.5"/>
      <line x1="0"   y1="-72" x2="0"   y2="56" stroke="#74b9ff" stroke-width="2.5"/>
      <line x1="32"  y1="-72" x2="32"  y2="56" stroke="#74b9ff" stroke-width="2.5"/>
      <!-- Base -->
      <line x1="-56" y1="56" x2="56" y2="56" stroke="#74b9ff" stroke-width="3.5"/>
      <!-- Label -->
      <text x="0" y="80" text-anchor="middle" fill="#74b9ff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="20" font-weight="700">S.A.</text>
    </g>

    <!-- Right option: SAS -->
    <g transform="translate(288,200)">
      <rect x="-56" y="-88" width="112" height="176" rx="10" fill="#1b2d4f" stroke="#52b788" stroke-width="3.5"/>
      <!-- Lighter/flex indicator (rounded top) -->
      <path d="M -56 -88 Q 0 -112 56 -88" fill="none" stroke="#52b788" stroke-width="3.5"/>
      <!-- Internal flex elements -->
      <circle cx="-20" cy="-40" r="10" fill="none" stroke="#52b788" stroke-width="2.5"/>
      <circle cx="20"  cy="-40" r="10" fill="none" stroke="#52b788" stroke-width="2.5"/>
      <circle cx="0"   cy="0"   r="10" fill="none" stroke="#52b788" stroke-width="2.5"/>
      <line x1="-20" y1="-30" x2="0"  y2="-10" stroke="#52b788" stroke-width="2"/>
      <line x1="20"  y1="-30" x2="0"  y2="-10" stroke="#52b788" stroke-width="2"/>
      <!-- Base -->
      <line x1="-56" y1="56" x2="56" y2="56" stroke="#52b788" stroke-width="3.5"/>
      <text x="0" y="80" text-anchor="middle" fill="#52b788" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="20" font-weight="700">SAS</text>
    </g>

    <!-- Center decision indicator -->
    <g transform="translate(200,200)">
      <circle r="20" fill="#0d1b2a" stroke="#f5c842" stroke-width="3.5"/>
      <text x="0" y="6" text-anchor="middle" fill="#f5c842" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
            font-size="20" font-weight="700">?</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#c0cfff" font-size="9" font-family="monospace" opacity="0.4" letter-spacing="1.2">Tech Founders · CO</text>
</svg>
