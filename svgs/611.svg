<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg611" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg611)"/>

  <text x="200" y="56" text-anchor="middle" fill="#e67e22" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">MULTIMODAL · BOG → UIO</text>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Route map with 3 transport modes (protagonist) -->
    <g transform="translate(200,212)">
      <!-- Path -->
      <path d="M -128 -32 Q -64 -80 0 -32 Q 64 -16 128 32" stroke="#f5c842" stroke-width="3" fill="none" stroke-dasharray="6 5" opacity="0.65"/>

      <!-- Origin (Bogotá) -->
      <circle cx="-128" cy="-32" r="14" fill="#1c2333" stroke="#74b9ff" stroke-width="3"/>
      <circle cx="-128" cy="-32" r="5" fill="#74b9ff"/>

      <!-- Mode 1: Truck (left segment) -->
      <g transform="translate(-72,-72)">
        <rect x="-16" y="-4" width="20" height="12" rx="2" fill="#1c2333" stroke="#e67e22" stroke-width="2.5"/>
        <rect x="4" y="0" width="10" height="8" rx="1" fill="#1c2333" stroke="#e67e22" stroke-width="2.5"/>
        <circle cx="-10" cy="10" r="3" fill="#e67e22"/>
        <circle cx="10"  cy="10" r="3" fill="#e67e22"/>
      </g>

      <!-- Mode 2: Plane (middle segment) -->
      <g transform="translate(8,-48)">
        <path d="M -24 0 L -8 0 L 0 -10 L 10 0 L 24 0 L 18 4 L 10 4 L 4 12 L 0 14 L -4 12 L -10 4 L -18 4 Z"
              fill="#1c2333" stroke="#dfe6e9" stroke-width="2.5"/>
      </g>

      <!-- Mode 3: Truck again (right segment) -->
      <g transform="translate(80,16)">
        <rect x="-16" y="-4" width="20" height="12" rx="2" fill="#1c2333" stroke="#e67e22" stroke-width="2.5"/>
        <rect x="4" y="0" width="10" height="8" rx="1" fill="#1c2333" stroke="#e67e22" stroke-width="2.5"/>
        <circle cx="-10" cy="10" r="3" fill="#e67e22"/>
        <circle cx="10"  cy="10" r="3" fill="#e67e22"/>
      </g>

      <!-- Destination (Quito) -->
      <circle cx="128" cy="32" r="14" fill="#1c2333" stroke="#52b788" stroke-width="3"/>
      <circle cx="128" cy="32" r="5" fill="#52b788"/>

      <!-- Risk shield in middle -->
      <g transform="translate(0,60)">
        <path d="M 0 -16 L -16 -8 L -16 8 Q -16 22 0 28 Q 16 22 16 8 L 16 -8 Z"
              fill="#1c2333" stroke="#f5c842" stroke-width="2.5"/>
        <path d="M -7 6 L -1 12 L 9 0" stroke="#f5c842" stroke-width="2.5" fill="none"/>
      </g>
    </g>

    <!-- Origin badge top-left (BOG) -->
    <g transform="translate(48,84)">
      <rect width="64" height="26" rx="4" fill="#74b9ff" fill-opacity="0.18" stroke="#74b9ff" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#74b9ff" font-size="11" font-family="monospace" font-weight="bold">BOG</text>
    </g>

    <!-- Destination badge top-right (UIO) -->
    <g transform="translate(288,84)">
      <rect width="64" height="26" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <text x="32" y="18" text-anchor="middle" fill="#52b788" font-size="11" font-family="monospace" font-weight="bold">UIO</text>
    </g>
  </g>

  <text x="200" y="372" text-anchor="middle" fill="#95a5a6" font-size="9" font-family="monospace" opacity="0.5" letter-spacing="1.2">500M · Machinery · CO–EC</text>
</svg>
