<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg479" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0a2418"/>
    </linearGradient>
    <linearGradient id="house479" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#c98a2b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg479)"/>

  <text x="200" y="58" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">FIN INCLUSION · REMITTANCE LOAN</text>

  <!-- Sun (background) -->
  <circle cx="320" cy="110" r="22" fill="#f5c842" opacity="0.55"/>

  <!-- mountains -->
  <g opacity="0.5" fill="#3d1f08">
    <polygon points="40,300 110,200 180,300"/>
    <polygon points="140,300 220,180 300,300"/>
    <polygon points="240,300 330,210 380,300"/>
  </g>

  <!-- TWO HANDS cupping (hero, central) -->
  <g transform="translate(200,260)">
    <!-- left hand -->
    <path d="M -90 -10 Q -85 -45 -55 -45 L -55 -10 Q -45 -2 -10 0 L -10 30 Q -50 30 -90 25 Z"
          fill="#c98a2b" stroke="#5a3210" stroke-width="2"/>
    <!-- right hand -->
    <path d="M 90 -10 Q 85 -45 55 -45 L 55 -10 Q 45 -2 10 0 L 10 30 Q 50 30 90 25 Z"
          fill="#c98a2b" stroke="#5a3210" stroke-width="2"/>
    <!-- HOUSE (small rural, in cupped hands) -->
    <g transform="translate(0,-30)">
      <polygon points="-28,0 28,0 0,-25" fill="#c0392b" stroke="#5a1010" stroke-width="1.5"/>
      <rect x="-25" y="0" width="50" height="32" fill="url(#house479)" stroke="#5a3210" stroke-width="1.5"/>
      <rect x="-6" y="14" width="12" height="18" fill="#5a3210"/>
      <rect x="-20" y="6" width="10" height="8" fill="#c0cfff"/>
      <rect x="10" y="6" width="10" height="8" fill="#c0cfff"/>
      <!-- $ coin -->
      <circle cx="0" cy="-12" r="6" fill="#f5c842" stroke="#5a3210" stroke-width="1"/>
      <text x="0" y="-9" text-anchor="middle" fill="#5a3210" font-size="7" font-family="Georgia" font-weight="bold">$</text>
    </g>
  </g>

  <!-- $ remittance arrow (top-left) -->
  <g transform="translate(60,135)">
    <circle cx="0" cy="0" r="14" fill="#52b788" fill-opacity="0.25" stroke="#52b788" stroke-width="1.4"/>
    <text x="0" y="3" text-anchor="middle" fill="#52b788" font-size="13" font-family="Georgia, serif" font-weight="bold">$→</text>
  </g>

  <!-- PAR risk chip (top-right) -->
  <g transform="translate(330,160)">
    <rect x="-22" y="-13" width="44" height="26" rx="3" fill="#ff6b6b" fill-opacity="0.18" stroke="#ff6b6b" stroke-width="1.3"/>
    <text x="0" y="3" text-anchor="middle" fill="#ff6b6b" font-size="9" font-family="monospace" font-weight="bold">PAR30</text>
  </g>

  <!-- HONDURAS pin -->
  <g transform="translate(345,340)">
    <path d="M 0 0 C -7 0 -12 5 -12 12 C -12 22 0 36 0 36 C 0 36 12 22 12 12 C 12 5 7 0 0 0 Z"
          fill="#1a4480" fill-opacity="0.3" stroke="#c0cfff" stroke-width="1.3"/>
    <circle cx="-3" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="0" cy="13" r="1.5" fill="#1a4480"/>
    <circle cx="3" cy="13" r="1.5" fill="#1a4480"/>
  </g>

  <text x="200" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">Inclusión Fin · Rural · HN</text>
</svg>
