<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg192" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="smokeGrad192" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#95a5a6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#52b788" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg192)"/>

  <!-- Steel factory silhouette (left) -->
  <!-- Main building -->
  <rect x="48" y="210" width="100" height="80" rx="2" fill="#95a5a6" opacity="0.25"/>
  <rect x="48" y="210" width="100" height="80" rx="2" fill="none" stroke="#95a5a6" stroke-width="1.5" opacity="0.5"/>
  <!-- Chimney 1 -->
  <rect x="62" y="168" width="18" height="44" rx="2" fill="#95a5a6" opacity="0.35"/>
  <!-- Chimney 2 -->
  <rect x="90" y="180" width="18" height="32" rx="2" fill="#95a5a6" opacity="0.3"/>
  <!-- Chimney 3 -->
  <rect x="118" y="172" width="18" height="40" rx="2" fill="#95a5a6" opacity="0.35"/>

  <!-- CO2 smoke transitioning to green -->
  <path d="M 71 165 Q 65 140 75 120 Q 85 100 78 80" fill="none" stroke="url(#smokeGrad192)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 99 177 Q 93 152 103 132 Q 113 112 106 92" fill="none" stroke="url(#smokeGrad192)" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <path d="M 127 169 Q 121 144 131 124 Q 141 104 134 84" fill="none" stroke="url(#smokeGrad192)" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

  <!-- CO2 label -->
  <text x="85" y="75" font-family="Arial,sans-serif" font-size="9" fill="#95a5a6" text-anchor="middle" opacity="0.5">CO₂</text>

  <!-- Arrow: transformation -->
  <path d="M 160 240 Q 200 235 238 240" fill="none" stroke="#f5c842" stroke-width="2.5" opacity="0.7"/>
  <polygon points="238,235 252,240 238,245" fill="#f5c842" opacity="0.8"/>
  <!-- Decarbonization label -->
  <text x="200" y="228" font-family="Arial,sans-serif" font-size="7" fill="#f5c842" text-anchor="middle" opacity="0.65">Decarbonization Path</text>

  <!-- Green bond certificate (right) -->
  <rect x="255" y="185" width="100" height="110" rx="8" fill="#52b788" opacity="0.1"/>
  <rect x="255" y="185" width="100" height="110" rx="8" fill="none" stroke="#52b788" stroke-width="2" opacity="0.7"/>
  <!-- Bond title -->
  <text x="305" y="204" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#52b788" text-anchor="middle" opacity="0.9">GREEN BOND</text>
  <line x1="265" y1="210" x2="345" y2="210" stroke="#52b788" stroke-width="1" opacity="0.4"/>
  <text x="305" y="226" font-family="Arial,sans-serif" font-size="7" fill="#52b788" text-anchor="middle" opacity="0.7">Issuer: AceroVerde</text>
  <text x="305" y="240" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#52b788" text-anchor="middle" opacity="0.85">$450M</text>
  <text x="305" y="255" font-family="Arial,sans-serif" font-size="7" fill="#52b788" text-anchor="middle" opacity="0.65">10-year · ICMA</text>
  <!-- Leaf on bond -->
  <path d="M 295 268 Q 295 255 305 255 Q 315 255 315 268 Q 305 275 295 268 Z" fill="#52b788" opacity="0.5"/>

  <!-- Carbon price dial -->
  <circle cx="200" cy="310" r="38" fill="#f5c842" opacity="0.06"/>
  <circle cx="200" cy="310" r="38" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.4"/>
  <!-- Dial arc -->
  <path d="M 168 330 A 38 38 0 0 1 232 330" fill="none" stroke="#f5c842" stroke-width="3" opacity="0.5"/>
  <!-- Needle pointing to high -->
  <line x1="200" y1="310" x2="228" y2="293" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="200" cy="310" r="4" fill="#f5c842" opacity="0.8"/>
  <text x="200" y="305" font-family="Arial,sans-serif" font-size="7" fill="#f5c842" text-anchor="middle" opacity="0.7">Carbon</text>
  <text x="200" y="353" font-family="Arial,sans-serif" font-size="7" fill="#e74c3c" text-anchor="middle" opacity="0.7">$85/tCO₂</text>

  <!-- TCFD badge -->
  <rect x="48" y="308" width="54" height="20" rx="5" fill="#00bfff" opacity="0.1"/>
  <rect x="48" y="308" width="54" height="20" rx="5" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.5"/>
  <text x="75" y="322" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.75">TCFD</text>

  <rect x="108" y="308" width="54" height="20" rx="5" fill="#00bfff" opacity="0.1"/>
  <rect x="108" y="308" width="54" height="20" rx="5" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.5"/>
  <text x="135" y="322" font-family="Arial,sans-serif" font-size="8" fill="#00bfff" text-anchor="middle" opacity="0.75">ISSB</text>

  <!-- Label -->
  <text x="200" y="375" font-family="Arial,sans-serif" font-size="8" fill="#c0cfff" text-anchor="middle" opacity="0.35">ClimateCFO · Steel · LATAM</text>
  <text x="200" y="388" font-family="Arial,sans-serif" font-size="8" fill="#52b788" text-anchor="middle" opacity="0.4" letter-spacing="1">CLIMATE FINANCE · TCFD</text>
</svg>
