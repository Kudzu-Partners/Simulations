<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg003" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#6a0572"/>
    </linearGradient>
    <radialGradient id="starGlow003" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cowGlow003" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b9d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg003)"/>

  <!-- Subtle dot texture -->
  <g fill="#ff6b9d" opacity="0.07">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/><circle cx="240" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="360" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/><circle cx="240" cy="120" r="2"/><circle cx="300" cy="120" r="2"/><circle cx="360" cy="120" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="120" cy="180" r="2"/><circle cx="180" cy="180" r="2"/><circle cx="240" cy="180" r="2"/><circle cx="300" cy="180" r="2"/><circle cx="360" cy="180" r="2"/>
    <circle cx="60" cy="240" r="2"/><circle cx="120" cy="240" r="2"/><circle cx="180" cy="240" r="2"/><circle cx="240" cy="240" r="2"/><circle cx="300" cy="240" r="2"/><circle cx="360" cy="240" r="2"/>
    <circle cx="60" cy="300" r="2"/><circle cx="120" cy="300" r="2"/><circle cx="180" cy="300" r="2"/><circle cx="240" cy="300" r="2"/><circle cx="300" cy="300" r="2"/><circle cx="360" cy="300" r="2"/>
    <circle cx="60" cy="360" r="2"/><circle cx="120" cy="360" r="2"/><circle cx="180" cy="360" r="2"/><circle cx="240" cy="360" r="2"/><circle cx="300" cy="360" r="2"/><circle cx="360" cy="360" r="2"/>
  </g>

  <!-- BCG Matrix frame -->
  <rect x="68" y="60" width="284" height="268" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-opacity="0.30"/>

  <!-- Quadrant dividers (dashed) -->
  <line x1="68" y1="194" x2="352" y2="194" stroke="#ff6b9d" stroke-width="1.5" stroke-opacity="0.38" stroke-dasharray="6,5"/>
  <line x1="210" y1="60" x2="210" y2="328" stroke="#ff6b9d" stroke-width="1.5" stroke-opacity="0.38" stroke-dasharray="6,5"/>

  <!-- Quadrant subtle labels -->
  <text x="85" y="80" font-family="Arial, sans-serif" font-size="10" fill="#ff6b9d" opacity="0.40" font-style="italic">?</text>
  <text x="224" y="80" font-family="Arial, sans-serif" font-size="10" fill="#ffd166" opacity="0.45" font-style="italic">Star</text>
  <text x="85" y="320" font-family="Arial, sans-serif" font-size="10" fill="#ff6b9d" opacity="0.40" font-style="italic">Dog</text>
  <text x="224" y="320" font-family="Arial, sans-serif" font-size="10" fill="#ff6b9d" opacity="0.45" font-style="italic">Cash Cow</text>

  <!-- Axis arrows -->
  <line x1="68" y1="344" x2="352" y2="344" stroke="#ff6b9d" stroke-width="1.5" stroke-opacity="0.45"/>
  <polygon points="352,340 360,344 352,348" fill="#ff6b9d" fill-opacity="0.45"/>
  <line x1="52" y1="328" x2="52" y2="60" stroke="#ff6b9d" stroke-width="1.5" stroke-opacity="0.45"/>
  <polygon points="48,60 52,52 56,60" fill="#ff6b9d" fill-opacity="0.45"/>

  <!-- NATIVA (Star) — top-right quadrant, gold, medium-large -->
  <circle cx="282" cy="127" r="50" fill="url(#starGlow003)"/>
  <circle cx="282" cy="127" r="47" fill="#ffd166" fill-opacity="0.22" stroke="#ffd166" stroke-width="2.5" stroke-opacity="0.90"/>
  <text x="282" y="118" font-family="Arial, sans-serif" font-size="26" fill="#ffd166" text-anchor="middle" opacity="0.95">★</text>
  <text x="282" y="140" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#ffd166" text-anchor="middle" opacity="0.85">N</text>

  <!-- VIVE (Cash Cow) — bottom-right quadrant, pink, large -->
  <circle cx="288" cy="262" r="56" fill="url(#cowGlow003)"/>
  <circle cx="288" cy="262" r="53" fill="#ff6b9d" fill-opacity="0.22" stroke="#ff6b9d" stroke-width="2.5" stroke-opacity="0.90"/>
  <text x="288" y="254" font-family="Arial, sans-serif" font-size="26" fill="#ff6b9d" text-anchor="middle" opacity="0.95">$</text>
  <text x="288" y="276" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#ff6b9d" text-anchor="middle" opacity="0.85">V</text>

  <!-- FORTE (Dog) — bottom-left quadrant, muted gray, small -->
  <circle cx="135" cy="262" r="28" fill="#a0aec0" fill-opacity="0.12" stroke="#a0aec0" stroke-width="2" stroke-opacity="0.55"/>
  <text x="135" y="268" font-family="Arial Black, Arial, sans-serif" font-size="12" font-weight="900" fill="#a0aec0" text-anchor="middle" opacity="0.60">F</text>

  <!-- P&L — main label, prominent at bottom -->
  <text x="200" y="382" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#ffd166" text-anchor="middle" opacity="0.88">P&amp;L</text>

</svg>
