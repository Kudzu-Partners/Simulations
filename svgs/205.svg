<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg205" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <radialGradient id="cockpit205" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dialBg205" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg205)"/>
  <rect width="400" height="400" rx="32" fill="url(#cockpit205)"/>

  <!-- Background grid -->
  <g stroke="#d4a574" stroke-width="0.4" opacity="0.06">
    <line x1="0" y1="80"  x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
  </g>

  <!-- ── CRO Command Dashboard: 4 dial gauges ── -->

  <!-- Dial 1: CASH (top-left) — critical (red zone needle) -->
  <g transform="translate(115, 130)">
    <circle r="50" fill="url(#dialBg205)" stroke="#d4a574" stroke-width="1.5" stroke-opacity="0.55"/>
    <!-- Arc segments -->
    <path d="M -38 12 A 40 40 0 0 1 -28 -28" stroke="#ff4444" stroke-width="6" fill="none" opacity="0.85" stroke-linecap="round"/>
    <path d="M -28 -28 A 40 40 0 0 1 12 -38" stroke="#d4a574" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 12 -38 A 40 40 0 0 1 38 12" stroke="#52b788" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
    <!-- Needle pointing into red -->
    <line x1="0" y1="0" x2="-30" y2="-12" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="4" fill="#ff4444"/>
    <circle r="2" fill="#0a0f1e"/>
    <text y="35" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#ff4444" opacity="0.95" letter-spacing="1">CASH</text>
    <text y="-58" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#ff4444" opacity="0.7">$12M</text>
  </g>

  <!-- Dial 2: EBITDA (top-right) — negative -->
  <g transform="translate(285, 130)">
    <circle r="50" fill="url(#dialBg205)" stroke="#d4a574" stroke-width="1.5" stroke-opacity="0.55"/>
    <path d="M -38 12 A 40 40 0 0 1 -28 -28" stroke="#ff4444" stroke-width="6" fill="none" opacity="0.85" stroke-linecap="round"/>
    <path d="M -28 -28 A 40 40 0 0 1 12 -38" stroke="#d4a574" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 12 -38 A 40 40 0 0 1 38 12" stroke="#52b788" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-22" y2="-22" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="4" fill="#ff4444"/>
    <circle r="2" fill="#0a0f1e"/>
    <text y="35" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#ff4444" opacity="0.95" letter-spacing="1">EBITDA</text>
    <text y="-58" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#ff4444" opacity="0.7">−$23M</text>
  </g>

  <!-- Dial 3: DEBT (bottom-left) — high -->
  <g transform="translate(115, 270)">
    <circle r="50" fill="url(#dialBg205)" stroke="#d4a574" stroke-width="1.5" stroke-opacity="0.55"/>
    <path d="M -38 12 A 40 40 0 0 1 -28 -28" stroke="#52b788" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M -28 -28 A 40 40 0 0 1 12 -38" stroke="#d4a574" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 12 -38 A 40 40 0 0 1 38 12" stroke="#ff4444" stroke-width="6" fill="none" opacity="0.85" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="32" y2="-8" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="4" fill="#ff4444"/>
    <circle r="2" fill="#0a0f1e"/>
    <text y="35" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#ff4444" opacity="0.95" letter-spacing="1">DEBT</text>
    <text y="-58" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#ff4444" opacity="0.7">$65M</text>
  </g>

  <!-- Dial 4: STAKEHOLDER (bottom-right) — low -->
  <g transform="translate(285, 270)">
    <circle r="50" fill="url(#dialBg205)" stroke="#d4a574" stroke-width="1.5" stroke-opacity="0.55"/>
    <path d="M -38 12 A 40 40 0 0 1 -28 -28" stroke="#ff4444" stroke-width="6" fill="none" opacity="0.85" stroke-linecap="round"/>
    <path d="M -28 -28 A 40 40 0 0 1 12 -38" stroke="#d4a574" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 12 -38 A 40 40 0 0 1 38 12" stroke="#52b788" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-32" y2="-8" stroke="#d4a574" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="4" fill="#d4a574"/>
    <circle r="2" fill="#0a0f1e"/>
    <text y="35" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#d4a574" opacity="0.95" letter-spacing="1">TRUST</text>
    <text y="-58" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#d4a574" opacity="0.7">30/100</text>
  </g>

  <!-- Center: CRO command badge with countdown -->
  <rect x="158" y="186" width="84" height="34" rx="8" fill="#0a0f1e" stroke="#d4a574" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#d4a574" opacity="0.95" letter-spacing="2">CRO</text>
  <text x="200" y="214" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#ff4444" opacity="0.9">90 DAYS</text>

  <!-- Pulse around CRO -->
  <rect x="153" y="181" width="94" height="44" rx="10" fill="none" stroke="#d4a574" stroke-width="1" opacity="0.35"/>

  <!-- Header -->
  <text x="200" y="48" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#d4a574" opacity="0.65" letter-spacing="3">DISTRESS COMMAND</text>

  <!-- 4 round indicators (bottom strip) -->
  <g transform="translate(0, 366)">
    <circle cx="155" cy="0" r="5" fill="#d4a574" stroke="#d4a574" stroke-width="1.5"/>
    <circle cx="183" cy="0" r="5" fill="#1a2744" stroke="#d4a574" stroke-width="1.5"/>
    <circle cx="211" cy="0" r="5" fill="#1a2744" stroke="#d4a574" stroke-width="1.5" opacity="0.6"/>
    <circle cx="239" cy="0" r="5" fill="#1a2744" stroke="#d4a574" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="0" x2="178" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.5"/>
    <line x1="188" y1="0" x2="206" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.4"/>
    <line x1="216" y1="0" x2="234" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
