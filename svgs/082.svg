<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg82" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2d4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg82)"/>
  <!-- Physical store (left) -->
  <rect x="55" y="155" width="120" height="130" rx="6" fill="#1b2d4f" stroke="#00bfff" stroke-width="2.5" opacity="0.95"/>
  <path d="M45,155 L115,100 L185,155 Z" fill="#1b2d4f" stroke="#00bfff" stroke-width="2" opacity="0.9"/>
  <!-- Store windows -->
  <rect x="70" y="175" width="35" height="30" rx="3" fill="#00bfff" opacity="0.2" stroke="#00bfff" stroke-width="1"/>
  <rect x="115" y="175" width="35" height="30" rx="3" fill="#00bfff" opacity="0.2" stroke="#00bfff" stroke-width="1"/>
  <!-- Store door -->
  <rect x="88" y="228" width="30" height="57" rx="3" fill="#00bfff" opacity="0.1" stroke="#00bfff" stroke-width="1"/>
  <!-- Smartphone (right) -->
  <rect x="225" y="120" width="120" height="200" rx="14" fill="#1b2d4f" stroke="#7b2fff" stroke-width="2.5" opacity="0.95"/>
  <rect x="237" y="140" width="96" height="155" rx="6" fill="#7b2fff" opacity="0.12"/>
  <!-- Screen content: product grid -->
  <g fill="#7b2fff" opacity="0.5">
    <rect x="242" y="148" width="38" height="32" rx="3"/>
    <rect x="285" y="148" width="38" height="32" rx="3"/>
    <rect x="242" y="186" width="38" height="32" rx="3"/>
    <rect x="285" y="186" width="38" height="32" rx="3"/>
    <rect x="242" y="224" width="38" height="32" rx="3"/>
    <rect x="285" y="224" width="38" height="32" rx="3"/>
  </g>
  <!-- Home button -->
  <circle cx="285" cy="300" r="8" fill="none" stroke="#7b2fff" stroke-width="2" opacity="0.6"/>
  <!-- Bidirectional arrows connecting store and phone (omnichannel) -->
  <path d="M178,195 Q200,175 222,195" fill="none" stroke="#00bfff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="222,195 210,188 212,202" fill="#00bfff" opacity="0.8"/>
  <path d="M222,225 Q200,245 178,225" fill="none" stroke="#7b2fff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="178,225 190,232 188,218" fill="#7b2fff" opacity="0.8"/>
  <!-- Inventory sync label -->
  <text x="200" y="270" font-family="sans-serif" font-size="9" fill="#00bfff" text-anchor="middle" opacity="0.6">OMNICHANNEL</text>
  <!-- Category bars bottom -->
  <rect x="60" y="330" width="20" height="30" rx="2" fill="#00bfff" opacity="0.5"/>
  <rect x="84" y="320" width="20" height="40" rx="2" fill="#00bfff" opacity="0.4"/>
  <rect x="108" y="310" width="20" height="50" rx="2" fill="#00bfff" opacity="0.35"/>
</svg>
