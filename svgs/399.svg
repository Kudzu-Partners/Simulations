<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg399" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <radialGradient id="globe399" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#1a4d3a"/>
      <stop offset="100%" stop-color="#0a2418"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg399)"/>

  <text x="200" y="58" text-anchor="middle" fill="#00ff88" font-size="9" font-family="monospace" opacity="0.85" letter-spacing="2">TRANSFER PRICING · BEPS</text>

  <!-- 3 JURISDICTION boxes connected by $ flows -->
  <g>
    <!-- Spain (origin) -->
    <g transform="translate(95,180)">
      <rect x="-32" y="-22" width="64" height="44" rx="4" fill="#f5c842" fill-opacity="0.18" stroke="#f5c842" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" fill="#f5c842" font-size="9" font-family="monospace" font-weight="bold">ES</text>
      <text x="0" y="10" text-anchor="middle" fill="#f5c842" font-size="6" font-family="monospace" opacity="0.85">parent</text>
    </g>
    <!-- Low-tax IP holding (right) -->
    <g transform="translate(305,180)">
      <rect x="-32" y="-22" width="64" height="44" rx="4" fill="#52b788" fill-opacity="0.18" stroke="#52b788" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" fill="#52b788" font-size="9" font-family="monospace" font-weight="bold">IP</text>
      <text x="0" y="10" text-anchor="middle" fill="#52b788" font-size="6" font-family="monospace" opacity="0.85">holding</text>
    </g>
    <!-- Subsidiary (bottom) -->
    <g transform="translate(200,310)">
      <rect x="-32" y="-22" width="64" height="44" rx="4" fill="#c0cfff" fill-opacity="0.15" stroke="#c0cfff" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" fill="#c0cfff" font-size="9" font-family="monospace" font-weight="bold">SUB</text>
      <text x="0" y="10" text-anchor="middle" fill="#c0cfff" font-size="6" font-family="monospace" opacity="0.85">opco</text>
    </g>
  </g>

  <!-- $ FLOW arrows between jurisdictions -->
  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 130 180 L 270 180" stroke-dasharray="4,3"/>
    <polygon points="270,180 264,176 264,184" fill="#00ff88"/>
    <path d="M 290 200 Q 250 270 230 290" stroke-dasharray="4,3"/>
    <polygon points="230,290 230,284 236,287" fill="#00ff88"/>
    <path d="M 170 290 Q 130 250 105 215" stroke-dasharray="4,3"/>
    <polygon points="105,215 110,221 102,219" fill="#00ff88"/>
  </g>
  <!-- $ symbols on flows -->
  <text x="200" y="175" text-anchor="middle" fill="#00ff88" font-size="10" font-family="Georgia, serif" font-weight="bold">$</text>
  <text x="265" y="247" text-anchor="middle" fill="#00ff88" font-size="10" font-family="Georgia, serif" font-weight="bold">$</text>
  <text x="135" y="247" text-anchor="middle" fill="#00ff88" font-size="10" font-family="Georgia, serif" font-weight="bold">$</text>

  <!-- Central GLOBE (hero) -->
  <g transform="translate(200,210)">
    <circle cx="0" cy="0" r="42" fill="url(#globe399)" stroke="#52b788" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="42" ry="14" fill="none" stroke="#c0cfff" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="18" ry="42" fill="none" stroke="#c0cfff" stroke-width="0.8" stroke-opacity="0.6"/>
    <path d="M -18 -10 q 8 -6 16 0 q 2 8 -6 12 q -12 0 -10 -12" fill="#52b788" opacity="0.85"/>
    <path d="M 10 8 q 8 -2 14 4 q -4 8 -14 4 z" fill="#52b788" opacity="0.85"/>
  </g>

  <!-- BEPS badge (top-left) -->
  <g transform="translate(55,90)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#ff6b6b" fill-opacity="0.18" stroke="#ff6b6b" stroke-width="1.3"/>
    <text x="30" y="13" text-anchor="middle" fill="#ff6b6b" font-size="10" font-family="monospace" font-weight="bold">BEPS</text>
    <text x="30" y="22" text-anchor="middle" fill="#ff6b6b" font-size="5" font-family="monospace" opacity="0.85">OECD</text>
  </g>

  <!-- AEAT badge (top-right) -->
  <g transform="translate(285,90)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#c0392b" fill-opacity="0.18" stroke="#c0392b" stroke-width="1.3"/>
    <text x="30" y="13" text-anchor="middle" fill="#c0392b" font-size="10" font-family="monospace" font-weight="bold">AEAT</text>
    <text x="30" y="22" text-anchor="middle" fill="#c0392b" font-size="5" font-family="monospace" opacity="0.85">inspector</text>
  </g>

  <!-- ESPAÑA pin -->
  <g transform="translate(345,345)">
    <rect x="-12" y="-9" width="24" height="6" fill="#c0392b" opacity="0.9"/>
    <rect x="-12" y="-3" width="24" height="12" fill="#f5c842" opacity="0.9"/>
    <rect x="-12" y="5" width="24" height="4" fill="#c0392b" opacity="0.9"/>
  </g>

  <text x="180" y="378" text-anchor="middle" fill="#c0cfff" font-size="10" font-family="monospace" opacity="0.42" letter-spacing="1.2">TP · BEPS · GAIBSA · España</text>
</svg>
